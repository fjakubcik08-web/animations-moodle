<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Labo atomique</title>
<style>
  html,body{margin:0;padding:0;background:#16182b;overflow:hidden}
  #stage{position:relative;width:100%;max-width:960px;aspect-ratio:960/600;margin:0 auto;user-select:none;-webkit-user-select:none;touch-action:none}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
  #stage.shake{animation:stshake .55s cubic-bezier(.36,.07,.19,.97)}
  @keyframes stshake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-3px)}30%,50%,70%{transform:translate(-7px,4px) rotate(-.6deg)}40%,60%{transform:translate(7px,-4px) rotate(.6deg)}}

  /* ---------- Bouton MESURE ---------- */
  .btn{position:absolute;z-index:5;font-family:Impact,"Arial Black",sans-serif;font-size:min(2.6vw,25px);letter-spacing:1px;
       color:#fff;background:#ff2d2d;border:3px solid #111;border-radius:12px 6px 14px 5px;box-shadow:5px 5px 0 #111;
       -webkit-text-stroke:1.2px #111;cursor:pointer;transform:rotate(-2deg);transition:transform .12s,box-shadow .12s,background .2s;padding:0}
  .btn:hover:not(:disabled){transform:rotate(1deg) scale(1.07);background:#ff4f1f}
  .btn:active:not(:disabled){transform:translate(4px,4px) rotate(0);box-shadow:1px 1px 0 #111}
  .btn:not(:disabled){animation:btnpulse 1.1s ease-in-out infinite}
  @keyframes btnpulse{50%{box-shadow:5px 5px 0 #111,0 0 0 7px rgba(255,230,0,.75)}}
  .btn:disabled{background:#9a9aa4;color:#e4e4e8;cursor:not-allowed;box-shadow:3px 3px 0 #111;animation:none}

  /* ---------- Effet MESURE ---------- */
  .fx{position:absolute;z-index:4;pointer-events:none}
  .fx>*{position:absolute;left:50%;top:50%;opacity:0}
  .rays{width:150%;aspect-ratio:1;border-radius:50%;
        background:repeating-conic-gradient(rgba(255,240,150,.9) 0 6deg,transparent 6deg 18deg);
        -webkit-mask:radial-gradient(circle,#000 18%,rgba(0,0,0,.6) 40%,transparent 68%);
                mask:radial-gradient(circle,#000 18%,rgba(0,0,0,.6) 40%,transparent 68%)}
  .dots{width:120%;aspect-ratio:1;border-radius:50%;
        background:radial-gradient(circle,#111 28%,transparent 32%) 0 0/14px 14px;
        -webkit-mask:radial-gradient(circle,transparent 25%,#000 45%,transparent 70%);
                mask:radial-gradient(circle,transparent 25%,#000 45%,transparent 70%)}
  .ring{width:30%;aspect-ratio:1;border-radius:50%;border:7px solid #111;border-width:4px}
  .flash{width:200%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff 25%,rgba(255,255,220,0) 60%)}
  .bolt{width:14%;height:60%;background:#fff200;
        clip-path:polygon(45% 0,100% 0,62% 38%,92% 38%,20% 100%,42% 52%,10% 52%);
        filter:drop-shadow(3px 0 0 #111) drop-shadow(-3px 0 0 #111) drop-shadow(0 3px 0 #111)}
  .scan{width:62%;height:6px;border-radius:3px;background:linear-gradient(90deg,transparent,#5dff9a,#fff,#5dff9a,transparent);box-shadow:0 0 18px 6px rgba(93,255,154,.8)}
  .spark{width:3.5%;aspect-ratio:1;background:#fff;
         clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
         filter:drop-shadow(2px 2px 0 #111)}
  .onom{font-family:Impact,"Arial Black",sans-serif;font-size:min(7.5vw,72px);white-space:nowrap;color:#ffe600;
        -webkit-text-stroke:3px #111;text-shadow:5px 5px 0 #111;letter-spacing:2px}


  .vortex{width:115%;aspect-ratio:1;border-radius:50%;
          background:repeating-conic-gradient(rgba(255,255,255,.7) 0 7deg,transparent 7deg 30deg);
          -webkit-mask:radial-gradient(circle,transparent 8%,#000 25%,transparent 68%);mask:radial-gradient(circle,transparent 8%,#000 25%,transparent 68%)}
  .speed{width:240%;aspect-ratio:1;border-radius:50%;
         background:repeating-conic-gradient(#fff 0 1.2deg,transparent 1.2deg 7deg);
         -webkit-mask:radial-gradient(circle,transparent 22%,#000 40%);mask:radial-gradient(circle,transparent 22%,#000 40%)}
  .panelw{width:78%;height:70%;filter:drop-shadow(4px 0 0 #111) drop-shadow(-4px 0 0 #111) drop-shadow(0 4px 0 #111) drop-shadow(0 -4px 0 #111) drop-shadow(8px 8px 0 rgba(0,0,0,.6))}
  .panel{position:absolute;inset:0;background:#fffbe8}
  .puff{width:24%;aspect-ratio:1;border-radius:50%;background:#f4f4f4;border:4px solid #111;box-shadow:inset -8px -8px 0 rgba(0,0,0,.12)}

  /* V1 : rayons */
  .go.v1 .rays{animation:rays 2.9s cubic-bezier(.2,.8,.3,1) forwards}
  .go.v1 .dots{animation:dots 2.9s ease-out forwards}
  .go.v1 .ring.r1{animation:ring 1.1s ease-out .05s forwards}
  .go.v1 .ring.r2{animation:ring 1.1s ease-out .45s forwards}
  .go.v1 .ring.r3{animation:ring 1.1s ease-out .85s forwards}
  .go.v1 .flash{animation:flash .5s ease-out forwards}
  .go.v1 .scan{animation:scan 2.6s ease-in-out forwards}
  .go.v1 .spark{animation:spark 1.4s cubic-bezier(.1,.7,.3,1) forwards}
  .go.v1 .onom{animation:onom 2.9s cubic-bezier(.2,1.6,.4,1) forwards}
  /* V2 : vortex aspirant */
  .go.v2 .vortex{animation:spinin 2.8s cubic-bezier(.5,0,.8,.6) forwards}
  .go.v2 .ring.r1{animation:ringin 1s ease-in .1s forwards}
  .go.v2 .ring.r2{animation:ringin 1s ease-in .7s forwards}
  .go.v2 .ring.r3{animation:ringin 1s ease-in 1.3s forwards}
  .go.v2 .spark{animation:sparkin 1.3s ease-in forwards}
  .go.v2 .flash{animation:flash .6s ease-out 2.3s forwards}
  .go.v2 .onom{animation:onomspin 2.9s cubic-bezier(.2,1.3,.4,1) forwards}
  /* V3 : case BD */
  .go.v3 .speed{animation:speed 2.8s ease-out forwards}
  .go.v3 .panelw{animation:panel 2.8s cubic-bezier(.2,1.4,.4,1) forwards}
  .go.v3 .dots{animation:dots 2.8s ease-out forwards}
  .go.v3 .onom{animation:onomslam 2.9s cubic-bezier(.3,1.2,.5,1) forwards}
  /* V4 : orage */
  .go.v4 .bolt{animation:bolt 2.7s steps(1) forwards}
  .go.v4 .flash{animation:strobe 2.6s linear forwards}
  .go.v4 .scan{animation:scan 2.6s ease-in-out forwards}
  .go.v4 .onom{animation:onomshake 2.9s linear forwards}
  /* V5 : explosion */
  .go.v5 .flash{animation:flash .45s ease-out forwards}
  .go.v5 .puff{animation:puff 2.2s cubic-bezier(.1,.8,.3,1) forwards}
  .go.v5 .ring.r1{animation:ring .9s ease-out forwards}
  .go.v5 .spark{animation:spark 1.6s cubic-bezier(.05,.8,.3,1) forwards}
  .go.v5 .onom{animation:onomzoom 2.9s cubic-bezier(.2,1.2,.4,1) forwards}

  @keyframes rays{0%{opacity:0;transform:translate(-50%,-50%) scale(.1) rotate(0)}12%{opacity:.6}75%{opacity:.45}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15) rotate(220deg)}}
  @keyframes dots{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(0)}20%{opacity:.25}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3) rotate(-60deg)}}
  @keyframes ring{0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.6)}}
  @keyframes ringin{0%{opacity:0;transform:translate(-50%,-50%) scale(3.4)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.1)}}
  @keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
  @keyframes strobe{0%{opacity:0;transform:translate(-50%,-50%) scale(.75)}5%{opacity:.8}9%{opacity:0}17%{opacity:.6}20%{opacity:0}34%{opacity:.85}38%{opacity:0}55%{opacity:.5}58%{opacity:0}74%{opacity:.8}79%,100%{opacity:0;transform:translate(-50%,-50%) scale(.75)}}
  @keyframes bolt{0%{opacity:1}8%{opacity:0}14%{opacity:1}24%{opacity:0}33%{opacity:1}40%{opacity:0}55%{opacity:1}62%{opacity:0}78%{opacity:1}84%,100%{opacity:0}}
  @keyframes scan{0%{opacity:0;transform:translate(-50%,-260%)}10%{opacity:1}30%{transform:translate(-50%,500%)}50%{transform:translate(-50%,-260%)}70%{transform:translate(-50%,500%)}90%{opacity:1}100%{opacity:0;transform:translate(-50%,-260%)}}
  @keyframes spark{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--a)) translateX(0) scale(.4)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateX(var(--d)) scale(1.3) rotate(200deg)}}
  @keyframes sparkin{0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateX(var(--d)) scale(1.3)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(calc(var(--a) + 120deg)) translateX(0) scale(.2)}}
  @keyframes spinin{0%{opacity:0;transform:translate(-50%,-50%) scale(1.4) rotate(0)}15%{opacity:.75}85%{opacity:.55}100%{opacity:0;transform:translate(-50%,-50%) scale(.05) rotate(1000deg)}}
  @keyframes speed{0%{opacity:0;transform:translate(-50%,-50%) scale(1.7)}10%{opacity:.55}80%{opacity:.4}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
  @keyframes panel{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-14deg)}12%{opacity:.95;transform:translate(-50%,-50%) scale(1.08) rotate(3deg)}20%{transform:translate(-50%,-50%) scale(1) rotate(0)}35%,65%{transform:translate(-50%,-50%) scale(1.03) rotate(-2deg)}50%,80%{transform:translate(-50%,-50%) scale(1) rotate(2deg)}88%{opacity:.95}100%{opacity:0;transform:translate(-50%,-50%) scale(1.25) rotate(0)}}
  @keyframes puff{0%{opacity:0;transform:translate(-50%,-50%) scale(.1)}12%{opacity:1}70%{opacity:.9}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.7)}}
  @keyframes onom{0%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(-35deg)}12%{opacity:1;transform:translate(-50%,-130%) scale(1.35) rotate(-8deg)}22%{transform:translate(-50%,-125%) scale(1) rotate(-5deg)}80%{opacity:1;transform:translate(-50%,-140%) scale(1.05) rotate(-3deg)}100%{opacity:0;transform:translate(-50%,-200%) scale(1.6) rotate(4deg)}}
  @keyframes onomspin{0%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(-560deg)}28%{opacity:1;transform:translate(-50%,-130%) scale(1.15) rotate(-6deg)}38%{transform:translate(-50%,-130%) scale(1) rotate(-4deg)}85%{opacity:1;transform:translate(-50%,-135%) scale(1) rotate(-4deg)}100%{opacity:0;transform:translate(-50%,-135%) scale(.4) rotate(30deg)}}
  @keyframes onomslam{0%{opacity:0;transform:translate(-50%,-700%) scale(1.3) rotate(10deg)}14%{opacity:1;transform:translate(-50%,-110%) scale(1.15,.8) rotate(-5deg)}22%{transform:translate(-50%,-128%) scale(1) rotate(-5deg)}85%{opacity:1;transform:translate(-50%,-128%) scale(1) rotate(-5deg)}100%{opacity:0;transform:translate(-50%,-128%) scale(1.1) rotate(-5deg)}}
  @keyframes onomshake{0%{opacity:0;transform:translate(-50%,-130%) scale(.5)}6%{opacity:1;transform:translate(-50%,-130%) scale(1.1)}12%{transform:translate(-46%,-127%) rotate(-4deg)}18%{transform:translate(-54%,-134%) rotate(3deg)}24%{transform:translate(-47%,-133%) rotate(-3deg)}30%{transform:translate(-53%,-127%) rotate(4deg)}36%{transform:translate(-48%,-131%) rotate(-2deg)}42%{transform:translate(-52%,-129%) rotate(2deg)}50%,85%{opacity:1;transform:translate(-50%,-130%) rotate(-3deg)}100%{opacity:0;transform:translate(-50%,-130%) rotate(-3deg)}}
  @keyframes onomzoom{0%{opacity:0;transform:translate(-50%,-130%) scale(4.5) rotate(10deg)}14%{opacity:1;transform:translate(-50%,-130%) scale(.85) rotate(-6deg)}22%{transform:translate(-50%,-130%) scale(1.05) rotate(-4deg)}85%{opacity:1;transform:translate(-50%,-130%) scale(1) rotate(-4deg)}100%{opacity:0;transform:translate(-50%,-160%) scale(1.3) rotate(-4deg)}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
</div>
<script>
(function(){
"use strict";
/* ====================== PARAMÈTRES (?p= codé XOR+base64url, clés en clair prioritaires) ====================== */
const KEY="P2-atome*labo#dc04";
const DEF={at:[[6,6,6],[8,8,8],[11,12,11]],nm:["A","B","C"],bal:1,cmp:1,lock:1,one:1,cs:3,unit:"kg",
           mp:1.673e-27,mn:1.675e-27,me:9.109e-31,noise:0,dur:2.9,move:1,seed:-1,chg:1,chgfree:1};
function decodeP(code){
  try{let b=code.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
    const bin=atob(b),k=new TextEncoder().encode(KEY),u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i)^k[i%k.length];
    return JSON.parse(new TextDecoder().decode(u));}catch(e){return {};}
}
const P=Object.assign({},DEF);
(function(){const q=new URLSearchParams(location.search);
  if(q.get('p'))Object.assign(P,decodeP(q.get('p')));
  for(const [k,v] of q){if(k==='p'||!(k in DEF))continue;
    if(k==='at')P.at=v.split(';').map(t=>t.split(',').map(Number));
    else if(k==='nm')P.nm=v.split(',');
    else if(k==='unit')P.unit=v;
    else P[k]=Number(v);}
  P.at=P.at.filter(a=>Array.isArray(a)&&a.length===3).slice(0,3);if(!P.at.length)P.at=DEF.at;
  P.cs=Math.min(6,Math.max(1,Math.round(P.cs)));
})();
function m32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const CONFIG=(function(){
  let list=P.at.map(a=>({p:a[0],n:a[1],e:a[2]}));
  const rnd=m32(P.seed>=0?P.seed:Math.floor(Math.random()*4294967296));
  if(P.seed>=0)for(let i=list.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[list[i],list[j]]=[list[j],list[i]];}
  list.forEach((a,i)=>{a.name=String(P.nm[i]!==undefined?P.nm[i]:"ABC"[i]);
    a.m=(a.p*P.mp+a.n*P.mn+a.e*P.me)*(1+P.noise/100*(2*rnd()-1));});
  return {atoms:list,balActive:!!P.bal,cmpActive:!!P.cmp,chgActive:!!P.chg,chgFree:!!P.chgfree,dur:P.dur*1000,lock:!!P.lock,one:!!P.one,move:!!P.move};
})();
const MP=1.673e-27, MN=1.675e-27, ME=9.109e-31;

/* ====================== CANVAS ====================== */
const W=960,H=600;
const stage=document.getElementById('stage'), cv=document.getElementById('cv'), ctx=cv.getContext('2d');
function fit(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
  cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));}
window.addEventListener('resize',fit);
function place(el,x,y,w,h){el.style.left=(x/W*100)+'%';el.style.top=(y/H*100)+'%';el.style.width=(w/W*100)+'%';el.style.height=(h/H*100)+'%';}

const FONT='"Comic Sans MS","Comic Neue","Chalkboard SE",cursive';
const IMPACT='Impact,"Arial Black",sans-serif';

/* ---------- tracé "à la main" (xkcd) ---------- */
function R(a){const x=Math.sin(a*127.1+311.7)*43758.5453;return x-Math.floor(x);}
let boil=0;
function jit(s,amp){return (R(s+boil*7.13)-.5)*2*amp;}
function smoothClosed(pts){
  const n=pts.length,m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  ctx.beginPath();let s=m(pts[n-1],pts[0]);ctx.moveTo(s[0],s[1]);
  for(let i=0;i<n;i++){const p=pts[i],q=m(p,pts[(i+1)%n]);ctx.quadraticCurveTo(p[0],p[1],q[0],q[1]);}
  ctx.closePath();
}
function rPoly(P,seed,amp){
  const pts=[];
  for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];
    const L=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.ceil(L/40));
    for(let k=0;k<n;k++){const t=k/n;pts.push([a[0]+(b[0]-a[0])*t+jit(seed+i*31+k,amp),a[1]+(b[1]-a[1])*t+jit(seed+i*31+k+.5,amp)]);
      if(k===0){pts.push([a[0]+jit(seed+i*7.7,amp*.4),a[1]+jit(seed+i*9.1,amp*.4)]);}}
  }
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(const p of pts)ctx.lineTo(p[0],p[1]);ctx.closePath();
}
function rRect(x,y,w,h,seed,amp=1.8){rPoly([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],seed,amp);}
function rEll(cx,cy,rx,ry,seed,amp=1.8,rot=0,N=26){
  const pts=[],c=Math.cos(rot),s=Math.sin(rot);
  for(let i=0;i<N;i++){const t=i/N*Math.PI*2,k=1+jit(seed+i,amp)/Math.max(rx,ry);
    const x=Math.cos(t)*rx*k,y=Math.sin(t)*ry*k;pts.push([cx+x*c-y*s,cy+x*s+y*c]);}
  smoothClosed(pts);
}
function rLine(x1,y1,x2,y2,seed,amp=1.5){
  const L=Math.hypot(x2-x1,y2-y1),n=Math.max(2,Math.ceil(L/22));ctx.beginPath();
  for(let i=0;i<=n;i++){const t=i/n,e=(i===0||i===n)?.4:1;
    const x=x1+(x2-x1)*t+jit(seed+i,amp*e),y=y1+(y2-y1)*t+jit(seed+i+.3,amp*e);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  ctx.stroke();
}
function ink(fill,lw=3.2){if(fill){ctx.fillStyle=fill;ctx.fill();}ctx.lineWidth=lw;ctx.strokeStyle='#111';ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();}
function txt(s,x,y,size,col='#111',font=FONT,align='center',stroke=0,sc='#111'){
  ctx.font='bold '+size+'px '+font;ctx.textAlign=align;ctx.textBaseline='middle';
  if(stroke){ctx.lineWidth=stroke;ctx.strokeStyle=sc;ctx.lineJoin='round';ctx.strokeText(s,x,y);}
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}

/* ---------- fond : papier + trame + traits de vitesse ---------- */
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
(function(){const b=bg.getContext('2d');
  const g=b.createRadialGradient(W/2,200,50,W/2,250,700);g.addColorStop(0,'#2c2f55');g.addColorStop(1,'#121426');
  b.fillStyle=g;b.fillRect(0,0,W,H);
  b.save();b.translate(W/2,200);b.strokeStyle='rgba(255,255,255,.035)';
  for(let i=0;i<60;i++){const a=i/60*Math.PI*2;b.lineWidth=2+R(i)*10;b.beginPath();b.moveTo(Math.cos(a)*120,Math.sin(a)*120);b.lineTo(Math.cos(a)*900,Math.sin(a)*900);b.stroke();}
  b.restore();
  for(let y=0;y<H;y+=12)for(let x=(y/12)%2*6;x<W;x+=12){const d=Math.hypot(x-W,y)/1000,r=Math.max(0,2.8*(1-d));
    if(r>.2){b.fillStyle='rgba(255,70,140,.16)';b.beginPath();b.arc(x,y,r,0,7);b.fill();}
    const d2=Math.hypot(x,y)/800,r2=Math.max(0,2.6*(1-d2));
    if(r2>.2){b.fillStyle='rgba(90,140,255,.18)';b.beginPath();b.arc(x,y,r2,0,7);b.fill();}}
})();

/* ====================== ÉTAT ====================== */
const HUES=[195,300,120];
const homes=[[[480,168]],[[330,168],[630,168]],[[230,168],[480,168],[730,168]]][CONFIG.atoms.length-1];
const atoms=CONFIG.atoms.map((c,i)=>({...c,i,home:{x:homes[i][0],y:homes[i][1]},x:homes[i][0],y:homes[i][1],tx:homes[i][0],ty:homes[i][1],
  r:58,scale:1,hue:HUES[i%3],ph:i*2.1,on:null,used:new Set(),drag:false,shakeT:0,blinkT:1500+i*900}));
const mkDev=(key,name,cx,active,onom,free)=>({key,name,cx,active,free,zone:[cx-150,240,300,320],slot:{x:cx,y:key==='bal'?316:318},
  atom:null,state:'idle',t0:0,tDone:0,shakeT:0,onom});
const devs={
  bal:mkDev('bal','BALANCE ATOMIQUE',170,CONFIG.balActive,['KA-CHUNK !!','KLONK !!','BAOUM !!'],false),
  chg:mkDev('chg','NUCLEAR-CHARGETOR',480,CONFIG.chgActive,['BZZZT !!','VOLTAGE !!','KRRZAP !!'],CONFIG.chgFree),
  cmp:mkDev('cmp','DÉCOMPOSITOR 3000',790,CONFIG.cmpActive,['ZZZAPP !!','KRAKA-BOOM !!','SHAZAM !!'],false)
};
const DKEYS=Object.keys(devs);
const ruled=k=>!devs[k].free;   // appareil soumis aux règles "un seul à la fois" / "verrou"
const bursts=[];
function burst(x,y,text,col,bad){bursts.push({x,y,text,col,bad,t0:performance.now(),rot:(Math.random()-.5)*.3});}

/* ====================== DOM : boutons + effets ====================== */
const UI={};
function starClip(){const P=[];for(let k=0;k<26;k++){const an=k/26*Math.PI*2,r=(k%2?50:36)+Math.random()*6;
  P.push((50+Math.cos(an)*r).toFixed(1)+'% '+(50+Math.sin(an)*r).toFixed(1)+'%');}return 'polygon('+P.join(',')+')';}
let lastV=0;
for(const k of DKEYS){
  const b=document.createElement('button');b.className='btn';b.textContent='MESURE !';

function measure(k){

/* ====================== INTERACTION ====================== */
let drag=null,off={x:0,y:0},mouse={x:W/2,y:300};
function L(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function atomAt(p){for(let i=atoms.length-1;i>=0;i--){const a=atoms[i];if(Math.hypot(p.x-a.x,p.y-a.y)<a.r*a.scale+8)return a;}return null;}
function hitDev(p){for(const k in devs){const z=devs[k].zone;if(p.x>z[0]&&p.x<z[0]+z[2]&&p.y>z[1]&&p.y<z[1]+z[3])return k;}return null;}
cv.addEventListener('pointerdown',e=>{if(!CONFIG.move)return;
  const p=L(e),a=atomAt(p);if(!a)return;
  if(a.on&&devs[a.on].state==='measuring'){burst(a.x,a.y-70,'PATIENCE !','#ff3b1f',true);return;}
  if(a.on){const d=devs[a.on];d.atom=null;d.state='idle';a.on=null;updButtons();}
  drag=a;a.drag=true;off={x:p.x-a.x,y:p.y-a.y};
  atoms.push(atoms.splice(atoms.indexOf(a),1)[0]);
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  cv.style.cursor='grabbing';
});
cv.addEventListener('pointermove',e=>{
  const p=L(e);mouse=p;
  if(drag){drag.x=drag.tx=p.x-off.x;drag.y=drag.ty=p.y-off.y;}
  else cv.style.cursor=atomAt(p)?'grab':'default';
});
function release(e){
  if(!drag)return;const a=drag;drag=null;a.drag=false;cv.style.cursor='grab';
  const p=L(e),k=hitDev(p);
  if(!k){a.tx=a.home.x;a.ty=a.home.y;return;}
  const d=devs[k];let err=null;
  if(!d.active)err='HORS SERVICE !';
  else if(d.atom)err='OCCUPÉ !';
  else if(ruled(k)&&CONFIG.one&&DKEYS.some(j=>j!==k&&ruled(j)&&devs[j].atom))err='UN APPAREIL À LA FOIS !';
  else if(ruled(k)&&CONFIG.lock&&[...a.used].some(j=>j!==k&&ruled(j)))err='DÉJÀ ANALYSÉ AILLEURS !';
  if(err){burst(Math.min(Math.max(p.x,200),760),p.y-50,err,'#ff3b1f',true);a.shakeT=performance.now()+500;a.tx=a.home.x;a.ty=a.home.y;return;}
  d.atom=a;a.on=k;d.state='ready';a.tx=d.slot.x;a.ty=d.slot.y;d.shakeT=performance.now()+250;
  burst(d.slot.x+70,d.slot.y-75,{bal:'KLONK !',cmp:'SHLOMP !',chg:'CLIC !'}[k],'#ffe600');
  updButtons();
}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);

function drawAtom(a,t){
  const sc=a.scale,breath=Math.sin(t*.004+a.ph)*.035;
  const bob=(a.on||a.drag)?0:Math.sin(t*.0022+a.ph)*8;
  const sh=a.shakeT>t?Math.sin(t*.09)*9:0;
  const meas=a.on&&devs[a.on].state==='measuring';
  const jx=meas?(Math.random()-.5)*4:0, jy=meas?(Math.random()-.5)*4:0;
  ctx.save();ctx.translate(a.x+sh+jx,a.y+bob+jy);
  ctx.rotate(a.drag?Math.sin(t*.02)*.12:Math.sin(t*.0017+a.ph)*.06);
  ctx.scale(sc*(1+breath),sc*(1-breath));
  // halo
  const g=ctx.createRadialGradient(0,0,8,0,0,a.r*1.25);
  g.addColorStop(0,'hsla('+a.hue+',95%,65%,.55)');g.addColorStop(.7,'hsla('+a.hue+',90%,60%,.22)');g.addColorStop(1,'hsla('+a.hue+',90%,60%,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,a.r*1.25,0,7);ctx.fill();
  // nuage électronique (continu, non dénombrable)
  for(let k=0;k<3;k++){
    const rot=k*Math.PI/3+t*.0004*(k%2?1:-1)+a.ph;
    rEll(0,0,a.r,a.r*.36,a.i*100+k*13,1.6,rot,30);
    ctx.lineWidth=7;ctx.strokeStyle='hsla('+a.hue+',90%,55%,.35)';ctx.stroke();
    ctx.lineWidth=2.6;ctx.strokeStyle='#111';ctx.stroke();
    ctx.save();ctx.setLineDash([14,22]);ctx.lineDashOffset=-t*.12*(1+k*.25);
    ctx.lineWidth=4;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.stroke();ctx.restore();
  }
  // noyau mystère
  const nr=23;
  rEll(0,0,nr,nr,a.i*50+7,1.5);
  const ng=ctx.createRadialGradient(-6,-7,2,0,0,nr);
  ng.addColorStop(0,'#ffd0c0');ng.addColorStop(.5,'#ff5a3c');ng.addColorStop(1,'#7c6f86');
  ink(ng,3);
  ctx.save();rEll(0,0,nr,nr,a.i*50+7,1.5);ctx.clip();
  for(let k=0;k<7;k++){const an=t*.003*(k%2?1:-1)+k*.9,rr=9+R(k+a.i)*8;
    ctx.fillStyle=k%2?'rgba(130,130,150,.45)':'rgba(255,60,40,.4)';
    ctx.beginPath();ctx.arc(Math.cos(an)*rr*.6,Math.sin(an)*rr*.6,9,0,7);ctx.fill();}
  ctx.restore();
  // yeux
  const ex=mouse.x-a.x,ey=mouse.y-a.y,el=Math.hypot(ex,ey)||1,px=ex/el*2.6,py=ey/el*2.6;
  const blink=((t+a.blinkT)%3600)<130;
  for(const s of [-1,1]){
    ctx.beginPath();ctx.ellipse(s*8,-3,6.2,blink?1:(a.drag?8:7),0,0,7);ink('#fff',2);
    if(!blink){ctx.fillStyle='#111';ctx.beginPath();ctx.arc(s*8+px,-3+py,a.drag?3.6:2.8,0,7);ctx.fill();}
  }
  ctx.lineWidth=2;ctx.strokeStyle='#111';ctx.beginPath();
  if(a.drag){ctx.ellipse(0,9,4,3.5,0,0,7);}else{ctx.arc(0,7,5,.2,Math.PI-.2);}ctx.stroke();
  ctx.restore();
}

const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function sci(m){const e=Math.floor(Math.log10(m));let mt=m/Math.pow(10,e);let s=mt.toFixed(2);
  if(s==='10.00'){s='1.00';return s.replace('.',',')+' × 10'+String(e+1).replace(/./g,c=>SUP[c]);}
  return s.replace('.',',')+' × 10'+String(e).replace(/./g,c=>SUP[c]);}
const UNIT_U=1.66054e-27;
function fmtMass(m){
  if(P.unit==='u'){const v=m/UNIT_U,d=Math.max(0,P.cs-1-Math.floor(Math.log10(v)));return v.toFixed(d).replace('.',',')+' u';}
  const x=P.unit==='g'?m*1000:m;let e=Math.floor(Math.log10(x)),mt=(x/Math.pow(10,e)).toFixed(P.cs-1);
  if(parseFloat(mt)>=10){e++;mt=(x/Math.pow(10,e)).toFixed(P.cs-1);}
  return mt.replace('.',',')+(e?' × 10'+String(e).replace(/./g,c=>SUP[c]):'')+' '+(P.unit==='g'?'g':'kg');
}
function scramble(n){let s='';for(let i=0;i<n;i++)s+=Math.floor(Math.random()*10);return s;}
function sleepy(d){return CONFIG.one&&!d.free&&!d.atom&&DKEYS.some(j=>j!==d.key&&ruled(j)&&devs[j].atom);}
function fitSize(s,w,max){return Math.min(max,(w-14)/(s.length*.6));}
function fmtCharge(q){let e=Math.floor(Math.log10(q)),mt=(q/Math.pow(10,e)).toFixed(P.cs-1);
  if(parseFloat(mt)>=10){e++;mt=(q/Math.pow(10,e)).toFixed(P.cs-1);}
  return mt.replace('.',',')+' × 10'+String(e).replace(/./g,c=>SUP[c])+' C';}

}
function drawBursts(t){
  for(let i=bursts.length-1;i>=0;i--){const b=bursts[i],e=(t-b.t0)/1300;if(e>1){bursts.splice(i,1);continue;}
    const s=e<.15?e/.15*1.15:(e<.25?1.15-(e-.15)*1.5:1);
    ctx.font='bold 24px '+IMPACT;const w=ctx.measureText(b.text).width/2+26,h=34,P=[];
    const bx=Math.min(Math.max(b.x,w*1.45+12),W-w*1.45-12);
    ctx.save();ctx.globalAlpha=e>.75?(1-e)/.25:1;ctx.translate(bx,b.y-e*25);ctx.rotate(b.rot);ctx.scale(s,s);
    for(let k=0;k<22;k++){const an=k/22*Math.PI*2,rr=(k%2?1:1.32)*(1+R(k+b.t0)*.08);P.push([Math.cos(an)*w*rr,Math.sin(an)*h*rr]);}
    ctx.beginPath();ctx.moveTo(P[0][0],P[0][1]);for(const p of P)ctx.lineTo(p[0],p[1]);ctx.closePath();
    ctx.fillStyle='#111';ctx.save();ctx.translate(5,5);ctx.fill();ctx.restore();
    ink(b.col,3);txt(b.text,0,2,24,b.bad?'#fff':'#111',IMPACT,'center',b.bad?4:0);
    ctx.restore();}
}

/* ====================== BOUCLE ====================== */
function frame(t){
  if(cv.width<2)fit();
  boil=Math.floor(t/140);
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  ctx.drawImage(bg,0,0,W,H);
  drawTitle(t);drawBench();
  drawBalance(devs.bal,t);drawCharge(devs.chg,t);drawCompositor(devs.cmp,t);
  for(const a of atoms)drawCaption(a,t);
  for(const a of atoms){
    if(!a.drag){a.x+=(a.tx-a.x)*.18;a.y+=(a.ty-a.y)*.18;}
    const ts=a.on&&!a.drag?.74:(a.drag?1.08:1);a.scale+=(ts-a.scale)*.2;
  }
  // ombres portées sous les atomes sur les appareils
  for(const a of atoms)drawAtom(a,t);
  drawBursts(t);
  if(CONFIG.move)requestAnimationFrame(frame);
}
fit();updButtons();
if(!CONFIG.move){for(const k in UI)UI[k].btn.style.display='none';cv.style.cursor='default';
  const f0=frame;frame=function(t){f0(1000);};let n=0;(function once(){if(n++<3)requestAnimationFrame(t=>{frame(t);setTimeout(once,200);});})();}
else requestAnimationFrame(frame);
})();
</script>
