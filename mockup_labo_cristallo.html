<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Maquette - Labo de cristallographie</title>
<style>
  :root{--ink:#14161c;--paper:#fffdf6;--blue:#1565c0;--red:#e53935;--yellow:#ffd54f;}
  *{box-sizing:border-box;}
  body{margin:0;background:#07090d;color:#eef1f6;font-family:"Trebuchet MS","Segoe UI",sans-serif;min-height:100vh;
    background-image:radial-gradient(rgba(66,165,245,.16) 1.2px,transparent 1.3px);background-size:10px 10px;}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);animation:scan 8s linear infinite;}
  body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:41;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%);}
  @keyframes scan{to{background-position:0 300px}}
  #page{max-width:960px;margin:0 auto;padding:14px 16px 20px;}
  .hand{filter:url(#rough);}
  h1{margin:0 0 14px;font-family:Impact,"Arial Black",sans-serif;font-weight:normal;letter-spacing:3px;font-size:32px;
    color:#fff;background:var(--blue);display:inline-block;padding:4px 18px;border:3px solid var(--ink);
    box-shadow:5px 5px 0 var(--yellow);transform:skew(-8deg);text-shadow:3px 3px 0 var(--ink);border-color:#eef1f6;}
  .panel{background:#11151d;border:3px solid #eef1f6;box-shadow:6px 6px 0 var(--blue);padding:12px 14px;position:relative;}
  /* appareils : fond clair */
  #stage,#scale{background:radial-gradient(ellipse at 30% 20%,#f5f8fa 0%,#dde5eb 70%,#c9d4dc 100%);color:var(--ink);}
  #stage .hint{color:#455a64;}
  #stage #msg{color:#c62828;}
  .ptitle{position:absolute;top:-15px;left:14px;z-index:6;background:var(--yellow);border:3px solid var(--ink);
    font-family:Impact,sans-serif;letter-spacing:1px;padding:1px 10px;font-size:15px;transform:rotate(-2deg);}
  /* echantillons */
  #samples{display:flex;gap:16px;justify-content:center;padding-top:20px;}
  .sample{flex:1;max-width:200px;display:flex;align-items:center;gap:12px;border:3px solid #eef1f6;
    padding:8px 12px;cursor:grab;background:#1a202b;transition:transform .15s,box-shadow .15s,opacity .2s;touch-action:none;user-select:none;}
  .sample:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--yellow);}
  .sample.in{opacity:.35;border-style:dashed;cursor:default;transform:none;box-shadow:none;}
  .sample b{font-family:Impact,sans-serif;font-weight:normal;font-size:26px;letter-spacing:1px;}
  .sample small{display:block;font-size:11px;color:#90a4ae;}
  /* rangee du bas */
  #row{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;margin-top:30px;align-items:start;}
  #stage{min-height:450px;padding-top:24px;}
  #fx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:4;}
  .btn{font-family:Impact,sans-serif;font-size:21px;letter-spacing:1px;color:#fff;background:var(--red);
    border:3px solid #eef1f6;box-shadow:4px 4px 0 var(--yellow);padding:8px 22px;cursor:pointer;transform:skew(-8deg);}
  .btn:hover{background:#f4511e;}
  .btn:active{transform:skew(-8deg) translate(3px,3px);box-shadow:1px 1px 0 var(--ink);}
  .btn.small{font-size:13px;padding:4px 10px;background:var(--blue);white-space:nowrap;box-shadow:3px 3px 0 var(--yellow);}
  .btn.small.alt{background:#37474f;}
  .btns{display:flex;flex-wrap:wrap;gap:8px;}
  .btn.shake{animation:shk .4s;}
  @keyframes shk{0%,100%{transform:skew(-8deg)}25%{transform:skew(-8deg) translateX(-8px)}75%{transform:skew(-8deg) translateX(8px)}}
  .center{text-align:center;}
  #msg{min-height:22px;font-size:14px;margin-top:8px;color:#ff8a80;font-weight:bold;}
  #slot.hot{stroke:#ffd54f;stroke-width:6;}
  /* effets */
  .burst{position:absolute;left:50%;top:46%;width:260px;height:170px;margin:-85px 0 0 -130px;
    background:var(--yellow);display:flex;align-items:center;justify-content:center;
    clip-path:polygon(50% 0,61% 22%,85% 5%,78% 32%,100% 38%,80% 55%,98% 78%,70% 72%,62% 100%,48% 78%,25% 98%,27% 70%,0 75%,18% 52%,2% 30%,28% 30%,22% 5%,42% 22%);
    font-family:Impact,sans-serif;font-size:44px;color:var(--red);text-shadow:3px 3px 0 var(--ink);transform:scale(0);}
  .burst.go{animation:pow .75s ease-out forwards;}
  @keyframes pow{0%{transform:scale(0) rotate(-25deg)}40%{transform:scale(1.15) rotate(6deg)}70%{transform:scale(1)}100%{transform:scale(1.5);opacity:0}}
  /* terminal */
  #term{display:none;position:relative;height:420px;background:#000;border:3px solid #33ff66;overflow:hidden;
    font-family:"Courier New",monospace;font-size:14px;color:#33ff66;padding:14px 16px;line-height:1.55;}
  #term:before{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 1px,transparent 1px 3px);}
  #term .dim{color:#1f9e45;} #term .ok{color:#fff;} #term .warn{color:#ffd54f;}
  #term .cursor{display:inline-block;width:9px;height:16px;background:#33ff66;vertical-align:-3px;animation:blink .7s steps(1) infinite;}
  @keyframes blink{50%{opacity:0}}
  .crt-off{animation:crtOff .45s ease-in forwards;}
  @keyframes crtOff{0%{transform:scale(1,1);filter:brightness(1)}60%{transform:scale(1,.01);filter:brightness(3)}100%{transform:scale(0,.01);filter:brightness(5)}}
  .crt-on{animation:crtOn .55s ease-out;}
  @keyframes crtOn{0%{transform:scale(0,.01);filter:brightness(5)}45%{transform:scale(1,.01);filter:brightness(3)}100%{transform:scale(1,1);filter:brightness(1)}}
  /* visualisation */
  #vizCard{display:none;}
  #cvWrap{position:relative;}
  #measTerm{display:none;position:absolute;inset:0;background:rgba(0,0,0,.92);border:3px solid #33ff66;overflow:hidden;
    font-family:"Courier New",monospace;font-size:12px;color:#33ff66;padding:10px 12px;line-height:1.4;}
  #measTerm:before{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.4) 0 1px,transparent 1px 3px);}
  #measTerm .hex{color:#1f7a3a;} #measTerm .red{color:#ff5252;} #measTerm .w{color:#fff;}
  #measTerm .big{font-size:22px;color:#fff;text-shadow:0 0 8px #33ff66;margin-top:6px;}
  .glitch{animation:glt .25s steps(2) 4;}
  @keyframes glt{0%{transform:translate(0)}25%{transform:translate(-4px,2px);color:#ff5252}50%{transform:translate(3px,-2px);color:#40c4ff}75%{transform:translate(-2px,1px)}100%{transform:translate(0)}}
  .shakeAll{animation:sa .3s;}
  @keyframes sa{25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-1px)}}
  #aBadge{display:none;margin-top:8px;font-family:"Courier New",monospace;font-size:16px;font-weight:bold;
    background:#000;color:#69f0ae;border:3px solid #69f0ae;padding:6px 10px;text-align:center;}
  #vizCard .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 10px;margin-bottom:10px;}
  #vizCard .tag{font-family:Impact,sans-serif;font-size:20px;letter-spacing:1px;white-space:nowrap;}
  #cv{width:100%;height:380px;background:#000;border:3px solid #eef1f6;display:block;touch-action:none;cursor:grab;}
  .hint{font-size:13px;margin-top:8px;color:#90a4ae;}
  /* balance */
  #scale{padding:26px 16px 18px;}
  .bal{display:flex;flex-direction:column;align-items:center;}
  .pan{position:relative;width:180px;height:30px;border-radius:50%;border:3px solid #eef1f6;
    background:radial-gradient(ellipse at 40% 35%,#ffffff 0%,#e3e8ec 45%,#9aa7b0 100%);transition:background .2s,box-shadow .2s;}
  .pan.hot{background:radial-gradient(ellipse at 40% 35%,#fffde7 0%,#fff176 60%,#fbc02d 100%);box-shadow:0 0 0 4px rgba(255,213,79,.5);}
  #onPlate{position:absolute;left:50%;bottom:12px;border-radius:50%;border:3px solid var(--ink);transform:translateX(-50%) scale(0);
    transition:transform .25s cubic-bezier(.3,1.6,.5,1);}
  #onPlate:after,#ghost.atom:after{content:"";position:absolute;left:18%;top:16%;width:30%;height:30%;border-radius:50%;background:rgba(255,255,255,.65);}
  .neck{width:26px;height:18px;background:#90a4ae;border:3px solid #eef1f6;border-top:none;border-bottom:none;}
  .body{width:220px;border:3px solid #eef1f6;border-radius:18px 18px 10px 10px;background:#263238;padding:12px 12px 10px;box-shadow:inset 0 -8px 0 #1c262b;}
  .brand{font-family:Impact,sans-serif;letter-spacing:2px;font-size:12px;color:#90a4ae;text-align:center;margin-bottom:6px;}
  #screen{font-family:"Courier New",monospace;font-size:18px;font-weight:bold;background:#0f2e1a;color:#69f0ae;
    border:3px solid var(--ink);border-radius:6px;padding:9px 6px;text-align:center;letter-spacing:1px;min-height:46px;}
  .keys{display:flex;justify-content:space-between;margin-top:9px;}
  .keys span{font-family:Impact,sans-serif;font-size:12px;letter-spacing:1px;background:#1565c0;color:#fff;border:2px solid var(--ink);border-radius:20px;padding:2px 12px;}
  .keys span.led{background:#fff;color:var(--ink);display:flex;align-items:center;gap:5px;}
  .keys span.led:before{content:"";width:8px;height:8px;border-radius:50%;background:#43a047;border:1px solid var(--ink);}
  #scale{position:relative;}
  #weighBtn{margin-top:14px;width:100%;font-size:22px;}
  #balFx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5;}
  #balRays{position:absolute;left:50%;top:40%;width:600px;height:600px;margin:-300px 0 0 -300px;opacity:0;
    background:repeating-conic-gradient(from 0deg,#ffd54f 0 10deg,#e53935 10deg 20deg);border-radius:50%;}
  #balRays.go{animation:rays .9s ease-out forwards;}
  @keyframes rays{0%{opacity:0;transform:scale(.2) rotate(0)}25%{opacity:.85}100%{opacity:0;transform:scale(1.1) rotate(90deg)}}
  #balWord{position:absolute;left:50%;top:40%;width:210px;height:150px;margin:-75px 0 0 -105px;
    background:#fff;display:flex;align-items:center;justify-content:center;transform:scale(0);
    clip-path:polygon(50% 0,60% 20%,82% 4%,78% 30%,100% 34%,82% 52%,100% 74%,72% 70%,64% 100%,48% 78%,28% 98%,26% 70%,0 74%,16% 50%,0 28%,26% 28%,20% 4%,40% 20%);
    font-family:Impact,sans-serif;font-size:46px;color:#e53935;letter-spacing:1px;
    text-shadow:3px 3px 0 #14161c,-2px -2px 0 #ffd54f;}
  #balWord.go{animation:word .9s cubic-bezier(.2,1.6,.4,1) forwards;}
  @keyframes word{0%{transform:scale(0) rotate(-30deg)}35%{transform:scale(1.2) rotate(-8deg)}65%{transform:scale(1) rotate(-12deg)}100%{transform:scale(1.3) rotate(-12deg);opacity:0}}
  .bal.flash .body{animation:fl .35s;}
  @keyframes fl{0%{background:#fff59d}100%{background:#263238}}
  /* fantome de glisser-deposer */
  #ghost{position:fixed;z-index:50;pointer-events:none;display:none;transform:translate(-50%,-50%) rotate(-6deg);}
  #ghost.atom{border-radius:50%;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transform:translate(-50%,-50%);}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/></filter>
  <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="rgba(0,0,0,.18)"/></pattern>
  <linearGradient id="glass" x1="0" x2="1"><stop offset="0" stop-color="#b3e5fc"/><stop offset="1" stop-color="#4fc3f7"/></linearGradient>
</svg>
<div id="ghost"></div>

<div id="page">
  <h1>LABO DE CRISTALLOGRAPHIE</h1>

  <div class="panel hand">
    <span class="ptitle">ÉCHANTILLONS</span>
    <div id="samples"></div>
  </div>

  <div id="row">
    <div class="panel" id="stage">
      <span class="ptitle" id="stageTitle">MICROSCOPE À EFFET TUNNEL</span>
      <div id="fx"><div class="burst" id="burst">ZZZAP !</div></div>

      <div id="micro" class="center">
        <svg id="microSvg" width="400" height="330" viewBox="0 0 400 330" class="hand" style="max-width:100%">
          <rect x="40" y="290" width="320" height="22" fill="#455a64" stroke="#14161c" stroke-width="3"/>
          <rect x="60" y="312" width="22" height="16" fill="#37474f" stroke="#14161c" stroke-width="3"/>
          <rect x="318" y="312" width="22" height="16" fill="#37474f" stroke="#14161c" stroke-width="3"/>
          <path d="M110 290 l8 -8 l-16 -6 l16 -6 l-16 -6 l8 -6 M290 290 l8 -8 l-16 -6 l16 -6 l-16 -6 l8 -6" stroke="#14161c" stroke-width="3" fill="none"/>
          <rect x="70" y="248" width="260" height="12" fill="#90a4ae" stroke="#14161c" stroke-width="3"/>
          <path d="M110 248 L110 120 Q110 70 200 70 Q290 70 290 120 L290 248 Z" fill="#cfd8dc" stroke="#14161c" stroke-width="4"/>
          <path d="M110 248 L110 120 Q110 70 200 70 Q290 70 290 120 L290 248 Z" fill="url(#dots)"/>
          <rect x="104" y="232" width="192" height="16" fill="#b0bec5" stroke="#14161c" stroke-width="3"/>
          <rect x="104" y="112" width="192" height="12" fill="#b0bec5" stroke="#14161c" stroke-width="3"/>
          <circle cx="200" cy="180" r="48" fill="#14161c"/>
          <circle id="slot" cx="200" cy="180" r="42" fill="url(#glass)" stroke="#14161c" stroke-width="3"/>
          <rect x="193" y="140" width="14" height="22" fill="#78909c" stroke="#14161c" stroke-width="2"/>
          <path d="M193 162 L207 162 L200 184 Z" fill="#ffd54f" stroke="#14161c" stroke-width="2"/>
          <g id="microSample" style="display:none">
            <rect x="172" y="196" width="56" height="12" stroke="#14161c" stroke-width="2"/>
            <path d="M200 186 l-4 4 l6 2 l-4 4" stroke="#ff7043" stroke-width="2.5" fill="none" stroke-linecap="round"><animate attributeName="opacity" values="1;0.2;1" dur="0.6s" repeatCount="indefinite"/></path>
          </g>
          <text id="slotTxt" x="200" y="222" text-anchor="middle" font-family="Impact" font-size="13" fill="#0d47a1" letter-spacing="1">VIDE</text>
          <path d="M168 150 Q178 140 190 142" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/>
          <rect x="190" y="40" width="20" height="30" fill="#78909c" stroke="#14161c" stroke-width="3"/>
          <rect x="178" y="30" width="44" height="12" rx="3" fill="#455a64" stroke="#14161c" stroke-width="3"/>
          <path d="M290 150 C340 150 340 220 372 220" stroke="#14161c" stroke-width="4" fill="none"/>
          <circle cx="372" cy="220" r="6" fill="#e53935" stroke="#14161c" stroke-width="3"/>
          <circle id="led1" cx="132" cy="140" r="6" fill="#b71c1c" stroke="#14161c" stroke-width="2"/>
          <circle cx="132" cy="160" r="6" fill="#ffd54f" stroke="#14161c" stroke-width="2"/>
        </svg>
        <div><button class="btn" id="vizBtn">⚡ VISUALISATION</button></div>
        <div id="msg"></div>
      </div>

      <div id="term"></div>

      <div id="vizCard">
        <div class="top">
          <span class="tag">ÉCHANTILLON <span id="vizName"></span></span>
          <div class="btns">
            <button class="btn small alt" id="rotBtn">⏸ PAUSE</button>
            <button class="btn small" id="measBtn">📏 MESURER a</button>
            <button class="btn small alt" id="backBtn">↩</button>
          </div>
        </div>
        <div id="cvWrap"><canvas id="cv"></canvas><div id="measTerm"></div></div>
        <div id="aBadge"></div>
        <div class="hint">Glisser sur la maille : rotation · glisser un atome vers la balance : pesée</div>
      </div>
    </div>

    <div class="panel" id="scale">
      <span class="ptitle">BALANCE</span>
      <div class="bal" id="bal">
        <div class="pan" id="dropZone"><div id="onPlate"></div></div>
        <div class="neck"></div>
        <div class="body">
          <div class="brand">ATOMIC SCALE</div>
          <div id="screen">0.000 kg</div>
          <div class="keys"><span>TARE</span><span class="led">ON</span></div>
        </div>
      </div>
      <button class="btn" id="weighBtn">⚖ PESER !</button>
      <div id="balFx"><div id="balRays"></div><div id="balWord">POW!</div></div>
    </div>
  </div>
</div>

<script>
/* ===== MAQUETTE (données factices) ===== */
const SAMPLES=[
  {name:"X-1",gem:"#80deea",cat:"#42a5f5",ani:"#66bb6a",mc:"3,82×10⁻²⁶",ma:"5,89×10⁻²⁶",a:"5,64×10⁻¹⁰"},
  {name:"X-2",gem:"#ce93d8",cat:"#ab47bc",ani:"#ffca28",mc:"6,66×10⁻²⁶",ma:"3,16×10⁻²⁶",a:"6,28×10⁻¹⁰"},
  {name:"X-3",gem:"#ffcc80",cat:"#ef5350",ani:"#26c6da",mc:"1,15×10⁻²⁶",ma:"2,66×10⁻²⁶",a:"4,03×10⁻¹⁰"}];
let autoRot=true,measuring=false,aMeasured=false;
const $=id=>document.getElementById(id);
const gemSvg=(c,s)=>`<svg width="${s}" height="${s}" viewBox="0 0 44 44"><polygon points="22,3 40,15 34,40 10,40 4,15" fill="${c}" stroke="#14161c" stroke-width="3"/><polygon points="22,3 30,15 22,40 14,15" fill="rgba(255,255,255,.35)"/><polyline points="4,15 40,15" stroke="#14161c" stroke-width="2" fill="none"/></svg>`;
let cur=-1;
const ghost=$('ghost');

/* --- échantillons : glisser vers le hublot du microscope --- */
SAMPLES.forEach((S,k)=>{
  const d=document.createElement('div');d.className='sample';d.dataset.k=k;
  d.innerHTML=gemSvg(S.gem,44)+`<div><b>${S.name}</b><small>glisser vers le microscope</small></div>`;
  $('samples').appendChild(d);
  d.addEventListener('pointerdown',e=>{
    if(d.classList.contains('in')||$('micro').style.display==='none')return;
    d.setPointerCapture(e.pointerId);
    ghost.className='';ghost.innerHTML=gemSvg(S.gem,60);
    Object.assign(ghost.style,{display:'block',width:'',height:'',background:'',left:e.clientX+'px',top:e.clientY+'px'});
    d._drag=true;
  });
  d.addEventListener('pointermove',e=>{if(!d._drag)return;
    ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
    $('slot').classList.toggle('hot',overSlot(e.clientX,e.clientY));});
  d.addEventListener('pointerup',e=>{if(!d._drag)return;d._drag=false;ghost.style.display='none';
    $('slot').classList.remove('hot');
    if(overSlot(e.clientX,e.clientY))loadSample(k);});
});
function overSlot(x,y){const r=$('microSvg').getBoundingClientRect();
  return x>r.left+r.width*.2&&x<r.right-r.width*.2&&y>r.top+r.height*.15&&y<r.bottom-r.height*.2;}
function loadSample(k){
  cur=k;document.querySelectorAll('.sample').forEach(s=>s.classList.toggle('in',+s.dataset.k===k));
  const g=$('microSample');g.style.display='';g.querySelector('rect').setAttribute('fill',SAMPLES[k].gem);
  $('slotTxt').textContent=SAMPLES[k].name;$('led1').setAttribute('fill','#69f0ae');$('msg').textContent='';
  resetScale();$('aBadge').style.display='none';aMeasured=false;
}
let onPan=null;
function resetScale(){onPan=null;$('screen').textContent='0.000 kg';$('onPlate').style.transform='translateX(-50%) scale(0)';}

/* --- VISUALISATION : terminal puis 3D --- */
$('vizBtn').onclick=()=>{
  if(cur<0){$('msg').textContent='Place d\'abord un échantillon dans le microscope.';
    const b=$('vizBtn');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return;}
  $('micro').style.display='none';$('stageTitle').textContent='ACQUISITION';
  runTerminal(SAMPLES[cur].name,showViz);
};
function runTerminal(name,done){
  const t=$('term');t.style.display='block';t.className='crt-on';t.innerHTML='';
  const L=[
    ['$ stm-ctl --load '+name,''],
    ['[ OK ] pompe turbomoléculaire ........ 2.1e-10 mbar','ok'],
    ['[ OK ] isolation vibratoire ........... active','ok'],
    ['[....] approche grossière de la pointe','dim'],
    ['[ OK ] contact tunnel établi ...... I = 1.24 nA','ok'],
    ['[....] balayage XY  ','dim','bar'],
    ['[ OK ] 4096 × 4096 points acquis','ok'],
    ['[WARN] dérive thermique corrigée','warn'],
    ['$ reconstruct --mode=3D --cell=conventional',''],
    ['>> reconstruction de la maille ...','ok']];
  let i=0;
  (function next(){
    if(i>=L.length){t.insertAdjacentHTML('beforeend','<span class="cursor"></span>');
      setTimeout(()=>{t.className='crt-off';setTimeout(()=>{t.style.display='none';done();},450);},700);return;}
    const [txt,cls,bar]=L[i++];const line=document.createElement('div');if(cls)line.className=cls;t.appendChild(line);
    let c=0;const typer=setInterval(()=>{line.textContent=txt.slice(0,++c);
      if(c>=txt.length){clearInterval(typer);
        if(bar){let n=0;const b=setInterval(()=>{line.textContent=txt+'█'.repeat(++n)+'░'.repeat(20-n)+' '+n*5+'%';
          if(n>=20){clearInterval(b);setTimeout(next,120);}},45);}
        else setTimeout(next,txt[0]==='$'?260:110);}},txt[0]==='$'?28:9);
  })();
}
function showViz(){
  const v=$('vizCard');v.style.display='block';v.className='crt-on';$('stageTitle').textContent='VISUALISATION';
  $('vizName').textContent=SAMPLES[cur].name;resize();
  const b=$('burst');b.classList.remove('go');void b.offsetWidth;b.classList.add('go');
}
$('backBtn').onclick=()=>{$('vizCard').style.display='none';$('micro').style.display='block';$('stageTitle').textContent='MICROSCOPE À EFFET TUNNEL';};

/* --- maille type NaCl (maquette 2D, sera remplacée par le rendu Three.js du viewer) --- */
const P=[];for(let x=0;x<=1;x++)for(let y=0;y<=1;y++)for(let z=0;z<=1;z++)P.push([x,y,z,0]);
[[.5,.5,0],[.5,.5,1],[.5,0,.5],[.5,1,.5],[0,.5,.5],[1,.5,.5]].forEach(p=>P.push([...p,0]));
[[.5,0,0],[0,.5,0],[0,0,.5],[.5,1,0],[1,.5,0],[.5,0,1],[0,.5,1],[1,0,.5],[0,1,.5],[.5,1,1],[1,.5,1],[1,1,.5],[.5,.5,.5]].forEach(p=>P.push([...p,1]));
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,ry=.6,rx=.35,drag=null,rot=null,proj=[];
function resize(){W=cv.width=cv.clientWidth;H=cv.height=cv.clientHeight;}
function project(p){const x=p[0]-.5,y=p[1]-.5,z=p[2]-.5;
  let X=x*Math.cos(ry)+z*Math.sin(ry),Z=-x*Math.sin(ry)+z*Math.cos(ry);
  let Y=y*Math.cos(rx)-Z*Math.sin(rx);Z=y*Math.sin(rx)+Z*Math.cos(rx);
  const s=Math.min(W,H)*.58,f=3/(3+Z);return{x:W/2+X*s*f,y:H/2-Y*s*f,z:Z,f};}
function rad(q){return (q.t?19:13)*q.f;}
function ball(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=c;ctx.fill();
  ctx.lineWidth=2.5;ctx.strokeStyle='#14161c';ctx.stroke();
  ctx.beginPath();ctx.arc(x-r*.35,y-r*.35,r*.28,0,7);ctx.fillStyle='rgba(255,255,255,.6)';ctx.fill();}
function draw(){
  if(W&&cur>=0){
    if(autoRot&&!drag&&!rot)ry+=.004;
    ctx.clearRect(0,0,W,H);const S=SAMPLES[cur];
    ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;
    [[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]].forEach(([a,b])=>{
      const A=project(P[a]),B=project(P[b]);ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();});
    proj=P.map((p,i)=>({...project(p),i,t:p[3]})).sort((a,b)=>b.z-a.z);
    proj.forEach(q=>{if(drag&&drag.i===q.i)return;ball(q.x,q.y,rad(q),q.t?S.ani:S.cat);});
    if(aMeasured)edgeArrow(project(P[0]),project(P[4]));
  }
  requestAnimationFrame(draw);}

/* --- double fleche "a" le long d'une arete (apres mesure) --- */
function edgeArrow(A,B){
  const dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  let nx=-uy,ny=ux;                                   /* normale, orientee vers l'exterieur du cube */
  if(((A.x+B.x)/2-W/2)*nx+((A.y+B.y)/2-H/2)*ny<0){nx=-nx;ny=-ny;}
  const off=26,ax=A.x+nx*off,ay=A.y+ny*off,bx=B.x+nx*off,by=B.y+ny*off,h=12;
  ctx.save();ctx.lineCap='round';
  ctx.strokeStyle='rgba(255,213,79,.5)';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(ax,ay);ctx.moveTo(B.x,B.y);ctx.lineTo(bx,by);ctx.stroke();
  ctx.setLineDash([]);
  [['#14161c',7],['#ffd54f',3.5]].forEach(([c,w])=>{
    ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);
    [[ax,ay,1],[bx,by,-1]].forEach(([x,y,sg])=>{ctx.moveTo(x+sg*(ux*h)+nx*h*.55,y+sg*(uy*h)+ny*h*.55);ctx.lineTo(x,y);
      ctx.lineTo(x+sg*(ux*h)-nx*h*.55,y+sg*(uy*h)-ny*h*.55);});
    ctx.stroke();});
  const mx=(ax+bx)/2+nx*20,my=(ay+by)/2+ny*20;
  ctx.font='bold 24px Impact';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=5;ctx.strokeStyle='#14161c';ctx.strokeText('a',mx,my);ctx.fillStyle='#ffd54f';ctx.fillText('a',mx,my);
  ctx.restore();}

/* --- atome : glisser vers la balance --- */
function overPlate(cx,cy){const r=$('dropZone').getBoundingClientRect();
  return cx>r.left-25&&cx<r.right+25&&cy>r.top-60&&cy<r.bottom+30;}
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  const hit=[...proj].reverse().find(q=>Math.hypot(q.x-mx,q.y-my)<rad(q)+4);
  cv.setPointerCapture(e.pointerId);
  if(hit){const S=SAMPLES[cur],d=hit.t?40:28;drag={i:hit.i,t:hit.t};
    ghost.className='atom';ghost.innerHTML='';
    Object.assign(ghost.style,{display:'block',width:d+'px',height:d+'px',background:hit.t?S.ani:S.cat,left:e.clientX+'px',top:e.clientY+'px'});
    cv.style.cursor='grabbing';}
  else rot={x:e.clientX,y:e.clientY};
});
cv.addEventListener('pointermove',e=>{
  if(drag){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
    $('dropZone').classList.toggle('hot',overPlate(e.clientX,e.clientY));}
  else if(rot){ry+=(e.clientX-rot.x)*.01;rx=Math.max(-1.4,Math.min(1.4,rx+(e.clientY-rot.y)*.01));rot={x:e.clientX,y:e.clientY};}
});
cv.addEventListener('pointerup',e=>{
  if(drag&&overPlate(e.clientX,e.clientY)){
    const S=SAMPLES[cur],c=$('onPlate'),d=drag.t?34:24;
    Object.assign(c.style,{width:d+'px',height:d+'px',background:drag.t?S.ani:S.cat,transform:'translateX(-50%) scale(1)'});
    onPan=drag.t?S.ma:S.mc;$('screen').textContent='- - - kg';
  }
  drag=null;rot=null;ghost.style.display='none';$('dropZone').classList.remove('hot');cv.style.cursor='grab';
});
/* --- pause / rotation --- */
$('rotBtn').onclick=()=>{autoRot=!autoRot;$('rotBtn').textContent=autoRot?'⏸ PAUSE':'▶ ROTATION';};

/* --- mesure du parametre de maille : terminal "de ouf" --- */
$('measBtn').onclick=()=>{
  if(measuring)return;measuring=true;
  const t=$('measTerm');t.style.display='block';t.className='crt-on';t.innerHTML='';
  const hex=()=>Array.from({length:8},()=>Math.floor(Math.random()*65536).toString(16).padStart(4,'0').toUpperCase()).join(' ');
  const add=(h,c)=>{const d=document.createElement('div');if(c)d.className=c;d.innerHTML=h;t.appendChild(d);
    while(t.children.length>22)t.removeChild(t.firstChild);return d;};
  const steps=[];
  steps.push(()=>add('$ sudo lattice-probe --target='+SAMPLES[cur].name+' --mode=OVERDRIVE','w'));
  steps.push(()=>add('[ OK ] calibration interférométrique laser 632.8 nm'));
  for(let i=0;i<10;i++)steps.push(()=>add('0x'+(4096+Math.floor(Math.random()*60000)).toString(16).toUpperCase()+'  '+hex(),'hex'));
  steps.push(()=>add('[!!!] SURCHARGE DU PIÉZO-SCANNER — compensation...','red'));
  steps.push(()=>{$('vizCard').classList.remove('shakeAll');void $('vizCard').offsetWidth;$('vizCard').classList.add('shakeAll');});
  for(let i=0;i<6;i++)steps.push(()=>add('0x'+(4096+Math.floor(Math.random()*60000)).toString(16).toUpperCase()+'  '+hex(),'hex'));
  steps.push(()=>add('[ OK ] FFT 3D … pics de Bragg verrouillés'));
  steps.push(()=>{const d=add('[....] ajustement de la maille  ');let n=0;
    const b=setInterval(()=>{d.textContent='[....] ajustement de la maille  '+'▓'.repeat(++n)+'░'.repeat(16-n);if(n>=16)clearInterval(b);},40);});
  steps.push(()=>{});steps.push(()=>{});steps.push(()=>{});steps.push(()=>{});
  steps.push(()=>add('[LOCK] paramètre de maille acquis','w'));
  steps.push(()=>{const d=add('a = '+SAMPLES[cur].a+' m','big glitch');});
  let i=0;
  (function go(){if(i<steps.length){steps[i++]();setTimeout(go,i<3?350:90);}
    else setTimeout(()=>{t.className='crt-off';setTimeout(()=>{t.style.display='none';measuring=false;
      aMeasured=true;const a=$('aBadge');a.style.display='block';a.textContent='📏 a = '+SAMPLES[cur].a+' m';},450);},1600);})();
};

/* --- pesee facon comics --- */
const WORDS=['POW!','BAM!','KAPOW!','WHAM!','ZOK!','BOOM!'];
$('weighBtn').onclick=()=>{
  const btn=$('weighBtn');
  if(!onPan){$('screen').textContent='PLATEAU VIDE';btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake');return;}
  const r=$('balRays'),w=$('balWord');
  w.textContent=WORDS[Math.floor(Math.random()*WORDS.length)];
  [r,w].forEach(el=>{el.classList.remove('go');void el.offsetWidth;el.classList.add('go');});
  const sc=$('scale');sc.classList.remove('shakeAll');void sc.offsetWidth;sc.classList.add('shakeAll');
  let n=0;const roll=setInterval(()=>{
    $('screen').textContent=(Math.random()*9+1).toFixed(2).replace('.',',')+'×10⁻²⁶ kg';
    if(++n>14){clearInterval(roll);$('screen').textContent=onPan+' kg';
      $('bal').classList.remove('flash');void $('bal').offsetWidth;$('bal').classList.add('flash');}},55);
};

window.addEventListener('resize',()=>{if($('vizCard').style.display==='block')resize();});
draw();
