<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masse volumique – Labo virtuel</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #F0F4F8;
  font-family: 'Segoe UI', sans-serif;
  display: flex; flex-direction: column; align-items: center;
  min-height: 100vh; padding: 18px 10px 30px;
  user-select: none;
}
h2 { color: #2C4A6E; font-size: 1.15rem; font-weight: 600; margin-bottom: 5px; }
.subtitle { color: #5A7A9A; font-size: 0.80rem; margin-bottom: 16px; }

#scene {
  position: relative;
  width: 680px; height: 420px;
  background: linear-gradient(180deg, #e8f0f7 0%, #d0e4ef 100%);
  border-radius: 16px; border: 1.5px solid #b8cfe0;
  box-shadow: 0 4px 18px rgba(44,74,110,0.10);
  overflow: visible;
}

/* ---- FLASK ---- */
#flask-wrap {
  position: absolute; left: 32px; top: 130px;
  width: 88px; height: 165px;
  cursor: pointer;
}
#flask-svg {
  display: block;
  transform-origin: 15px 165px;
  transition: transform 0.25s ease;
}
#flask-svg.tilt  { transform: rotate(42deg); }
#flask-svg.shake { animation: shk 0.45s ease; }
@keyframes shk {
  0%   { transform: rotate(0deg);  }
  15%  { transform: rotate(8deg);  }
  35%  { transform: rotate(-8deg); }
  55%  { transform: rotate(6deg);  }
  75%  { transform: rotate(-5deg); }
  90%  { transform: rotate(3deg);  }
  100% { transform: rotate(0deg);  }
}
/* Pour indicator ring around flask */
#flask-wrap .ring {
  position: absolute; inset: -4px;
  border-radius: 50%;
  border: 3px solid transparent;
  transition: border-color 0.2s;
  pointer-events: none;
}
#flask-wrap.pouring .ring { border-color: rgba(93,202,165,0.55); }

/* ---- ÉPROUVETTE ----
   SVG viewBox = 0 0 82 290, displayed at 82×200px
   → scale factor = 200/290 ≈ 0.6897
   → base (socle bottom, SVG y=279) displayed at pixel 279*(200/290) ≈ 192px from top */
#ep {
  position: absolute; left: 200px; top: 50px;
  width: 82px; height: 200px;
  cursor: grab; z-index: 10;
}
#ep.dragging { cursor: grabbing; z-index: 50; }

/* ---- LECTURE VOLUME ---- */
#vol-readout {
  position: absolute;
  left: -28px; top: 208px;        /* centré sous l'éprouvette */
  width: 138px;
  background: #1A2A1A;
  border: 1.5px solid #3A7A50;
  border-radius: 7px;
  padding: 3px 8px 4px;
  font-family: monospace;
  text-align: center;
  pointer-events: none;
  display: none;
  box-shadow: 0 2px 6px rgba(0,0,0,0.25);
}
#vol-readout .vr-label {
  font-size: 0.60rem; color: #5A9A6A; letter-spacing: 0.06em; display:block;
}
#vol-readout .vr-val {
  font-size: 1.30rem; font-weight: bold; color: #9FE1CB; line-height: 1.15;
}

/* ---- BALANCE ---- */
#balance-wrap {
  position: absolute; left: 406px; top: 202px;
  width: 168px; height: 180px;
}

/* ---- BUTTONS ---- */
.btn-row { display: flex; gap: 10px; margin-top: 14px; }
.btn {
  padding: 7px 18px; border: none; border-radius: 8px;
  font-size: 0.88rem; font-weight: 600; cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  box-shadow: 0 2px 6px rgba(0,0,0,0.10);
}
.btn:active { transform: scale(0.96); }
#btn-minus { background: #F39C12; color: #fff; }
#btn-minus:hover { background: #D68910; }
#btn-vider { background: #7F8C8D; color: #fff; }
#btn-vider:hover { background: #636E72; }
.hint  { color: #6A8EAA; font-size: 0.76rem; margin-top: 7px; }
#msg   { margin-top: 8px; font-size: 0.80rem; color: #c0392b; min-height: 16px; font-style: italic; }
#no-code-msg { display: none; color: #999; font-size: 0.82rem; margin-top: 8px; font-style: italic; }
</style>
</head>

<div class="btn-row">
  <button class="btn" id="btn-minus">− 1 mL</button>
  <button class="btn" id="btn-vider">↺ Vider</button>
</div>
<p class="hint">🧪 Cliquer et maintenir le flacon pour verser · Glisser l'éprouvette sur la balance</p>
<div id="msg"></div>
<div id="no-code-msg">⚠ Paramètre manquant – utilisez <code>?k=xxx</code> dans l'URL.</div>

<script>
// =============================================
//  DÉCODAGE URL  (?k=abc)
// =============================================
// ?k=abc → rho (g/mL) : n=int(rho*1000), XOR 1523, offset 3000, base-26 x3
function decodeK(code) {
  const A = 'abcdefghijklmnopqrstuvwxyz';
  if (!code || code.length !== 3) return null;
  const v = code.toLowerCase().split('').map(c => A.indexOf(c));
  if (v.some(x => x < 0)) return null;
  const n = ((v[0]*676 + v[1]*26 + v[2]) - 3000) ^ 1523;
  return (n < 700 || n > 1500) ? null : n / 1000;
}
// ?m=abc → masse vide (g) : n=int(m*10), XOR 743, offset 2500, base-26 x3
function decodeM(code) {
  const A = 'abcdefghijklmnopqrstuvwxyz';
  if (!code || code.length !== 3) return null;
  const v = code.toLowerCase().split('').map(c => A.indexOf(c));
  if (v.some(x => x < 0)) return null;
  const n = ((v[0]*676 + v[1]*26 + v[2]) - 2500) ^ 743;
  return (n < 500 || n > 2000) ? null : n / 10;
}
const params   = new URLSearchParams(window.location.search);
const DENS_RAW = decodeK(params.get('k'));
const M0_RAW   = decodeM(params.get('m'));
if (DENS_RAW === null || M0_RAW === null) {
  document.getElementById('no-code-msg').style.display = 'block';
}

// =============================================
//  CONSTANTES GÉOMÉTRIQUES
// =============================================
// Éprouvette SVG viewBox = 0 0 82 290, displayed at 82×200px
// Scale = 200/290 ≈ 0.6897
// Base (socle bottom) at SVG y=279 → pixel offset from ep div top:
const EP_SVG_H   = 290;
const EP_DISP_H  = 200;
const EP_SCALE   = EP_DISP_H / EP_SVG_H;           // ≈ 0.6897
const EP_BASE_PX = Math.round(279 * EP_SCALE);      // ≈ 192px

// Graduation constants (SVG coordinates, scale applied by SVG renderer)
const Y0 = 252;          // SVG y for 0 mL
const SC = 232 / 250;    // SVG px per mL = 0.928

// =============================================
//  ÉTAT
// =============================================
const L = {
  DENS:  DENS_RAW ?? 1.00,
  M0:    M0_RAW   ?? 94.32,  // masse éprouvette vide (g)
  vol:   0,
  onBal: false,
  pour:  false,
  tm:    null
};

// =============================================
//  COULEURS LIQUIDE
// =============================================
function lc(d) {
  if (d < 0.90) return { f:'#EF9F27', s:'#BA7517' }; // ambre
  if (d < 1.05) return { f:'#5DCAA5', s:'#1D9E75' }; // eau/vert
  if (d < 1.20) return { f:'#378ADD', s:'#185FA5' }; // bleu
  return              { f:'#D4537E', s:'#993556' };  // rose/dense
}
const COL = lc(L.DENS);
(function applyColors() {
  document.getElementById('liq').setAttribute('fill',   COL.f);
  document.getElementById('men').setAttribute('stroke', COL.s);
  document.getElementById('vl' ).setAttribute('stroke', COL.s);
  document.getElementById('vt' ).setAttribute('fill',   COL.s);
  document.getElementById('fl' ).setAttribute('fill',   COL.f);
  document.getElementById('fs' ).setAttribute('stroke', COL.s);
})();

// =============================================
//  MISE À JOUR ÉPROUVETTE
// =============================================
const elLiq     = document.getElementById('liq');
const elMen     = document.getElementById('men');
const elVolBox  = document.getElementById('vol-readout');
const elVolNum  = document.getElementById('vol-num');

function updL() {
  const yt = Y0 - L.vol * SC;
  elLiq.setAttribute('y', yt);
  if (L.vol > 0) {
    elMen.setAttribute('d', `M28,${yt} Q40,${yt+3} 52,${yt}`);
    elMen.removeAttribute('display');
    elVolBox.style.display = 'block';
    elVolNum.textContent   = L.vol.toFixed(0);
  } else {
    elMen.setAttribute('display', 'none');
    elVolBox.style.display = 'none';
  }
  if (L.onBal) updB();
}

// =============================================
//  BALANCE
// =============================================
const elBd = document.getElementById('bd');
function updB() {
  elBd.textContent = L.onBal
    ? (L.M0 + L.vol * L.DENS).toFixed(2) + ' g'
    : '0.00 g';
}

// =============================================
//  VERSEMENT — clic maintenu sur le flacon
// =============================================
const flaskWrap = document.getElementById('flask-wrap');
const flaskSvg  = document.getElementById('flask-svg');

function startPour() {
  if (L.pour) return;
  if (L.vol >= 250) { showMsg('Éprouvette pleine !'); return; }
  if (L.onBal) {
    // Secouer le flacon et bloquer
    flaskSvg.classList.remove('shake');
    void flaskSvg.offsetWidth; // force reflow pour relancer animation
    flaskSvg.classList.add('shake');
    showMsg("Retirez d'abord l'éprouvette de la balance.");
    return;
  }
  clearMsg();
  L.pour = true;
  flaskWrap.classList.add('pouring');
  flaskSvg.classList.add('tilt');
  L.tm = setInterval(() => {
    if (L.vol >= 250) { stopPour(); return; }
    L.vol += 1;
    updL();
  }, 120);
}

function stopPour() {
  if (!L.pour) return;
  L.pour = false;
  clearInterval(L.tm); L.tm = null;
  flaskSvg.classList.remove('tilt');
  flaskWrap.classList.remove('pouring');
}

flaskWrap.addEventListener('mousedown', (e) => {
  e.preventDefault();
  startPour();
});
document.addEventListener('mouseup', () => {
  if (L.pour) stopPour();
});

// =============================================
//  BOUTONS
// =============================================
document.getElementById('btn-minus').addEventListener('click', () => {
  stopPour();
  if (L.vol > 0) { L.vol = Math.max(0, L.vol - 1); updL(); }
});
document.getElementById('btn-vider').addEventListener('click', () => {
  stopPour();
  L.vol = 0; updL(); clearMsg();
});

// =============================================
//  DRAG & DROP ÉPROUVETTE
// =============================================
const ep       = document.getElementById('ep');
const scene    = document.getElementById('scene');
const balWrap  = document.getElementById('balance-wrap');
let drag = { active: false, ox: 0, oy: 0 };

ep.addEventListener('mousedown', (e) => {
  if (L.onBal) unsnap();        // désancrer si sur balance
  drag.active = true;
  ep.classList.add('dragging');
  const r = ep.getBoundingClientRect();
  drag.ox = e.clientX - r.left;
  drag.oy = e.clientY - r.top;
  e.preventDefault();
  e.stopPropagation();          // ne pas déclencher le flask mousedown
});

document.addEventListener('mousemove', (e) => {
  if (!drag.active) return;
  const sr = scene.getBoundingClientRect();
  let nx = e.clientX - sr.left - drag.ox;
  let ny = e.clientY - sr.top  - drag.oy;
  // limites souples
  nx = Math.max(-30, Math.min(nx, scene.offsetWidth  - 52));
  ny = Math.max(-50, Math.min(ny, scene.offsetHeight - 30));
  ep.style.left = nx + 'px';
  ep.style.top  = ny + 'px';
});

document.addEventListener('mouseup', () => {
  if (!drag.active) return;
  drag.active = false;
  ep.classList.remove('dragging');
  checkSnap();
});

// =============================================
//  SNAP SUR LA BALANCE
//  Platform top (SVG y=5) en coords scène = balance-wrap.top + 5
//  Éprouvette base en coords scène  = ep.top + EP_BASE_PX (≈192px)
//  Tolérance snap : ±55px en Y, centre ep dans largeur plateforme
// =============================================
function checkSnap() {
  const pr = balWrap.getBoundingClientRect();
  const sr = scene.getBoundingClientRect();
  const er = ep.getBoundingClientRect();

  const platTop   = pr.top  - sr.top  + 5;       // surface plateforme en coords scène
  const platLeft  = pr.left - sr.left + 9;        // bord gauche plateforme
  const platRight = platLeft + 150;               // bord droit plateforme
  const epCenterX = er.left - sr.left + 41;       // centre ep (82/2 = 41px)
  const epBase    = er.top  - sr.top  + EP_BASE_PX; // bas socle ep en coords scène

  const inX = epCenterX > platLeft  && epCenterX < platRight;
  const inY = Math.abs(epBase - platTop) < 55;

  if (inX && inY) snapToBal();
}

function snapToBal() {
  const pr = balWrap.getBoundingClientRect();
  const sr = scene.getBoundingClientRect();
  // position en coords scène
  const platTop_sc  = pr.top  - sr.top  + 5;
  const platCtrX_sc = pr.left - sr.left + 9 + 75; // centre de la plateforme (9 + 150/2)
  ep.style.top  = (platTop_sc  - EP_BASE_PX) + 'px'; // base alignée sur la plateforme
  ep.style.left = (platCtrX_sc - 41)         + 'px'; // centré
  L.onBal = true;
  updB();
}

function unsnap() {
  L.onBal = false;
  updB();
}

// =============================================
//  MESSAGES
// =============================================
const elMsg = document.getElementById('msg');
function showMsg(t) { elMsg.textContent = t; }
function clearMsg()  { elMsg.textContent = ''; }

</script>
