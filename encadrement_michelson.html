<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encadrement de la vitesse de la lumière</title>
<style>
  html,body{margin:0;padding:0;background:#fdfdf8;overflow-x:hidden;overflow-y:auto;}
  body{font-family:"Comic Sans MS","Comic Neue","Chalkboard SE","Segoe Print",cursive;color:#222;}
  #wrap{max-width:960px;margin:0 auto;padding:6px;}
  canvas{display:block;width:100%;height:auto;touch-action:none;}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:6px;}
  .grp{display:flex;align-items:center;gap:6px;padding:5px 10px;border:2px solid #222;border-radius:14px 10px 16px 9px;background:#fff;}
  button{font-family:inherit;font-size:15px;background:#fff;color:#222;border:2px solid #222;
         border-radius:12px 9px 13px 8px;padding:5px 11px;cursor:pointer;box-shadow:2px 2px 0 #222;}
  button:active{transform:translate(2px,2px);box-shadow:none;}
  button.on{background:#ffe9a8;}
  #codeBox{margin:12px auto 4px;text-align:center;font-size:18px;}
  #code{display:inline-block;min-width:150px;padding:6px 16px;margin-left:6px;background:#fff;border:2px solid #222;
        border-radius:14px 9px 15px 10px;font-family:Consolas,"Courier New",monospace;font-size:20px;letter-spacing:1px;
        user-select:all;-webkit-user-select:all;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div class="bar">
    <div class="grp">
      <button id="kL">[ borne basse</button>
      <button id="kH">borne haute ]</button>
      <button id="kC">🚩 c (1973)</button>
    </div>
    <div class="grp">
      <button id="m1">◀ −1</button>
      <button id="m01">◀ −0,1</button>
      <button id="p01">+0,1 ▶</button>
      <button id="p1">+1 ▶</button>
    </div>
    <button id="reset">↺ Recommencer</button>
  </div>
  <div id="codeBox">Code de vérification :<span id="code">—</span></div>
</div>
<script>
(function(){
"use strict";
/* ---------- Paramètres (JSON -> XOR -> base64url dans ?p=) ---------- */
const KEY="PBayle-Michelson#1926";
const DEF={c:299790, s:20, m:299790, mm:1};   // c : centre de la règle (km/s) ; s : demi-étendue ; m : valeur de Michelson ; mm : l'afficher
function decodeP(s){
  try{ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="=";
    const bin=atob(s), k=new TextEncoder().encode(KEY), b=new Uint8Array(bin.length);
    for(let j=0;j<bin.length;j++) b[j]=bin.charCodeAt(j)^k[j%k.length];
    return JSON.parse(new TextDecoder().decode(b)); }catch(e){ return {}; }
}
const Q=new URLSearchParams(location.search);
const P=Object.assign({},DEF,Q.get("p")?decodeP(Q.get("p")):{});
for(const k of Object.keys(DEF)) if(Q.has(k)) P[k]=parseFloat(Q.get(k));   // clair > codé

/* ---------- Canvas ---------- */
const W=960, H=290, X0=50, X1=910, RY=170;
const VMIN=P.c-P.s, VMAX=P.c+P.s;
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let dpr=1;
function resize(){ dpr=Math.min(window.devicePixelRatio||1,2); cv.width=W*dpr; cv.height=H*dpr; draw(); }
const v2x=v=>X0+(v-VMIN)/(VMAX-VMIN)*(X1-X0);
const x2v=x=>VMIN+(x-X0)/(X1-X0)*(VMAX-VMIN);
const snap=v=>Math.round(Math.max(VMIN,Math.min(VMAX,v))*10)/10;
const fr=v=>{ const [a,b]=v.toFixed(1).split("."); return a.replace(/\B(?=(\d{3})+(?!\d))/g," ")+","+b; };

/* ---------- Trait "fait main" ---------- */
function hash(x){ x=Math.sin(x*127.1+311.7)*43758.5453; return x-Math.floor(x); }
function noise(t){ const i=Math.floor(t), f=t-i, u=f*f*(3-2*f); return (hash(i)*(1-u)+hash(i+1)*u)*2-1; }
function wpath(c,pts,amp,seed){ amp=amp||1.3; seed=seed||0; c.beginPath();
  for(let s=0;s<pts.length-1;s++){ const [x1,y1]=pts[s],[x2,y2]=pts[s+1], L=Math.hypot(x2-x1,y2-y1)||1;
    const nx=-(y2-y1)/L, ny=(x2-x1)/L, n=Math.max(2,Math.round(L/9));
    for(let k=0;k<=n;k++){ const t=k/n, o=amp*noise(seed+s*13.7+t*L/38);
      const x=x1+(x2-x1)*t+nx*o, y=y1+(y2-y1)*t+ny*o; (s===0&&k===0)?c.moveTo(x,y):c.lineTo(x,y); } } }
function wline(c,x1,y1,x2,y2,amp,seed){ wpath(c,[[x1,y1],[x2,y2]],amp,seed); c.stroke(); }
const FONT='"Comic Sans MS","Comic Neue","Chalkboard SE","Segoe Print",cursive';
function txt(c,s,x,y,size,align,col){ c.font=size+"px "+FONT; c.textAlign=align||"center"; c.textBaseline="middle"; c.fillStyle=col||"#222"; c.fillText(s,x,y); }

/* ---------- État ---------- */
let st;
// au départ : repères posés n'importe où sur la règle (positions aléatoires, au dixième)
function rnd(){ return snap(VMIN+1+Math.random()*(VMAX-VMIN-2)); }
function init(){
  let L=rnd(), H=rnd(), C=rnd(), k=0;
  while((Math.abs(L-H)<3||Math.abs(L-C)<2||Math.abs(H-C)<2) && k++<50){ L=rnd(); H=rnd(); C=rnd(); }
  st={L:Math.min(L,H),H:Math.max(L,H),C:C,sel:"L",drag:null}; updBtns(); draw();
}
// position "au repos" (pas encore posé)
const PARK={L:[110,318],H:[300,318],C:[520,322]};

/* ---------- Dessin ---------- */
function bracket(c,x,y,open,col,sel){
  c.strokeStyle=col; c.lineWidth=sel?4:3;
  const d=open?1:-1;
  wpath(c,[[x+d*12,y-30],[x,y-30],[x,y+30],[x+d*12,y+30]],0.8,open?11:12); c.stroke();
}
function flag(c,x,y,sel){
  c.strokeStyle="#222"; c.lineWidth=sel?3:2.2; wline(c,x,y+28,x,y-42,0.6,21);
  c.fillStyle="#e0161b"; wpath(c,[[x,y-42],[x+28,y-34],[x,y-24],[x,y-42]],0.7,22); c.fill();
}
function draw(){
  if(typeof updCode==="function") updCode();
  const c=ctx; c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle="#fdfdf8"; c.fillRect(0,0,W,H); c.lineJoin="round"; c.lineCap="round";
  txt(c,"Vitesse de la lumière (en km/s)",W/2,28,19);
  c.strokeStyle="#222"; c.lineWidth=1.5; wline(c,W/2-140,44,W/2+140,44,1,3);

  /* zone entre les bornes */
  if(st.L!==null && st.H!==null){
    const a=Math.min(st.L,st.H), b=Math.max(st.L,st.H);
    c.fillStyle="rgba(42,111,176,0.15)"; c.fillRect(v2x(a),RY-34,v2x(b)-v2x(a),68);
  }
  /* règle */
  c.strokeStyle="#222"; c.lineWidth=2.5; wline(c,X0-10,RY,X1+10,RY,0.8,5);
  for(let k=Math.ceil(VMIN*10); k<=Math.floor(VMAX*10); k++){
    const v=k/10, x=v2x(v);
    const big=(k%50===0), mid=(k%10===0);
    if(!big && !mid && (k%5!==0)) { c.lineWidth=0.6; c.strokeStyle="#999"; c.beginPath(); c.moveTo(x,RY); c.lineTo(x,RY+5); c.stroke(); continue; }
    c.strokeStyle="#222"; c.lineWidth=big?1.8:mid?1.2:0.8;
    const L=big?20:mid?12:7;
    c.beginPath(); c.moveTo(x,RY); c.lineTo(x,RY+L); c.stroke();
    if(big) txt(c,String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g," "),x,RY+36,14);
  }
  /* Michelson */
  if(P.mm){ const x=v2x(P.m);
    c.fillStyle="#222"; c.beginPath(); c.arc(x,RY,5,0,7); c.fill();
    txt(c,"Michelson (1926)",x,RY-70,14,"center","#555");
    c.strokeStyle="#777"; c.lineWidth=1; wline(c,x,RY-60,x,RY-8,0.5,40);
  }
  /* bornes et drapeau */
  const pL=st.L===null?PARK.L:[v2x(st.L),RY], pH=st.H===null?PARK.H:[v2x(st.H),RY], pC=st.C===null?PARK.C:[v2x(st.C),RY];
  bracket(c,pL[0],pL[1],true,"#2a6fb0",st.sel==="L");
  bracket(c,pH[0],pH[1],false,"#2a6fb0",st.sel==="H");
  flag(c,pC[0],pC[1],st.sel==="C");
  if(st.L===null) txt(c,"borne basse",pL[0]+4,pL[1]+42,14,"center","#2a6fb0");
  else txt(c,fr(st.L),pL[0],RY+62,14,"center","#2a6fb0");
  if(st.H===null) txt(c,"borne haute",pH[0]-4,pH[1]+42,14,"center","#2a6fb0");
  else txt(c,fr(st.H),pH[0],RY+80,14,"center","#2a6fb0");
  if(st.C===null) txt(c,"c (1973), à convertir en km/s",pC[0]+36,pC[1]-30,14,"left","#e0161b");
  else txt(c,"c (1973) : "+fr(st.C),pC[0]+32,RY-36,14,"left","#e0161b");
  txt(c,"Fais glisser les repères. Pense à convertir c (1973) en km/s !",W/2,272,14,"center","#888");

  /* verdict (par rapport aux bornes placées par l'élève) */
  if(st.L!==null && st.H!==null && st.C!==null){
    const a=Math.min(st.L,st.H), b=Math.max(st.L,st.H), dans=(st.C>=a && st.C<=b);
    txt(c, dans?"🚩 c (1973) est DANS ton encadrement":"🚩 c (1973) est EN DEHORS de ton encadrement",
        W/2,62,18,"center",dans?"#2e7d32":"#c62828");
  }
}

/* ---------- Code de vérification (FNV-1a 32 bits, base 36, 6 car.) ---------- */
function hash6(str){ let h=2166136261>>>0;
  for(let j=0;j<str.length;j++){ h^=str.charCodeAt(j); h=Math.imul(h,16777619)>>>0; }
  return h.toString(36).toUpperCase().padStart(6,"0").slice(0,6); }
function updCode(){
  const el=document.getElementById("code");
  if(st.L===null||st.H===null||st.C===null){ el.textContent="—"; return; }
  const a=Math.round(Math.min(st.L,st.H)*10), b=Math.round(Math.max(st.L,st.H)*10), cc=Math.round(st.C*10);
  el.textContent="V-"+hash6(a+"|"+b+"|"+cc);
}

/* ---------- Interaction ---------- */
function pos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]; }
function where(k){ const v=st[k]; return v===null?PARK[k]:[v2x(v),RY]; }
function hit(x,y){
  let best=null, bd=40;
  for(const k of ["C","L","H"]){ const [px,py]=where(k), dx=x-px-(k==="C"?8:0), dy=y-py+(k==="C"?10:0), d=Math.hypot(dx,dy*0.6);
    if(d<bd){ bd=d; best=k; } }
  return best;
}
cv.addEventListener("pointerdown",e=>{ const [x,y]=pos(e), k=hit(x,y); if(!k) return;
  st.drag=k; st.sel=k; cv.setPointerCapture(e.pointerId); move(x,y); updBtns(); });
cv.addEventListener("pointermove",e=>{ if(!st.drag) return; const [x,y]=pos(e); move(x,y); });
function move(x,y){ const k=st.drag;
  st[k]=snap(x2v(x));
  draw(); }
const up=()=>{ st.drag=null; };
cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);

const $=id=>document.getElementById(id);
function updBtns(){ $("kL").classList.toggle("on",st.sel==="L"); $("kH").classList.toggle("on",st.sel==="H"); $("kC").classList.toggle("on",st.sel==="C"); }
$("kL").onclick=()=>{ st.sel="L"; updBtns(); draw(); };
$("kH").onclick=()=>{ st.sel="H"; updBtns(); draw(); };
$("kC").onclick=()=>{ st.sel="C"; updBtns(); draw(); };
function nudge(d){ const k=st.sel; st[k]=snap((st[k]===null?P.c:st[k])+d); draw(); }
$("m1").onclick=()=>nudge(-1); $("m01").onclick=()=>nudge(-0.1);
$("p01").onclick=()=>nudge(0.1); $("p1").onclick=()=>nudge(1);
$("reset").onclick=init;
window.addEventListener("keydown",e=>{ if(e.key==="ArrowLeft"){nudge(e.shiftKey?-1:-0.1);e.preventDefault();}
  if(e.key==="ArrowRight"){nudge(e.shiftKey?1:0.1);e.preventDefault();} });

window.addEventListener("resize",resize);
init(); resize();
})();
</script>
</body>
</html>
