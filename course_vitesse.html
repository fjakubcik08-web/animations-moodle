<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course de vitesse — v = D/t</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { overflow: hidden; background: #b8dff0; font-family: sans-serif; }
  canvas { display: block; cursor: default; }
  #bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 6px 12px; background: #f4f4f2;
    border-top: 1px solid #ddd; font-size: 12px; color: #666;
  }
  .pill {
    background: #eee; border: 0.5px solid #ccc;
    border-radius: 6px; padding: 3px 9px;
    font-family: monospace; font-size: 12px; color: #222;
  }
  button.btn {
    padding: 5px 14px; font-size: 12px; font-weight: 600;
    border-radius: 6px; cursor: pointer; border: 1px solid #ccc; background: #fff;
  }
  #start { background: #c0392b; color: white; border-color: #a93226; }
  #start:hover { background: #a93226; }
  #start:disabled { background: #999; border-color: #888; cursor: default; }
  #chrono {
    margin-left: auto;
    background: #0b0f0a; color: #4bffb0;
    font-family: 'Courier New', monospace; font-weight: bold;
    font-size: 18px; letter-spacing: 1px;
    padding: 6px 14px; border-radius: 6px;
    border: 2px solid #1c2b20;
    box-shadow: inset 0 0 6px rgba(0,0,0,0.6);
    min-width: 150px; text-align: center;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <button class="btn" id="start">&#9654; DÉPART</button>
  <button class="btn" id="reset">&#8635; Reset</button>
  <span class="pill" id="objInfo">Objet : —</span>
  <span class="pill" id="distInfo">D = —</span>
  <div id="chrono">0 s</div>
</div>
<script>
// === DECODEUR PARAMETRES URL (XOR + base64url) ===
// Usage : ?param=<encoded>  — encodé par anim_iframe() côté Python
const _ANIM_KEY=[83,17,204,61,128,42,75,199,33,91,156,47,113,8,240,66];
function _animDecrypt(b64url){
  let b64=b64url.replace(/-/g,'+').replace(/_/g,'/');
  while(b64.length%4)b64+='=';
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const dec=bytes.map((b,i)=>b^_ANIM_KEY[i%_ANIM_KEY.length]);
  return JSON.parse(new TextDecoder().decode(dec));
}
function getAnimParams(){
  const code=new URLSearchParams(location.search).get('param');
  return code?_animDecrypt(code):{};
}
const PARAMS=getAnimParams();

const OBJET  = PARAMS.objet  ?? 'TGV';
const V      = +(PARAMS.v      ?? 83);     // m/s — jamais affiché
const D      = +(PARAMS.D      ?? 1);      // valeur numérique de la distance, dans D_unit
const D_UNIT = PARAMS.D_unit ?? 'km';      // 'm' | 'km'
const T_UNIT = PARAMS.t_unit ?? 's';       // 's' | 'min' | 'h'
const FORME  = PARAMS.forme  ?? 'train';

// ---------- paramètres → calculs (params définis côté générateur Python) ----------
const D_METRES = D * (D_UNIT==='km' ? 1000 : 1);
const T_REAL_S = D_METRES / V; // temps réel en secondes — jamais affiché tel quel

const T_FACTORS = { s:1, min:60, h:3600 };
const T_REAL = T_REAL_S / (T_FACTORS[T_UNIT] ?? 1); // valeur affichée sur le chrono, dans T_UNIT

function fmtNum(v){
  if(v===0) return '0';
  const a=Math.abs(v);
  if(a>=100) return v.toFixed(0);
  if(a>=10) return v.toFixed(1);
  if(a>=1) return v.toFixed(2);
  return v.toPrecision(3);
}
const distStr = fmtNum(D) + ' ' + D_UNIT;

document.getElementById('objInfo').textContent = 'Objet : ' + OBJET;
document.getElementById('distInfo').textContent = 'D = ' + distStr;
document.title = 'Course — ' + OBJET;

// ---------- decor selon la situation ----------
function pickDecor(objet, forme){
  const o = (objet||'').toLowerCase();
  if(forme==='rayon' || forme==='fusee' || forme==='planete') return 'espace';
  if(forme==='avion') return 'air';
  if(o.includes('eau')) return 'eau';
  if(o.includes('espadon')) return 'eau';
  if(o.includes('acier')) return 'metal';
  if(o.includes('faucon')) return 'air';
  return 'terre';
}
const DECOR = pickDecor(OBJET, FORME);

const STARS=Array.from({length:130},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.6+0.3}));
const BUBBLES=Array.from({length:20},()=>({x:Math.random(),y:Math.random(),r:2+Math.random()*4}));

function drawCloud(ctx,cx,cy){
  ctx.fillStyle='rgba(255,255,255,0.9)';
  [[0,0,18],[16,-6,14],[-16,-4,13],[30,2,11],[-28,3,10]].forEach(([dx,dy,r])=>{
    ctx.beginPath(); ctx.arc(cx+dx,cy+dy,r,0,Math.PI*2); ctx.fill();
  });
}
function drawDecor(ctx,W,H,groundY){
  if(DECOR==='terre'){
    const sky=ctx.createLinearGradient(0,0,0,groundY);
    sky.addColorStop(0,'#8ec9f0'); sky.addColorStop(1,'#d9f0fa');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,groundY);
    ctx.beginPath(); ctx.arc(W-70,50,26,0,Math.PI*2); ctx.fillStyle='#f9d03f'; ctx.fill();
    const grnd=ctx.createLinearGradient(0,groundY,0,H);
    grnd.addColorStop(0,'#8bc663'); grnd.addColorStop(1,'#5c9a3f');
    ctx.fillStyle=grnd; ctx.fillRect(0,groundY,W,H-groundY);
  } else if(DECOR==='air'){
    const sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#4a90c9'); sky.addColorStop(1,'#bfe3f7');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
    ctx.beginPath(); ctx.arc(W-80,46,22,0,Math.PI*2); ctx.fillStyle='#fff4d0'; ctx.fill();
    drawCloud(ctx,W*0.2,60); drawCloud(ctx,W*0.55,110); drawCloud(ctx,W*0.82,50);
  } else if(DECOR==='eau'){
    const wat=ctx.createLinearGradient(0,0,0,H);
    wat.addColorStop(0,'#4fa8c9'); wat.addColorStop(1,'#0b3d59');
    ctx.fillStyle=wat; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,0.06)';
    for(let i=0;i<4;i++){
      const bx=W*0.22*i+40;
      ctx.beginPath(); ctx.moveTo(bx,0); ctx.lineTo(bx+50,0); ctx.lineTo(bx+10,H); ctx.lineTo(bx-30,H);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle='rgba(255,255,255,0.35)';
    BUBBLES.forEach(b=>{ ctx.beginPath(); ctx.arc(b.x*W,b.y*H,b.r,0,Math.PI*2); ctx.fill(); });
  } else if(DECOR==='espace'){
    ctx.fillStyle='#050414'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,0.9)';
    STARS.forEach(s=>{ ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2); ctx.fill(); });
    const grad=ctx.createRadialGradient(W-90,70,4,W-90,70,40);
    grad.addColorStop(0,'#e08a4f'); grad.addColorStop(1,'#7a3d17');
    ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(W-90,70,36,0,Math.PI*2); ctx.fill();
  } else if(DECOR==='metal'){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#b0b8bd'); g.addColorStop(1,'#6d767b');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=1;
    for(let yy=0; yy<H; yy+=40){ ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(W,yy); ctx.stroke(); }
    ctx.fillStyle='rgba(0,0,0,0.25)';
    for(let xx=20; xx<W; xx+=60){ for(let yy=20; yy<H; yy+=40){ ctx.beginPath(); ctx.arc(xx,yy,2.2,0,Math.PI*2); ctx.fill(); } }
  }
}

// ---------- formes ----------
function drawCoureur(ctx,x,y,phase){
  ctx.strokeStyle='#2c3e50'; ctx.fillStyle='#2c3e50'; ctx.lineWidth=2.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(x, y-16, 4.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x,y-11); ctx.lineTo(x,y-2); ctx.stroke();
  const s = Math.sin(phase*10);
  ctx.beginPath(); ctx.moveTo(x,y-2); ctx.lineTo(x-6*s-2, y+10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x,y-2); ctx.lineTo(x+6*s+2, y+10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x,y-9); ctx.lineTo(x+6*s, y-2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x,y-9); ctx.lineTo(x-6*s, y-2); ctx.stroke();
}
function drawEscargot(ctx,x,y){
  ctx.fillStyle='#a1662f';
  ctx.beginPath(); ctx.ellipse(x, y-2, 14, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x-2, y-12, 9, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle='#6d4c20'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(x-2,y-12,6,0.5,4.5); ctx.stroke();
  ctx.beginPath(); ctx.arc(x-2,y-12,3,0.5,4.5); ctx.stroke();
  ctx.strokeStyle='#5d4037'; ctx.lineWidth=1.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x+12,y-4); ctx.lineTo(x+16,y-10); ctx.stroke();
  ctx.beginPath(); ctx.arc(x+16,y-10,1.5,0,Math.PI*2); ctx.fillStyle='#5d4037'; ctx.fill();
}
function drawTortue(ctx,x,y){
  ctx.fillStyle='#558b2f';
  ctx.beginPath(); ctx.ellipse(x, y-6, 13, 9, 0, Math.PI, 0); ctx.fill();
  ctx.strokeStyle='#33691e'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x-8,y-6); ctx.lineTo(x+8,y-6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x,y-13); ctx.lineTo(x,y-6); ctx.stroke();
  ctx.fillStyle='#7cb342';
  ctx.beginPath(); ctx.arc(x+14,y-3,3.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x-8,y+2,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+6,y+2,3,0,Math.PI*2); ctx.fill();
}
function drawVelo(ctx,x,y,phase){
  ctx.strokeStyle='#2c3e50'; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.arc(x-12,y+6,8,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(x+12,y+6,8,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-12,y+6); ctx.lineTo(x-2,y-6); ctx.lineTo(x+12,y+6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-2,y-6); ctx.lineTo(x+4,y+6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-12,y+6); ctx.lineTo(x+4,y+6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-2,y-6); ctx.lineTo(x-6,y-10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+8,y-2); ctx.lineTo(x+11,y-8); ctx.stroke();
  ctx.fillStyle='#2c3e50';
  ctx.beginPath(); ctx.arc(x-3,y-16,4,0,Math.PI*2); ctx.fill();
  ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(x-3,y-12); ctx.lineTo(x+2,y-4); ctx.stroke();
  const s=Math.sin(phase*10);
  ctx.beginPath(); ctx.moveTo(x+2,y-4); ctx.lineTo(x-2+4*s,y+4); ctx.stroke();
}
function drawGuepard(ctx,x,y,phase){
  ctx.fillStyle='#d4a24c';
  ctx.beginPath(); ctx.ellipse(x-2,y-4,16,6,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+16,y-6,5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+14,y-10,1.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+19,y-10,1.5,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#d4a24c'; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x-16,y-4); ctx.quadraticCurveTo(x-26,y-2,x-24,y-10); ctx.stroke();
  const s=Math.sin(phase*14);
  ctx.strokeStyle='#b5832e'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(x-8,y); ctx.lineTo(x-8+6*s,y+9); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+8,y); ctx.lineTo(x+8-6*s,y+9); ctx.stroke();
  ctx.fillStyle='#7a4a10';
  [[-8,-6],[-2,-2],[4,-6],[-12,-1]].forEach(([dx,dy])=>{ ctx.beginPath(); ctx.arc(x+dx,y+dy,1.3,0,Math.PI*2); ctx.fill(); });
}
function drawPoisson(ctx,x,y){
  ctx.fillStyle='#4a90c9';
  ctx.beginPath(); ctx.ellipse(x-4,y,10,5,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x-14,y); ctx.lineTo(x-22,y-6); ctx.lineTo(x-22,y+6); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#4a90c9'; ctx.lineWidth=2.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x+6,y); ctx.lineTo(x+18,y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-4,y-5); ctx.lineTo(x,y-12); ctx.lineTo(x+4,y-5); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#1a1a1a'; ctx.beginPath(); ctx.arc(x+2,y-1,1,0,Math.PI*2); ctx.fill();
}
function drawOiseau(ctx,x,y,phase){
  ctx.fillStyle='#5d4037';
  ctx.beginPath(); ctx.ellipse(x,y,6,4,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+7,y-2,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#f0a020';
  ctx.beginPath(); ctx.moveTo(x+10,y-2); ctx.lineTo(x+14,y-1); ctx.lineTo(x+10,y); ctx.closePath(); ctx.fill();
  const wa = Math.sin(phase*12)*0.6;
  ctx.strokeStyle='#5d4037'; ctx.lineWidth=2.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x-2,y-1); ctx.lineTo(x-14,y-10-wa*10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-2,y-1); ctx.lineTo(x-14,y+8+wa*10); ctx.stroke();
}
function drawBalle(ctx,x,y){
  ctx.fillStyle='#e67e22';
  ctx.beginPath(); ctx.arc(x,y-6,6,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=1; ctx.stroke();
}
function drawVoiture(ctx,x,y){
  ctx.fillStyle='#c0392b';
  ctx.beginPath();
  ctx.moveTo(x-20,y); ctx.lineTo(x-16,y-10); ctx.lineTo(x-6,y-16);
  ctx.lineTo(x+8,y-16); ctx.lineTo(x+16,y-10); ctx.lineTo(x+20,y);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#7b241c'; ctx.lineWidth=1.2; ctx.stroke();
  ctx.fillStyle='#222';
  ctx.beginPath(); ctx.arc(x-12,y+2,5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+12,y+2,5,0,Math.PI*2); ctx.fill();
}
function drawTrain(ctx,x,y){
  ctx.fillStyle='#2980b9';
  ctx.beginPath();
  ctx.moveTo(x-28,y+2); ctx.lineTo(x-28,y-14); ctx.lineTo(x-20,y-18);
  ctx.lineTo(x+22,y-18); ctx.lineTo(x+28,y-8); ctx.lineTo(x+28,y+2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#d6eaf8';
  for(let i=0;i<3;i++) ctx.fillRect(x-22+i*15, y-14, 9,7);
  ctx.fillStyle='#222';
  [-18,-2,14].forEach(dx=>{ctx.beginPath(); ctx.arc(x+dx,y+4,4,0,Math.PI*2); ctx.fill();});
}
function drawAvion(ctx,x,y){
  ctx.fillStyle='#7f8c8d';
  ctx.beginPath();
  ctx.moveTo(x+22,y); ctx.lineTo(x-18,y-6); ctx.lineTo(x-10,y); ctx.lineTo(x-18,y+6);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x-8, y-16); ctx.lineTo(x-2, y-2); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x-8, y+16); ctx.lineTo(x-2, y+2); ctx.closePath(); ctx.fill();
}
function drawFusee(ctx,x,y,phase){
  ctx.fillStyle=`rgba(255,${120+Math.round(Math.sin(phase*30)*40)},0,0.85)`;
  ctx.beginPath();
  ctx.moveTo(x-16,y-5); ctx.lineTo(x-30,y); ctx.lineTo(x-16,y+5);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#ecf0f1';
  ctx.beginPath();
  ctx.moveTo(x-16,y-6); ctx.lineTo(x+10,y-6); ctx.lineTo(x+22,y); ctx.lineTo(x+10,y+6); ctx.lineTo(x-16,y+6);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#bdc3c7'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle='#3498db';
  ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='#e74c3c';
  ctx.beginPath(); ctx.moveTo(x-16,y-6); ctx.lineTo(x-22,y-12); ctx.lineTo(x-10,y-6); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x-16,y+6); ctx.lineTo(x-22,y+12); ctx.lineTo(x-10,y+6); ctx.closePath(); ctx.fill();
}
function drawPlanete(ctx,x,y){
  const grad = ctx.createRadialGradient(x-4,y-14,2,x,y-10,14);
  grad.addColorStop(0,'#8ec9e8'); grad.addColorStop(1,'#1b4f72');
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.arc(x,y-10,13,0,Math.PI*2); ctx.fill();
}
function drawOnde(ctx,x0,x,y){
  const r = Math.max(2, x - x0);
  for(let k=0;k<3;k++){
    const rr = r - k*18;
    if(rr>0){
      ctx.beginPath(); ctx.arc(x0,y,rr,0,Math.PI*2);
      ctx.strokeStyle=`rgba(52,152,219,${Math.max(0,0.6-k*0.2)})`; ctx.lineWidth=2; ctx.stroke();
    }
  }
}
function drawRayon(ctx,x0,x,y){
  const grad=ctx.createLinearGradient(x0,y,x,y);
  grad.addColorStop(0,'rgba(231,76,60,0.05)');
  grad.addColorStop(1,'rgba(231,76,60,0.95)');
  ctx.strokeStyle=grad; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x,y); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x,y); ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill();
}

// ---------- scène ----------
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let W,H,START_X,FINISH_X,TRACK_Y;

function resize(){
  W=window.innerWidth; H=window.innerHeight-document.getElementById('bar').offsetHeight;
  canvas.width=W; canvas.height=H;
  START_X=W*0.10; FINISH_X=W*0.90; TRACK_Y=H*0.62;
  draw();
}

// couleur d'encre adaptée au décor (contraste garanti quel que soit le fond)
const DECOR_INK = { terre:'#1a1a1a', air:'#1a1a1a', metal:'#1a1a1a', eau:'#eaf6ff', espace:'#f5f5f5' };
const INK = DECOR_INK[DECOR] || '#1a1a1a';
const INK_IS_DARK = INK === '#1a1a1a';
const INK_HALO = INK_IS_DARK ? 'rgba(255,255,255,0.65)' : 'rgba(0,0,0,0.55)';

function drawGate(x,y){
  ctx.fillStyle=INK;
  ctx.fillRect(x-6,y-70,12,140);
  ctx.strokeStyle=INK_HALO; ctx.lineWidth=1.5;
  ctx.strokeRect(x-6,y-70,12,140);
}
function drawArrowDistance(){
  const y=TRACK_Y-95;
  ctx.strokeStyle=INK; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(START_X,y); ctx.lineTo(FINISH_X,y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(START_X,y); ctx.lineTo(START_X+10,y-5); ctx.lineTo(START_X+10,y+5); ctx.closePath(); ctx.fillStyle=INK; ctx.fill();
  ctx.beginPath(); ctx.moveTo(FINISH_X,y); ctx.lineTo(FINISH_X-10,y-5); ctx.lineTo(FINISH_X-10,y+5); ctx.closePath(); ctx.fill();
  ctx.font='bold 15px sans-serif'; ctx.textAlign='center';
  ctx.lineWidth=3; ctx.strokeStyle=INK_HALO;
  ctx.strokeText('D = ' + distStr, (START_X+FINISH_X)/2, y-10);
  ctx.fillStyle=INK;
  ctx.fillText('D = ' + distStr, (START_X+FINISH_X)/2, y-10);
}
function drawLabels(){
  ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
  ctx.lineWidth=3; ctx.strokeStyle=INK_HALO;
  ctx.strokeText('DÉPART', START_X, TRACK_Y+90);
  ctx.strokeText('ARRIVÉE', FINISH_X, TRACK_Y+90);
  ctx.fillStyle=INK;
  ctx.fillText('DÉPART', START_X, TRACK_Y+90);
  ctx.fillText('ARRIVÉE', FINISH_X, TRACK_Y+90);
}

let st={phase:'idle', x:0, phaseAnim:0};

function draw(){
  ctx.clearRect(0,0,W,H);
  drawDecor(ctx,W,H,TRACK_Y+55);
  ctx.strokeStyle=INK_IS_DARK ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.5)'; ctx.setLineDash([6,6]); ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(START_X,TRACK_Y); ctx.lineTo(FINISH_X,TRACK_Y); ctx.stroke();
  ctx.setLineDash([]);
  drawGate(START_X,TRACK_Y); drawGate(FINISH_X,TRACK_Y);
  drawArrowDistance();
  drawLabels();

  const x = st.phase==='idle' ? START_X : st.x;
  const x0 = START_X;
  if(FORME==='rayon') drawRayon(ctx,x0,x,TRACK_Y);
  else if(FORME==='onde') drawOnde(ctx,x0,x,TRACK_Y);
  else if(FORME==='coureur') drawCoureur(ctx,x,TRACK_Y,st.phaseAnim);
  else if(FORME==='escargot') drawEscargot(ctx,x,TRACK_Y);
  else if(FORME==='tortue') drawTortue(ctx,x,TRACK_Y);
  else if(FORME==='velo') drawVelo(ctx,x,TRACK_Y,st.phaseAnim);
  else if(FORME==='guepard') drawGuepard(ctx,x,TRACK_Y,st.phaseAnim);
  else if(FORME==='poisson') drawPoisson(ctx,x,TRACK_Y);
  else if(FORME==='oiseau') drawOiseau(ctx,x,TRACK_Y,st.phaseAnim);
  else if(FORME==='balle') drawBalle(ctx,x,TRACK_Y);
  else if(FORME==='voiture') drawVoiture(ctx,x,TRACK_Y);
  else if(FORME==='train') drawTrain(ctx,x,TRACK_Y);
  else if(FORME==='avion') drawAvion(ctx,x,TRACK_Y);
  else if(FORME==='fusee') drawFusee(ctx,x,TRACK_Y,st.phaseAnim);
  else if(FORME==='planete') drawPlanete(ctx,x,TRACK_Y);
  else drawBalle(ctx,x,TRACK_Y);
}

// ---------- chrono / animation ----------
const DURATION = 3200; // ms, durée visuelle fixe (indépendante du temps réel calculé)
let animId=null, startTs=null;

function fmtChrono(t){
  return fmtNum(t) + ' ' + T_UNIT;
}
document.getElementById('chrono').textContent = fmtChrono(0);

function start(){
  if(animId) cancelAnimationFrame(animId);
  document.getElementById('start').disabled = true;
  startTs=null;
  function step(ts){
    if(!startTs) startTs=ts;
    const elapsed = ts-startTs;
    const p = Math.min(elapsed/DURATION, 1);
    st.phase='running';
    st.x = START_X + p*(FINISH_X-START_X);
    st.phaseAnim = elapsed/1000;
    document.getElementById('chrono').textContent = fmtChrono(p*T_REAL);
    draw();
    if(p<1){ animId=requestAnimationFrame(step); }
    else { st.phase='done'; document.getElementById('start').disabled=false; }
  }
  animId=requestAnimationFrame(step);
}
document.getElementById('start').addEventListener('click', start);
document.getElementById('reset').addEventListener('click', ()=>{
  if(animId) cancelAnimationFrame(animId);
  st={phase:'idle', x:START_X, phaseAnim:0};
  document.getElementById('chrono').textContent = fmtChrono(0);
  document.getElementById('start').disabled=false;
  draw();
});

resize(); window.addEventListener('resize', resize);
</script>
