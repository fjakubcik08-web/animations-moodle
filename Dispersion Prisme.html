<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Dispersion de la lumière par un prisme</title>
<style>
  @font-face { font-family: 'Archivo'; src: local('Archivo'); }
  * { box-sizing: border-box; }
  body { margin:0; background:#f3f2f2; color:#201e1d; font-family:'Archivo', Arial, sans-serif; }
  .btn { font-family:inherit; font-size:12px; padding:4px 10px; border:1.5px solid #605d5d; background:#2d2b2b; color:#eae7e7; cursor:pointer; white-space:nowrap; }
  .btn:hover { background:#3a3838; }
  a { color:#ec3013; }
  a:hover { color:#c8280f; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
  var WL_MIN = 400, WL_MAX = 800, BAR_PAD = 10, BAR_SPAN = 880;
  var SOURCE_X = 145, PRISM_X = 460, SCREEN_X = 816, AXIS_Y = 170;

  var SOURCES = {
    h:  { name:'Hydrogène', short:'H', lines:[410.2,434.0,486.1,656.3], swatchWl:486, caption:"Série de Balmer : violet, bleu, cyan et rouge caractéristiques de l'hydrogène." },

    ar: { name:'Argon', short:'Ar', lines:[419.8,425.9,451.1,459.0,470.2,480.6,501.7,518.8,545.2,588.9,675.3,696.5,706.7,738.4,750.4], swatchWl:451, caption:"L'argon, gaz noble des tubes à décharge, émet surtout dans le bleu-violet et le rouge." },
    kr: { name:'Krypton', short:'Kr', lines:[427.4,431.9,435.0,445.4,450.2,460.9,470.6,556.2,587.1,645.6,760.2,768.5,810.4], swatchWl:557, caption:"Le krypton présente des raies vertes et jaune-orangées, utilisées comme référence de longueur d'onde." },
    xe: { name:'Xénon', short:'Xe', lines:[462.4,467.1,484.4,492.3,500.0,529.2,541.9,553.7,605.9,619.9], swatchWl:480, caption:"Le xénon émet plusieurs raies bleu-vert, donnant aux lampes au xénon leur teinte blanc-bleuté." },
    hg: { name:'Mercure', short:'Hg', lines:[404.7,407.8,435.8,491.6,546.1,577.0,579.1], swatchWl:546, caption:"Le mercure émet des raies dans le violet, le bleu, le vert et le jaune." },
    na: { name:'Sodium', short:'Na', lines:[568.8,589.0,589.6,615.4,616.1], swatchWl:589, caption:"Le sodium émet un doublet jaune presque monochromatique, à 589,0 et 589,6 nm, entouré de raies plus faibles." },
    li: { name:'Lithium', short:'Li', lines:[413.3,460.3,610.4,670.8], swatchWl:670, caption:"Le lithium colore la flamme en rouge carmin, avec des raies rouge et orangée dominantes." },

    rb: { name:'Rubidium', short:'Rb', lines:[420.2,421.6,620.6,629.8,780.0,794.8], swatchWl:620, caption:"Le rubidium émet un doublet violet et un doublet rouge profond, colorant la flamme en rouge-violet." },
    cs: { name:'Césium', short:'Cs', lines:[455.5,459.3,601.0,621.3,697.0], swatchWl:457, caption:"Le césium émet un doublet bleu caractéristique, donnant une flamme bleu-violet." },
    ca: { name:'Calcium', short:'Ca', lines:[422.7,559.4,585.7,616.2,646.3], swatchWl:620, caption:"Le calcium colore la flamme en orange-rouge, avec des raies violette, verte et orangée." },
    sr: { name:'Strontium', short:'Sr', lines:[460.7,546.6,606.0,636.6,646.8,688.0,707.0], swatchWl:646, caption:"Le strontium émet plusieurs raies rouges, responsables de la flamme écarlate utilisée en pyrotechnie." },
    ba: { name:'Baryum', short:'Ba', lines:[455.4,493.4,553.5,585.4,614.2,649.7], swatchWl:553, caption:"Le baryum émet des raies vertes, donnant une flamme verte utilisée dans les feux d'artifice." },
    cu: { name:'Cuivre', short:'Cu', lines:[465.1,510.6,515.3,521.8,578.2], swatchWl:515, caption:"Le cuivre colore la flamme en vert-bleu, avec un ensemble de raies vertes rapprochées." },
    cd: { name:'Cadmium', short:'Cd', lines:[467.8,480.0,508.6,533.8,643.8], swatchWl:643, caption:"Le cadmium émet des raies bleue, verte et une raie rouge intense." },
    zn: { name:'Zinc', short:'Zn', lines:[468.0,472.2,481.0,636.2], swatchWl:472, caption:"Le zinc émet un ensemble de raies bleues rapprochées et une raie rouge plus faible." },
    tl: { name:'Thallium', short:'Tl', lines:[466.0,535.0,652.0,706.0], swatchWl:535, caption:"Le thallium émet une raie verte intense et isolée, très caractéristique." },
    inn:{ name:'Indium', short:'In', lines:[410.2,451.1,468.0,610.4,616.0], swatchWl:451, caption:"L'indium émet des raies bleu-violet, utilisées pour calibrer les spectromètres." },
    pb: { name:'Plomb', short:'Pb', lines:[405.8,500.6,571.8,639.0], swatchWl:405, caption:"Le plomb émet un ensemble de raies faibles, du violet au rouge, peu visibles à l'œil nu." },
    bi: { name:'Bismuth', short:'Bi', lines:[440.0,461.5,472.3,529.0,613.0], swatchWl:472, caption:"Le bismuth émet des raies bleu-vert dans son spectre d'arc." },
    sb: { name:'Antimoine', short:'Sb', lines:[452.7,473.0,528.0,606.0], swatchWl:452, caption:"L'antimoine émet des raies bleu-vert caractéristiques de son spectre d'arc." },
    al: { name:'Aluminium', short:'Al', lines:[394.4,396.2,466.0,512.0,624.0,669.0], swatchWl:512, caption:"L'aluminium émet des raies bleu-vert et rouge dans son spectre d'arc." },
    b:  { name:'Bore', short:'B', lines:[492.0,518.0,549.0,563.0], swatchWl:518, caption:"Le bore émet des raies vertes, donnant une flamme verte pâle." },
    mn: { name:'Manganèse', short:'Mn', lines:[403.1,476.0,542.0,601.0], swatchWl:542, caption:"Le manganèse émet des raies du violet au jaune-orangé." },
    fe: { name:'Fer', short:'Fe', lines:[438.4,495.7,516.7,527.0], swatchWl:480, caption:"Le fer émet de très nombreuses raies, notamment bleue et verte, d'où les étincelles dorées à la flamme." },
    ni: { name:'Nickel', short:'Ni', lines:[430.0,470.0,486.0,508.0,533.0,547.7,610.0], swatchWl:520, caption:"Le nickel émet de nombreuses raies vertes et bleues rapprochées, typiques des métaux de transition." },
    co: { name:'Cobalt', short:'Co', lines:[423.0,450.0,481.3,520.9,546.0,587.0,612.0], swatchWl:500, caption:"Le cobalt émet de nombreuses raies bleue, verte et jaune, typiques des métaux de transition." },
    cr: { name:'Chrome', short:'Cr', lines:[425.4,427.5,520.6,552.5,600.0], swatchWl:480, caption:"Le chrome émet des raies violette et verte caractéristiques." }
  };
  var SOURCE_ORDER = ['h','he','ne','ar','kr','xe','hg','na','li','k','rb','cs','ca','sr','ba','cu','cd','zn','tl','inn','pb','bi','sb','al','b','mn','fe','ni','co','cr'];

  function wavelengthToRGB(wl) {
    var r=0,g=0,b=0;
    if (wl>=380 && wl<440) { r=-(wl-440)/(440-380); g=0; b=1; }
    else if (wl>=440 && wl<490) { r=0; g=(wl-440)/(490-440); b=1; }
    else if (wl>=490 && wl<510) { r=0; g=1; b=-(wl-510)/(510-490); }
    else if (wl>=510 && wl<580) { r=(wl-510)/(580-510); g=1; b=0; }
    else if (wl>=580 && wl<645) { r=1; g=-(wl-645)/(645-580); b=0; }
    else if (wl>=645 && wl<=780) { r=1; g=0; b=0; }
    var factor;
    if (wl>=380 && wl<420) factor = 0.55 + 0.45*(wl-380)/(420-380);
    else if (wl>=420 && wl<701) factor = 1;
    else if (wl>=701 && wl<=780) factor = 0.55 + 0.45*(780-wl)/(780-701);
    else factor = 0.55;
    var gamma = 0.8;
    function adj(c){ return c===0 ? 0 : Math.round(255*Math.pow(c*factor, gamma)); }
    return 'rgb('+adj(r)+','+adj(g)+','+adj(b)+')';
  }

  var state = { sourceKey:'na', playing:false, phase:'idle', cursorX:450, draggingCursor:false, gain:1, viewMin:WL_MIN, viewMax:WL_MAX };
  var timeouts = [];
  function clearTimeouts(){ timeouts.forEach(clearTimeout); timeouts = []; }

  function xFromWl(wl){ return BAR_PAD + (wl - state.viewMin) / (state.viewMax - state.viewMin) * BAR_SPAN; }
  function wlFromX(x){ return state.viewMin + (x - BAR_PAD) / BAR_SPAN * (state.viewMax - state.viewMin); }
  function xFromWlIn(wl, vMin, vMax){ return BAR_PAD + (wl - vMin) / (vMax - vMin) * BAR_SPAN; }
  function pickStep(span){
    var steps = [0.1,0.2,0.5,1,2,5,10,20,50,100,200];
    for (var i=0;i<steps.length;i++){ if (span/steps[i] <= 9) return steps[i]; }
    return 200;
  }
  function zoomBy(factor){
    var vMin=state.viewMin, vMax=state.viewMax;
    var centerWl = Math.max(vMin, Math.min(vMax, wlFromX(state.cursorX)));
    var half = Math.max(5, (vMax - vMin) / 2 * factor);
    var newMin = centerWl - half, newMax = centerWl + half;
    if (newMax - newMin >= WL_MAX - WL_MIN) { newMin = WL_MIN; newMax = WL_MAX; }
    else {
      if (newMin < WL_MIN) { newMax += WL_MIN - newMin; newMin = WL_MIN; }
      if (newMax > WL_MAX) { newMin -= newMax - WL_MAX; newMax = WL_MAX; }
    }
    state.viewMin = newMin; state.viewMax = newMax;
    state.cursorX = xFromWlIn(centerWl, newMin, newMax);
    render();
  }
  function adjustCursor(deltaNm){
    var lo = BAR_PAD, hi = BAR_PAD + BAR_SPAN;
    var pxPerNm = BAR_SPAN / (state.viewMax - state.viewMin);
    state.cursorX = Math.max(lo, Math.min(hi, state.cursorX + deltaNm * pxPerNm));
    render();
  }
  function selectSource(key){
    clearTimeouts();
    if (state.playing) {
      state.sourceKey = key; state.phase = 'toPrism'; render();
      timeouts.push(setTimeout(function(){ state.phase='dispersing'; render(); }, 700));
      timeouts.push(setTimeout(function(){ state.phase='done'; render(); }, 1500));
    } else {
      state.sourceKey = key; render();
    }
  }
  function togglePower(){
    clearTimeouts();
    if (state.playing) { state.playing=false; state.phase='idle'; render(); return; }
    state.playing = true; state.phase = 'toPrism'; render();
    timeouts.push(setTimeout(function(){ state.phase='dispersing'; render(); }, 700));
    timeouts.push(setTimeout(function(){ state.phase='done'; render(); }, 1500));
  }

  var root = document.getElementById('root');
  root.innerHTML =
    '<div style="min-height:100vh; background:#f3f2f2; padding:36px 20px; display:flex; flex-direction:column; align-items:center; gap:18px;">' +
      '<div style="width:960px; max-width:100%;">' +
        '<h1 style="font-size:28px; margin:0 0 6px;">Dispersion de la lumière par un prisme</h1>' +
        '<p style="font-size:15px; color:#5a5757; margin:0;">Clique une ampoule pour choisir la source, puis appuie sur l\'interrupteur pour observer le spectre obtenu. Déplace le curseur pour lire une longueur d\'onde.</p>' +
      '</div>' +
      '<div style="width:960px; max-width:100%; background:#201e1d; border:2px solid #444141; padding:18px 28px 26px;">' +
        '<div style="width:900px; max-width:100%; margin:0 auto;">' +
          '<div style="display:flex; justify-content:space-between; align-items:baseline; font-size:12px; letter-spacing:0.04em; text-transform:uppercase; color:#9b9797; font-weight:600; margin-bottom:8px;"><span>Spectre observé</span><span>Longueur d\'onde →</span></div>' +
          '<svg viewBox="0 0 900 18" width="900" height="18" style="display:block; overflow:visible;"><line x1="0" y1="9" x2="890" y2="9" stroke="#7d7979" stroke-width="1.5"></line><polygon points="890,3 900,9 890,15" fill="#7d7979"></polygon></svg>' +
          '<div style="position:relative; height:70px; margin-top:6px;">' +
            '<div id="spectrumBg" style="position:absolute; inset:0; overflow:hidden; background:#161515; border:1px solid #444141;"></div>' +
            '<div id="cursorLabel" style="position:absolute; top:-26px; font-size:11px; font-weight:700; color:#ec3013; white-space:nowrap; background:#161515; padding:1px 5px; border:1px solid #ec3013; transform:translateX(-50%);"></div>' +
            '<div id="cursorHandle" style="position:absolute; top:0; width:16px; height:70px; cursor:grab; touch-action:none; transform:translateX(-50%);">' +
              '<div style="position:absolute; left:7px; top:0; width:2px; height:70px; background:#ec3013;"></div>' +
              '<div style="position:absolute; left:2px; top:-2px; width:12px; height:8px; background:#ec3013;"></div>' +
            '</div>' +
          '</div>' +
          '<div id="ticks" style="position:relative; height:26px; margin-top:2px;"></div>' +
          '<div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-top:14px;">' +
            '<div style="display:flex; gap:6px; flex-wrap:wrap;">' +
              '<button class="btn" data-cursor="-1">−1 nm</button>' +
              '<button class="btn" data-cursor="-0.1">−0,1 nm</button>' +
              '<button class="btn" data-cursor="0.1">+0,1 nm</button>' +
              '<button class="btn" data-cursor="1">+1 nm</button>' +
              '<button class="btn" id="zoomOut">Zoom −</button>' +
              '<button class="btn" id="zoomIn">Zoom +</button>' +
              '<button class="btn" id="zoomReset">Réinitialiser le zoom</button>' +
            '</div>' +
            '<div style="display:flex; align-items:center; gap:10px;">' +
              '<label style="font-size:12px; color:#9b9797; white-space:nowrap;">Amplification ×<span id="gainLabel">1.0</span></label>' +
              '<input type="range" id="gainRange" min="1" max="4" step="0.1" value="1" style="width:160px; accent-color:#ec3013;">' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div id="bench" style="width:960px; max-width:100%; background:#201e1d; border:2px solid #444141; padding:16px 28px;">' +
        '<svg viewBox="0 0 900 360" width="900" height="360" style="display:block; width:100%; height:auto; max-width:900px; margin:0 auto;">' +
          '<rect x="20" y="300" width="860" height="26" fill="#7d7979"></rect>' +
          '<rect x="26" y="236" width="66" height="64" fill="#444141"></rect>' +
          '<circle id="powerDot" cx="59" cy="268" r="10" fill="#7d7979"></circle>' +
          '<circle id="powerGlow" cx="59" cy="268" r="17" fill="#7d7979" opacity="0" style="cursor:pointer;"></circle>' +
          '<circle cx="59" cy="268" r="10" fill="transparent" id="powerClick" style="cursor:pointer;"></circle>' +
          '<text id="powerLabel" x="59" y="320" text-anchor="middle" font-size="11" fill="#7d7979">ARRÊT</text>' +
          '<rect x="137" y="190" width="6" height="110" fill="#7d7979"></rect>' +
          '<circle id="bulb" cx="140" cy="170" r="20" fill="#888" opacity="0.92" style="animation:bulbPulse 2.4s ease-in-out infinite; transform-origin:140px 170px;"></circle>' +
          '<circle id="bulbGlow" cx="140" cy="170" r="30" fill="#888" opacity="0"></circle>' +
          '<text x="140" y="110" text-anchor="middle" font-size="12" fill="#d7d3d3">Source</text>' +
          '<line id="beam" x1="145" y1="170" x2="460" y2="170" stroke="#888" stroke-width="4" stroke-linecap="round" stroke-dasharray="315 315" opacity="0"></line>' +
          '<g id="rays"></g>' +
          '<g id="dots"></g>' +
          '<rect x="457" y="194" width="6" height="106" fill="#7d7979"></rect>' +
          '<polygon points="460,138 428,194 492,194" fill="rgba(215,211,211,0.22)" stroke="#d7d3d3" stroke-width="2"></polygon>' +
          '<text x="460" y="122" text-anchor="middle" font-size="12" fill="#d7d3d3">Prisme</text>' +
          '<rect x="796" y="285" width="6" height="15" fill="#7d7979"></rect>' +
          '<rect x="816" y="55" width="8" height="230" fill="#f8f4f4"></rect>' +
          '<text x="820" y="43" text-anchor="middle" font-size="12" fill="#d7d3d3">Écran</text>' +
        '</svg>' +
      '</div>' +
      '<div style="width:960px; max-width:100%; background:#ffffff; border:2px solid #d8d5d5; padding:18px 28px; display:flex; flex-direction:column; gap:14px;">' +
        '<div id="bulbTray" style="display:flex; gap:10px; flex-wrap:wrap;"></div>' +
      '</div>' +
    '</div>' +
    '<style>@keyframes bulbPulse { 0%,100% { opacity:0.82; filter:brightness(1); } 50% { opacity:1; filter:brightness(1.22); } }</style>';

  var spectrumBg = document.getElementById('spectrumBg');
  var cursorLabelEl = document.getElementById('cursorLabel');
  var cursorHandle = document.getElementById('cursorHandle');
  var ticksEl = document.getElementById('ticks');
  var gainLabelEl = document.getElementById('gainLabel');
  var gainRange = document.getElementById('gainRange');
  var powerDot = document.getElementById('powerDot');
  var powerGlow = document.getElementById('powerGlow');
  var powerClick = document.getElementById('powerClick');
  var powerLabel = document.getElementById('powerLabel');
  var bulbEl = document.getElementById('bulb');
  var bulbGlow = document.getElementById('bulbGlow');
  var beamEl = document.getElementById('beam');
  var raysG = document.getElementById('rays');
  var dotsG = document.getElementById('dots');
  var bulbTray = document.getElementById('bulbTray');
  var benchEl = document.getElementById('bench');

  document.querySelectorAll('[data-cursor]').forEach(function(btn){
    btn.addEventListener('click', function(){ adjustCursor(parseFloat(btn.getAttribute('data-cursor'))); });
  });
  document.getElementById('zoomIn').addEventListener('click', function(){ zoomBy(0.6); });
  document.getElementById('zoomOut').addEventListener('click', function(){ zoomBy(1/0.6); });
  document.getElementById('zoomReset').addEventListener('click', function(){ state.viewMin=WL_MIN; state.viewMax=WL_MAX; render(); });
  gainRange.addEventListener('input', function(){ state.gain = parseFloat(gainRange.value); render(); });
  powerGlow.addEventListener('click', togglePower);
  powerClick.addEventListener('click', togglePower);

  var draggingCursor = false;
  cursorHandle.addEventListener('pointerdown', function(e){ draggingCursor = true; cursorHandle.setPointerCapture(e.pointerId); cursorHandle.style.cursor='grabbing'; });
  cursorHandle.addEventListener('pointermove', function(e){
    if (!draggingCursor) return;
    var rect = cursorHandle.parentElement.getBoundingClientRect();
    var scale = 900 / rect.width;
    var x = (e.clientX - rect.left) * scale;
    var lo = BAR_PAD, hi = BAR_PAD + BAR_SPAN;
    state.cursorX = Math.max(lo, Math.min(hi, x));
    render();
  });
  cursorHandle.addEventListener('pointerup', function(){ draggingCursor = false; cursorHandle.style.cursor='grab'; });

  benchEl.addEventListener('dragover', function(e){ e.preventDefault(); });
  benchEl.addEventListener('drop', function(e){
    e.preventDefault();
    var key = e.dataTransfer.getData('text/plain');
    if (key && SOURCES[key]) selectSource(key);
  });

  SOURCE_ORDER.forEach(function(key, i){
    var s = SOURCES[key];
    var color = wavelengthToRGB(s.swatchWl);
    var wrap = document.createElement('div');
    wrap.setAttribute('draggable', 'true');
    wrap.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:4px; cursor:grab; padding:6px 8px; border:2px solid #d8d5d5;';
    wrap.innerHTML =
      '<svg viewBox="0 0 28 32" width="28" height="32">' +
        '<circle cx="14" cy="12" r="10" fill="'+color+'" opacity="0.9" style="animation:bulbPulse 2.2s ease-in-out infinite; animation-delay:'+((i%6)*0.18)+'s; transform-origin:14px 12px;"></circle>' +
        '<rect x="10" y="20" width="8" height="4" fill="#7d7979"></rect>' +
        '<rect x="11" y="25" width="6" height="3" fill="#605d5d"></rect>' +
      '</svg>' +
      '<span style="font-size:11px; font-weight:700; color:#5a5757; line-height:1;">'+s.short+'</span>';
    wrap.dataset.key = key;
    wrap.addEventListener('dragstart', function(e){ e.dataTransfer.setData('text/plain', key); e.dataTransfer.effectAllowed='copy'; });
    wrap.addEventListener('click', function(){ selectSource(key); });
    bulbTray.appendChild(wrap);
  });

  function svgEl(tag, attrs){
    var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  function render(){
    var sourceKey = state.sourceKey;
    var source = SOURCES[sourceKey];
    var d = SCREEN_X - PRISM_X;
    var phase = state.phase, playing = state.playing;
    var beamRevealed = phase !== 'idle';
    var beamOffset = beamRevealed ? 0 : (PRISM_X - SOURCE_X);
    var beamOpacity = beamRevealed ? 1 : 0;
    var disperseRevealed = phase === 'dispersing' || phase === 'done';
    var doneRevealed = phase === 'done';

    var idxs = source.lines.map(function(w,i){return i;});
    idxs.sort(function(a,b){ return source.lines[a]-source.lines[b]; });
    var sortedOffsets = idxs.map(function(i){ return (550 - source.lines[i]) * 0.00095 * d; });
    var minGap = 14;
    for (var k=1;k<sortedOffsets.length;k++){
      if (sortedOffsets[k-1] - sortedOffsets[k] < minGap) sortedOffsets[k] = sortedOffsets[k-1] - minGap;
    }
    sortedOffsets = sortedOffsets.map(function(v){ return Math.max(-105, Math.min(105, v)); });
    var offsetByIndex = {};
    idxs.forEach(function(i, kk){ offsetByIndex[i] = sortedOffsets[kk]; });

    var bulbColor = wavelengthToRGB(source.swatchWl);
    bulbEl.setAttribute('fill', bulbColor);
    bulbGlow.setAttribute('fill', bulbColor);
    bulbGlow.setAttribute('opacity', playing ? 0.35 : 0);
    beamEl.setAttribute('stroke', bulbColor);
    beamEl.setAttribute('opacity', beamOpacity);
    beamEl.style.strokeDashoffset = beamOffset;
    beamEl.style.transition = 'stroke-dashoffset 0.65s ease, opacity 0.65s ease';

    powerDot.setAttribute('fill', playing ? '#ec3013' : '#7d7979');
    powerGlow.setAttribute('fill', playing ? '#ec3013' : '#7d7979');
    powerGlow.setAttribute('opacity', playing ? 0.4 : 0);
    powerLabel.setAttribute('fill', playing ? '#ec3013' : '#7d7979');
    powerLabel.textContent = playing ? 'MARCHE' : 'ARRÊT';

    raysG.innerHTML = '';
    dotsG.innerHTML = '';
    var sortedWls = source.lines.slice().sort(function(a,b){return a-b;});
    source.lines.forEach(function(wl, i){
      var y2 = AXIS_Y + offsetByIndex[i];
      var len = Math.hypot(SCREEN_X - PRISM_X, y2 - AXIS_Y);
      var color = wavelengthToRGB(wl);
      var line = svgEl('line', { x1:PRISM_X, y1:AXIS_Y, x2:SCREEN_X, y2:y2, stroke:color, 'stroke-width':3, 'stroke-linecap':'round', 'stroke-dasharray': len+' '+len, opacity: disperseRevealed?1:0 });
      line.style.strokeDashoffset = disperseRevealed ? 0 : len;
      line.style.transition = 'stroke-dashoffset 0.7s ease, opacity 0.7s ease';
      raysG.appendChild(line);
      var glow = svgEl('circle', { cx:SCREEN_X, cy:y2, r:12, fill:color, opacity: doneRevealed?0.3:0 });
      var dot = svgEl('circle', { cx:SCREEN_X, cy:y2, r:5, fill:color, opacity: doneRevealed?1:0 });
      dotsG.appendChild(glow); dotsG.appendChild(dot);
    });

    spectrumBg.innerHTML = '';
    var gain = state.gain;
    source.lines.forEach(function(wl){
      var x = xFromWl(wl);
      var color = wavelengthToRGB(wl);
      var rank = sortedWls.indexOf(wl) + 1;
      var width = Math.min(24, 3*gain);
      var bar = document.createElement('div');
      bar.style.cssText = 'position:absolute; top:6px; left:'+x+'px; transform:translateX(-50%); width:'+width+'px; height:58px; background:'+color+'; box-shadow:0 0 10px '+color+'; opacity:'+(doneRevealed?1:0)+'; filter:brightness('+gain+'); transition:opacity 0.5s ease, width 0.2s ease;';
      spectrumBg.appendChild(bar);
      var rankEl = document.createElement('div');
      rankEl.style.cssText = 'position:absolute; top:8px; left:'+x+'px; transform:translateX(-50%); font-size:9px; font-weight:800; line-height:1; color:#161515; background:'+color+'; padding:0 3px; opacity:'+(doneRevealed?1:0)+'; transition:opacity 0.5s ease;';
      rankEl.textContent = rank;
      spectrumBg.appendChild(rankEl);
    });

    cursorLabelEl.style.left = state.cursorX + 'px';
    cursorHandle.style.left = state.cursorX + 'px';
    var cursorWl = wlFromX(state.cursorX);
    cursorLabelEl.textContent = cursorWl.toFixed(1) + ' nm';

    gainLabelEl.textContent = gain.toFixed(1);

    var vMin = state.viewMin, vMax = state.viewMax;
    var majorStep = pickStep(vMax - vMin);
    var minorStep = majorStep / 5;
    ticksEl.innerHTML = '';
    for (var v = Math.ceil(vMin/minorStep)*minorStep; v <= vMax + 1e-6; v += minorStep) {
      if (Math.abs(v/majorStep - Math.round(v/majorStep)) > 1e-6) {
        var mt = document.createElement('div');
        mt.style.cssText = 'position:absolute; top:0; left:'+xFromWl(v)+'px; width:1px; height:6px; background:#605d5d;';
        ticksEl.appendChild(mt);
      }
    }
    for (var v2 = Math.ceil(vMin/majorStep)*majorStep; v2 <= vMax + 1e-6; v2 += majorStep) {
      var t = document.createElement('div');
      t.style.cssText = 'position:absolute; top:0; left:'+xFromWl(v2)+'px; width:1px; height:10px; background:#9b9797;';
      ticksEl.appendChild(t);
      var lbl = document.createElement('span');
      lbl.style.cssText = 'position:absolute; top:11px; left:'+xFromWl(v2)+'px; transform:translateX(-50%); font-size:11px; color:#5a5757; white-space:nowrap;';
      lbl.textContent = (majorStep < 1 ? v2.toFixed(1) : Math.round(v2)) + ' nm';
      ticksEl.appendChild(lbl);
    }

    Array.prototype.forEach.call(bulbTray.children, function(el){
      var active = el.dataset.key === sourceKey;
      el.style.background = active ? '#fde8e3' : '#f3f2f2';
      el.style.borderColor = active ? '#ec3013' : '#d8d5d5';
    });
  }

  render();
})();
</script>
</body>
</html>
