<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atom Shooter</title>
<style>
html,body{margin:0;height:100%;background:#05060f;overflow:hidden}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;outline:none;cursor:crosshair}
#stage{position:relative}
#codebox{position:absolute;left:14.6%;top:84.1%;width:70.8%;height:8.75%;display:none;align-items:center;justify-content:center;gap:4%;
  background:rgba(0,0,0,.75);border:2px solid #ffd54f;box-sizing:border-box}
#codebox input{width:55%;background:transparent;border:none;color:#fff;font:bold 1em "Courier New",monospace;text-align:center;outline:none;cursor:text;letter-spacing:.05em}
#codebox button{font:bold .5em "Courier New",monospace;background:#ffd54f;color:#000;border:2px solid #000;padding:.35em .7em;cursor:pointer}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" tabindex="0"></canvas><div id="codebox"><input id="codein" readonly aria-label="Code Moodle"><button id="codebtn" type="button">COPIER</button></div></div></div>
<script>
(()=>{
"use strict";
const W=480,H=640;
const F='"Comic Sans MS","Comic Neue","Chalkboard SE","Segoe Print",cursive';
const INK='#222';

/* ---------- Paramètres URL (XOR + base64url) ---------- */
const KEY="Bayle-Atomes-2026";
function decodeP(s){
  try{
    s=s.replace(/-/g,'+').replace(/_/g,'/');
    while(s.length%4)s+='=';
    const b=atob(s),out=new Uint8Array(b.length);
    for(let i=0;i<b.length;i++)out[i]=b.charCodeAt(i)^KEY.charCodeAt(i%KEY.length);
    return JSON.parse(new TextDecoder().decode(out));
  }catch(e){return {};}
}
const qs=new URLSearchParams(location.search);
const P={lvl:1,t:0,vies:3,v:1,zs:1,nc:0,fx:2,s:-1,obj:.85};
if(qs.get('p'))Object.assign(P,decodeP(qs.get('p')));
for(const k of Object.keys(P))if(qs.has(k)&&qs.get(k)!=='')P[k]=Number(qs.get(k));
P.lvl=Math.max(1,Math.min(3,Math.round(P.lvl)||1));
P.vies=Math.max(1,Math.round(P.vies)||3);
P.v=P.v>0?P.v:1;
P.fx=P.fx>=1?P.fx:2;
P.obj=P.obj>0&&P.obj<=1?P.obj:.85;
P.s=P.s>=0?Math.round(P.s)%65536:0;
P.t=P.t>0?P.t:0;
P.nc=P.nc>0?Math.round(P.nc):(P.lvl===1?3:6);
const PER=Math.max(1,Math.round(P.nc/3));

/* ---------- Données ---------- */
const EL=[null,
 ["H","hydrogène",[1,2,3]],["He","hélium",[4,3]],["Li","lithium",[7,6]],["Be","béryllium",[9]],
 ["B","bore",[11,10]],["C","carbone",[12,13,14]],["N","azote",[14,15]],["O","oxygène",[16,17,18]],
 ["F","fluor",[19]],["Ne","néon",[20,22,21]],["Na","sodium",[23]],["Mg","magnésium",[24,25,26]],
 ["Al","aluminium",[27]],["Si","silicium",[28,29,30]],["P","phosphore",[31]],["S","soufre",[32,34,33]],
 ["Cl","chlore",[35,37]],["Ar","argon",[40,36,38]],["K","potassium",[39,41,40]],["Ca","calcium",[40,42,44]]];
const IONS=[[1,1],[3,1],[11,1],[19,1],[12,2],[20,2],[13,3],[9,-1],[17,-1],[8,-2],[16,-2]];
const pool=[];
for(let z=1;z<EL.length;z++)for(const A of EL[z][2])pool.push({z,A,q:0});
if(P.lvl>=3)for(const [z,q] of IONS)pool.push({z,A:EL[z][2][0],q});
const V={Z:e=>e.z,A:e=>e.A,N:e=>e.A-e.z,X:e=>e.z,E:e=>e.z-e.q};
const TYPES={1:['Z','A'],2:['Z','A','N','X'],3:['Z','A','N','X','E']};
const COLS=['#ffd54f','#81d4fa','#a5d6a7','#f48fb1','#ce93d8','#ffab91','#80cbc4','#fff59d'];

/* ---------- Canvas ---------- */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1;
function resize(){
  const ww=window.innerWidth,wh=window.innerHeight;
  scale=Math.min(ww/W,wh/H);
  const dpr=window.devicePixelRatio||1;
  cv.style.width=(W*scale)+'px';cv.style.height=(H*scale)+'px';
  cv.width=Math.round(W*scale*dpr);cv.height=Math.round(H*scale*dpr);
  const cb=document.getElementById('codebox');if(cb)cb.style.fontSize=(24*scale)+'px';
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
}
window.addEventListener('resize',resize);resize();

/* ---------- Dessin "fait main" ---------- */
let boil=0;
function R(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function wob(id,i,p){return R(id+i*13.7+p*71.3+boil*3.17)-.5;}
function pathPts(pts,close){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);if(close)ctx.closePath();}
function circlePts(x,y,r,id,p){
  const n=28,a0=R(id+p*3.3)*6.283,pts=[];
  for(let i=0;i<=n;i++){const a=a0+i/n*6.283*1.05,rr=r*(1+wob(id,i,p)*.07);pts.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr]);}
  return pts;
}
function sCircle(x,y,r,fill,stroke,lw,id){
  if(fill){ctx.fillStyle=fill;pathPts(circlePts(x,y,r,id,0),true);ctx.fill();}
  if(stroke){
    ctx.strokeStyle=stroke;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=lw;pathPts(circlePts(x,y,r,id,1));ctx.stroke();
    ctx.globalAlpha*=.55;ctx.lineWidth=lw*.6;pathPts(circlePts(x,y,r,id,2));ctx.stroke();ctx.globalAlpha/=.55;
  }
}
function sEdge(x1,y1,x2,y2,id,p){
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,b=wob(id,7,p)*Math.min(6,L*.06);
  const j=1.6;
  ctx.moveTo(x1+wob(id,1,p)*j,y1+wob(id,2,p)*j);
  ctx.quadraticCurveTo((x1+x2)/2+nx*b,(y1+y2)/2+ny*b,x2+wob(id,3,p)*j,y2+wob(id,4,p)*j);
}
function sLine(x1,y1,x2,y2,col,lw,id){
  ctx.strokeStyle=col;ctx.lineCap='round';
  ctx.lineWidth=lw;ctx.beginPath();sEdge(x1,y1,x2,y2,id,1);ctx.stroke();
  ctx.globalAlpha*=.5;ctx.lineWidth=lw*.6;ctx.beginPath();sEdge(x1,y1,x2,y2,id,2);ctx.stroke();ctx.globalAlpha/=.5;
}
function sPoly(pts,fill,stroke,lw,id){
  if(fill){ctx.fillStyle=fill;pathPts(pts,true);ctx.fill();}
  if(!stroke)return;
  ctx.strokeStyle=stroke;ctx.lineCap='round';ctx.lineJoin='round';
  for(let p=1;p<=2;p++){
    ctx.lineWidth=p===1?lw:lw*.6;if(p===2)ctx.globalAlpha*=.5;
    ctx.beginPath();
    for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];sEdge(a[0],a[1],b[0],b[1],id+i*5.1,p);}
    ctx.stroke();if(p===2)ctx.globalAlpha/=.5;
  }
}
function sRect(x,y,w,h,fill,stroke,lw,id){sPoly([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],fill,stroke,lw,id);}
function txt(s,x,y,size,col,align,rot,bold){
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);
  ctx.font=(bold?'bold ':'')+size+'px '+F;ctx.fillStyle=col||INK;
  ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillText(s,0,0);ctx.restore();
}
function heart(x,y,s,fill,id){
  const pts=[];for(let i=0;i<24;i++){const t=i/24*6.283;pts.push([x+s*10*Math.pow(Math.sin(t),3),y-s*10*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/16]);}
  sPoly(pts,fill,INK,2,id);
}
function limb(x1,y1,x2,y2,w,col,id){sLine(x1,y1,x2,y2,INK,w+4,id);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function astro(x,y,s,id,wave){
  const a=wave?Math.sin(time*7)*8*s:0;
  sRect(x-17*s,y-32*s,34*s,26*s,'#b0bec5',INK,2.2,id);
  limb(x-7*s,y,x-9*s,y+16*s,9*s,'#fafafa',id+1);
  limb(x+7*s,y,x+9*s,y+16*s,9*s,'#fafafa',id+2);
  sRect(x-15*s,y+14*s,11*s,7*s,'#78909c',INK,2,id+3);
  sRect(x+4*s,y+14*s,11*s,7*s,'#78909c',INK,2,id+4);
  sPoly([[x-14*s,y-30*s],[x+14*s,y-30*s],[x+16*s,y-4*s],[x+12*s,y+4*s],[x-12*s,y+4*s],[x-16*s,y-4*s]],'#fafafa',INK,2.4,id+5);
  sRect(x-7*s,y-20*s,14*s,10*s,'#ef5350',INK,1.6,id+6);
  sCircle(x-3*s,y-15*s,1.8*s,'#ffd54f',null,0,id+7);sCircle(x+3*s,y-15*s,1.8*s,'#4fc3f7',null,0,id+8);
  limb(x-14*s,y-24*s,x-24*s,y-6*s,8*s,'#fafafa',id+9);
  limb(x+14*s,y-24*s,x+25*s,y-(40*s+a),8*s,'#fafafa',id+10);
  sCircle(x+25*s,y-(42*s+a),5*s,'#78909c',INK,1.8,id+11);
  sCircle(x-24*s,y-4*s,5*s,'#78909c',INK,1.8,id+12);
  sCircle(x,y-46*s,17*s,'#fafafa',INK,2.6,id+13);
  visor(x,y-45*s,12*s,id+14);
  sLine(x+10*s,y-60*s,x+15*s,y-72*s,INK,2,id+15);sCircle(x+15*s,y-73*s,3*s,'#ef5350',INK,1.4,id+16);
}
function visor(x,y,r,id){
  ctx.save();ctx.translate(x,y);ctx.scale(1,.8);sCircle(0,0,r,'#4fc3f7',INK,2,id);ctx.restore();
  ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1.5,r*.22);ctx.lineCap='round';
  ctx.beginPath();ctx.arc(x,y,r*.6,-2.6,-1.7);ctx.stroke();
}

/* ---------- État du jeu ---------- */
let state='menu',time=0,last=0,overT=0,why='',credits=0,coinT=-1,newHi=false,hi=0;
/* HI-SCORE affiché = moitié du score max possible : un joueur au-dessus de la moyenne bat le record */
hi=Math.round((210*(P.nc-1)+210*P.fx)*.5/10)*10;
const RT=40;let hurry=false;
let lvLog=[],lvStart=0;
const MAXS=210*(P.nc-1)+Math.round(210*P.fx),GOAL=Math.round(MAXS*P.obj);
/* Code Moodle : FNV-1a 32 bits sur 'ATOMSHOOTER|seed|note10' (note sur 10 = score/MAX) */
const CALPH='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
function fnv(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function note10(){return Math.max(0,Math.min(10,Math.round(score/GOAL*10)));}
function scoreCode(seed,n){const st='ATOMSHOOTER|'+seed+'|'+n,h1=fnv(st),h2=fnv(st+'#');let c='';
  for(let i=0;i<6;i++)c+=CALPH[(h1>>>(5*i))&31];c+=CALPH[h2&31];return c.slice(0,4)+'-'+c.slice(4);}
function grade(){const r=score/GOAL;return r>=1?['S','#ffd54f']:r>=.8?['A','#69f0ae']:r>=.6?['B','#4fc3f7']:r>=.4?['C','#ffa726']:['D','#ff5252'];}
let streak=0,hiBeaten=false,cheer=null,shieldG=0,shieldT=0,shieldAnn=false;
const SH_DUR=4,SH_R=115,SH_FILL=14;
function doCheer(t,col){cheer={s:t,t:0,col:col||null};}
const AF='"Press Start 2P","Courier New",monospace';
function atxt(s,x,y,size,col,align){ctx.save();ctx.font='bold '+size+'px '+AF;ctx.textAlign=align||'center';ctx.textBaseline='middle';
  ctx.lineWidth=Math.max(3,size*.22);ctx.strokeStyle='#000';ctx.lineJoin='round';ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.restore();}
function blink(f){return Math.floor(time*(f||2.5))%2===0;}
function levelName(){return mult()>1?'LEVEL FINAL':'LEVEL '+(round+1);}
const ship={x:W/2,y:H-78,tx:W/2,dead:0,inv:0,boom:false};let trans=null,warp=0;const Y0=H-78;
let debris=[],crashes=0,glitter=[],rings=[],sparks=[],muzzle=0,recoil=0;
const keys={};let fireHeld=false;
let bullets=[],atoms=[],fx=[],puffs=[],stars=[];
let score=0,lives=0,hits=0,errs=0,round=0,rule=null,ruleT=0,spawnT=0,cool=0,shake=0,remain=0,banner=0,lastX=-99;
for(let i=0;i<130;i++){const L=i<80?0:i<118?1:2;stars.push({x:Math.random()*W,y:Math.random()*H,L,s:[.25,.7,1.4][L],size:[1,1.7,5+Math.random()*4][L],tw:Math.random()*6,
  col:L<2?(Math.random()<.15?'#ffe082':Math.random()<.15?'#81d4fa':'#fff'):pick(['#fff59d','#80deea','#f8bbd0','#fff'])});}
const nebulas=[{x:110,y:160,r:150,col:'#7c4dff'},{x:380,y:430,r:170,col:'#00bcd4'},{x:220,y:-220,r:140,col:'#ff4081'}];
const planet={x:390,y:120,r:34,col:'#ffab91',ring:'#ffe082',id:333};
const THEMES=[
 {bg:'#05060f',neb:['#7c4dff','#00bcd4','#ff4081'],extra:null,planet:'ring'},
 {bg:'#0f0406',neb:['#ff6d00','#d50000','#ffab00'],extra:'sun',planet:null},
 {bg:'#020a1c',neb:['#2962ff','#aa00ff','#00e5ff'],extra:'galaxy',planet:'gas'},
 {bg:'#000000',neb:['#ff3d00','#6200ea','#ffd600'],extra:'hole',planet:null}];
let theme=THEMES[0],exY=0;const rocks=[];
for(let i=0;i<7;i++)rocks.push({x:Math.random()*W,y:Math.random()*H,r:8+Math.random()*16,rot:Math.random()*6,vr:(Math.random()-.5)*.8,v:10+Math.random()*25,id:Math.random()*999,
  pts:Array.from({length:8},(_,k)=>.7+Math.random()*.4)});
function setTheme(i){theme=THEMES[i];exY=0;theme.neb.forEach((c,k)=>nebulas[k].col=c);
  if(theme.planet){planet.y=70+Math.random()*60;planet.x=60+Math.random()*(W-120);planet.r=theme.planet==='gas'?42:30;planet.col=theme.planet==='gas'?'#ffcc80':'#ffab91';}}
function themeFor(){return mult()>1?3:round%3;}

function pick(a){return a[Math.floor(Math.random()*a.length)];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function mult(){return round+1>=P.nc?P.fx:1;}
function same(a,b){return a.z===b.z&&a.A===b.A&&a.q===b.q;}
function isOk(e){return V[rule.t](e)===rule.val&&!(rule.ref&&same(e,rule.ref));}

function ruleText(t,v){
  if(t==='Z')return v+' proton'+(v>1?'s':'');
  if(t==='A')return v+' nucléon'+(v>1?'s':'');
  if(t==='N')return v+' neutron'+(v>1?'s':'');
  if(t==='E')return v+' électron'+(v>1?'s':'');
  return 'élément '+EL[v][1];
}
function newRule(first){
  if(!first){for(const a of atoms)puff(a.x,a.y,a.r);atoms=[];round++;}
  ruleT=0;banner=1.6;setTheme(themeFor());
  if(P.lvl===1){
    /* Niveau 1 : étapes même Z -> même A -> même N (2 cibles par étape) */
    const step=Math.min(2,Math.floor(round/PER)),t=['Z','A','N'][step];
    const ok=pool.filter(e=>pool.some(o=>!same(o,e)&&V[t](o)===V[t](e)));
    let ref;do{ref=pick(ok);}while(rule&&rule.ref&&same(ref,rule.ref)&&ok.length>1);
    rule={t,val:V[t](ref),ref,text:'même '+t+' que',hits:0,errs:0,esc:0,step};
    return;
  }
  const types=TYPES[P.lvl];let t;
  do{t=pick(types);}while(rule&&types.length>1&&t===rule.t&&Math.random()<.7);
  const src=t==='E'?pool.filter(e=>e.q!==0).concat(pool):pool;
  const e=pick(src),val=V[t](e);
  rule={t,val,text:ruleText(t,val),hits:0,errs:0,esc:0};
}
function spawn(){
  const M=pool.filter(isOk),D=pool.filter(e=>!isOk(e)&&!(rule.ref&&same(e,rule.ref)));
  let e;
  const anyOk=atoms.some(a=>isOk(a));
  if(Math.random()<(anyOk?.4:.75)||!D.length)e=pick(M);
  else if(Math.random()<.7){
    const s=D.slice().sort((a,b)=>Math.abs(V[rule.t](a)-rule.val)-Math.abs(V[rule.t](b)-rule.val));
    e=pick(s.slice(0,8));
  }else e=pick(D);
  let x;for(let k=0;k<6;k++){x=45+Math.random()*(W-90);if(Math.abs(x-lastX)>80)break;}
  lastX=x;
  const sp=45*(1+.1*round)*P.v;
  const vy0=sp*(.8+Math.random()*.4);
  atoms.push({z:e.z,A:e.A,q:e.q,x,y:-40,r:31,vy:vy0,vy0,vx:(Math.random()-.5)*24,
    id:Math.random()*1000,col:pick(COLS),rot:(Math.random()-.5)*.25,ph:Math.random()*6});
}
const RAINBOW=['#ef5350','#ffa726','#ffee58','#66bb6a','#42a5f5','#ab47bc','#f48fb1'];
/* ---------- Explosions variées ---------- */
let parts=[],flashes=[],bolts=[];
function P_(o){parts.push(Object.assign({life:1,max:1,drag:1,grav:0,size:3,rot:0,vr:0,kind:'dot'},o));}
function nova(a){
  flashes.push({x:a.x,y:a.y,r:20,v:260,life:.35,max:.35,col:'#fff',k:'disc'});
  flashes.push({x:a.x,y:a.y,r:10,v:0,life:.7,max:.7,col:'#fff59d',k:'rays',rot:Math.random()*6});
  rings.push({x:a.x,y:a.y,r:a.r,v:420,delay:0,life:.55,max:.55,col:'#fff',id:Math.random()*99});
  rings.push({x:a.x,y:a.y,r:a.r,v:250,delay:.08,life:.7,max:.7,col:'#ffd54f',id:Math.random()*99});
  for(let i=0;i<36;i++){const g=Math.random()*6.283,v=150+Math.random()*260;
    P_({x:a.x,y:a.y,vx:Math.cos(g)*v,vy:Math.sin(g)*v,life:.5+Math.random()*.6,drag:.15,size:2.5,kind:'trail',col:pick(['#fff','#ffee58','#ffb300','#ff7043'])});}
}
function firework(a){
  const C=pick([['#ff4081','#f8bbd0'],['#69f0ae','#b9f6ca'],['#40c4ff','#b3e5fc'],['#ffd740','#fff59d'],['#e040fb','#ea80fc']]);
  for(let i=0;i<9;i++){const g=i/9*6.283+Math.random()*.3,v=170+Math.random()*60;
    P_({x:a.x,y:a.y,vx:Math.cos(g)*v,vy:Math.sin(g)*v-40,life:.45,max:.45,drag:.4,size:3,kind:'trail',col:C[0],burst:C});}
  flashes.push({x:a.x,y:a.y,r:a.r,v:60,life:.25,max:.25,col:C[1],k:'disc'});
}
function spiral(a){
  const C=['#b388ff','#80d8ff','#ff80ab','#fff','#a7ffeb'];
  for(let i=0;i<60;i++)P_({cx:a.x,cy:a.y,ang:i/60*6.283*2,rad:4+i*.3,vrad:70+Math.random()*50,av:5-i*.03,life:1.1+Math.random()*.4,size:2+Math.random()*2.5,kind:'orbit',col:C[i%5]});
  flashes.push({x:a.x,y:a.y,r:a.r*.8,v:20,life:.9,max:.9,col:'#b388ff',k:'swirl',rot:0});
}
function fission(a){
  const g=Math.random()*3.14;
  for(const sgn of [-1,1])P_({x:a.x,y:a.y,vx:Math.cos(g)*sgn*170,vy:Math.sin(g)*sgn*170-30,life:.9,drag:.5,size:a.r*.8,rot:g+(sgn>0?0:Math.PI)+Math.PI/2,vr:sgn*5,kind:'half',col:a.col});
  for(let i=0;i<3;i++){const h=Math.random()*6.283;P_({x:a.x,y:a.y,vx:Math.cos(h)*380,vy:Math.sin(h)*380,life:.7,size:5,kind:'neutron',col:'#cfd8dc'});}
  rings.push({x:a.x,y:a.y,r:a.r,v:300,delay:0,life:.6,max:.6,col:'#76ff03',id:Math.random()*99});
  flashes.push({x:a.x,y:a.y,r:a.r*1.4,v:120,life:.4,max:.4,col:'#b2ff59',k:'disc'});

      ctx.globalAlpha=.45;ctx.strokeStyle='#e040fb';ctx.lineWidth=21*w;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x,b.y+L+6);ctx.stroke();
      ctx.globalAlpha=1;ctx.strokeStyle=INK;ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x,b.y+L);ctx.stroke();
      ctx.strokeStyle='#ff1744';ctx.lineWidth=10.5;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x,b.y+L);ctx.stroke();
      ctx.strokeStyle='#fff59d';ctx.lineWidth=4.5;ctx.beginPath();ctx.moveTo(b.x,b.y+2);ctx.lineTo(b.x,b.y+L-4);ctx.stroke();
      sparkle(b.x,b.y,13*w,time*12,'#fff');
    }
  }
  ctx.globalAlpha=1;
}
function drawShipState(){
  for(const d of debris){ctx.save();ctx.globalAlpha=Math.min(1,d.life/d.max*1.5);ctx.translate(d.x,d.y);ctx.rotate(d.r);sPoly(d.pts,d.col,INK,2,d.id);ctx.restore();}
  ctx.globalAlpha=1;
  if(ship.dead>0){
    const t=1.6-ship.dead;
    if(t<.45){
      const k=t/.45;
      star(ship.x,ship.y-4,40+k*50,18+k*22,8,t*14,'#ffd54f','#e53935',600);
      star(ship.x,ship.y-4,22+k*30,10+k*12,8,-t*20,'#fff59d','#ff8f00',601);
      ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(t*t*90);ctx.scale(1-k*.3,1-k*.3);ctx.translate(-ship.x,-ship.y);drawShip();ctx.restore();
    }else if(t<.75){
      const k=(t-.45)/.3;
      ctx.globalAlpha=1-k;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ship.x,ship.y,40+k*260,0,7);ctx.fill();
      star(ship.x,ship.y-4,90+k*80,40+k*30,8,t*14,'#ffd54f','#e53935',600);ctx.globalAlpha=1;
    }
    return;
  }
  if(shieldT>0&&!(shieldT<1&&Math.floor(shieldT*10)%2===0)){
    const x=ship.x,y=ship.y-4,R=SH_R*.62+Math.sin(time*9)*3;
    ctx.save();ctx.globalAlpha=.13;ctx.fillStyle='#18ffff';ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.fill();
    ctx.globalAlpha=.07;ctx.beginPath();ctx.arc(x,y,SH_R,0,7);ctx.fill();
    ctx.globalAlpha=.75;ctx.strokeStyle='#18ffff';ctx.lineWidth=1.4;
    for(let k=0;k<12;k++){const a=time*1.5+k/12*6.283,b=a+6.283/12;
      ctx.beginPath();ctx.moveTo(x+Math.cos(a)*R,y+Math.sin(a)*R);ctx.lineTo(x+Math.cos(b)*R,y+Math.sin(b)*R);ctx.lineTo(x+Math.cos(b-.26)*R*.78,y+Math.sin(b-.26)*R*.78);ctx.closePath();ctx.stroke();}
    ctx.globalAlpha=1;ctx.lineWidth=3.5;ctx.strokeStyle='#e0f7fa';ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.stroke();
    ctx.lineWidth=2;ctx.strokeStyle='#18ffff';ctx.setLineDash([6,8]);ctx.lineDashOffset=-time*60;ctx.beginPath();ctx.arc(x,y,R+9,0,7);ctx.stroke();ctx.setLineDash([]);
    ctx.restore();
  }
  if(ship.inv>0&&Math.floor(ship.inv*10)%2===0)return;
  ctx.save();ctx.translate(0,recoil);drawShip();
  if(muzzle>0){const k=muzzle/.1,MC=[['#fff59d','#ff1744'],['#ea80fc','#6200ea'],['#fff','#ff6d00'],['#ccff90','#00c853']][shipType];
    star(ship.x,ship.y-44,16+20*k,7+8*k,6,time*20,MC[0],MC[1],610);sparkle(ship.x,ship.y-44,10*k,0,'#fff');}
  ctx.restore();
}
function sparkle(x,y,s,rot,col){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=col;ctx.beginPath();
  for(let i=0;i<8;i++){const a=i/8*6.283,r=i%2?s*.28:s;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
  ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(34,34,34,.35)';ctx.lineWidth=.8;ctx.stroke();ctx.restore();
}
function drawDream(){
  drawParts();
  for(const r of rings){if(r.delay>0)continue;const k=r.life/r.max;
    if(r.halo){ctx.globalAlpha=k*.35;ctx.fillStyle=r.col;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.fill();ctx.globalAlpha=k*.5;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(r.x,r.y,r.r*.55,0,7);ctx.fill();continue;}
    ctx.globalAlpha=k;sCircle(r.x,r.y,r.r,null,r.col,3*k+.8,r.id);}
  for(const g of glitter){const k=Math.min(1,g.life/.5),tw=.6+.4*Math.sin(g.tw);
    ctx.globalAlpha=k;sparkle(g.x,g.y,g.size*tw,g.rot+g.tw*.15,g.col);}
  ctx.globalAlpha=1;
}
function drawFx(){
  drawDream();
  for(const p of puffs){ctx.globalAlpha=p.life/p.max*.7;sCircle(p.x,p.y,p.r,'#eceff1','#90a4ae',1.4,p.id);}
  ctx.globalAlpha=1;
  for(const f of fx){
    const age=f.max-f.life,k=1+.5*Math.max(0,1-age/.15);
    ctx.globalAlpha=Math.min(1,f.life/.3);
    if(f.burst&&age<.35){for(let i=0;i<9;i++){const a=i/9*6.283+f.id,r1=22+age*60,r2=36+age*90;sLine(f.x+Math.cos(a)*r1,f.y+Math.sin(a)*r1,f.x+Math.cos(a)*r2,f.y+Math.sin(a)*r2,'#ffa000',2.4,f.id+i);}}
    ctx.save();ctx.translate(f.x,f.y);ctx.scale(k,k);
    ctx.font='bold '+f.size+'px '+F;ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.rotate(f.rot);ctx.strokeText(f.s,0,0);ctx.fillStyle=f.col;ctx.fillText(f.s,0,0);ctx.restore();
  }
  ctx.globalAlpha=1;
}
function drawHud(){
  sRect(10,8,W-20,74,'#fff59d',INK,2.6,500);
  txt(levelName()+(mult()>1?'  ·  points ×'+P.fx:'')+'  ·  CIBLE :',22,24,14,mult()>1?'#c62828':'#5d4037','left',0,true);
  ruleLabel(W/2,46,28);
  for(let i=0;i<6;i++)sCircle(W/2-50+i*20,72,4.5,i<rule.hits?'#66bb6a':'#fff',INK,1.4,510+i);
  if(blink(1.5)||state!=='play')atxt('1UP',16,98,13,'#ff5252','left');
  atxt(String(score).padStart(6,'0'),62,98,13,'#fff','left');
  atxt('HI '+String(Math.max(hi,score)).padStart(6,'0'),W/2+20,98,13,'#ffd54f','center');
  for(let i=0;i<P.vies;i++)heart(W-24-i*28,100,1.05,i<lives?'#ef5350':'#455a64',520+i);
  if(P.t>0){const s=Math.ceil(remain);txt(Math.floor(s/60)+':'+String(s%60).padStart(2,'0'),W/2+20,146,15,remain<10?'#ff5252':'#fff','center',0,true);}
  if(!trans){const left=Math.max(0,RT-ruleT),k=left/RT,col=k>.5?'#69f0ae':k>.25?'#ffa726':'#ff5252';
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(12,84,W-24,5);ctx.fillStyle=col;ctx.fillRect(12,84,(W-24)*k,5);
    if(left>10||blink(4))atxt('TIME '+String(Math.ceil(left)).padStart(2,'0'),W/2+20,122,15,left>10?'#fff':'#ff5252');}
  {const gx=12,gy=H-30,gw=130,gh=12,full=shieldG>=1;
    atxt('Q-SHIELD',gx,gy-14,10,'#18ffff','left');
    ctx.fillStyle='rgba(24,255,255,.12)';ctx.fillRect(gx,gy,gw,gh);
    ctx.fillStyle=shieldT>0?'#e0f7fa':full?(blink(6)?'#18ffff':'#80deea'):'#00acc1';
    ctx.fillRect(gx,gy,gw*(shieldT>0?shieldT/SH_DUR:shieldG),gh);
    ctx.strokeStyle='#18ffff';ctx.lineWidth=1.5;ctx.strokeRect(gx,gy,gw,gh);
    if(full&&shieldT<=0&&blink(3))atxt('READY  [MAJ / CLIC DROIT]',gx+gw+8,gy+6,9,'#18ffff','left');}
  if(banner>0){
    const k=Math.min(1,(1.6-banner)/.2);
    ctx.save();ctx.globalAlpha=Math.min(1,banner/.3);
    ctx.translate(W/2,H/2-30);ctx.scale(k,k);ctx.rotate(-.05);
    sRect(-170,-48,340,96,'#fff',INK,3,530);
    txt('NOUVELLE CIBLE !',0,-14,28,'#1565c0','center',0,true);
    ruleLabel(0,24,24);
    ctx.restore();
  }
}
const RANKC=['#ff5252','#ffa726','#ffee58','#69f0ae','#4fc3f7'];
function fakeTable(){const n=['CUR','BOH','RUT','MEN','DAL'],f=[1,.85,.7,.55,.4];return n.map((nm,i)=>({nm,sc:Math.round(hi*f[i]/10)*10}));}
function rankTable(y,rows,hl){
  atxt('TOP 5 RANKING SCORE!!',W/2,y,16,'#fff');
  const lab=['TOP','2ND','3RD','4TH','5TH'];
  rows.slice(0,5).forEach((r,i)=>{const yy=y+46+i*38,c=RANKC[i];
    if(i===hl&&!blink(4))return;
    atxt(lab[i],70,yy,18,c,'left');atxt(String(r.sc).padStart(6,'0'),W/2+10,yy,18,c,'center');atxt(r.nm,W-70,yy,18,c,'right');});
}
function drawMenu(){
  atxt('1UP',30,22,11,'#ff5252','left');atxt('HI-SCORE '+String(hi).padStart(6,'0'),W-12,22,11,'#ffd54f','right');
  const scr=coinT>=0?1:Math.floor(time/6)%3;
  if(scr===0){
    txt('ATOM',W/2,100,62,'#4fc3f7','center',-.06,true);
    txt('SHOOTER',W/2,158,56,'#ff5252','center',.04,true);
    drawAtom({z:8,A:16,q:0,x:W/2+105,y:290,r:31,col:'#a5d6a7',id:11,rot:.1,ph:0});
    drawAtom({z:7,A:14,q:0,x:W/2-105,y:305,r:31,col:'#f48fb1',id:12,rot:-.1,ph:2});
    astro(W/2,350,1.4,900,true);
    atxt('LYCÉE PIERRE BAYLE',W/2,440,13,'#90a4ae');
    atxt('PRÉSENTE',W/2,462,13,'#90a4ae');
  }else if(scr===1){
    atxt('HOW TO PLAY',W/2,80,26,'#ffd54f');
    atxt('TIRE SUR LES ATOMES',W/2,126,14,'#fff');atxt('QUI RESPECTENT LA CIBLE',W/2,148,14,'#fff');
    const R=[[180,'atom','#a5d6a7','BON ATOME','+10 PTS','#69f0ae'],[240,'atom','#f48fb1','MAUVAIS ATOME','-1 VIE','#ff5252'],
             [300,'ship',null,'CRASH','-1 VIE','#ff5252'],[360,'esc',null,'BON ATOME RATÉ','-5 PTS','#ffa726'],[420,'fin',null,'LEVEL FINAL','PTS x'+P.fx,'#ffd54f']];
    for(const [y,ic,col,lab,val,vc] of R){
      if(ic==='atom')drawAtom({z:6,A:12,q:0,x:70,y,r:20,col,id:y,rot:0,ph:y});
      else if(ic==='ship'){ctx.save();ctx.translate(70,y);ctx.scale(.7,.7);ctx.translate(-ship.x,-ship.y);drawShip();ctx.restore();}
      else if(ic==='esc')atxt('↓',70,y,26,'#ffa726');
      else atxt('x'+P.fx,70,y,20,'#ffd54f');
      atxt(lab,110,y,14,'#fff','left');atxt(val,W-30,y,16,vc,'right');
    }
    atxt('← →  SOURIS : BOUGER',W/2,480,13,'#4fc3f7');atxt('ESPACE  CLIC : TIRER',W/2,504,13,'#4fc3f7');atxt('MAJ  CLIC DROIT : Q-SHIELD',W/2,528,13,'#18ffff');
  }else{
    rankTable(110,fakeTable(),-1);
    atxt('LES SAVANTS T\'ATTENDENT...',W/2,360,13,'#90a4ae');
    astro(W/2,460,.9,960,true);
  }
  if(coinT<0){if(blink(2))atxt('INSERT COIN',W/2,575,24,'#ffd54f');}
  else if(coinT>1&&blink(2.5)){atxt('PUSH START',W/2,568,24,'#69f0ae');atxt('(CLIC OU ESPACE)',W/2,596,11,'#90a4ae');}
  atxt('CREDIT '+credits,W-12,628,11,'#fff','right');
  atxt('© 2026 LYCÉE P. BAYLE',12,628,9,'#78909c','left');
}
function drawCheer(){
  const c=cheer,k=1+.6*Math.max(0,1-c.t/.15),a=Math.min(1,(1.4-c.t)/.3);
  const col=c.col||RAINBOW[Math.floor(time*12)%RAINBOW.length];
  ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,H-170-c.t*20);ctx.scale(k,k);ctx.rotate(Math.sin(time*14)*.04);
  atxt(c.s,0,0,26,col);ctx.restore();
}
function drawOver(){
  ctx.fillStyle='rgba(5,6,15,.85)';ctx.fillRect(0,0,W,H);
  if(why==='win'){atxt('MISSION ACCOMPLIE !',W/2,112,24,'#4fc3f7');}
  else atxt('GAME OVER',W/2,112,40,'#ff5252');
  if(overT<7){
    atxt('SCORE',W/2,195,14,'#fff');atxt(String(score).padStart(6,'0'),W/2,228,30,'#ffd54f');
    atxt('OBJECTIF '+String(GOAL).padStart(6,'0')+'   MAX '+String(MAXS).padStart(6,'0'),W/2,258,11,'#90a4ae');
    atxt('LEVEL',28,295,10,'#90a4ae','left');atxt('TIRS',190,295,10,'#90a4ae','center');atxt('ERR',255,295,10,'#90a4ae','center');atxt('RATÉS',320,295,10,'#90a4ae','center');atxt('PTS',W-28,295,10,'#90a4ae','right');
    lvLog.forEach((L,k)=>{const y=325+k*30,c=RANKC[k%5];
      atxt(L.n.replace('LEVEL ','LV '),28,y,13,c,'left');atxt(L.h+'/6',190,y,13,L.h>=6?'#69f0ae':'#ffa726','center');
      atxt(String(L.e),255,y,13,L.e?'#ff5252':'#fff','center');atxt(String(L.x),320,y,13,L.x?'#ffa726':'#fff','center');
      atxt('+'+L.p,W-28,y,13,'#fff','right');});
    if(overT>1.5){const [g,gc]=grade(),k=1+.4*Math.max(0,1-(overT-1.5)/.2);
      ctx.save();ctx.translate(W/2,462);ctx.scale(k,k);atxt('RANG '+g,0,0,34,gc);ctx.restore();
      atxt(Math.min(100,Math.round(score/GOAL*100))+' % DE L\'OBJECTIF',W/2,496,12,'#fff');}
    if(newHi&&blink(4))atxt('NEW HI-SCORE !',W/2,160,16,'#ffd54f');
  }else{
    const rows=fakeTable();let hl=-1;
    for(let i=0;i<5;i++)if(score>rows[i].sc){rows.splice(i,0,{nm:'TOI',sc:score});hl=i;break;}
    rankTable(200,rows,hl);
    if(hl===0&&blink(3))atxt('TU ES LE N°1 !',W/2,440,20,'#ffd54f');
  }
  if(overT>1.5)atxt('CODE MOODLE',W/2,526,11,'#ffd54f');
  if(overT>5&&blink(2))atxt('INSERT COIN',W/2,618,14,'#90a4ae');
}
function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake*14,(Math.random()-.5)*shake*14);
  drawBg();
  if(state==='menu'){drawMenu();drawFx();ctx.restore();return;}
  if(state==='select'){drawSelect();ctx.restore();return;}
  for(const a of atoms)drawAtom(a);
  drawLasers();
  drawShipState();drawFx();drawHud();
  if(trans&&state==='play')drawTrans();
  if(cheer&&state==='play')drawCheer();
  if(state==='over')drawOver();
  ctx.restore();
}
const codebox=document.getElementById('codebox'),codein=document.getElementById('codein'),codebtn=document.getElementById('codebtn');
let codeShown=false;
function syncCode(){const show=state==='over'&&overT>1.5;
  if(show&&!codeShown){codein.value=scoreCode(P.s,note10());codebtn.textContent='COPIER';codebox.style.display='flex';}
  if(!show&&codeShown)codebox.style.display='none';codeShown=show;}
codein.addEventListener('focus',()=>codein.select());
codein.addEventListener('click',()=>codein.select());
codebtn.addEventListener('click',e=>{e.stopPropagation();const v=codein.value;
  const done=()=>{codebtn.textContent='COPIÉ !';};
  const fb=()=>{codein.focus();codein.select();try{document.execCommand('copy');done();}catch(err){codebtn.textContent='CTRL+C';}};
  try{if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(v).then(done,fb);else fb();}catch(err){fb();}});
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;time+=dt;boil=Math.floor(time*7);
  update(dt);draw();syncCode();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- Entrées ---------- */
function toX(cx){const r=cv.getBoundingClientRect();return (cx-r.left)/r.width*W;}
function toY(cy){const r=cv.getBoundingClientRect();return (cy-r.top)/r.height*H;}
function press(){
  cv.focus();
  if(state==='menu'){if(coinT<0){credits++;coinT=0;}else if(coinT>1){coinT=-1;credits--;state='select';selT=0;}return true;}
  if(state==='select'){if(selT>.4)start();return true;}
  if(state==='over'){if(overT>5){state='menu';credits++;coinT=0;}return true;}
  return false;
}
cv.addEventListener('mousemove',e=>{ship.tx=clamp(toX(e.clientX),28,W-28);if(state==='select'){const c=cardAt(toX(e.clientX),toY(e.clientY));if(c>=0)shipType=c;}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('mousedown',e=>{e.preventDefault();if(e.button===2){if(state==='play')shieldOn();return;}if(state==='select'){const c=cardAt(toX(e.clientX),toY(e.clientY));if(c>=0)shipType=c;}if(!press()){fireHeld=true;if(cool<=0)shoot();}});
window.addEventListener('mouseup',()=>{fireHeld=false;});
cv.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];if(state==='select'){const c=cardAt(toX(t.clientX),toY(t.clientY));if(c>=0&&c!==shipType){shipType=c;return;}}if(state==='play'&&e.touches.length>1){shieldOn();return;}{const r=cv.getBoundingClientRect(),ty=(t.clientY-r.top)/r.height*H;if(state==='play'&&toX(t.clientX)<150&&ty>H-60){shieldOn();return;}}ship.tx=clamp(toX(t.clientX),28,W-28);if(!press()){fireHeld=true;if(cool<=0)shoot();}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();ship.tx=clamp(toX(e.touches[0].clientX),28,W-28);},{passive:false});
cv.addEventListener('touchend',()=>{fireHeld=false;});
window.addEventListener('keydown',e=>{
  if(e.target===codein)return;
  if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();
  if(state==='select'){if(e.code==='ArrowLeft'||e.code==='KeyA'||e.code==='KeyQ'){shipType=(shipType+3)%4;return;}if(e.code==='ArrowRight'||e.code==='KeyD'){shipType=(shipType+1)%4;return;}
    if(e.code==='ArrowUp'||e.code==='ArrowDown'){shipType=(shipType+2)%4;return;}}
  if((e.code==='Space'||e.code==='Enter')&&state!=='play'){press();return;}
  if(e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='KeyE'){shieldOn();return;}
  keys[e.code]=true;
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;fireHeld=false;});
})();
