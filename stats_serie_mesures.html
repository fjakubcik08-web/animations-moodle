<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analyse Statistique — Série de mesures</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #f0f4f8;
  color: #222;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

/* ── HEADER ── */
#header {
  background: #fff;
  border-bottom: 2px solid #d0dce8;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
  min-height: 44px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}
h1 { font-size: 1rem; color: #1a5a9a; letter-spacing: 0.4px; }

#n-tag {
  margin-left: auto;
  font-size: 0.72rem;
  color: #1a7a40;
  background: #e6f7ee;
  border: 1px solid #70c090;
  border-radius: 12px;
  padding: 2px 10px;
  display: none;
}

/* ── LAYOUT PRINCIPAL : 3 colonnes ── */
#main {
  flex: 1;
  display: flex;
  min-height: 0;
  overflow: hidden;
}

/* ── COLONNE GAUCHE : saisie ── */
#left-panel {
  width: 210px;
  flex-shrink: 0;
  background: #fff;
  border-right: 2px solid #d0dce8;
  display: flex;
  flex-direction: column;
  padding: 12px 12px 10px;
  gap: 10px;
  box-shadow: 2px 0 6px rgba(0,0,0,0.04);
}

.panel-title {
  font-size: 0.62rem;
  color: #8090a8;
  text-transform: uppercase;
  letter-spacing: 2px;
  flex-shrink: 0;
}

.paste-label {
  font-size: 0.68rem;
  color: #7090b0;
  letter-spacing: 0.5px;
}

#paste-area {
  flex: 1;
  min-height: 0;
  background: #f8fbff;
  border: 1px solid #b8cce0;
  border-radius: 6px;
  color: #1a3a60;
  font-family: 'Courier New', monospace;
  font-size: 0.78rem;
  padding: 6px 8px;
  resize: none;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  user-select: text;
}
#paste-area:focus {
  border-color: #4488cc;
  box-shadow: 0 0 0 3px rgba(68,136,204,0.12);
}
#paste-area::placeholder { color: #b0c4d8; font-size: 0.72rem; }

#controls {
  display: flex;
  flex-direction: column;
  gap: 7px;
  flex-shrink: 0;
}

#classes-control {
  display: flex;
  flex-direction: column;
  gap: 4px;
  background: #f0f6ff;
  border: 1px solid #c8daf0;
  border-radius: 7px;
  padding: 6px 8px;
}
#classes-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.ctrl-label { color: #6080a0; font-size: 0.74rem; }

#bars-val {
  width: 46px;
  font-weight: bold;
  color: #1a5a9a;
  font-size: 1rem;
  text-align: center;
  border: 1.5px solid #4488cc;
  border-radius: 5px;
  padding: 2px 4px;
  background: #fff;
  outline: none;
}
#bars-val:focus { border-color: #1a5a9a; box-shadow: 0 0 0 2px rgba(68,136,204,0.15); }

#bars-slider {
  width: 100%;
  cursor: pointer;
  accent-color: #2266bb;
  height: 4px;
  margin: 0;
}
#classes-range-hint {
  display: flex;
  justify-content: space-between;
  font-size: 0.58rem;
  color: #a0b4c8;
}

#btn-analyse {
  background: linear-gradient(160deg, #1e6abb, #0e3d80);
  color: #fff;
  border: none;
  border-radius: 7px;
  padding: 9px 0;
  cursor: pointer;
  font-size: 0.88rem;
  font-weight: bold;
  letter-spacing: 0.5px;
  transition: all 0.15s;
  width: 100%;
  box-shadow: 0 2px 8px rgba(30,106,187,0.3);
}
#btn-analyse:hover  { background: linear-gradient(160deg, #2a78c8, #1a4a90); box-shadow: 0 3px 12px rgba(30,106,187,0.4); }
#btn-analyse:active { transform: scale(0.98); }

#btn-reset-data {
  background: transparent;
  color: #8090a8;
  border: 1px solid #c8d8e8;
  border-radius: 5px;
  padding: 4px 10px;
  cursor: pointer;
  font-size: 0.72rem;
  transition: all 0.15s;
  width: 100%;
}
#btn-reset-data:hover { color: #cc4444; border-color: #e8b0b0; background: #fff5f5; }

#error-msg {
  display: none;
  color: #cc3333;
  font-size: 0.7rem;
  padding: 4px 7px;
  background: #fff0f0;
  border-radius: 4px;
  border: 1px solid #e8b0b0;
}

#shortcut-hint {
  font-size: 0.56rem;
  color: #c0ccd8;
  text-align: center;
}

/* ── COLONNE CENTRALE : histogramme ── */
#histogram-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 10px 10px 10px 12px;
  min-width: 0;
  gap: 6px;
}

#canvas-wrap {
  flex: 1;
  position: relative;
  min-height: 0;
  background: #fff;
  border: 1px solid #d0dce8;
  border-radius: 8px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.05);
}
#histo-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  cursor: crosshair;
}
#placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  pointer-events: none;
}
.ph-icon { font-size: 3rem; opacity: 0.2; }
.ph-text  { font-size: 0.75rem; letter-spacing: 0.5px; color: #b0c0d0; }

/* ── COLONNE DROITE : stats ── */
#stats-panel {
  width: 210px;
  flex-shrink: 0;
  background: #f8fbff;
  border-left: 2px solid #d0dce8;
  display: flex;
  flex-direction: column;
  padding: 10px 10px 8px;
  gap: 8px;
}

/* Écran calculatrice style Casio/NumWorks clair */
#calc-screen {
  flex: 1;
  background: #e8f0d8;
  border: 2px solid #b0c890;
  border-radius: 8px;
  padding: 10px 12px 8px;
  overflow-y: auto;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.07), inset 0 0 0 1px rgba(160,200,100,0.2);
  scrollbar-width: none;
}
#calc-screen::-webkit-scrollbar { display: none; }

.screen-title {
  font-family: 'Courier New', monospace;
  color: #4a6a20;
  font-size: 0.58rem;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  border-bottom: 1px solid #c0d8a0;
  padding-bottom: 5px;
  margin-bottom: 6px;
}

.stat-block { margin-bottom: 5px; }
.stat-block-title {
  font-family: 'Courier New', monospace;
  font-size: 0.52rem;
  color: #6a8a40;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 2px;
  opacity: 0.75;
}
.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 3px 0 2px;
  border-bottom: 1px solid rgba(160,200,100,0.35);
  opacity: 0;
  transform: translateX(6px);
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.stat-row.visible { opacity: 1; transform: translateX(0); }
.stat-row:last-child { border-bottom: none; }

.stat-name {
  font-family: 'Courier New', monospace;
  color: #3a6010;
  font-size: 0.72rem;
}
.stat-val {
  font-family: 'Courier New', monospace;
  color: #1a4800;
  font-size: 0.82rem;
  font-weight: bold;
}

#calc-footer {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex-shrink: 0;
}
#calc-brand {
  text-align: center;
  font-size: 0.5rem;
  color: #b0c0d0;
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* ── TOOLTIP ── */
#histo-tooltip {
  position: fixed;
  pointer-events: none;
  display: none;
  background: #fff;
  border: 1px solid #b0c8e0;
  border-radius: 7px;
  padding: 6px 10px;
  font-size: 0.78rem;
  color: #1a3a60;
  box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  z-index: 100;
  line-height: 1.65;
  white-space: nowrap;
}
#histo-tooltip .tt-interval { font-weight: bold; color: #1a5a9a; font-family: 'Courier New', monospace; }
#histo-tooltip .tt-count    { color: #333; }
#histo-tooltip .tt-freq     { color: #888; font-size: 0.7rem; }
</style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<div id="header">
  <h1>📊 Analyse statistique — Série de mesures</h1>
  <span id="n-tag"></span>
</div>

<!-- ═══ LAYOUT 3 COLONNES ═══ -->
<div id="main">

  <!-- GAUCHE : saisie des données -->
  <div id="left-panel">
    <div class="panel-title">◆ Données</div>
    <span class="paste-label">Colle le tableau Moodle ici :</span>
    <textarea id="paste-area"
      placeholder="Une valeur par ligne&#10;&#10;Ex :&#10;47.3&#10;48.1&#10;46.9&#10;47.8&#10;…"></textarea>

    <div id="controls">
      <div id="classes-control">
        <div id="classes-top">
          <span class="ctrl-label">Nombre de classes</span>
          <input type="number" id="bars-val" min="10" max="50" value="20">
        </div>
        <input type="range" id="bars-slider" min="10" max="50" value="20">
        <div id="classes-range-hint"><span>10</span><span>50</span></div>
      </div>
      <button id="btn-analyse">⚡ Analyser</button>
      <button id="btn-reset-data">↺ Réinitialiser</button>
      <div id="error-msg"></div>
      <div id="shortcut-hint">Ctrl+Entrée pour analyser</div>
    </div>
  </div>

  <!-- CENTRE : histogramme -->
  <div id="histogram-panel">
    <div class="panel-title">◆ Histogramme de répartition</div>
    <div id="canvas-wrap">
      <canvas id="histo-canvas"></canvas>
      <div id="placeholder">
        <div class="ph-icon">📈</div>
        <div class="ph-text">Colle des données, puis clique sur Analyser</div>
      </div>
    </div>
  </div>

  <!-- DROITE : statistiques -->
  <div id="stats-panel">
    <div id="calc-screen">
      <div class="screen-title">Statistiques</div>
      <div id="stats-content"></div>
    </div>
    <div id="calc-footer">
      <div id="calc-brand">FJ Analytics · Seconde</div>
    </div>
  </div>

</div>

<div id="histo-tooltip"></div>

<script>
const slider       = document.getElementById('bars-slider');
const barsVal      = document.getElementById('bars-val');
const btnAnalyse   = document.getElementById('btn-analyse');
const btnReset     = document.getElementById('btn-reset-data');
const textarea     = document.getElementById('paste-area');
const errorMsg     = document.getElementById('error-msg');
const nTag         = document.getElementById('n-tag');
const placeholder  = document.getElementById('placeholder');
const canvas       = document.getElementById('histo-canvas');
const ctx          = canvas.getContext('2d');
const statsContent = document.getElementById('stats-content');
const tooltip      = document.getElementById('histo-tooltip');

let currentData = null;
let animFrame   = null;
let currentBins = null;   // { bins, min, step, nBars } pour le tooltip

/* Marges partagées entre drawHistogram et le tooltip */
const PAD_L = 46, PAD_R = 14, PAD_T = 20, PAD_B = 48;

/* ── TOOLTIP ── */
canvas.addEventListener('mousemove', e => {
  if (!currentBins) return;
  const rect   = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const px     = (e.clientX - rect.left) * scaleX;

  const { bins, min, step, nBars } = currentBins;
  const plotW = canvas.width - PAD_L - PAD_R;
  const barW  = plotW / nBars;
  const idx   = Math.floor((px - PAD_L) / barW);

  if (idx < 0 || idx >= nBars) { tooltip.style.display = 'none'; return; }

  const lo    = min + idx * step;
  const hi    = min + (idx + 1) * step;
  const count = bins[idx];
  const total = bins.reduce((s, v) => s + v, 0);
  const pct   = ((count / total) * 100).toFixed(1);

  tooltip.innerHTML =
    `<div class="tt-interval">[${fmtAxis(lo, step)} ; ${fmtAxis(hi, step)}[</div>` +
    `<div class="tt-count">Effectif : <strong>${count}</strong></div>` +
    `<div class="tt-freq">Fréquence : ${pct} %</div>`;

  const TW = 185, TH = 72;
  let tx = e.clientX + 14;
  let ty = e.clientY - 10;
  if (tx + TW > window.innerWidth)  tx = e.clientX - TW - 10;
  if (ty + TH > window.innerHeight) ty = e.clientY - TH - 10;
  tooltip.style.left    = tx + 'px';
  tooltip.style.top     = ty + 'px';
  tooltip.style.display = 'block';
});
canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

/* ── ÉVÉNEMENTS ── */
slider.addEventListener('input', () => {
  barsVal.value = slider.value;
  if (currentData) drawHistogram(currentData, +slider.value);
});

barsVal.addEventListener('input', () => {
  let v = Math.min(50, Math.max(10, parseInt(barsVal.value) || 10));
  barsVal.value  = v;
  slider.value   = v;
  if (currentData) drawHistogram(currentData, v);
});
btnReset.addEventListener('click', reset);
btnAnalyse.addEventListener('click', analyse);
textarea.addEventListener('keydown', e => { if (e.ctrlKey && e.key === 'Enter') analyse(); });

/* ── RESET ── */
function reset() {
  textarea.value = '';
  currentData = null;
  currentBins = null;
  nTag.style.display = 'none';
  statsContent.innerHTML = '';
  placeholder.style.display = 'flex';
  errorMsg.style.display = 'none';
  clearCanvas();
  textarea.focus();
}

/* ── PARSING ── */
function parseData(raw) {
  const normalized = raw
    .replace(/(\d),(\d)/g, '$1.$2')   // virgule décimale française
    .replace(/[;,\t|]/g, ' ');
  const nums = normalized.match(/-?\d+(?:\.\d+)?(?:e[+-]?\d+)?/gi);
  if (!nums) return null;
  return nums.map(Number).filter(n => isFinite(n));
}

/* ── ANALYSER ── */
function analyse() {
  hideError();
  const raw = textarea.value.trim();
  if (!raw) { showError('Aucune donnée collée.'); return; }
  const data = parseData(raw);
  if (!data || data.length < 2) { showError('Données invalides (min. 2 valeurs).'); return; }
  currentData = data.slice().sort((a, b) => a - b);
  nTag.textContent = `n = ${data.length} mesures`;
  nTag.style.display = 'inline';
  placeholder.style.display = 'none';
  displayStats(currentData);
  drawHistogram(currentData, +slider.value);
}

function showError(msg) { errorMsg.textContent = '⚠ ' + msg; errorMsg.style.display = 'block'; }
function hideError()    { errorMsg.style.display = 'none'; }

/* ── FORMAT STATS : 4 chiffres significatifs, sci si nécessaire ── */
function fmt(x) {
  if (!isFinite(x)) return '—';
  if (x === 0) return '0';
  const abs = Math.abs(x);
  if (abs >= 1e6 || abs < 1e-4) return x.toExponential(3);
  const mag = Math.floor(Math.log10(abs));
  return x.toFixed(Math.max(0, 3 - mag));
}

/* ── FORMAT AXE/TOOLTIP : adapté à la largeur de classe ── */
function fmtAxis(x, step) {
  if (!isFinite(x)) return '—';
  if (!isFinite(step) || step <= 0) return fmt(x);

  const absX    = Math.abs(x);
  const absStep = Math.abs(step);

  // Nb de décimales pour distinguer les bornes de classes (min 2)
  const nDec = Math.max(2, Math.ceil(-Math.log10(absStep)));

  if (x === 0) return (0).toFixed(Math.min(nDec, 10));

  // Notation scientifique si valeur très grande ou très petite
  if (absX >= 1e6 || absX < 1e-3) {
    const xExp    = Math.floor(Math.log10(absX));
    const stepExp = Math.floor(Math.log10(absStep));
    const sigDec  = Math.max(2, xExp - stepExp + 1);
    return x.toExponential(Math.min(sigDec, 8));
  }

  // Notation décimale standard
  return x.toFixed(Math.min(nDec, 10));
}

/* ── STATS ── */
function quantile(sorted, p) {
  if (sorted.length === 1) return sorted[0];
  const pos = p * (sorted.length - 1);
  const lo  = Math.floor(pos), hi = Math.ceil(pos);
  if (lo === hi) return sorted[lo];
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);
}

function computeStats(sorted) {
  const n    = sorted.length;
  const sumX = sorted.reduce((s, v) => s + v, 0);
  const mean = sumX / n;
  const ssq  = sorted.reduce((s, v) => s + (v - mean) ** 2, 0);
  return {
    n, sumX, mean,
    sigN:    Math.sqrt(ssq / n),
    sigN1:   n > 1 ? Math.sqrt(ssq / (n - 1)) : 0,
    min:     sorted[0],
    max:     sorted[n - 1],
    q1:      quantile(sorted, 0.25),
    med:     quantile(sorted, 0.50),
    q3:      quantile(sorted, 0.75),
    etendue: sorted[n - 1] - sorted[0],
  };
}

function displayStats(sorted) {
  const s = computeStats(sorted);
  const groups = [
    { title: '— Effectif & position —', rows: [
        { name: 'n',       val: s.n.toString() },
        { name: 'x̄',      val: fmt(s.mean)    },
        { name: 'Σx',      val: fmt(s.sumX)    },
    ]},
    { title: '— Dispersion —', rows: [
        { name: 'σn',      val: fmt(s.sigN)    },
        { name: 'σn-1',    val: fmt(s.sigN1)   },
        { name: 'étendue', val: fmt(s.etendue) },
    ]},
    { title: '— Quartiles —', rows: [
        { name: 'min',  val: fmt(s.min) },
        { name: 'Q1',   val: fmt(s.q1)  },
        { name: 'méd',  val: fmt(s.med) },
        { name: 'Q3',   val: fmt(s.q3)  },
        { name: 'max',  val: fmt(s.max) },
    ]},
  ];

  statsContent.innerHTML = '';
  let delay = 0;
  groups.forEach(group => {
    const block = document.createElement('div');
    block.className = 'stat-block';
    const title = document.createElement('div');
    title.className = 'stat-block-title';
    title.textContent = group.title;
    block.appendChild(title);
    group.rows.forEach(r => {
      const row = document.createElement('div');
      row.className = 'stat-row';
      row.innerHTML = `<span class="stat-name">${r.name}</span><span class="stat-val">${r.val}</span>`;
      block.appendChild(row);
      setTimeout(() => row.classList.add('visible'), delay);
      delay += 55;
    });
    statsContent.appendChild(block);
  });
}

/* ── HISTOGRAMME ── */
function clearCanvas() {
  canvas.width  = canvas.offsetWidth  || 100;
  canvas.height = canvas.offsetHeight || 100;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function drawHistogram(sorted, nBars) {
  const min   = sorted[0];
  const max   = sorted[sorted.length - 1];
  const range = max - min;

  sizeCanvas();
  const W = canvas.width, H = canvas.height;

  if (range === 0) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#6090b0';
    ctx.font = '13px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Toutes les valeurs sont identiques : ' + fmt(min), W / 2, H / 2);
    return;
  }

  const step = range / nBars;
  const bins = new Array(nBars).fill(0);
  sorted.forEach(v => {
    let idx = Math.floor((v - min) / step);
    if (idx >= nBars) idx = nBars - 1;
    bins[idx]++;
  });
  currentBins = { bins, min, step, nBars };
  const maxFreq = Math.max(...bins);

  const plotW = W - PAD_L - PAD_R;
  const plotH = H - PAD_T - PAD_B;
  const barW  = plotW / nBars;

  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  const t0 = performance.now();
  const DUR = 480;
  function easeOut(t) { return 1 - (1 - t) ** 3; }

  function frame(now) {
    const t        = Math.min((now - t0) / DUR, 1);
    const progress = easeOut(t);

    ctx.clearRect(0, 0, W, H);

    /* Fond blanc zone tracé */
    ctx.fillStyle = '#fff';
    ctx.fillRect(PAD_L, PAD_T, plotW, plotH);

    /* Quadrillage horizontal */
    const nGridY = 5;
    for (let i = 0; i <= nGridY; i++) {
      const gy = PAD_T + plotH - plotH * i / nGridY;
      ctx.strokeStyle = i === 0 ? '#b0c8e0' : '#e8eef6';
      ctx.lineWidth   = i === 0 ? 1.2 : 0.7;
      ctx.beginPath(); ctx.moveTo(PAD_L, gy); ctx.lineTo(PAD_L + plotW, gy); ctx.stroke();
      const labelY = Math.round(maxFreq * i / nGridY);
      ctx.fillStyle = '#8090a8';
      ctx.font = '9px Arial';
      ctx.textAlign = 'right';
      ctx.fillText(labelY, PAD_L - 6, gy + 3);
    }

    /* Axes */
    ctx.strokeStyle = '#8090a8';
    ctx.lineWidth   = 1.5;
    ctx.beginPath();
    ctx.moveTo(PAD_L, PAD_T); ctx.lineTo(PAD_L, PAD_T + plotH);
    ctx.lineTo(PAD_L + plotW, PAD_T + plotH);
    ctx.stroke();

    /* Barres */
    bins.forEach((count, i) => {
      const h  = (count / maxFreq) * plotH * progress;
      const bx = PAD_L + i * barW;
      const by = PAD_T + plotH - h;
      const bw = Math.max(barW - 1.5, 1);
      if (h < 0.5) return;

      const grad = ctx.createLinearGradient(bx, by, bx, PAD_T + plotH);
      grad.addColorStop(0,   '#5aaae8');
      grad.addColorStop(0.6, '#2266bb');
      grad.addColorStop(1,   '#0e3a88');
      ctx.fillStyle = grad;
      ctx.fillRect(bx + 0.75, by, bw, h);

      /* Reflet */
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(bx + 0.75, by, bw, Math.min(h, 4));

      /* Bordure */
      ctx.strokeStyle = 'rgba(34,102,187,0.2)';
      ctx.lineWidth   = 0.5;
      ctx.strokeRect(bx + 0.75, by, bw, h);

      /* Effectif au-dessus (fin d'animation, barre assez haute) */
      if (t > 0.88 && count > 0 && h > 14) {
        const fs = Math.max(6.5, Math.min(10, barW * 0.5));
        ctx.fillStyle = '#1a4a88';
        ctx.font = `${fs}px Arial`;
        ctx.textAlign = 'center';
        ctx.fillText(count, bx + barW / 2, by - 3);
      }
    });

    /* Labels axe X */
    ctx.fillStyle = '#7090a8';
    ctx.font = '9px Arial';
    ctx.textAlign = 'center';
    const skipStep = Math.max(1, Math.ceil(nBars / 7));
    for (let i = 0; i <= nBars; i += skipStep) {
      const xval = min + i * step;
      const xpx  = PAD_L + i * barW;
      ctx.fillText(fmtAxis(xval, step), xpx, PAD_T + plotH + 14);
      ctx.strokeStyle = '#c0ccd8'; ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.moveTo(xpx, PAD_T + plotH); ctx.lineTo(xpx, PAD_T + plotH + 4); ctx.stroke();
    }
    ctx.fillStyle = '#7090a8';
    ctx.fillText(fmtAxis(max, step), PAD_L + plotW, PAD_T + plotH + 14);

    /* Label axe Y */
    ctx.save();
    ctx.translate(12, PAD_T + plotH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = '#9090a8'; ctx.font = '9px Arial'; ctx.textAlign = 'center';
    ctx.fillText('Effectif', 0, 0);
    ctx.restore();

    /* Label axe X bas */
    ctx.fillStyle = '#9090a8'; ctx.font = '9px Arial'; ctx.textAlign = 'center';
    ctx.fillText('Valeurs mesurées', PAD_L + plotW / 2, PAD_T + plotH + 34);

    if (t < 1) animFrame = requestAnimationFrame(frame);
    else animFrame = null;
  }
  animFrame = requestAnimationFrame(frame);
}

function sizeCanvas() {
  const wrap    = canvas.parentElement;
  canvas.width  = wrap.offsetWidth;
  canvas.height = wrap.offsetHeight;
}

new ResizeObserver(() => {
  if (currentData) drawHistogram(currentData, +slider.value);
}).observe(document.getElementById('canvas-wrap'));

textarea.focus();
</script>
