<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analyse Statistique — Série de mesures</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #0e1520;
  color: #c8d8f0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

/* ── HEADER ── */
#header {
  background: #1a2236;
  border-bottom: 2px solid #2a3a5c;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
  min-height: 44px;
}
h1 { font-size: 1rem; color: #90b8e0; letter-spacing: 0.5px; }

#n-tag {
  margin-left: auto;
  font-size: 0.72rem;
  color: #44aa66;
  background: rgba(0,80,40,0.3);
  border: 1px solid #2a6a44;
  border-radius: 12px;
  padding: 2px 10px;
  display: none;
}

/* ── INPUT ZONE ── */
#input-zone {
  display: flex;
  gap: 12px;
  padding: 10px 14px;
  background: #111824;
  border-bottom: 2px solid #1e2d45;
  flex-shrink: 0;
  align-items: flex-start;
}

/* Colonne gauche : label + textarea */
#paste-col {
  display: flex;
  flex-direction: column;
  flex: 1;
  gap: 4px;
}
.paste-label {
  font-size: 0.68rem;
  color: #3a5a80;
  letter-spacing: 1px;
  text-transform: uppercase;
}
#paste-area {
  flex: 1;
  height: 82px;
  background: #0a0f1a;
  border: 1px solid #2a3a5c;
  border-radius: 6px;
  color: #a0c8e8;
  font-family: 'Courier New', monospace;
  font-size: 0.8rem;
  padding: 6px 10px;
  resize: none;
  outline: none;
  transition: border-color 0.2s;
  user-select: text;
}
#paste-area:focus { border-color: #4080c0; box-shadow: 0 0 0 2px rgba(64,128,192,0.15); }
#paste-area::placeholder { color: #2a3a58; font-size: 0.75rem; }

/* Colonne droite : contrôles */
#controls {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 220px;
}

.ctrl-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.8rem;
}
.ctrl-label { color: #5a7a9a; min-width: 68px; font-size: 0.78rem; }

#bars-slider {
  flex: 1;
  cursor: pointer;
  accent-color: #4488cc;
  height: 4px;
}
#bars-val {
  font-weight: bold;
  color: #88c0f0;
  min-width: 22px;
  text-align: right;
  font-size: 0.85rem;
}

#btn-analyse {
  background: linear-gradient(160deg, #1e5298, #0e2d5a);
  color: #70b8ff;
  border: 1px solid #3a6aaa;
  border-radius: 7px;
  padding: 8px 0;
  cursor: pointer;
  font-size: 0.88rem;
  font-weight: bold;
  letter-spacing: 0.5px;
  transition: all 0.15s;
  width: 100%;
}
#btn-analyse:hover { background: linear-gradient(160deg, #2a60a8, #1a3d70); border-color: #5a8aee; color: #a0d0ff; }
#btn-analyse:active { transform: scale(0.98); }

#btn-reset-data {
  background: transparent;
  color: #4a6888;
  border: 1px solid #2a3a5c;
  border-radius: 5px;
  padding: 4px 10px;
  cursor: pointer;
  font-size: 0.72rem;
  transition: all 0.15s;
  width: 100%;
}
#btn-reset-data:hover { color: #ff9999; border-color: #804040; background: rgba(80,0,0,0.15); }

#error-msg {
  display: none;
  color: #ff8080;
  font-size: 0.72rem;
  padding: 4px 8px;
  background: rgba(80,0,0,0.25);
  border-radius: 4px;
  border: 1px solid #6a2828;
}

/* ── RESULTS ── */
#results {
  flex: 1;
  display: flex;
  min-height: 0;
  overflow: hidden;
}

/* ── HISTOGRAM ── */
#histogram-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 10px 14px 10px 10px;
  min-width: 0;
  gap: 6px;
}
.panel-title {
  font-size: 0.62rem;
  color: #2a4a6a;
  text-transform: uppercase;
  letter-spacing: 2.5px;
  flex-shrink: 0;
}
#canvas-wrap {
  flex: 1;
  position: relative;
  min-height: 0;
}
#histo-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
#placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: #1e3050;
  pointer-events: none;
}
.ph-icon { font-size: 3rem; opacity: 0.35; }
.ph-text { font-size: 0.75rem; letter-spacing: 1px; color: #253a55; }

/* ── STATS PANEL — style calculatrice ── */
#stats-panel {
  width: 215px;
  flex-shrink: 0;
  background: #080c14;
  border-left: 2px solid #1a2640;
  display: flex;
  flex-direction: column;
  padding: 10px 10px 8px;
  gap: 8px;
}

/* Écran calculatrice */
#calc-screen {
  flex: 1;
  background: #050e05;
  border: 2px solid #163016;
  border-radius: 8px;
  padding: 10px 12px 8px;
  overflow-y: auto;
  box-shadow: inset 0 3px 12px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(0,100,0,0.15);
  scrollbar-width: none;
}
#calc-screen::-webkit-scrollbar { display: none; }

.screen-title {
  font-family: 'Courier New', monospace;
  color: #1e5a1e;
  font-size: 0.58rem;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  border-bottom: 1px solid #0e300e;
  padding-bottom: 5px;
  margin-bottom: 6px;
}

/* Blocs de stats (groupes) */
.stat-block {
  margin-bottom: 5px;
}
.stat-block-title {
  font-family: 'Courier New', monospace;
  font-size: 0.52rem;
  color: #1e6a1e;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 2px;
  opacity: 0.7;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 3px 0 2px;
  border-bottom: 1px solid rgba(0,50,0,0.6);
  opacity: 0;
  transform: translateX(6px);
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.stat-row.visible {
  opacity: 1;
  transform: translateX(0);
}
.stat-row:last-child { border-bottom: none; }

.stat-name {
  font-family: 'Courier New', monospace;
  color: #3a9a3a;
  font-size: 0.72rem;
}
.stat-val {
  font-family: 'Courier New', monospace;
  color: #00e060;
  font-size: 0.82rem;
  font-weight: bold;
  text-shadow: 0 0 8px rgba(0,180,60,0.6);
  letter-spacing: 0.5px;
}

/* Pied : marque */
#calc-footer {
  display: flex;
  flex-direction: column;
  gap: 5px;
  flex-shrink: 0;
}
#calc-brand {
  text-align: center;
  font-size: 0.5rem;
  color: #1a2a3a;
  letter-spacing: 2px;
  text-transform: uppercase;
}
#shortcut-hint {
  text-align: center;
  font-size: 0.58rem;
  color: #1e3050;
}
</style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<div id="header">
  <h1>📊 Analyse statistique — Série de mesures</h1>
  <span id="n-tag"></span>
</div>

<!-- ═══ ZONE DE SAISIE ═══ -->
<div id="input-zone">
  <div id="paste-col">
    <span class="paste-label">▸ Données (colle ton tableau ici)</span>
    <textarea id="paste-area"
      placeholder="Colle ici les valeurs issues de Moodle&#10;(une par ligne, ou séparées par tabulations / virgules / points-virgules)&#10;&#10;Ex : 47.3&#10;     48.1&#10;     46.9&#10;     …"></textarea>
  </div>

  <div id="controls">
    <div class="ctrl-row">
      <span class="ctrl-label">Bâtons :</span>
      <input type="range" id="bars-slider" min="4" max="28" value="10">
      <span id="bars-val">10</span>
    </div>
    <button id="btn-analyse">⚡ Analyser</button>
    <button id="btn-reset-data">↺ Réinitialiser</button>
    <div id="error-msg"></div>
  </div>
</div>

<!-- ═══ RÉSULTATS ═══ -->
<div id="results">

  <!-- Histogramme -->
  <div id="histogram-panel">
    <div class="panel-title">◆ Histogramme de répartition</div>
    <div id="canvas-wrap">
      <canvas id="histo-canvas"></canvas>
      <div id="placeholder">
        <div class="ph-icon">📈</div>
        <div class="ph-text">Colle des données, puis clique sur Analyser</div>
      </div>
    </div>
  </div>

  <!-- Panneau stats style calculatrice -->
  <div id="stats-panel">
    <div id="calc-screen">
      <div class="screen-title">Statistiques</div>
      <div id="stats-content"></div>
    </div>
    <div id="calc-footer">
      <div id="shortcut-hint">Ctrl+Entrée pour analyser</div>
      <div id="calc-brand">FJ Analytics · Seconde</div>
    </div>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════════
   RÉFÉRENCES DOM
═══════════════════════════════════════════════ */
const slider      = document.getElementById('bars-slider');
const barsVal     = document.getElementById('bars-val');
const btnAnalyse  = document.getElementById('btn-analyse');
const btnReset    = document.getElementById('btn-reset-data');
const textarea    = document.getElementById('paste-area');
const errorMsg    = document.getElementById('error-msg');
const nTag        = document.getElementById('n-tag');
const placeholder = document.getElementById('placeholder');
const canvas      = document.getElementById('histo-canvas');
const ctx         = canvas.getContext('2d');
const statsContent = document.getElementById('stats-content');

let currentData = null;   // tableau trié
let animFrame   = null;

/* ═══════════════════════════════════════════════
   ÉVÉNEMENTS
═══════════════════════════════════════════════ */
slider.addEventListener('input', () => {
  barsVal.textContent = slider.value;
  if (currentData) drawHistogram(currentData, +slider.value);
});

btnReset.addEventListener('click', reset);

btnAnalyse.addEventListener('click', analyse);

textarea.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'Enter') analyse();
});

/* ═══════════════════════════════════════════════
   RESET
═══════════════════════════════════════════════ */
function reset() {
  textarea.value = '';
  currentData = null;
  nTag.style.display = 'none';
  statsContent.innerHTML = '';
  placeholder.style.display = 'flex';
  errorMsg.style.display = 'none';
  clearCanvas();
  textarea.focus();
}

/* ═══════════════════════════════════════════════
   PARSING
═══════════════════════════════════════════════ */
function parseData(raw) {
  // Gère virgule décimale française (47,3 → 47.3)
  // Stratégie : si une ligne ne contient qu'un seul nombre avec virgule,
  // c'est un séparateur décimal ; sinon c'est un séparateur de valeurs.
  // → on remplace la virgule par un point uniquement si elle est entre deux groupes de chiffres
  const normalized = raw
    .replace(/(\d),(\d)/g, '$1.$2')  // 47,3 → 47.3  (décimale française)
    .replace(/[;,\t|]/g, ' ');       // séparateurs multiples → espace

  const nums = normalized.match(/-?\d+(?:\.\d+)?(?:e[+-]?\d+)?/gi);
  if (!nums) return null;
  return nums.map(Number).filter(n => isFinite(n));
}

/* ═══════════════════════════════════════════════
   ANALYSER
═══════════════════════════════════════════════ */
function analyse() {
  hideError();
  const raw = textarea.value.trim();
  if (!raw) { showError('Aucune donnée collée.'); return; }

  const data = parseData(raw);
  if (!data || data.length < 2) {
    showError('Données invalides ou insuffisantes (minimum 2 valeurs).');
    return;
  }

  currentData = data.slice().sort((a, b) => a - b);

  nTag.textContent = `n = ${data.length} mesures`;
  nTag.style.display = 'inline';
  placeholder.style.display = 'none';

  displayStats(currentData);
  drawHistogram(currentData, +slider.value);
}

function showError(msg) {
  errorMsg.textContent = '⚠ ' + msg;
  errorMsg.style.display = 'block';
}
function hideError() { errorMsg.style.display = 'none'; }

/* ═══════════════════════════════════════════════
   STATISTIQUES
═══════════════════════════════════════════════ */

/* Quantile par interpolation linéaire (méthode NumWorks) */
function quantile(sorted, p) {
  if (sorted.length === 1) return sorted[0];
  const pos = p * (sorted.length - 1);
  const lo  = Math.floor(pos);
  const hi  = Math.ceil(pos);
  if (lo === hi) return sorted[lo];
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);
}

/* Formatage intelligent : 4 chiffres significatifs */
function fmt(x) {
  if (!isFinite(x)) return '—';
  if (x === 0) return '0';
  const abs = Math.abs(x);
  if (abs >= 1e6 || abs < 1e-3) return x.toExponential(3);
  // Nombre de décimales pour avoir ~4 chiffres significatifs
  const mag = Math.floor(Math.log10(abs));
  const dec = Math.max(0, 3 - mag);
  return x.toFixed(dec);
}

function computeStats(sorted) {
  const n    = sorted.length;
  const sumX = sorted.reduce((s, v) => s + v, 0);
  const mean = sumX / n;
  const ssq  = sorted.reduce((s, v) => s + (v - mean) ** 2, 0);
  const sigN   = Math.sqrt(ssq / n);
  const sigN1  = n > 1 ? Math.sqrt(ssq / (n - 1)) : 0;
  const min  = sorted[0];
  const max  = sorted[n - 1];
  const q1   = quantile(sorted, 0.25);
  const med  = quantile(sorted, 0.50);
  const q3   = quantile(sorted, 0.75);
  return { n, sumX, mean, sigN, sigN1, min, max, q1, med, q3,
           etendue: max - min, iqr: q3 - q1 };
}

function displayStats(sorted) {
  const s = computeStats(sorted);

  const groups = [
    {
      title: '— Effectif & position —',
      rows: [
        { name: 'n',       val: s.n.toString() },
        { name: 'x̄',      val: fmt(s.mean)   },
        { name: 'Σx',      val: fmt(s.sumX)   },
      ]
    },
    {
      title: '— Dispersion —',
      rows: [
        { name: 'σn',      val: fmt(s.sigN)   },
        { name: 'σn-1',    val: fmt(s.sigN1)  },
        { name: 'étendue', val: fmt(s.etendue) },
      ]
    },
    {
      title: '— Quartiles —',
      rows: [
        { name: 'min',  val: fmt(s.min) },
        { name: 'Q1',   val: fmt(s.q1)  },
        { name: 'méd',  val: fmt(s.med) },
        { name: 'Q3',   val: fmt(s.q3)  },
        { name: 'max',  val: fmt(s.max) },
      ]
    },
  ];

  statsContent.innerHTML = '';
  let delay = 0;

  groups.forEach(group => {
    const block = document.createElement('div');
    block.className = 'stat-block';

    const title = document.createElement('div');
    title.className = 'stat-block-title';
    title.textContent = group.title;
    block.appendChild(title);

    group.rows.forEach(r => {
      const row = document.createElement('div');
      row.className = 'stat-row';
      row.innerHTML =
        `<span class="stat-name">${r.name}</span>` +
        `<span class="stat-val">${r.val}</span>`;
      block.appendChild(row);
      // Animation décalée
      const d = delay;
      setTimeout(() => row.classList.add('visible'), d);
      delay += 55;
    });

    statsContent.appendChild(block);
  });
}

/* ═══════════════════════════════════════════════
   HISTOGRAMME
═══════════════════════════════════════════════ */
function clearCanvas() {
  const W = canvas.offsetWidth || 100;
  const H = canvas.offsetHeight || 100;
  canvas.width  = W;
  canvas.height = H;
  ctx.clearRect(0, 0, W, H);
}

function drawHistogram(sorted, nBars) {
  const min   = sorted[0];
  const max   = sorted[sorted.length - 1];
  const range = max - min;

  /* Cas dégénéré : toutes les valeurs identiques */
  if (range === 0) {
    sizeCanvas();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#2a4a6a';
    ctx.font = '13px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Toutes les valeurs sont identiques : ' + fmt(min),
      canvas.width / 2, canvas.height / 2);
    return;
  }

  const step  = range / nBars;
  const bins  = new Array(nBars).fill(0);
  sorted.forEach(v => {
    let idx = Math.floor((v - min) / step);
    if (idx >= nBars) idx = nBars - 1;  // inclure le max dans le dernier bac
    bins[idx]++;
  });

  const maxFreq = Math.max(...bins);

  sizeCanvas();
  const W = canvas.width;
  const H = canvas.height;

  // Marges
  const PAD_L = 44, PAD_R = 14, PAD_T = 20, PAD_B = 46;
  const plotW  = W - PAD_L - PAD_R;
  const plotH  = H - PAD_T - PAD_B;
  const barW   = plotW / nBars;

  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }

  const t0  = performance.now();
  const DUR = 500;   // ms

  function easeOut(t) { return 1 - (1 - t) ** 3; }

  function frame(now) {
    const t = Math.min((now - t0) / DUR, 1);
    const progress = easeOut(t);

    ctx.clearRect(0, 0, W, H);

    /* Fond quadrillé */
    const nGridY = 5;
    for (let i = 0; i <= nGridY; i++) {
      const gy = PAD_T + plotH - plotH * i / nGridY;
      ctx.strokeStyle = i === 0 ? 'rgba(42,74,110,0.9)' : 'rgba(26,48,76,0.5)';
      ctx.lineWidth = i === 0 ? 1.2 : 0.5;
      ctx.beginPath(); ctx.moveTo(PAD_L, gy); ctx.lineTo(PAD_L + plotW, gy); ctx.stroke();

      // Label Y
      const labelY = Math.round(maxFreq * i / nGridY);
      ctx.fillStyle = '#3a5c7a';
      ctx.font = '9px Arial';
      ctx.textAlign = 'right';
      ctx.fillText(labelY, PAD_L - 6, gy + 3);
    }

    /* Axes */
    ctx.strokeStyle = '#2a4a6a';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(PAD_L, PAD_T); ctx.lineTo(PAD_L, PAD_T + plotH);
    ctx.lineTo(PAD_L + plotW, PAD_T + plotH);
    ctx.stroke();

    /* Bâtons */
    bins.forEach((count, i) => {
      const h  = (count / maxFreq) * plotH * progress;
      const bx = PAD_L + i * barW;
      const by = PAD_T + plotH - h;
      const bw = Math.max(barW - 2, 1);

      if (h < 0.5) return;

      /* Dégradé bleu */
      const grad = ctx.createLinearGradient(bx, by, bx, PAD_T + plotH);
      grad.addColorStop(0,   '#5aabff');
      grad.addColorStop(0.5, '#2266cc');
      grad.addColorStop(1,   '#0e2255');
      ctx.fillStyle = grad;
      ctx.fillRect(bx + 1, by, bw, h);

      /* Ligne supérieure lumineuse */
      ctx.fillStyle = 'rgba(180,220,255,0.55)';
      ctx.fillRect(bx + 1, by, bw, 2);

      /* Bordure latérale discrète */
      ctx.strokeStyle = 'rgba(80,160,255,0.25)';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(bx + 1, by, bw, h);

      /* Effectif au-dessus du bâton (visible seulement à la fin) */
      if (t > 0.88 && count > 0 && h > 12) {
        const fs = Math.max(7, Math.min(10, barW * 0.45));
        ctx.fillStyle = '#6aadff';
        ctx.font = `${fs}px Arial`;
        ctx.textAlign = 'center';
        ctx.fillText(count, bx + barW / 2, by - 3);
      }
    });

    /* Labels axe X */
    ctx.fillStyle = '#3a5c7a';
    ctx.font = '9px Arial';
    ctx.textAlign = 'center';

    // On affiche un label tous les N bâtons pour ne pas surcharger
    const skipStep = Math.max(1, Math.ceil(nBars / 7));
    for (let i = 0; i <= nBars; i += skipStep) {
      const xval = min + i * step;
      const xpx  = PAD_L + i * barW;
      ctx.fillText(fmt(xval), xpx, PAD_T + plotH + 14);
      ctx.strokeStyle = '#2a4060';
      ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.moveTo(xpx, PAD_T + plotH); ctx.lineTo(xpx, PAD_T + plotH + 4); ctx.stroke();
    }
    // Toujours afficher le max en dernier
    const lastX = PAD_L + plotW;
    ctx.fillStyle = '#3a5c7a';
    ctx.fillText(fmt(max), lastX, PAD_T + plotH + 14);

    /* Label axe Y (rotaté) */
    ctx.save();
    ctx.translate(12, PAD_T + plotH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = '#2a4060';
    ctx.font = '9px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Effectif', 0, 0);
    ctx.restore();

    /* Titre de l'axe X (valeurs) */
    ctx.fillStyle = '#2a4060';
    ctx.font = '9px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Valeurs mesurées', PAD_L + plotW / 2, PAD_T + plotH + 32);

    if (t < 1) animFrame = requestAnimationFrame(frame);
    else animFrame = null;
  }

  animFrame = requestAnimationFrame(frame);
}

function sizeCanvas() {
  const wrap = canvas.parentElement;
  canvas.width  = wrap.offsetWidth;
  canvas.height = wrap.offsetHeight;
}

/* ═══════════════════════════════════════════════
   REDIMENSIONNEMENT
═══════════════════════════════════════════════ */
const ro = new ResizeObserver(() => {
  if (currentData) drawHistogram(currentData, +slider.value);
});
ro.observe(document.getElementById('canvas-wrap'));

/* ═══════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
textarea.focus();
</script>
</body>
</html>
