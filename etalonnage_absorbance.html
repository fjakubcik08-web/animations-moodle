<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spectrophotométrie — étalonnage</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;}
  #wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  #scene{width:100%;height:100%;touch-action:none;user-select:none;}
  .instr{font-size:15px;fill:#37474f;}
  .label{font-size:15px;fill:#37474f;font-weight:600;text-anchor:middle;}
  .sublabel{font-size:12px;fill:#607d8b;text-anchor:middle;}
  .draggable{cursor:grab;}
  .draggable:active{cursor:grabbing;}
  .uibtn{cursor:pointer;}
  #aura{opacity:0;pointer-events:none;}
  #aura.show{opacity:1;}
  @keyframes auraPulse{ 0%{opacity:.35;} 50%{opacity:.8;} 100%{opacity:.35;} }
  #aura.show circle{ animation: auraPulse 1.1s ease-in-out infinite; }
</style>
</head>
<body>
<div id="wrap">
<svg id="scene" viewBox="0 0 1650 620" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">

  <!-- décor -->
  <rect x="0" y="0" width="1650" height="400" fill="#eef3f6"/>
  <rect x="0" y="400" width="1650" height="220" fill="#e7ded0"/>
  <rect x="0" y="396" width="1650" height="6" fill="#d9d0c0"/>
  <ellipse cx="825" cy="560" rx="760" ry="26" fill="#00000008"/>

  <!-- consigne -->
  <text x="20" y="28" class="instr">Faites glisser un bécher sur la cuve pour la remplir, puis placez la cuve dans le spectrophotomètre (BLANC puis MESURE).</text>
  <text x="20" y="50" class="instr">Avant de changer de solution, videz la cuve dans le bécher « déchets ».</text>

  <!-- table -->
  <rect x="10" y="400" width="1630" height="18" rx="3" fill="#a97a4a"/>
  <rect x="55" y="418" width="16" height="100" fill="#8a5a34"/>
  <rect x="1560" y="418" width="16" height="100" fill="#8a5a34"/>

  <!-- bouton réinitialiser -->
  <g id="btnReset" class="uibtn">
    <rect x="1500" y="16" width="130" height="28" rx="6" fill="#78909c"/>
    <text x="1565" y="35" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600" pointer-events="none">Réinitialiser</text>
  </g>

  <!-- message ponctuel -->
  <text id="toast" x="825" y="90" text-anchor="middle" font-size="16" font-weight="600" fill="#c62828" opacity="0" pointer-events="none"></text>

  <g id="itemsLayer"></g>

  <!-- aura (zone de dépôt) -->
  <g id="aura"><circle cx="0" cy="0" r="60" fill="none" stroke="#4fc3f7" stroke-width="4"/></g>

</svg>
</div>

<script>
(function(){

  /* =========================================================
     1) Paramètres (XOR + base64url) — schéma propre à cette animation
        Ordre : [k, Cx, col, bruit, seed, C1, C2, ..., Cn]   (n = 3..8)
        A_i = k*C_i + bruit_i  (bruit_i déterministe, tiré de seed)
     ========================================================= */
  var XOR_KEY = "ABSO2026FRED";

  function b64urlToBytes(p){
    var b64 = p.replace(/-/g,'+').replace(/_/g,'/');
    while (b64.length % 4) b64 += '=';
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function decodeParams(p){
    var x = b64urlToBytes(p);
    var bytes = new Uint8Array(x.length);
    for (var i=0;i<x.length;i++) bytes[i] = x[i] ^ XOR_KEY.charCodeAt(i % XOR_KEY.length);
    return JSON.parse(new TextDecoder('utf-8').decode(bytes));
  }

  var cfg = { C:[1,2,3,4,5,6], k:0.12, cx:3.4, col:0, bruit:0.004, seed:12345, move:true };

  var qs = new URLSearchParams(location.search);
  if (qs.get('p')){
    try{
      var d = decodeParams(qs.get('p'));
      cfg.k = d[0]; cfg.cx = d[1]; cfg.col = d[2]|0; cfg.bruit = d[3]; cfg.seed = d[4]|0;
      cfg.C = d.slice(5);
    }catch(e){ console.warn('Paramètre p invalide, valeurs par défaut utilisées.', e); }
  }
  // paramètres en clair : priment sur p (tests locaux)
  if (qs.get('k') !== null)     cfg.k = parseFloat(qs.get('k'));
  if (qs.get('cx') !== null)    cfg.cx = parseFloat(qs.get('cx'));
  if (qs.get('col') !== null)   cfg.col = parseInt(qs.get('col'),10);
  if (qs.get('bruit') !== null) cfg.bruit = parseFloat(qs.get('bruit'));
  if (qs.get('seed') !== null)  cfg.seed = parseInt(qs.get('seed'),10);
  if (qs.get('move') !== null)  cfg.move = qs.get('move') !== '0';
  var cl = [];
  for (var q=1;q<=8;q++){ if (qs.get('c'+q) !== null) cl.push(parseFloat(qs.get('c'+q))); }
  if (cl.length) cfg.C = cl;
  cfg.C = cfg.C.slice(0,8);
  var N = cfg.C.length;

  // bruit déterministe (miroir exact du générateur Python)
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(cfg.seed);
  var noises = [];
  for (var i=0;i<=N;i++){ noises.push(cfg.bruit * (rng()+rng()+rng()-1.5)*2); }

  // contenu : 'eau' | 'S' | entier 0..N-1
  function trueA(c){
    if (c === 'eau') return 0;
    if (c === 'S') return cfg.k*cfg.cx + noises[N];
    return cfg.k*cfg.C[c] + noises[c];
  }
  function concOf(c){
    if (c === 'eau') return 0;
    if (c === 'S') return cfg.cx;
    return cfg.C[c];
  }

  var COLORS = [[25,95,200],[125,35,145],[235,150,20],[205,35,55],[40,150,70]];
  var rgb = COLORS[cfg.col] || COLORS[0];
  var Cmax = Math.max.apply(null, cfg.C.concat([cfg.cx]));
  function colorOf(c){
    if (c === 'eau') return 'rgba(144,202,249,0.35)';
    var a = 0.10 + 0.75*Math.max(0, concOf(c))/Cmax;
    return 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+a.toFixed(3)+')';
  }

  /* =========================================================
     2) Outils SVG / animation
     ========================================================= */
  var svgNS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById('scene');
  var itemsLayer = document.getElementById('itemsLayer');
  var TABLE_Y = 400;

  function mk(tag, attrs, parent){
    var e = document.createElementNS(svgNS, tag);
    for (var a in attrs) e.setAttribute(a, attrs[a]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function setT(it){
    it.el.setAttribute('transform','translate('+it.x+','+it.y+')'+(it.angle ? ' rotate('+it.angle.toFixed(2)+')' : ''));
  }
  function tween(dur, f, done){
    var t0 = performance.now();
    function step(now){
      var t = Math.min(1,(now-t0)/dur);
      f(1-Math.pow(1-t,3), t);
      if (t<1) requestAnimationFrame(step); else if (done) done();
    }
    requestAnimationFrame(step);
  }
  function moveTo(it, x, y, dur, done){
    var sx=it.x, sy=it.y;
    tween(dur, function(e){ it.x=sx+(x-sx)*e; it.y=sy+(y-sy)*e; setT(it); }, done);
  }
  function rotateTo(it, a, dur, done){
    var sa=it.angle||0;
    tween(dur, function(e){ it.angle=sa+(a-sa)*e; setT(it); }, done);
  }
  function localToAbs(it, lx, ly){
    var r = (it.angle||0)*Math.PI/180, c=Math.cos(r), s=Math.sin(r);
    return { x: it.x + lx*c - ly*s, y: it.y + lx*s + ly*c };
  }
  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

  function stream(x1,y1,x2,y2,color,dur){
    var line = mk('line',{x1:x1,y1:y1,x2:x1,y2:y1,stroke:color,'stroke-width':4,'stroke-linecap':'round'}, svg);
    var t0 = performance.now(), grow=dur*0.25, shrink=dur*0.75;
    function step(now){
      var el = now-t0;
      var g = Math.min(1, el/grow);
      line.setAttribute('x2', x1+(x2-x1)*g); line.setAttribute('y2', y1+(y2-y1)*g);
      if (el > shrink){
        var s = Math.min(1,(el-shrink)/(dur-shrink));
        line.setAttribute('x1', x1+(x2-x1)*s); line.setAttribute('y1', y1+(y2-y1)*s);
      }
      if (el < dur) requestAnimationFrame(step); else line.remove();
    }
    requestAnimationFrame(step);
  }

  var toastEl = document.getElementById('toast'), toastTimer=null;
  function toast(msg){
    toastEl.textContent = msg; toastEl.setAttribute('opacity','1');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.setAttribute('opacity','0'); }, 2200);
  }

  /* =========================================================
     3) Objets
     ========================================================= */
  var items = {}, busy = false;

  function addHit(g, x, y, w, h){
    mk('rect',{x:x,y:y,width:w,height:h,fill:'transparent','pointer-events':'all'}, g);
  }

  var LIQ = 56; // hauteur de liquide dans un bécher
  function makeBecher(id, x, content, label, opts){
    opts = opts || {};
    var it = { id:id, kind:'becher', x:x, y:TABLE_Y, homeX:x, homeY:TABLE_Y, angle:0, content:content };
    var g = mk('g',{ 'data-itemid':id, 'class': (opts.fixed || !cfg.move) ? '' : 'draggable' }, itemsLayer);
    it.el = g;
    var lh = opts.level != null ? opts.level : LIQ;
    it.liq = mk('rect',{x:-34,y:-2-lh,width:68,height:lh,fill: opts.fill || colorOf(content)}, g);
    mk('path',{d:'M -36,-92 L -36,-4 Q -36,0 -32,0 L 32,0 Q 36,0 36,-4 L 36,-86 Q 36,-92 42,-92',
      fill:'none',stroke:'#333333','stroke-width':3,'stroke-linejoin':'round','stroke-linecap':'round'}, g);
    [-25,-45,-65].forEach(function(yy){ mk('line',{x1:-36,y1:yy,x2:-27,y2:yy,stroke:'#555','stroke-width':1.5}, g); });
    addHit(g,-50,-105,100,115);
    var t = mk('text',{x:0,y:-104,'class': opts.sub ? 'sublabel' : 'label'}, g);
    t.textContent = label;
    setT(it);
    items[id] = it;
    return it;
  }

  function makeCuve(x){
    var it = { id:'cuve', kind:'cuve', x:x, y:TABLE_Y, homeX:x, homeY:TABLE_Y, angle:0, content:null, inSpectro:false };
    var g = mk('g',{ 'data-itemid':'cuve', 'class': cfg.move ? 'draggable' : '' }, itemsLayer);
    it.el = g;
    mk('rect',{x:-13,y:-70,width:26,height:70,fill:'rgba(255,255,255,0.55)'}, g);
    it.liq = mk('rect',{x:-11,y:-3,width:22,height:0,fill:'transparent'}, g);
    mk('rect',{x:-13,y:-70,width:5,height:70,fill:'#cfd8dc',opacity:0.9}, g);
    mk('rect',{x:8,y:-70,width:5,height:70,fill:'#cfd8dc',opacity:0.9}, g);
    mk('rect',{x:-13,y:-70,width:26,height:70,rx:1.5,fill:'none',stroke:'#333333','stroke-width':2}, g);
    addHit(g,-30,-90,60,100);
    var t = mk('text',{x:0,y:-80,'class':'sublabel'}, g); t.textContent = 'cuve';
    it.lbl = t;
    setT(it);
    items.cuve = it;
    return it;
  }
  var CUVE_LIQ = 50;
  function setCuveLevel(h){ cuve.liq.setAttribute('y', -3-h); cuve.liq.setAttribute('height', h); }

  // --- disposition
  var SPEC_X = 1430;
  var DECH_X = 1050;
  var CUVE_X = 1160;

  var eau = makeBecher('eau', 70, 'eau', 'eau');
  var bechers = [eau];
  var gap = Math.min(95, 760/(N+1));
  for (var b=0;b<N;b++){ bechers.push(makeBecher('b'+b, 175 + b*gap, b, String(b+1))); }
  bechers.push(makeBecher('S', 175 + N*gap + 10, 'S', 'S'));
  var dechets = makeBecher('dechets', DECH_X, null, 'déchets', {fixed:true, sub:true, level:14, fill:'rgba(150,160,170,0.35)'});
  var dechLevel = 14;

  // spectrophotomètre (fixe)
  var spec = { x:SPEC_X, y:TABLE_Y };
  spec.el = mk('g',{transform:'translate('+SPEC_X+','+TABLE_Y+')'}, itemsLayer);
  (function(g){
    mk('rect',{x:-140,y:-4,width:22,height:8,fill:'#757575',stroke:'#333','stroke-width':2}, g);
    mk('rect',{x:118,y:-4,width:22,height:8,fill:'#757575',stroke:'#333','stroke-width':2}, g);
    mk('rect',{x:-150,y:-150,width:300,height:146,rx:10,fill:'#e0e0e0',stroke:'#333333','stroke-width':3}, g);
    mk('rect',{x:-125,y:-150,width:90,height:16,rx:3,fill:'#cfd8dc',stroke:'#333333','stroke-width':2}, g);
    mk('rect',{x:-96,y:-153,width:32,height:7,rx:1,fill:'#37474f'}, g);
    var t = mk('text',{x:-80,y:-110,'font-size':11,'font-weight':'bold',fill:'#546e7a','text-anchor':'middle'}, g);
    t.textContent = 'SPECTRO';
    var t2 = mk('text',{x:-80,y:-96,'font-size':9,fill:'#78909c','text-anchor':'middle'}, g);
    t2.textContent = 'UV-visible';
    mk('rect',{x:-20,y:-130,width:150,height:42,rx:4,fill:'#b3e5fc',stroke:'#78909c','stroke-width':1.5}, g);
    var ta = mk('text',{x:-10,y:-102,'font-family':'monospace, Courier','font-size':16,'font-weight':'bold',fill:'#0277bd'}, g);
    ta.textContent = 'A';
    spec.disp = mk('text',{x:122,y:-101,'font-family':'monospace, Courier','font-size':20,'font-weight':'bold',fill:'#0277bd','text-anchor':'end'}, g);
    spec.disp.textContent = '-----';
    spec.btnBlanc = mk('g',{'class':'uibtn'}, g);
    mk('rect',{x:-20,y:-74,width:68,height:26,rx:4,fill:'#ffb74d',stroke:'#333','stroke-width':2}, spec.btnBlanc);
    var tb = mk('text',{x:14,y:-56,'font-size':12,'font-weight':'bold',fill:'#333','text-anchor':'middle','pointer-events':'none'}, spec.btnBlanc);
    tb.textContent = 'BLANC';
    spec.btnMes = mk('g',{'class':'uibtn'}, g);
    mk('rect',{x:62,y:-74,width:68,height:26,rx:4,fill:'#81c784',stroke:'#333','stroke-width':2}, spec.btnMes);
    var tm = mk('text',{x:96,y:-56,'font-size':12,'font-weight':'bold',fill:'#333','text-anchor':'middle','pointer-events':'none'}, spec.btnMes);
    tm.textContent = 'MESURE';
  })(spec.el);
  var SLOT = { x: SPEC_X-80, y: TABLE_Y-150 };

  var cuve = makeCuve(CUVE_X);

  /* =========================================================
     4) Affichage / mesures
     ========================================================= */
  var blankRef = null, dispToken = 0;
  function showDisp(s){ dispToken++; spec.disp.textContent = s; }
  function fmtA(v){ if (Math.abs(v) < 0.0005) v = 0; return v.toFixed(3); }
  function animateA(target){
    var tok = ++dispToken;
    var t0 = performance.now(), dur = 900;
    function step(now){
      if (tok !== dispToken) return;
      var t = Math.min(1,(now-t0)/dur);
      var jit = Math.pow(1-t,1.5) * (Math.random()-0.5) * 0.08;
      spec.disp.textContent = t<1 ? fmtA(target+jit) : fmtA(target);
      if (t<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function checkCuve(){
    if (!cuve.inSpectro){ showDisp('CUVE ?'); return false; }
    if (cuve.content === null){ showDisp('VIDE'); return false; }
    return true;
  }
  spec.btnBlanc.addEventListener('click', function(){
    if (busy || !checkCuve()) return;
    blankRef = trueA(cuve.content);
    animateA(0);
  });
  spec.btnMes.addEventListener('click', function(){
    if (busy || !checkCuve()) return;
    if (blankRef === null){ showDisp('BLANC ?'); return; }
    animateA(trueA(cuve.content) - blankRef);
  });

  /* =========================================================
     5) Actions
     ========================================================= */
  var aura = document.getElementById('aura');
  function showAura(x,y,r){
    aura.setAttribute('transform','translate('+x+','+y+')');
    aura.querySelector('circle').setAttribute('r', r);
    aura.classList.add('show');
  }
  function hideAura(){ aura.classList.remove('show'); }

  function cuveCenter(){ return { x:cuve.x, y:cuve.y-35 }; }
  function becherCenter(it){ return { x:it.x, y:it.y-46 }; }
  var DECH_C = { x:DECH_X, y:TABLE_Y-46 };

  function pourIntoCuve(b){
    busy = true;
    var top = { x:cuve.x, y:cuve.y-70 };
    moveTo(b, top.x-101, top.y-20, 300, function(){
      rotateTo(b, 70, 350, function(){
        var sp = localToAbs(b, 42, -92);
        var col = colorOf(b.content);
        stream(sp.x, sp.y, top.x, top.y+12, col, 1000);
        cuve.content = b.content;
        cuve.liq.setAttribute('fill', col);
        tween(1000, function(e){ setCuveLevel(CUVE_LIQ*e); }, function(){
          rotateTo(b, 0, 300, function(){
            moveTo(b, b.homeX, b.homeY, 400, function(){ busy = false; });
          });
        });
      });
    });
  }

  function dumpCuve(){
    busy = true;
    var dt = { x:DECH_X, y:TABLE_Y-92 };
    moveTo(cuve, dt.x-54, dt.y-56, 300, function(){
      rotateTo(cuve, 120, 400, function(){
        var lip = localToAbs(cuve, 13, -70);
        stream(lip.x, lip.y, lip.x, dt.y+60, cuve.liq.getAttribute('fill'), 800);
        var d0 = dechLevel, d1 = Math.min(60, dechLevel+3);
        tween(800, function(e){
          setCuveLevel(CUVE_LIQ*(1-e));
          var h = d0+(d1-d0)*e;
          dechets.liq.setAttribute('y', -2-h); dechets.liq.setAttribute('height', h);
        }, function(){
          dechLevel = d1;
          cuve.content = null;
          rotateTo(cuve, 0, 300, function(){
            moveTo(cuve, cuve.homeX, cuve.homeY, 400, function(){ busy = false; });
          });
        });
      });
    });
  }

  function insertCuve(){
    busy = true;
    moveTo(cuve, SLOT.x, SLOT.y-4, 250, function(){
      itemsLayer.insertBefore(cuve.el, spec.el); // passe derrière la façade
      cuve.lbl.style.display = 'none';
      moveTo(cuve, SLOT.x, TABLE_Y-112, 350, function(){
        cuve.inSpectro = true;
        showDisp('-----');
        busy = false;
      });
    });
  }

  function removeFromSpectro(){
    if (!cuve.inSpectro) return;
    cuve.inSpectro = false;
    cuve.lbl.style.display = '';
    showDisp('-----');
  }

  /* =========================================================
     6) Glisser-déposer
     ========================================================= */
  var pt = svg.createSVGPoint();
  function toSvg(evt){
    pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  var dragging = null, off = {x:0,y:0};

  function zoneFor(it){
    if (it.kind === 'becher'){
      if (!cuve.inSpectro && dist(becherCenter(it), cuveCenter()) < 90) return 'pour';
    } else if (it.kind === 'cuve'){
      if (dist(cuveCenter(), {x:SLOT.x, y:SLOT.y-20}) < 70) return 'spectro';
      if (cuve.content !== null && dist(cuveCenter(), DECH_C) < 75) return 'dump';
    }
    return null;
  }

  if (cfg.move){
    svg.addEventListener('pointerdown', function(evt){
      if (busy) return;
      var g = evt.target.closest ? evt.target.closest('.draggable') : null;
      if (!g) return;
      var it = items[g.getAttribute('data-itemid')];
      if (!it) return;
      evt.preventDefault();
      try{ svg.setPointerCapture(evt.pointerId); }catch(e){}
      if (it.kind === 'cuve') removeFromSpectro();
      dragging = it;
      var p = toSvg(evt);
      off.x = it.x - p.x; off.y = it.y - p.y;
      itemsLayer.appendChild(it.el);
    });

    svg.addEventListener('pointermove', function(evt){
      if (!dragging) return;
      var p = toSvg(evt);
      dragging.x = p.x + off.x; dragging.y = p.y + off.y;
      setT(dragging);
      var z = zoneFor(dragging);
      if (z === 'pour') showAura(cuve.x, cuve.y-35, 55);
      else if (z === 'spectro') showAura(SLOT.x, SLOT.y-15, 50);
      else if (z === 'dump') showAura(DECH_C.x, DECH_C.y, 65);
      else hideAura();
    });

    function endDrag(){
      if (!dragging) return;
      var it = dragging; dragging = null;
      hideAura();
      var z = zoneFor(it);
      if (z === 'pour'){
        if (cuve.content !== null){
          toast('La cuve n’est pas vide : videz-la d’abord dans le bécher « déchets ».');
          moveTo(it, it.homeX, it.homeY, 350);
        } else {
          pourIntoCuve(it);
        }
      } else if (z === 'spectro'){
        insertCuve();
      } else if (z === 'dump'){
        dumpCuve();
      } else {
        moveTo(it, it.homeX, it.homeY, 350);
      }
    }
    svg.addEventListener('pointerup', endDrag);
    svg.addEventListener('pointercancel', endDrag);
  }

  /* =========================================================
     7) Réinitialisation
     ========================================================= */
  document.getElementById('btnReset').addEventListener('click', function(){
    if (busy) return;
    dragging = null; hideAura();
    bechers.forEach(function(b){ b.x=b.homeX; b.y=b.homeY; b.angle=0; setT(b); });
    removeFromSpectro();
    itemsLayer.appendChild(cuve.el);
    cuve.x=cuve.homeX; cuve.y=cuve.homeY; cuve.angle=0; cuve.content=null; setT(cuve);
    setCuveLevel(0);
    dechLevel = 14;
    dechets.liq.setAttribute('y', -2-dechLevel); dechets.liq.setAttribute('height', dechLevel);
