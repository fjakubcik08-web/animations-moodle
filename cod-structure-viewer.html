<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COD - Visualisation structure cristalline</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;font-family:Arial,Helvetica,sans-serif;overflow:hidden;}
  #app{position:relative;width:100%;height:100vh;min-height:400px;}
  #toolbar{position:absolute;top:0;left:0;right:0;z-index:10;
    background:#1565c0;color:#fff;padding:6px 10px;display:flex;gap:8px;align-items:center;
    flex-wrap:wrap;font-size:13px;box-sizing:border-box;}
  #toolbar label{opacity:.85;}
  #toolbar input[type=number]{width:90px;padding:3px 5px;border:none;border-radius:3px;}
  #toolbar button{padding:4px 10px;border:none;border-radius:3px;background:#0d47a1;color:#fff;cursor:pointer;}
  #toolbar button:hover{background:#0a3a80;}
  #toolbar select{padding:3px 5px;border:none;border-radius:3px;}
  #toolbar .nav{margin-left:auto;display:flex;gap:6px;}
  #frameHolder{position:absolute;top:34px;left:0;right:0;bottom:0;background:#000;}
  iframe{width:100%;height:100%;border:0;display:block;}
  #watermark{position:absolute;bottom:8px;right:12px;z-index:5;color:#ff9800;
    font-family:'Courier New',monospace;font-weight:bold;font-size:13px;pointer-events:none;}
  #legendPanel{position:absolute;top:40px;right:8px;z-index:8;display:none;
    background:rgba(20,20,20,.92);border:1px solid #444;border-radius:6px;
    padding:8px 10px;max-height:calc(100% - 56px);overflow-y:auto;width:190px;
    box-shadow:0 2px 10px rgba(0,0,0,.5);}
  #legendPanel h4{margin:0 0 6px;color:#ddd;font-size:12px;font-weight:normal;
    border-bottom:1px solid #444;padding-bottom:4px;}
  .legendGrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;}
  .legendItem{display:flex;align-items:center;gap:6px;font-size:12px;color:#eee;
    font-family:Arial,Helvetica,sans-serif;}
  .legendDot{width:14px;height:14px;border-radius:50%;flex:none;
    box-shadow:inset -2px -2px 3px rgba(0,0,0,.5), inset 1px 1px 2px rgba(255,255,255,.4);}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <label>COD id :</label>
    <input type="number" id="codInput" min="1" step="1" placeholder="ex: 1527138">
    <button id="loadBtn">Charger</button>
    <label>style :</label>
    <select id="modeSelect">
      <option value="balls">boules/bâtons</option>
      <option value="vdw">Van der Waals</option>
      <option value="stick">bâtons</option>
      <option value="wireframe">fil de fer</option>
    </select>
    <button id="legendBtn" title="afficher/masquer la légende des couleurs">🎨 Légende</button>
    <div class="nav">
      <button id="prevBtn" title="entrée précédente">&#9664; id-1</button>
      <button id="nextBtn" title="entrée suivante">id+1 &#9654;</button>
    </div>
  </div>
  <div id="frameHolder">
    <iframe id="viewerFrame" allow="fullscreen" loading="eager"></iframe>
  </div>
  <div id="legendPanel">
    <h4>Couleur → élément (convention Jmol/CPK, identique à celle utilisée dans la vue 3D)</h4>
    <div class="legendGrid" id="legendGrid"></div>
  </div>
  <div id="watermark">COD</div>
</div>

<script>
/* Rendu délégué à MolView (embed.molview.org), qui sait nativement charger
   une entrée COD par id, générer la maille via les opérations de symétrie du CIF,
   et gérer rotation/zoom à la souris — beaucoup plus fiable qu'un parseur maison. */

function getCodIdFromUrl(){
  const p = new URLSearchParams(window.location.search);
  return p.get('cod') || p.get('id') || '1527138';
}
function setUrlParams(id, mode){
  const url = new URL(window.location.href);
  url.searchParams.set('cod', id);
  url.searchParams.set('mode', mode);
  window.history.replaceState({}, '', url);
}
function embedUrl(id, mode){
  return 'https://embed.molview.org/v1/?mode=' + encodeURIComponent(mode) +
    '&codid=' + encodeURIComponent(id) + '&bg=black';
}
function loadCod(id, mode){
  id = String(id).trim();
  mode = mode || document.getElementById('modeSelect').value;
  if(!id) return;
  document.getElementById('viewerFrame').src = embedUrl(id, mode);
  document.getElementById('codInput').value = id;
  document.getElementById('watermark').textContent = 'COD ' + id;
  setUrlParams(id, mode);
  buildLegend(id);
}

document.getElementById('loadBtn').addEventListener('click', () => {
  loadCod(document.getElementById('codInput').value);
});
document.getElementById('codInput').addEventListener('keydown', e => {
  if(e.key === 'Enter') document.getElementById('loadBtn').click();
});
document.getElementById('prevBtn').addEventListener('click', () => {
  const id = parseInt(document.getElementById('codInput').value, 10);
  if(id > 1) loadCod(id - 1);
});
document.getElementById('nextBtn').addEventListener('click', () => {
  const id = parseInt(document.getElementById('codInput').value, 10);
  if(id) loadCod(id + 1);
});
document.getElementById('modeSelect').addEventListener('change', () => {
  loadCod(document.getElementById('codInput').value);
});

/* ============ Légende couleurs (convention Jmol/CPK — MolView utilise le même standard) ============ */
const JMOL_COLORS = [
  ['H','#ffffff'],['He','#d9ffff'],['Li','#cc80ff'],['Be','#c2ff00'],['B','#ffb5b5'],
  ['C','#909090'],['N','#3050f8'],['O','#ff0d0d'],['F','#90e050'],['Ne','#b3e3f5'],
  ['Na','#ab5cf2'],['Mg','#8aff00'],['Al','#bfa6a6'],['Si','#f0c8a0'],['P','#ff8000'],
  ['S','#ffff30'],['Cl','#1ff01f'],['Ar','#80d1e3'],['K','#8f40d4'],['Ca','#3dff00'],
  ['Sc','#e6e6e6'],['Ti','#bfc2c7'],['V','#a6a6ab'],['Cr','#8a99c7'],['Mn','#9c7ac7'],
  ['Fe','#e06633'],['Co','#f090a0'],['Ni','#50d050'],['Cu','#c88033'],['Zn','#7d80b0'],
  ['Ga','#c28f8f'],['Ge','#668f8f'],['As','#bd80e3'],['Se','#ffa100'],['Br','#a62929'],
  ['Kr','#5cb8d1'],['Rb','#702eb0'],['Sr','#00ff00'],['Y','#94ffff'],['Zr','#94e0e0'],
  ['Nb','#73c2c9'],['Mo','#54b5b5'],['Ag','#c0c0c0'],['Cd','#ffd98f'],['In','#a67573'],
  ['Sn','#668080'],['Sb','#9e63b5'],['Te','#d47a00'],['I','#940094'],['Cs','#57178f'],
  ['Ba','#00c900'],['Au','#ffd123'],['Hg','#b8b8d0'],['Pb','#575961'],['Bi','#9e4fb5'],
  ['W','#2194d6']
];
/* Table cod_id -> [symbole cation, symbole anion], extraite de database_1ES.xlsx (feuille
   ionic_struc2, 41 structures ioniques cubiques à 2 éléments validées "3D_ok"). Statique,
   aucun appel réseau : évite le CORS de COD et le bruit d'une légende à 50 entrées. */
const COD_ELEMENTS = {
  1010076:["Cu","Br"], 1010117:["Mn","Se"], 1010991:["Cu","Cl"], 1011199:["Hg","Se"],
  1011239:["Cu","I"], 1011368:["Hg","S"], 1011382:["Mn","S"], 9008829:["Ag","I"],
  9008843:["Cu","F"], 1000041:["Na","Cl"], 1000043:["Ca","F"], 1000044:["Ca","O"],
  1000053:["Mg","O"], 1010042:["Ag","F"], 1010045:["Na","Br"], 1010046:["K","Br"],
  1010064:["Li","O"], 1010326:["Li","Cl"], 1010393:["Mn","O"], 1010580:["Hg","F"],
  1010874:["Li","S"], 1010876:["Na","O"], 1010878:["K","O"], 1010978:["K","F"],
  1010990:["Li","F"], 1011003:["Cd","O"], 1011127:["K","Cl"], 1011141:["Na","F"],
  1011169:["Fe","O"], 1011363:["Li","Br"], 1011373:["Li","Se"], 1011374:["Na","S"],
  1011378:["Na","Se"], 1509151:["Ag","Br"], 1530196:["Pb","F"], 1533087:["Co","O"],
  1539418:["Pb","S"], 8104342:["Mg","S"], 9008597:["Ag","Cl"], 9008673:["Mg","Se"],
  9009006:["Cd","F"]
};
function buildLegend(id){
  const grid = document.getElementById('legendGrid');
  const titleEl = document.querySelector('#legendPanel h4');
  grid.innerHTML = '';
  const known = COD_ELEMENTS[parseInt(id, 10)];
  const list = known
    ? JMOL_COLORS.filter(([sym]) => known.includes(sym))
    : JMOL_COLORS;
  titleEl.textContent = known
    ? 'Éléments présents (COD ' + id + ')'
    : 'Couleur → élément (Jmol/CPK, id inconnu de la base — liste complète)';
  list.forEach(([sym, color]) => {
    const item = document.createElement('div');
    item.className = 'legendItem';
    item.innerHTML = '<span class="legendDot" style="background:' + color + '"></span>' + sym;
    grid.appendChild(item);
  });
}
document.getElementById('legendBtn').addEventListener('click', () => {
  const panel = document.getElementById('legendPanel');
  panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
});

/* Démarrage */
const startId = getCodIdFromUrl();
const startMode = new URLSearchParams(window.location.search).get('mode') || 'balls';
document.getElementById('codInput').value = startId;
document.getElementById('modeSelect').value = startMode;
loadCod(startId, startMode);
</script>
</body>
</html>
