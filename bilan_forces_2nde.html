<!DOCTYPE html>
<html lang="fr">
<head>

<title>Bilan des forces</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#fff8e1;font-family:"Comic Sans MS","Comic Neue","Chalkboard SE",cursive,sans-serif;user-select:none;-webkit-user-select:none}
  #wrap{position:relative;max-width:960px;margin:0 auto;padding:6px}

  #code{font-family:Consolas,"Courier New",monospace;font-size:20px;font-weight:bold;width:130px;padding:4px 8px;border:3px solid #111;border-radius:4px;background:#ffe14d;text-align:center}

<body>
<div id="wrap">
  <canvas id="cv" width="960" height="620"></canvas>
  <div id="bar">
    <button id="bdone" class="green">J'ai terminé</button>
    <span class="lbl">CODE :</span>
    <input id="code" readonly value="">
    <button id="bcopy" disabled>Copier</button>
    <button id="bjpg" disabled>Export JPG</button>
    <button id="breset" class="red">Recommencer</button>

    <select id="dbg" style="display:none;margin-left:auto;font-size:15px;padding:4px;border:3px solid #111;border-radius:4px"></select>
  </div>
</div>
<script>
"use strict";
/* ============================================================
   Bilan des forces - 2nde
   Parametres (XOR + base64url dans ?p=..., cle propre a cette anim) :
     s  : identifiant de la scene        (defaut "grue")
     n  : nombre de vecteurs en reserve  (defaut : nb de forces de la scene + 1)
   Parametres en clair (?s=..&n=..) prioritaires sur ?p=...
   Code : F-XXXXXX = hash6( scene + "#" + vecteurs poses
          "point:angle" tries, joints par "|" ), joints par "|"
          angle en degres (0 = droite, 90 = haut), multiple de 15
   ============================================================ */
const XKEY = "Bil@nF0rces-2nde";
function decodeP(p){
  try{
    p = p.replace(/-/g,"+").replace(/_/g,"/");
    while(p.length%4) p += "=";
    const bin = atob(p), b = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) b[i] = bin.charCodeAt(i) ^ XKEY.charCodeAt(i%XKEY.length);
    return JSON.parse(new TextDecoder().decode(b));
  }catch(e){ return {}; }
}
const Q = new URLSearchParams(location.search);
let PRM = Q.get("p") ? decodeP(Q.get("p")) : {};
for(const k of ["s","n"]) if(Q.get(k)!==null) PRM[k] = Q.get(k);
const SCENE_ID = String(PRM.s || "grue");

/* ---------- hash6 (identique a FJmoodl.py) ---------- */
function hash6(s){
  let h = 2166136261 >>> 0;
  for(const ch of s){ h ^= ch.codePointAt(0); h = Math.imul(h,16777619) >>> 0; }
  return h.toString(36).toUpperCase().padStart(6,"0").slice(0,6);
}

/* ---------- canvas ---------- */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const W = 960, H = 620, SCENE_H = 480, LVEC = 110;
let DPR = 1;
function resize(){
  DPR = Math.max(1, window.devicePixelRatio || 1);
  cv.width = W*DPR; cv.height = H*DPR;
}
resize(); window.addEventListener("resize", resize);

/* ---------- outils de dessin comics ---------- */
const INK = "#111";
function halftone(color, bg, step, r){
  const c = document.createElement("canvas"); c.width = c.height = step;
  const g = c.getContext("2d");
  if(bg){ g.fillStyle = bg; g.fillRect(0,0,step,step); }
  g.fillStyle = color;
  g.beginPath(); g.arc(step/2, step/2, r, 0, 7); g.fill();
  g.beginPath(); for(const [x,y] of [[0,0],[step,0],[0,step],[step,step]]){ g.moveTo(x,y); g.arc(x,y,r*0.55,0,7);} g.fill();
  return ctx.createPattern(c, "repeat");
}
function shape(pathFn, fill, lw=4){
  ctx.beginPath(); pathFn(); ctx.closePath();
  if(fill){ ctx.fillStyle = fill; ctx.fill(); }
  ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.lineJoin = "round"; ctx.stroke();
}
function rect(x,y,w,h,fill,lw=4){ shape(()=>ctx.rect(x,y,w,h), fill, lw); }
function burst(cx,cy,r1,r2,n,fill){
  shape(()=>{ for(let i=0;i<2*n;i++){ const a=i*Math.PI/n, r=i%2?r1:r2; const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a); i?ctx.lineTo(x,y):ctx.moveTo(x,y);} }, fill, 3);
}
function comicText(txt,x,y,size,fill,stroke="#111",align="center",rot=0){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  ctx.font = `${size}px Impact, "Arial Black", sans-serif`; ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.lineWidth = Math.max(3,size/7); ctx.strokeStyle = stroke; ctx.lineJoin="round"; ctx.strokeText(txt,0,0);
  ctx.fillStyle = fill; ctx.fillText(txt,0,0); ctx.restore();
}

function winOn(x,y,t){                     // fenetres qui s'allument/s'eteignent
  const h=((x*73856093)^(y*19349663))>>>0, base=(h%5)>1;
  if(h%7!==0) return base;
  return Math.floor((t+(h%13))/4)%2===0 ? base : !base;
}
function bird(x,y,s,t,ph){
  const f=Math.sin(t*9+ph)*6*s;
  ctx.lineWidth=3; ctx.strokeStyle=INK; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(x-14*s,y-f); ctx.quadraticCurveTo(x-6*s,y-4*s,x,y); ctx.quadraticCurveTo(x+6*s,y-4*s,x+14*s,y-f); ctx.stroke();
}
function scaled(cx,cy,k,fn){ ctx.save(); ctx.translate(cx,cy); ctx.scale(k,k); ctx.translate(-cx,-cy); fn(); ctx.restore(); }

function cloud(x,y,s,fill){ shape(()=>{ ctx.arc(x,y,22*s,Math.PI*.5,Math.PI*1.5); ctx.arc(x+30*s,y-14*s,26*s,Math.PI,0); ctx.arc(x+62*s,y,22*s,Math.PI*1.5,Math.PI*.5); }, fill||"#fff", 3); }
function driftClouds(t,list,sp){ for(const [x0,y0,s] of list){ const x=((x0+t*(sp||12)*s)%(W+200))-100; cloud(x,y0,s); } }
function sunAt(x,y,r,t){
  ctx.save(); ctx.globalAlpha=.22; ctx.fillStyle="#fff";
  for(let i=0;i<12;i++){ const a=i*Math.PI/6+t*0.08; ctx.beginPath(); ctx.moveTo(x,y); ctx.arc(x,y,r*4,a,a+0.12); ctx.fill(); }
  ctx.restore();
  ctx.fillStyle="#ffe14d"; ctx.beginPath(); ctx.arc(x,y,r+3*Math.sin(t*1.3),0,7); ctx.fill(); ctx.lineWidth=4; ctx.strokeStyle=INK; ctx.stroke();
}
function hills(y0,amp,fq,ph,fill){ shape(()=>{ ctx.moveTo(-10,SCENE_H+10); for(let x=-10;x<=W+10;x+=16) ctx.lineTo(x, y0+amp*Math.sin(x*fq+ph)); ctx.lineTo(W+10,SCENE_H+10); }, fill, 4); }
function pine(x,y,s,fill){ rect(x-5*s,y-12*s,10*s,12*s,"#6b3e1e",3); for(let k=0;k<3;k++) shape(()=>{ ctx.moveTo(x-30*s+k*6*s,y-12*s-k*20*s); ctx.lineTo(x,y-52*s-k*20*s); ctx.lineTo(x+30*s-k*6*s,y-12*s-k*20*s); }, fill||"#2d7a3a",3); }
function starsBg(t,n,ymax){ for(let i=0;i<n;i++){ const x=(i*197+31)%W, y=(i*83+17)%ymax, s=1.5+((i*7)%3), tw=0.5+0.5*Math.sin(t*3+i); ctx.fillStyle=`rgba(255,255,220,${0.3+0.7*tw})`; ctx.fillRect(x,y,s,s); } }
function snowFall(t,n){ ctx.fillStyle="#fff"; for(let i=0;i<n;i++){ const x=(((i*137)%W)+25*Math.sin(t*0.8+i)+W)%W, y=((i*71)+t*(25+i%25))%SCENE_H; ctx.beginPath(); ctx.arc(x,y,2+(i%3),0,7); ctx.fill(); } }
function rainFall(t,n){ ctx.strokeStyle="rgba(190,210,255,.55)"; ctx.lineWidth=2; for(let i=0;i<n;i++){ const x=(i*97)%W, y=((i*53)+t*520)%(SCENE_H+20)-20; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-6,y+18); ctx.stroke(); } }
function clockAt(x,y,r,t){
  shape(()=>ctx.arc(x,y,r,0,7),"#fff",4);
  ctx.lineWidth=2; ctx.strokeStyle=INK;
  for(let i=0;i<12;i++){ const a=i*Math.PI/6; ctx.beginPath(); ctx.moveTo(x+r*0.8*Math.cos(a),y+r*0.8*Math.sin(a)); ctx.lineTo(x+r*0.92*Math.cos(a),y+r*0.92*Math.sin(a)); ctx.stroke(); }
  const as=t*Math.PI/30-Math.PI/2, am=t*Math.PI/1800-Math.PI/3;
  ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+r*0.55*Math.cos(am),y+r*0.55*Math.sin(am)); ctx.stroke();
  ctx.lineWidth=2; ctx.strokeStyle="#e0322b"; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+r*0.8*Math.cos(as),y+r*0.8*Math.sin(as)); ctx.stroke();
}
function room(t,wallPat,floorY){
  floorY=floorY||420;
  ctx.fillStyle=wallPat; ctx.fillRect(0,0,W,floorY);
  rect(-5,floorY,W+10,SCENE_H-floorY+5,PAT.floor,4);
  ctx.lineWidth=2; ctx.strokeStyle=INK; for(let x=-40;x<W;x+=90){ ctx.beginPath(); ctx.moveTo(x,floorY); ctx.lineTo(x+40,SCENE_H); ctx.stroke(); }
  // fenetre avec nuage qui passe
  ctx.save(); ctx.beginPath(); ctx.rect(60,80,190,150); ctx.clip();
  ctx.fillStyle=PAT.day; ctx.fillRect(60,80,190,150); cloud(((t*15)%320)+20,150,0.8); ctx.restore();
  rect(60,80,190,150,null,6); ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(155,80); ctx.lineTo(155,230); ctx.moveTo(60,155); ctx.lineTo(250,155); ctx.stroke();
  clockAt(850,110,42,t);
}
function spaceBg(t){
  ctx.fillStyle=PAT.space; ctx.fillRect(0,0,W,SCENE_H);
  ctx.save(); ctx.globalAlpha=0.35;
  for(const [x,y,r,c] of [[150,380,140,"#b13cc4"],[820,90,120,"#2bb3d8"],[700,420,90,"#e0322b"]]){ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x+10*Math.sin(t*0.3+r),y,r,0,7); ctx.fill(); }
  ctx.restore();
  starsBg(t,110,SCENE_H);
  const k=(t%9)/1.6; if(k<1){ const x=900-k*500, y=60+k*90;
    const g=ctx.createLinearGradient(x,y,x+120,y-22); g.addColorStop(0,"rgba(255,255,255,0.95)"); g.addColorStop(1,"rgba(255,255,255,0)");
    ctx.strokeStyle=g; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+120,y-22); ctx.stroke(); }
}
function earthAt(x,y,r,t){
  ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.clip();
  ctx.fillStyle=PAT.sea; ctx.fillRect(x-r,y-r,2*r,2*r);
  const off=(t*8)%(4*r);
  for(const [dx,dy,rr] of [[0,-0.3,0.35],[0.9,0.2,0.3],[1.7,-0.1,0.4],[2.6,0.35,0.28],[3.3,-0.35,0.3]]){
    for(const sh of [0,4*r]){ const cx=x-2*r+dx*r+off-sh, cy=y+dy*r; shape(()=>{ ctx.ellipse(cx,cy,rr*r,rr*r*0.7,0.4,0,7); }, "#3fae4a", 3); }
  }
  ctx.fillStyle="rgba(255,255,255,0.8)"; for(let i=0;i<3;i++){ const cx=x-r+((off*1.4+i*r*0.9)%(2.4*r)), cy=y-r*0.5+i*r*0.45; ctx.beginPath(); ctx.ellipse(cx,cy,r*0.3,r*0.08,0,0,7); ctx.fill(); }
  ctx.restore();
  ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.lineWidth=5; ctx.strokeStyle=INK; ctx.stroke();
}
function orbitCircle(x,y,r){ ctx.save(); ctx.setLineDash([10,10]); ctx.lineWidth=2.5; ctx.strokeStyle="rgba(255,255,255,0.7)"; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.stroke(); ctx.restore(); }
function popBurst(x,y,txt,t,col,period,size){
  const ph=t%period; if(ph>2.5) return;
  const k=Math.min(1,ph*5)*(1+0.06*Math.sin(t*12));
  scaled(x,y,k,()=>{ burst(x,y,size*0.6,size,11,"#fff"); comicText(txt,x,y,size*0.45,col,"#111","center",-0.1); });
}
function springV(x,y1,y2,n,w){
  ctx.lineWidth=4; ctx.strokeStyle=INK; ctx.lineJoin="round"; ctx.beginPath(); ctx.moveTo(x,y1); ctx.lineTo(x,y1+8);
  const h=(y2-y1-16)/n; for(let i=0;i<n;i++) ctx.lineTo(x+(i%2?-w:w), y1+8+h*(i+0.5));
  ctx.lineTo(x,y2-8); ctx.lineTo(x,y2); ctx.stroke();
  ctx.lineWidth=1.5; ctx.strokeStyle="#bbb"; ctx.stroke();
}
function springH(x1,x2,y,n,w){
  ctx.lineWidth=4; ctx.strokeStyle=INK; ctx.lineJoin="round"; ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x1+8,y);
  const h=(x2-x1-16)/n; for(let i=0;i<n;i++) ctx.lineTo(x1+8+h*(i+0.5), y+(i%2?-w:w));
  ctx.lineTo(x2-8,y); ctx.lineTo(x2,y); ctx.stroke();
  ctx.lineWidth=1.5; ctx.strokeStyle="#bbb"; ctx.stroke();
}
function speedLines(x,y1,y2,len,dir){ ctx.lineWidth=3; ctx.strokeStyle=INK; ctx.lineCap="round"; for(let y=y1;y<=y2;y+=(y2-y1)/3){ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+dir*len,y); ctx.stroke(); } }

const IMG = {};
IMG.basket = new Image();
IMG.basket.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent("<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 800\" width=\"800\" height=\"800\"><defs> <filter id=\"shadow\" x=\"-10%\" y=\"-10%\" width=\"120%\" height=\"120%\"> <feDropShadow dx=\"0\" dy=\"12\" stdDeviation=\"0\" flood-color=\"#121212\" flood-opacity=\"1\" /> </filter> <filter id=\"ball-shadow\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"140%\"> <feDropShadow dx=\"-5\" dy=\"8\" stdDeviation=\"0\" flood-color=\"#121212\" /> </filter> </defs> <ellipse cx=\"320\" cy=\"740\" rx=\"140\" ry=\"18\" fill=\"#0d0a14\" /> <g filter=\"url(#shadow)\"> <g class=\"left-leg\"> <path d=\"M 230 715 L 275 725 C 285 727 285 715 270 705 L 245 685 Z\" fill=\"#d11a2a\" stroke=\"#121212\" stroke-width=\"7\" stroke-linejoin=\"round\" /> <path d=\"M 245 685 L 265 700 L 255 710\" fill=\"none\" stroke=\"#121212\" stroke-width=\"6\" /> <path d=\"M 235 690 L 220 620 L 260 520 L 290 530 L 255 625 L 250 690 Z\" fill=\"#ffb87a\" stroke=\"#121212\" stroke-width=\"7\" stroke-linejoin=\"round\" /> <path d=\"M 225 645 L 253 652\" stroke=\"#121212\" stroke-width=\"7\" /> </g> <g class=\"right-leg\"> <path d=\"M 335 720 L 395 725 C 410 725 410 710 390 695 L 360 675 Z\" fill=\"#ffffff\" stroke=\"#121212\" stroke-width=\"7\" stroke-linejoin=\"round\" /> <path d=\"M 335 720 L 350 690 L 375 675\" fill=\"#f64b4b\" stroke=\"#121212\" stroke-width=\"7\" stroke-linejoin=\"round\" /> <path d=\"M 375 723 L 395 725 L 390 715 Z\" fill=\"#121212\" /> <path d=\"M 350 680 L 340 595 L 315 525 L 355 520 L 385 595 L 375 685 Z\" fill=\"#ffd1a9\" stroke=\"#121212\" stroke-width=\"7\" stroke-linejoin=\"round\" /> <path d=\"M 342 615 L 382 615\" fill=\"none\" stroke=\"#121212\" stroke-width=\"7\" /> <path d=\"M 341 627 L 380 624\" fill=\"none\" stroke=\"#f64b4b\" stroke-width=\"5\" /> </g> <g class=\"torso\"> <path d=\"M 245 515 L 365 510 L 360 575 L 305 570 L 300 595 L 255 585 L 260 565 L 240 550 Z\" fill=\"#f64b4b\" stroke=\"#121212\" stroke-width=\"7\" stroke-linejoin=\"round\" /> <path d=\"M 245 525 C 290 530 320 528 363 520\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"6\" /> <path d=\"M 255 585 L 300 595\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"6\" stroke-linecap=\"round\" /> <path d=\"M 250 515 C 240 440 260 380 295 350 C 340 355 365 410 365 510 Z\" fill=\"#f64b4b\" stroke=\"#121212\" stroke-width=\"7\" stroke-linejoin=\"round\" /> <path d=\"M 295 350 C 285 380 280 440 285 513\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"5\" opacity=\"0.8\" /> <text x=\"325\" y=\"440\" font-family=\"'Impact', 'Arial Black', sans-serif\" font-size=\"55\" font-weight=\"bold\" fill=\"#ffffff\" stroke=\"#121212\" stroke-width=\"4\" transform=\"rotate(10 325 440)\" text-anchor=\"middle\">23</text> </g> <g class=\"left-arm\"> <path d=\"M 280 350 L 310 240 L 390 200 L 415 225 L 340 275 L 305 360 Z\" fill=\"#ffb87a\" stroke=\"#121212\" stroke-width=\"7\" stroke-linejoin=\"round\" /> <path d=\"M 390 200 L 420 175 C 425 170 435 180 425 190 L 405 210 Z\" fill=\"#ffb87a\" stroke=\"#121212\" stroke-width=\"7\" stroke-linejoin=\"round\" /> </g> <g class=\"head\"> <path d=\"M 295 360 C 290 320 320 320 325 345\" fill=\"#ffd1a9\" stroke=\"#121212\" stroke-width=\"7\" stroke-linecap=\"round\" /> <path d=\"M 300 320 C 290 270 320 240 350 255 C 365 262 375 255 380 270 C 385 280 395 285 385 295 C 375 300 375 310 360 315 C 345 320 315 325 300 320 Z\" fill=\"#ffd1a9\" stroke=\"#121212\" stroke-width=\"7\" stroke-linejoin=\"round\" /> <path d=\"M 305 280 C 285 250 290 210 330 215 C 345 220 350 240 345 255 Z\" fill=\"#121212\" stroke=\"#121212\" stroke-width=\"4\" stroke-linejoin=\"round\" /> <path d=\"M 315 245 C 300 230 310 215 325 225\" fill=\"none\" stroke=\"#f64b4b\" stroke-width=\"4\" stroke-linecap=\"round\" /> <circle cx=\"330\" cy=\"285\" r=\"10\" fill=\"#ffd1a9\" stroke=\"#121212\" stroke-width=\"6\" /> <path d=\"M 355 270 L 370 275\" stroke=\"#121212\" stroke-width=\"6\" stroke-linecap=\"round\" /> <path d=\"M 352 263 L 370 267\" stroke=\"#121212\" stroke-width=\"5\" stroke-linecap=\"round\" /> <path d=\"M 365 298 C 360 298 358 293 363 290\" fill=\"none\" stroke=\"#121212\" stroke-width=\"5\" stroke-linecap=\"round\" /> <path d=\"M 315 295 C 310 305 315 310 317 305 Z\" fill=\"#4be3f6\" stroke=\"#121212\" stroke-width=\"2\" /> </g> <g class=\"right-arm\"> <path d=\"M 340 355 C 350 310 370 240 405 185 L 445 210 C 415 260 395 330 370 365 Z\" fill=\"#ffd1a9\" stroke=\"#121212\" stroke-width=\"7\" stroke-linejoin=\"round\" /> <path d=\"M 405 185 L 485 175 L 490 210 L 435 218 Z\" fill=\"#ffd1a9\" stroke=\"#121212\" stroke-width=\"7\" stroke-linejoin=\"round\" /> <path d=\"M 485 175 C 500 175 515 185 510 200 C 505 215 485 235 475 230 C 470 220 480 205 480 205 L 465 208\" fill=\"#ffd1a9\" stroke=\"#121212\" stroke-width=\"7\" stroke-linejoin=\"round\" /> <path d=\"M 460 180 L 455 214\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"12\" stroke-linecap=\"square\" /> <path d=\"M 460 180 L 455 214\" fill=\"none\" stroke=\"#121212\" stroke-width=\"7\" stroke-linecap=\"square\" /> </g> </g> </svg>");
function makePatterns(){
  PAT.sun   = halftone("#ff9f1c", "#ffd23f", 12, 3.2);
  PAT.sky2  = halftone("#ff5e5b", "#ff9f1c", 12, 3.4);

const SCENES = {
  grue: {
    nf: 2,
    caption: "Une caisse est suspendue, IMMOBILE, au câble d'une grue.",
    points: [ {id:"A", x:450, y:180}, {id:"B", x:450, y:262}, {id:"C", x:450, y:338} ],

const SC = SCENES[SCENE_ID] || SCENES.grue;
const SCENE_KEY = SCENES[SCENE_ID] ? SCENE_ID : "grue";
const NVEC = Math.max(1, Math.min(8, parseInt(PRM.n ?? (SC.nf+1)) || (SC.nf+1)));   // defaut : nb de forces + 1 intrus

/* ---------- etat ---------- */
let vecs = [];     // {id, home:{x,y}, pt:null|pointId, ang}
function initVecs(){
  vecs = [];
  const gap = W/(NVEC+1);
  for(let i=0;i<NVEC;i++) vecs.push({id:i, home:{x:gap*(i+1)-LVEC/2, y:SCENE_H+85}, pt:null, ang:0});
}
initVecs();
let drag = null;
let done = false;   // {v, mode:'move'|'rot', x, y}

function ptById(id){ return SC.points.find(p=>p.id===id); }
function tailOf(v){
  if(drag && drag.v===v && drag.mode==="move") return {x:drag.x, y:drag.y};
  if(v.pt){ const p=ptById(v.pt); return {x:p.x,y:p.y}; }
  return {x:v.home.x, y:v.home.y};
}
function headOf(v){ const t=tailOf(v), a=v.ang*Math.PI/180; return {x:t.x+LVEC*Math.cos(a), y:t.y-LVEC*Math.sin(a)}; }

/* ---------- dessin des vecteurs ---------- */
function rnd(seed){ let x=Math.sin(seed*127.1+311.7)*43758.5453; return x-Math.floor(x); }
function penLine(ax,ay,bx,by,seed,amp){
  // trait "stylo" : legere ondulation stable (pas de scintillement)
  const n=14, dx=bx-ax, dy=by-ay, L=Math.hypot(dx,dy)||1, nx=-dy/L, ny=dx/L;
  const p1=rnd(seed)*6.28, p2=rnd(seed+1)*6.28, bow=(rnd(seed+2)-0.5)*amp*2.2;
  ctx.beginPath();
  for(let i=0;i<=n;i++){
    const u=i/n, env=Math.sin(Math.PI*u);
    const o = env*bow + amp*0.5*(Math.sin(u*9+p1)+0.6*Math.sin(u*17+p2));
    const x=ax+dx*u+nx*o, y=ay+dy*u+ny*o;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.stroke();
}
function drawPenArrow(T,Hh,seed,ink){
  const a=Math.atan2(Hh.y-T.y,Hh.x-T.x), hl=24, ha=0.42;
  const segs=[
    [T.x,T.y, Hh.x+Math.cos(a)*2, Hh.y+Math.sin(a)*2, seed, 1.6],
    [Hh.x,Hh.y, Hh.x-hl*Math.cos(a-ha-0.05*rnd(seed+5)), Hh.y-hl*Math.sin(a-ha-0.05*rnd(seed+5)), seed+10, 0.8],
    [Hh.x,Hh.y, Hh.x-(hl+3)*Math.cos(a+ha), Hh.y-(hl+3)*Math.sin(a+ha), seed+20, 0.8]
  ];
  ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.strokeStyle="rgba(255,255,255,0.92)"; ctx.lineWidth=10;   // halo blanc (lisible sur fond sombre)
  for(const g of segs) penLine(...g);
  ctx.strokeStyle=ink; ctx.lineWidth=4;
  for(const g of segs) penLine(...g);
  ctx.globalAlpha=0.35; ctx.lineWidth=1.6;                     // 2e passage de stylo
  for(const g of segs) penLine(g[0]+0.8,g[1]-0.6,g[2]+0.6,g[3]+0.7,g[4]+3,g[5]*1.3);
  ctx.globalAlpha=1;
}
function drawArrow(v, t){
  const T = tailOf(v), Hh = headOf(v);
  const active = drag && drag.v===v;
  drawPenArrow(T,Hh,v.id*7+1, active ? "#1d4fd8" : "#111");
  // point de depart (encre)
  ctx.beginPath(); ctx.arc(T.x,T.y,4.5,0,7); ctx.fillStyle=active?"#1d4fd8":"#111"; ctx.fill();
  // poignee de rotation discrete (pointillés)
  if(v.pt && !done){
    ctx.save(); ctx.setLineDash([3,4]); ctx.lineWidth=2; ctx.strokeStyle="rgba(255,255,255,0.8)";
    ctx.beginPath(); ctx.arc(Hh.x,Hh.y,14,0,7); ctx.stroke(); ctx.restore();
  }
}
function drawAura(p, t){
  const occ = vecs.some(v=>v.pt===p.id);
  if(done){                                   // termine : points vides masques
    if(!occ) return;
    ctx.beginPath(); ctx.arc(p.x,p.y,6,0,7); ctx.fillStyle="#fff"; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle=INK; ctx.stroke();
    comicText(p.id, p.x-26, p.y-22, 22, "#fff");
    return;
  }
  const pulse = 0.5+0.5*Math.sin(t*2.5 + p.x*0.01);
  const R = 14 + 5*pulse;
  const g = ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,R+8);
  g.addColorStop(0,`rgba(255,255,255,${occ?0.25:0.5})`); g.addColorStop(0.5,`rgba(120,230,255,${occ?0.15:0.3})`); g.addColorStop(1,"rgba(120,230,255,0)");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,R+8,0,7); ctx.fill();
  // 2 petites etincelles discretes qui apparaissent/disparaissent
  for(let i=0;i<2;i++){
    const a = t*1.2 + i*Math.PI, r = R+2;
    const s = 2.5*Math.max(0,Math.sin(t*2+i*1.6+p.y*0.02));
    if(s<0.3) continue;
    const x = p.x + r*Math.cos(a), y = p.y + r*Math.sin(a);
    ctx.save(); ctx.globalAlpha = (occ?0.25:0.55)*s/2.5;
    ctx.fillStyle="#fff";
    ctx.beginPath(); ctx.moveTo(x,y-s*1.6); ctx.lineTo(x+s*.4,y-s*.4); ctx.lineTo(x+s*1.6,y); ctx.lineTo(x+s*.4,y+s*.4);
    ctx.lineTo(x,y+s*1.6); ctx.lineTo(x-s*.4,y+s*.4); ctx.lineTo(x-s*1.6,y); ctx.lineTo(x-s*.4,y-s*.4); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(p.x,p.y,6,0,7); ctx.fillStyle="#fff"; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle=INK; ctx.stroke();
  comicText(p.id, p.x-26, p.y-22, 22, "#fff");
}

function drawFrame(t){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  // scene
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,SCENE_H); ctx.clip();
  SC.bg(t);
  ctx.fillStyle = "rgba(25,15,45,0.55)"; ctx.fillRect(0,0,W,SCENE_H);   // fond assombri
  ctx.save(); ctx.shadowColor = "rgba(255,255,255,0.9)"; ctx.shadowBlur = 22;
  SC.sys(t);                                                          // systeme mis en avant
  ctx.restore();
  ctx.restore();
  // cartouche
  ctx.font='bold 18px "Comic Sans MS", cursive';
  const cw = Math.min(W-30, ctx.measureText(SC.caption).width+30);
  rect(10,10,cw,38,"#ffe14d",4);
  ctx.fillStyle=INK; ctx.textAlign="left"; ctx.textBaseline="middle"; ctx.fillText(SC.caption,25,30);
  // cadre de case
  ctx.lineWidth=8; ctx.strokeStyle=INK; ctx.strokeRect(4,4,W-8,SCENE_H-4);
  // reserve
  ctx.fillStyle = PAT.res; ctx.fillRect(4,SCENE_H+8,W-8,H-SCENE_H-12);
  ctx.lineWidth=6; ctx.strokeRect(4,SCENE_H+8,W-8,H-SCENE_H-12);
  comicText("RÉSERVE", 20, SCENE_H+30, 24, "#2b6dd8", "#111", "left");
  ctx.font='14px "Comic Sans MS", cursive'; ctx.fillStyle=INK; ctx.textAlign="right";
  ctx.fillText("Glisse un vecteur sur un point qui scintille, puis tourne-le en tirant sa pointe. Pour l'enlever, ramène-le ici.", W-20, SCENE_H+30);
  // points
  for(const p of SC.points) drawAura(p,t);
  // vecteurs (celui en cours de deplacement en dernier)
  for(const v of vecs) if(!(drag&&drag.v===v)) drawArrow(v,t);
  if(drag) drawArrow(drag.v,t);
}
function loop(ms){ drawFrame(ms/1000); requestAnimationFrame(loop); }
makePatterns();
requestAnimationFrame(loop);

/* ---------- interactions ---------- */
function toLocal(e){
  const r = cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height};
}
function distSeg(p,a,b){
  const dx=b.x-a.x, dy=b.y-a.y, l2=dx*dx+dy*dy;
  let u = l2 ? ((p.x-a.x)*dx+(p.y-a.y)*dy)/l2 : 0; u=Math.max(0,Math.min(1,u));
  return Math.hypot(p.x-a.x-u*dx, p.y-a.y-u*dy);
}
function hit(p){
  for(let i=vecs.length-1;i>=0;i--){
    const v=vecs[i];
    if(v.pt && Math.hypot(p.x-headOf(v).x, p.y-headOf(v).y) < 20) return {v, mode:"rot"};
  }
  for(let i=vecs.length-1;i>=0;i--){
    const v=vecs[i];
    if(distSeg(p, tailOf(v), headOf(v)) < 16) return {v, mode:"move"};
  }
  return null;
}
let downPos=null, moved=false;
cv.addEventListener("pointerdown", e=>{
  if(done) return;
  const p = toLocal(e); downPos=p; moved=false;
  const h = hit(p);
  if(!h) return;
  cv.setPointerCapture(e.pointerId);
  drag = {v:h.v, mode:h.mode, x:p.x, y:p.y, ox:0, oy:0};
  if(h.mode==="move"){ const T=tailOf(h.v); drag.ox=T.x-p.x; drag.oy=T.y-p.y; drag.x=T.x; drag.y=T.y; }
});
cv.addEventListener("pointermove", e=>{
  const p = toLocal(e);
  if(done){ cv.style.cursor="default"; return; }
  if(!drag){ const h=hit(p); cv.style.cursor = h ? (h.mode==="rot"?"crosshair":"grab") : "default"; return; }
  if(downPos && Math.hypot(p.x-downPos.x,p.y-downPos.y)>4) moved=true;
  if(drag.mode==="move"){ drag.x=p.x+drag.ox; drag.y=p.y+drag.oy; }
  else{
    const T=tailOf(drag.v);
    let a = Math.atan2(-(p.y-T.y), p.x-T.x)*180/Math.PI;
    a = Math.round(a/15)*15; a = ((a%360)+360)%360;
    drag.v.ang = a;
  }
});
function endDrag(e){
  if(!drag) return;
  const v = drag.v;
  if(drag.mode==="move" && moved){
    let best=null, bd=40;
    for(const pt of SC.points){ const d=Math.hypot(drag.x-pt.x, drag.y-pt.y); if(d<bd){bd=d; best=pt;} }
    if(best){ v.pt=best.id; }
    else { v.pt=null; v.ang=0; }
  }
  drag=null;
  updateCode();
}
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);

/* ---------- code / fin / export ---------- */
const codeEl=document.getElementById("code"), msg=document.getElementById("msg");
const bDone=document.getElementById("bdone"), bCopy=document.getElementById("bcopy"), bJpg=document.getElementById("bjpg");
function currentCode(){
  const items = vecs.filter(v=>v.pt).map(v=>`${v.pt}:${v.ang}`).sort();
  return "F-"+hash6(SCENE_KEY+"#"+items.join("|"));
}
function updateCode(){
  codeEl.value = done ? currentCode() : "";
  bCopy.disabled = bJpg.disabled = !done;
  bDone.textContent = done ? "Modifier" : "J'ai terminé";
  bDone.className = done ? "" : "green";
  msg.textContent = "";
}
bDone.onclick = ()=>{ done = !done; drag=null; updateCode(); };
bCopy.onclick = async ()=>{
  codeEl.select();
  let ok=false;
  try{ await navigator.clipboard.writeText(codeEl.value); ok=true; }catch(e){ try{ ok=document.execCommand("copy"); }catch(e2){} }
  msg.textContent = ok ? "Code copié !" : "Sélectionne le code et fais Ctrl+C.";
};
bJpg.onclick = ()=>{
  drawFrame(performance.now()/1000);
  const c=document.createElement("canvas"); c.width=W*DPR; c.height=(SCENE_H+4)*DPR;
  const g=c.getContext("2d");
  g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height);
  g.drawImage(cv,0,0,c.width,c.height,0,0,c.width,c.height);
  // tampon du code en bas a droite
  g.scale(DPR,DPR);
  g.font='bold 20px Consolas, "Courier New", monospace';
  const txt=codeEl.value, tw=g.measureText(txt).width+24;
  g.fillStyle="#ffe14d"; g.fillRect(W-tw-16,SCENE_H-46,tw,34);
  g.lineWidth=3; g.strokeStyle="#111"; g.strokeRect(W-tw-16,SCENE_H-46,tw,34);
  g.fillStyle="#111"; g.textAlign="center"; g.textBaseline="middle"; g.fillText(txt,W-16-tw/2,SCENE_H-29);
  const a=document.createElement("a");
  a.href=c.toDataURL("image/jpeg",0.92); a.download="bilan_forces_"+SCENE_ID+".jpg";
  document.body.appendChild(a); a.click(); a.remove();
  msg.textContent="Image exportée.";
};
document.getElementById("breset").onclick = ()=>{ initVecs(); done=false; updateCode(); };
updateCode();

/* ---------- menu de test (uniquement en local, fichier ouvert directement) ---------- */
if(location.protocol==="file:"){
  const sel=document.getElementById("dbg"); sel.style.display="";
  for(const id of Object.keys(SCENES)){ const o=document.createElement("option"); o.value=id; o.textContent="Scène : "+id; if(SCENES[id]===SC) o.selected=true; sel.appendChild(o); }
  sel.onchange=()=>{ const q=new URLSearchParams(location.search); q.delete("p"); q.set("s",sel.value); location.search=q.toString(); };
}
</script>
