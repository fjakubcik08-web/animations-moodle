<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromatographie sur couche mince</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 500px; height: 580px;
    overflow: hidden;
    background: #d8d5cf;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  #canvas-wrap { flex: 1; }
  canvas { display: block; }
  #bar {
    height: 58px;
    background: #ccc9c2;
    border-top: 1px solid #b5b2ab;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    position: relative;
  }
  button {
    padding: 7px 22px;
    border: 1.5px solid #666;
    background: #f5f4f0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    text-align: center;
    transition: background 0.1s;
  }
  button:hover  { background: #edecea; }
  button:active { background: #e2e0db; transform: scale(0.98); }
  button:disabled { color: #aaa; border-color: #ccc; background: #f5f4f0;
                    cursor: default; transform: none; }
  #status {
    position: absolute;
    bottom: 3px; left: 0; right: 0;
    text-align: center;
    font-size: 10px;
    color: #888;
  }
</style>
</head>
<body>

<div id="canvas-wrap"><canvas id="c"></canvas></div>
<div id="bar">
  <button id="btnNew"   onclick="newPlate()">Nouvelle<br>plaque</button>
  <button id="btnStart" onclick="startElution()">Démarrer<br>l'élution</button>
  <div id="status"></div>
</div>

<script>
// ── Déchiffrement URL ─────────────────────────────────────────────────────
const _ANIM_KEY = [83,17,204,61,128,42,75,199,33,91,156,47,113,8,240,66];
function _animDecrypt(b64url) {
  let b64 = b64url.replace(/-/g,'+').replace(/_/g,'/');
  while (b64.length % 4) b64 += '=';
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const dec = bytes.map((b, i) => b ^ _ANIM_KEY[i % _ANIM_KEY.length]);
  return JSON.parse(new TextDecoder().decode(dec));
}
function getAnimParams() {
  const code = new URLSearchParams(location.search).get('param');
  return code ? _animDecrypt(code) : {};
}
const PARAMS = getAnimParams();

// ── Paramètres ────────────────────────────────────────────────────────────
const MODE  = PARAMS.mode ?? 'analyse';
const N     = Math.min(6, Math.max(MODE === 'rf' ? 1 : 2, +(PARAMS.n ?? (MODE === 'rf' ? 3 : 4))));
const H_CM  = Math.min(12, Math.max(6, +(PARAMS.h_cm ?? 9)));

const N_REF = N - 1;
const RF_REF  = [+(PARAMS.rf2??0.28),+(PARAMS.rf3??0.60),+(PARAMS.rf4??0.82),
                 +(PARAMS.rf5??0.45),+(PARAMS.rf6??0.70)].slice(0, N_REF);
const NOM_REF = [PARAMS.nom2??'E131',PARAMS.nom3??'E127',PARAMS.nom4??'E124',
                 PARAMS.nom5??'S5',  PARAMS.nom6??'S6'].slice(0, N_REF);
const COL_REF = [PARAMS.col2??'#5bc8ff',PARAMS.col3??'#ff4455',PARAMS.col4??'#ff88aa',
                 PARAMS.col5??'#66cc66',PARAMS.col6??'#ffaa44'].slice(0, N_REF);

const NOM_DEP1 = PARAMS.nom1 ?? '?';
const RF1      = +(PARAMS.rf1  ?? 0.50);
const COL1     = PARAMS.col1   ?? '#999999';

const MEL_STR = (PARAMS.mel ?? '2,3').toString();
const MEL_IDX = MEL_STR.split(',')
  .map(s => parseInt(s.trim()) - 2)
  .filter(i => i >= 0 && i < N_REF);

// ── Canvas ────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 500, H = 522;
canvas.width = W; canvas.height = H;

// ── Géométrie ─────────────────────────────────────────────────────────────

// Cuve en verre (plus large)
const JAR_X  = 50,  JAR_Y  = 46;
const JAR_W  = 340, JAR_H  = 398;
const JAR_BOT = JAR_Y + JAR_H;           // 444

// Couvercle
const LID_X = JAR_X - 16, LID_W = JAR_W + 32;
const LID_Y = JAR_Y - 38, LID_H = 40;

// Plaque CCM (plus large)
const PX = JAR_X + 50;                   // 100
const PW = JAR_W - 100;                  // 240
const PY = JAR_Y + 14;                   // 60
const PH = 330;
const PBOT = PY + PH;                    // 390

const PTOP = PY + 10;                    // 70
const DEPY = PBOT - 46;                  // 344
const MAX_TRAVEL = DEPY - PTOP;          // 274 px
const PX_PER_CM  = MAX_TRAVEL / H_CM;

// Solvant
const SOLV_SURFACE = PBOT + 8;           // 398

// Règle
const RX = JAR_X + JAR_W + 20;          // 410

// ── État ──────────────────────────────────────────────────────────────────
let frontY   = DEPY;
let animating = false, done = false, rafId = null;
let cursorY   = DEPY - Math.round(MAX_TRAVEL * 0.40);
let dragging  = false;

// ── Diffusion gaussienne ──────────────────────────────────────────────────
const R0 = 5.5, K_DIFF = 0.54;
function spotY(rf)     { return DEPY - (DEPY - frontY) * rf; }
function spotRadius(t) { return R0 + K_DIFF * Math.sqrt(Math.max(0, t)); }

function hexToRgb(hex) {
  const h = hex.replace('#','');
  if (h.length === 3)
    return [parseInt(h[0]+h[0],16), parseInt(h[1]+h[1],16), parseInt(h[2]+h[2],16)];
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}

function drawSpot(x, y, col) {
  const travel  = Math.max(0, DEPY - y);
  const rr      = spotRadius(travel);
  const alpha_c = Math.max(0.28, 0.88 - (travel / MAX_TRAVEL) * 0.50);
  const [r, g, b] = hexToRgb(col);
  const rx = rr * 1.10, ry = rr * 0.86;
  ctx.save();
  ctx.translate(x, y); ctx.scale(rx, ry);
  const grd = ctx.createRadialGradient(0,0,0, 0,0,1);
  grd.addColorStop(0,    `rgba(${r},${g},${b},${alpha_c.toFixed(3)})`);
  grd.addColorStop(0.38, `rgba(${r},${g},${b},${(alpha_c*0.60).toFixed(3)})`);
  grd.addColorStop(0.68, `rgba(${r},${g},${b},${(alpha_c*0.20).toFixed(3)})`);
  grd.addColorStop(0.88, `rgba(${r},${g},${b},${(alpha_c*0.06).toFixed(3)})`);
  grd.addColorStop(1,    `rgba(${r},${g},${b},0)`);
  ctx.beginPath(); ctx.arc(0,0,1,0,Math.PI*2);
  ctx.fillStyle = grd; ctx.fill();
  ctx.restore();
  const rc = Math.max(1.2, rr * 0.20);
  ctx.beginPath(); ctx.arc(x, y, rc, 0, Math.PI*2);
  ctx.fillStyle = `rgba(${r},${g},${b},${Math.min(0.95,alpha_c+0.08).toFixed(3)})`;
  ctx.fill();
}

function drawMelMarker(x) {
  if (frontY < DEPY - 3) return;
  const s = 5;
  ctx.beginPath();
  ctx.moveTo(x-s, DEPY-s); ctx.lineTo(x+s, DEPY+s);
  ctx.moveTo(x+s, DEPY-s); ctx.lineTo(x-s, DEPY+s);
  ctx.strokeStyle = 'rgba(60,60,60,0.35)'; ctx.lineWidth = 1.2; ctx.stroke();
}

// Label vertical (rotation 90°, lecture de bas en haut)
function drawLabelVertical(x, text, color, italic) {
  ctx.save();
  ctx.translate(x, DEPY + 4);
  ctx.rotate(Math.PI / 2);          // lecture de haut en bas (vers le bas de la plaque)
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.font = (italic ? 'bold italic ' : 'bold ') + '10px Arial';
  ctx.fillText(text, 0, 0);
  ctx.restore();
}

function depX(i) { return PX + PW * (i + 1) / (N + 1); }

// ── Rendu ─────────────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Fond
  ctx.fillStyle = '#d5d2cc';
  ctx.fillRect(0, 0, W, H);

  // Cuve : remplissage transparent
  ctx.fillStyle = 'rgba(195,215,230,0.22)';
  ctx.beginPath();
  ctx.roundRect(JAR_X, JAR_Y, JAR_W, JAR_H, [0, 0, 18, 18]);
  ctx.fill();

  // Solvant au fond
  const solvH = JAR_BOT - 7 - SOLV_SURFACE;
  ctx.fillStyle = 'rgba(145,192,112,0.55)';
  ctx.beginPath();
  ctx.roundRect(JAR_X+2, SOLV_SURFACE, JAR_W-4, solvH, [0,0,16,16]);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(JAR_X+4, SOLV_SURFACE);
  ctx.bezierCurveTo(JAR_X+JAR_W*0.3, SOLV_SURFACE-3,
                    JAR_X+JAR_W*0.7, SOLV_SURFACE+2,
                    JAR_X+JAR_W-4,   SOLV_SURFACE);
  ctx.strokeStyle='rgba(95,148,72,0.45)'; ctx.lineWidth=1; ctx.stroke();

  // Plaque : ombre
  ctx.fillStyle = 'rgba(0,0,0,0.07)';
  ctx.fillRect(PX+2, PY+2, PW, PH);

  // Plaque : fond
  ctx.fillStyle = '#f9f8f2';
  ctx.fillRect(PX, PY, PW, PH);

  // Zone éluant sur la plaque
  if (frontY < DEPY) {
    ctx.fillStyle = 'rgba(135,182,255,0.18)';
    ctx.fillRect(PX+1, frontY, PW-2, DEPY-frontY);
  }

  // Bordure plaque
  ctx.strokeStyle = '#b2b2a2'; ctx.lineWidth = 0.8;
  ctx.strokeRect(PX, PY, PW, PH);

  // Ligne de dépôt
  ctx.beginPath();
  ctx.moveTo(PX, DEPY); ctx.lineTo(PX+PW, DEPY);
  ctx.strokeStyle = '#c8c7b8'; ctx.lineWidth = 0.8; ctx.stroke();

  // ── Taches ────────────────────────────────────────────────────────────
  const xD1 = depX(0);

  if (MODE === 'rf') {
    drawSpot(xD1, spotY(RF1), COL1);
    if (frontY >= DEPY - 3) {
      ctx.beginPath(); ctx.rect(xD1-8, DEPY-9, 16, 16);
      ctx.strokeStyle='rgba(80,80,80,0.28)'; ctx.lineWidth=0.8;
      ctx.setLineDash([2,2]); ctx.stroke(); ctx.setLineDash([]);
    }
  } else {
    MEL_IDX.forEach(ri => drawSpot(xD1, spotY(RF_REF[ri]), COL_REF[ri]));
    drawMelMarker(xD1);
  }

  for (let i = 0; i < N_REF; i++) {
    drawSpot(depX(i+1), spotY(RF_REF[i]), COL_REF[i]);
  }

  // ── Front ─────────────────────────────────────────────────────────────
  if (frontY < DEPY) {
    ctx.beginPath();
    ctx.moveTo(PX, frontY); ctx.lineTo(PX+PW, frontY);
    ctx.strokeStyle = 'rgba(55,128,240,0.88)';
    ctx.lineWidth=1.5; ctx.setLineDash([5,3]); ctx.stroke(); ctx.setLineDash([]);
  }

  // ── Parois cuve (par-dessus le contenu) ───────────────────────────────
  ctx.strokeStyle = '#8898aa'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(JAR_X, JAR_Y, JAR_W, JAR_H, [0,0,18,18]);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.11)';
  ctx.beginPath();
  ctx.roundRect(JAR_X+5, JAR_Y+22, 14, JAR_H-50, 6);
  ctx.fill();

  // ── Couvercle ─────────────────────────────────────────────────────────
  ctx.fillStyle = 'rgba(175,185,200,0.75)';
  ctx.beginPath();
  ctx.roundRect(LID_X, LID_Y, LID_W, LID_H, [7,7,2,2]);
  ctx.fill();
  ctx.strokeStyle = '#7888aa'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath();
  ctx.roundRect(LID_X+8, LID_Y+7, LID_W-16, LID_H-14, [4,4,1,1]);
  ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.lineWidth=0.8; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.14)';
  ctx.beginPath();
  ctx.roundRect(LID_X+12, LID_Y+4, LID_W*0.38, 8, 3);
  ctx.fill();

  // ── Labels "dépôt" / "front" ──────────────────────────────────────────
  ctx.font='9px Arial'; ctx.textAlign='right';
  ctx.fillStyle='#aaa';
  ctx.fillText('dépôt', PX-5, DEPY+3);
  if (frontY < DEPY) {
    ctx.fillStyle='rgba(55,128,240,0.90)';
    ctx.fillText('front', PX-5, frontY+3);
  }

  // ── Noms des dépôts (verticaux) ───────────────────────────────────────
  drawLabelVertical(xD1, NOM_DEP1, '#444', true);
  for (let i = 0; i < N_REF; i++) {
    drawLabelVertical(depX(i+1), NOM_REF[i], '#777', false);
  }

  // ── Règle graduée ─────────────────────────────────────────────────────
  ctx.strokeStyle='#aaa'; ctx.lineWidth=0.8;
  ctx.beginPath(); ctx.moveTo(RX, DEPY); ctx.lineTo(RX, PTOP); ctx.stroke();
  for (let i=0; i<=H_CM; i++) {
    const ry = DEPY - i*PX_PER_CM;
    if (ry < PTOP-2) break;
    const tw = (i%2===0) ? 7 : 4;
    ctx.beginPath(); ctx.moveTo(RX,ry); ctx.lineTo(RX+tw,ry); ctx.stroke();
    if (i%2===0) {
      ctx.fillStyle='#aaa'; ctx.font='9px Arial'; ctx.textAlign='left';
      ctx.fillText(i+'', RX+10, ry+3);
    }
  }
  ctx.fillStyle='#aaa'; ctx.font='9px Arial'; ctx.textAlign='left';
  ctx.fillText('cm', RX+9, PTOP-4);

  // ── Curseur de mesure ─────────────────────────────────────────────────
  const cL = PX-28, cR = PX+PW+10;

  ctx.beginPath();
  ctx.moveTo(cL, cursorY); ctx.lineTo(cR, cursorY);
  ctx.strokeStyle='#e63946'; ctx.lineWidth=1.3;
  ctx.setLineDash([6,4]); ctx.stroke(); ctx.setLineDash([]);

  ctx.fillStyle='#e63946';
  ctx.beginPath(); ctx.roundRect(cL-22, cursorY-9, 20, 18, 3); ctx.fill();
  ctx.fillStyle='white'; ctx.font='bold 12px Arial'; ctx.textAlign='center';
  ctx.fillText('↕', cL-12, cursorY+5);

  if (cursorY <= DEPY) {
    const cm = ((DEPY-cursorY)/PX_PER_CM).toFixed(2);
    ctx.fillStyle='#e63946'; ctx.font='bold 11px Arial'; ctx.textAlign='left';
    ctx.fillText(cm+' cm', RX+22, cursorY+4);
  }

  // ── Label cuve ────────────────────────────────────────────────────────
  ctx.fillStyle='#aaa'; ctx.font='10px Arial'; ctx.textAlign='center';
  ctx.fillText('cuve à chromatographie', JAR_X+JAR_W/2, JAR_BOT+14);
}

// ── Animation ─────────────────────────────────────────────────────────────
const SPEED = 0.48;

function animate() {
  if (!animating) return;
  frontY -= SPEED;
  if (frontY <= PTOP) {
    frontY = PTOP; animating = false; done = true;
    document.getElementById('status').textContent =
      'Élution terminée — mesurez les hauteurs avec le curseur';
    document.getElementById('btnStart').innerHTML = 'Démarrer<br>l\'élution';
    document.getElementById('btnStart').disabled = true;
  }
  draw();
  if (animating) rafId = requestAnimationFrame(animate);
}

function startElution() {
  if (animating || done) return;
  animating = true;
  document.getElementById('status').textContent = 'Élution en cours…';
  document.getElementById('btnStart').innerHTML = 'En cours…';
  document.getElementById('btnStart').disabled = true;
  animate();
}

function newPlate() {
  cancelAnimationFrame(rafId);
  animating=false; done=false; frontY=DEPY;
  document.getElementById('status').textContent='';
  document.getElementById('btnStart').innerHTML='Démarrer<br>l\'élution';
  document.getElementById('btnStart').disabled=false;
  draw();
}

// ── Interactions curseur ───────────────────────────────────────────────────
canvas.addEventListener('mousedown', e => {
  const r=canvas.getBoundingClientRect();
  const my=(e.clientY-r.top)*(H/r.height);
  if(Math.abs(my-cursorY)<14) dragging=true;
});
canvas.addEventListener('mousemove', e => {
  const r=canvas.getBoundingClientRect();
  const my=(e.clientY-r.top)*(H/r.height);
  if(dragging){ cursorY=Math.max(PTOP,Math.min(DEPY,my)); draw(); }
  canvas.style.cursor=Math.abs(my-cursorY)<14?'ns-resize':'default';
});
canvas.addEventListener('mouseup',    ()=>{ dragging=false; });
canvas.addEventListener('mouseleave', ()=>{ dragging=false; });

canvas.addEventListener('touchstart', e=>{
  const r=canvas.getBoundingClientRect();
  const my=(e.touches[0].clientY-r.top)*(H/r.height);
  if(Math.abs(my-cursorY)<20){ dragging=true; e.preventDefault(); }
},{ passive:false });
canvas.addEventListener('touchmove', e=>{
  if(!dragging) return; e.preventDefault();
  const r=canvas.getBoundingClientRect();
  const my=(e.touches[0].clientY-r.top)*(H/r.height);
  cursorY=Math.max(PTOP,Math.min(DEPY,my)); draw();
},{ passive:false });
canvas.addEventListener('touchend', ()=>{ dragging=false; });

draw();
</script>
</body>
</html>
