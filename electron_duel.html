<style>

  font-family:"Courier New",Courier,monospace;font-weight:bold;text-align:center;letter-spacing:.12em;user-select:text;-webkit-user-select:text;outline:none}

  font-family:"Courier New",Courier,monospace;font-weight:bold}

.comic .lines{position:absolute;inset:0;opacity:0;animation:lnFlash .45s ease-out forwards}

.comic .bf{background:radial-gradient(circle,rgba(0,0,0,.28) 22%,transparent 24%) 0 0/calc(7px * var(--sc)) calc(7px * var(--sc)),var(--c1);
  animation:burst 1.25s cubic-bezier(.2,1.9,.4,1) .03s forwards}
.comic .in{position:absolute;left:50%;top:50%;width:calc(var(--bw) * .62 * var(--sc));height:calc(var(--bh) * .62 * var(--sc));transform:translate(-50%,-50%) scale(0);
  background:var(--c3);animation:burst 1.25s cubic-bezier(.2,1.9,.4,1) .06s forwards}

  color:var(--c2);-webkit-text-stroke:calc(2px * var(--sc)) #000;
  text-shadow:calc(2px * var(--sc)) calc(2px * var(--sc)) 0 #000,calc(4px * var(--sc)) calc(4px * var(--sc)) 0 #000,calc(6px * var(--sc)) calc(6px * var(--sc)) 0 var(--c4);
  transform:translate(-50%,-50%) rotate(var(--r)) scale(0);animation:word 1.25s cubic-bezier(.3,2,.5,1) .08s forwards}

  transform:translate(-50%,-50%);animation:fly .8s ease-out forwards}

  75%{transform:translate(-50%,-50%) scale(1.03) rotate(2deg);opacity:1}100%{transform:translate(-50%,-50%) scale(1.6) rotate(12deg);opacity:0}}

  45%{opacity:1;transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}60%,75%{opacity:1;transform:translate(-50%,-50%) rotate(calc(var(--r) + 4deg)) scale(1.08)}
  100%{transform:translate(-50%,-120%) rotate(var(--r)) scale(.6);opacity:0}}

#wrap.cshake{animation:cShake .3s linear}

  animation:btnFlow 2.5s linear infinite,btnPulse 1s ease-in-out infinite;text-shadow:0 2px 0 #000,0 0 6px #000}

@keyframes btnFlow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes btnPulse{0%,100%{box-shadow:0 0 6px 2px #ff00c8,0 0 0 0 rgba(255,255,255,.7)}50%{box-shadow:0 0 22px 8px #00e5ff,0 0 0 6px rgba(255,255,255,0)}}

#scanBeam.go{display:block}

  background:linear-gradient(90deg,transparent,rgba(0,255,200,.15),rgba(180,255,255,.9),rgba(0,255,200,.15),transparent);
  box-shadow:0 0 40px 10px rgba(0,255,220,.5);animation:sweep .7s ease-in-out forwards}

  linear-gradient(35deg,transparent 46%,rgba(255,0,60,.55) 47% 53%,transparent 54%),linear-gradient(-35deg,transparent 46%,rgba(255,0,60,.55) 47% 53%,transparent 54%);

  transform-origin:50% 100%;margin-bottom:calc(4px * var(--sc,1))}

#hint i:nth-of-type(2){right:0;top:0;--dx:40px;--dy:-30px;--c:#ffe600;animation-delay:.15s}
#hint i:nth-of-type(3){left:0;bottom:0;--dx:-40px;--dy:30px;--c:#00ff9d;animation-delay:.3s}
#hint i:nth-of-type(4){right:0;bottom:0;--dx:40px;--dy:30px;--c:#00c8ff;animation-delay:.45s}
#hint i:nth-of-type(5){left:50%;top:0;--dx:0px;--dy:-45px;--c:#b400ff;animation-delay:.6s}

@keyframes spin{to{--a:360deg}}
@keyframes hintIn{0%{transform:scale(3) rotate(-20deg);opacity:0;filter:brightness(4)}60%{opacity:1}100%{transform:scale(1) rotate(0);filter:brightness(1)}}

</style>

<button id="hintBtn" type="button"><span class="t">SCANNER</span><span class="s">1 SEULE FOIS</span></button>

<script>
(() => {
'use strict';
/* ================= CONSTANTES ================= */
const W = 480, H = 640, TAU = Math.PI * 2;
const FC = '"Comic Sans MS","Comic Neue","Chalkboard SE","Comic Sans",cursive';
const FA = '"Courier New",Courier,monospace';
const KEY = 'Bayle-Duel-2026';
const ALPHA = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const codebox = document.getElementById('codebox'), codeIn = document.getElementById('codeIn'), copyBtn = document.getElementById('copyBtn');

/* ================= OUTILS ================= */
const rand = Math.random;
function hash(n) { const s = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function ease(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }

/* ================= PARAMÈTRES URL ================= */
function decodeP(str) {
  try {
    let b = String(str).replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    const bin = atob(b), k = new TextEncoder().encode(KEY), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i) ^ k[i % k.length];
    const o = JSON.parse(new TextDecoder().decode(u));
    return (o && typeof o === 'object') ? o : {};
  } catch (e) { return {}; }
}
const Q = new URLSearchParams(location.search);
const P = Q.get('p') ? decodeP(Q.get('p')) : {};
['lvl', 'nc', 'fx', 'obj', 'vies', 'zs', 't', 's', 'ent'].forEach(k => { if (Q.has(k)) P[k] = Q.get(k); });
function num(v, d, mn, mx) { const x = parseFloat(v); return isFinite(x) ? clamp(x, mn, mx) : d; }
const CFG = {
  lvl: Math.round(num(P.lvl, 1, 1, 3)),
  nc: Math.round(num(P.nc, 3, 1, 3)),
  fx: num(P.fx, 2, 1, 5),
  obj: num(P.obj, 0.85, 0.1, 1),
  vies: Math.round(num(P.vies, 3, 1, 9)),
  v: num(P.v, 1, 0.3, 3),
  zs: num(P.zs, 1, 0, 1) >= 0.5 ? 1 : 0,
  t: num(P.t, 90, 20, 600),
  s: Math.round(num(P.s, 0, 0, 65535))
};
const LEVELS = [];
for (let n = CFG.lvl; n <= 3 && LEVELS.length < CFG.nc; n++) LEVELS.push(n);

/* ================= CODE DE FIN (FNV-1a) ================= */
function fnv1a(str) {
  const b = new TextEncoder().encode(str); let h = 0x811c9dc5;
  for (let i = 0; i < b.length; i++) { h ^= b[i]; h = Math.imul(h, 0x01000193) >>> 0; }
  return h >>> 0;
}
function codeFor(seed, note) {
  const s = 'ELECTRONDUEL|' + seed + '|' + note;
  let h = fnv1a(s); const h2 = fnv1a(s + '#'); let c = '';
  for (let i = 0; i < 6; i++) { c += ALPHA[h % 32]; h = Math.floor(h / 32); }
  c += ALPHA[h2 % 32];
  return c.slice(0, 4) + '-' + c.slice(4);
}

/* ================= ENTITÉS : ATOMES ET IONS ================= */
const ELS = ['H', 'He', 'Li', 'Be', 'B', 'C', 'N', 'O', 'F', 'Ne', 'Na', 'Mg', 'Al', 'Si', 'P', 'S', 'Cl', 'Ar', 'K', 'Ca'];
const SUB = [['1s', 2, 1], ['2s', 2, 2], ['2p', 6, 2], ['3s', 2, 3], ['3p', 6, 3], ['4s', 2, 4]];
function fill(e) { const o = []; let r = e; for (const [nm, cap, sh] of SUB) { const k = Math.min(cap, r); o.push(k); r -= k; } return o; } // [1s,2s,2p,3s,3p]
function mkEnt(z, q) {
  const e = z - q, c = fill(e), outer = e === 0 ? 0 : (c[3] + c[4] > 0 ? 3 : c[1] + c[2] > 0 ? 2 : 1);
  const val = outer === 1 ? c[0] : outer === 2 ? c[1] + c[2] : outer === 3 ? c[3] + c[4] : 0;
  return { z, q, sym: ELS[z - 1], e, cfg: c.join(','), outer, val };
}
const ATOMS = []; for (let z = 1; z <= 20; z++) ATOMS.push(mkEnt(z, 0));
const IONS = [[1, 1], [3, 1], [11, 1], [19, 1], [4, 2], [12, 2], [20, 2], [13, 3], [9, -1], [17, -1], [8, -2], [16, -2], [7, -3]].map(([z, q]) => mkEnt(z, q));
const ALLE = ATOMS.concat(IONS);

/* ================= AFFICHAGE / ÉCHELLE ================= */
let SC = 1;
const CODE_L = { x: 70, y: 438, w: 340, h: 46 };
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const s = Math.max(0.1, Math.min((window.innerWidth || W) / W, (window.innerHeight || H) / H));
  SC = s;
  cv.style.width = Math.round(W * s) + 'px'; cv.style.height = Math.round(H * s) + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  placeCode();
}
function placeCode() {
  const r = cv.getBoundingClientRect();
  codebox.style.left = (r.left + CODE_L.x * SC) + 'px';
  codebox.style.top = (r.top + CODE_L.y * SC) + 'px';
  codebox.style.width = (CODE_L.w * SC) + 'px';
  codebox.style.height = (CODE_L.h * SC) + 'px';
  codeIn.style.fontSize = Math.max(10, 24 * SC) + 'px';
  copyBtn.style.fontSize = Math.max(9, 16 * SC) + 'px';
}
window.addEventListener('resize', resize);

/* ================= DESSIN : AIDES ================= */
function txt(s, x, y, o = {}) {
  const size = o.size || 16;
  ctx.font = (o.bold === false ? '' : 'bold ') + size + 'px ' + (o.arcade ? FA : FC);
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  if (o.ol) { ctx.lineJoin = 'round'; ctx.lineWidth = o.ol; ctx.strokeStyle = o.olc || '#000'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = o.c || '#fff'; ctx.fillText(s, x, y);
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
function wq() { return Math.floor(T * 8); }
function wcirc(x, y, r, seed, amp = 1.3) {
  const q = wq(), n = 24; ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU, rr = r + (hash(seed * 131 + q * 17 + i * 7) * 2 - 1) * amp;
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}
function wrect(x, y, w, h, seed, amp = 1.4) {
  const q = wq(), pts = [], step = 24;
  const edge = (x1, y1, x2, y2, k) => { const L = Math.hypot(x2 - x1, y2 - y1), n = Math.max(1, Math.round(L / step));
    for (let i = 0; i < n; i++) { const t = i / n; pts.push([x1 + (x2 - x1) * t + (hash(seed + q * 31 + k * 97 + i) - 0.5) * 2 * amp, y1 + (y2 - y1) * t + (hash(seed + q * 53 + k * 89 + i * 3) - 0.5) * 2 * amp]); } };
  edge(x, y, x + w, y, 1); edge(x + w, y, x + w, y + h, 2); edge(x + w, y + h, x, y + h, 3); edge(x, y + h, x, y, 4);
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
}
function blink(f = 2) { return Math.floor(T * f * 2) % 2 === 0; }

/* ================= SON : désactivé ================= */
function audioInit() {}
function beep() {}
function noise() {}
const SFX = new Proxy({}, { get: () => () => {} });

/* ================= FONDS ================= */
function makeBg(n) {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'), r = mulberry32(100 + n);
  g.fillStyle = '#03020a'; g.fillRect(0, 0, W, H);
  const hues = n === 1 ? [285, 320, 210, 180] : n === 2 ? [5, 20, 340, 30] : [265, 290, 230, 310];
  for (let i = 0; i < 16; i++) {
    const x = r() * W, y = r() * H, rad = 70 + r() * 190, h = hues[Math.floor(r() * 4)];
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, `hsla(${h},90%,${n === 3 ? 35 : 50}%,${n === 3 ? 0.16 : 0.2})`); gr.addColorStop(1, `hsla(${h},90%,40%,0)`);
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  }
  for (let i = 0; i < 140; i++) { g.fillStyle = `rgba(255,255,255,${0.15 + r() * 0.5})`; g.fillRect(r() * W, r() * H, r() < 0.9 ? 1 : 2, r() < 0.9 ? 1 : 2); }
  g.lineJoin = 'round';
  if (n === 1) { // planète à anneau
    const px = 372, py = 300, pr = 40;
    g.save(); g.translate(px, py); g.rotate(-0.35);
    g.strokeStyle = 'rgba(255,220,160,0.75)'; g.lineWidth = 7; g.beginPath(); g.ellipse(0, 0, pr * 1.9, pr * 0.5, 0, Math.PI, TAU); g.stroke();
    g.restore();
    const gr = g.createRadialGradient(px - 14, py - 14, 4, px, py, pr);
    gr.addColorStop(0, '#ffd59a'); gr.addColorStop(0.6, '#e8843a'); gr.addColorStop(1, '#7a2f1a');
    g.fillStyle = gr; g.beginPath(); g.arc(px, py, pr, 0, TAU); g.fill(); g.strokeStyle = '#1a0d14'; g.lineWidth = 2.5; g.stroke();
    g.strokeStyle = 'rgba(120,50,20,0.5)'; g.lineWidth = 4; g.beginPath(); g.arc(px, py + 60, 72, -2.2, -0.95); g.stroke();
    g.save(); g.translate(px, py); g.rotate(-0.35);
    g.strokeStyle = 'rgba(255,230,180,0.9)'; g.lineWidth = 7; g.beginPath(); g.ellipse(0, 0, pr * 1.9, pr * 0.5, 0, 0, Math.PI); g.stroke();
    g.strokeStyle = '#1a0d14'; g.lineWidth = 1.5; g.beginPath(); g.ellipse(0, 0, pr * 1.9 + 4, pr * 0.5 + 4, 0, 0, Math.PI); g.stroke();
    g.restore();
  } else if (n === 2) { // soleil rouge
    const sx = 92, sy = 240, sr = 62;
    let gr = g.createRadialGradient(sx, sy, sr * 0.8, sx, sy, sr * 3.4);
    gr.addColorStop(0, 'rgba(255,90,40,0.45)'); gr.addColorStop(1, 'rgba(255,40,20,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
