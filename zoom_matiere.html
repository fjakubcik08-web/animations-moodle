<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoom dans la matière</title>
<style>
  :root{--ink:#14161c;--blue:#1565c0;--red:#e53935;--yellow:#ffd54f;--light:#eef1f6;}
  *{box-sizing:border-box;}
  body{margin:0;background:#07090d;color:var(--light);font-family:"Trebuchet MS","Segoe UI",sans-serif;
    background-image:radial-gradient(rgba(66,165,245,.16) 1.2px,transparent 1.3px);background-size:10px 10px;}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);}
  #page{max-width:960px;margin:0 auto;padding:14px 16px 20px;}
  h1{margin:0 0 14px;font-family:Impact,"Arial Black",sans-serif;font-weight:normal;letter-spacing:3px;font-size:30px;
    color:#fff;background:var(--blue);display:inline-block;padding:4px 18px;border:3px solid var(--light);
    box-shadow:5px 5px 0 var(--yellow);transform:skew(-8deg);text-shadow:3px 3px 0 var(--ink);}
  .panel{background:#11151d;border:3px solid var(--light);box-shadow:6px 6px 0 var(--blue);padding:12px 14px;position:relative;}
  .ptitle{position:absolute;top:-15px;left:14px;z-index:6;background:var(--yellow);border:3px solid var(--ink);color:var(--ink);
    font-family:Impact,sans-serif;letter-spacing:1px;padding:1px 10px;font-size:15px;transform:rotate(-2deg);}
  #samples{display:flex;gap:16px;justify-content:center;padding-top:18px;flex-wrap:wrap;}
  .sample{flex:1;min-width:140px;max-width:190px;display:flex;align-items:center;gap:12px;border:3px solid var(--light);
    padding:8px 12px;cursor:pointer;background:#1a202b;transition:transform .15s,box-shadow .15s;user-select:none;}
  .sample:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--yellow);}
  .sample.on{background:var(--yellow);color:var(--ink);box-shadow:5px 5px 0 var(--blue);transform:translate(-3px,-3px);}
  .sample b{font-family:Impact,sans-serif;font-weight:normal;font-size:26px;letter-spacing:1px;}
  #viewPanel{margin-top:30px;padding-top:24px;background:radial-gradient(ellipse at 30% 20%,#f5f8fa 0%,#dde5eb 70%,#c9d4dc 100%);color:var(--ink);}
  #wrap{position:relative;height:440px;border:3px solid var(--ink);background:#000;overflow:hidden;}
  #cv{display:block;width:100%;height:100%;touch-action:none;}
  #scaleBar{position:absolute;left:14px;bottom:14px;color:#fff;font-family:"Courier New",monospace;font-weight:bold;font-size:15px;
    text-shadow:1px 1px 0 #000;}
  #scaleBar .bar{height:8px;background:#fff;border:2px solid #000;margin-bottom:4px;}
  #fov{position:absolute;right:12px;top:10px;background:rgba(0,0,0,.65);color:#ffd54f;font-family:"Courier New",monospace;
    font-weight:bold;font-size:15px;padding:4px 10px;border:2px solid #ffd54f;}
  #zone{position:absolute;left:12px;top:10px;background:rgba(0,0,0,.65);color:#fff;font-family:Impact,sans-serif;letter-spacing:1px;
    font-size:15px;padding:4px 10px;border:2px solid #fff;}
  .ctrl{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;}
  .ctrl label{font-family:Impact,sans-serif;letter-spacing:1px;}
  input[type=range]{flex:1;min-width:220px;accent-color:#1565c0;height:28px;}
  .btn{font-family:Impact,sans-serif;font-size:16px;letter-spacing:1px;color:#fff;background:var(--red);border:3px solid var(--ink);
    box-shadow:3px 3px 0 var(--yellow);padding:5px 14px;cursor:pointer;transform:skew(-8deg);white-space:nowrap;touch-action:manipulation;}
  .btn.alt{background:#37474f;} .btn.on{background:#2e7d32;}
  #measOut{font-family:"Courier New",monospace;font-weight:bold;font-size:17px;background:#000;color:#69f0ae;border:3px solid var(--ink);
    padding:5px 12px;min-width:200px;text-align:center;}
</style>
</head>
<body>
<div id="page">
  <h1>ZOOM DANS LA MATIÈRE</h1>

  <div class="panel">
    <span class="ptitle">ÉCHANTILLONS</span>
    <div id="samples"></div>
  </div>

  <div class="panel" id="viewPanel">
    <span class="ptitle">MICROSCOPE À ZOOM</span>
    <div id="wrap">
      <canvas id="cv"></canvas>
      <div id="zone">VUE</div>
      <div id="fov"></div>
      <div id="scaleBar"><div class="bar" id="bar"></div><span id="barTxt"></span></div>
    </div>
    <div class="ctrl">
      <label>ZOOM</label>
      <button class="btn alt" id="zOut" aria-label="dézoomer">−</button>
      <input type="range" id="zoom" min="1.5" max="9.5" step="0.01" value="1.6">
      <button class="btn alt" id="zIn" aria-label="zoomer">+</button>
    </div>
    <div class="ctrl">
      <button class="btn" id="measBtn">📏 MESURER</button>
      <button class="btn" id="cellBtn">▦ MAILLE</button>
      <button class="btn alt" id="rotL" aria-label="tourner la maille à gauche">⟲</button>
      <button class="btn alt" id="rotR" aria-label="tourner la maille à droite">⟳</button>
      <span id="measOut">glisser sur l'image</span>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   PARAMETRES  (?p= JSON -> XOR cle "PBayle-ZoomMatiere#2" -> base64url)
   { x:[{t:"mono"|"poly"|"amorphe", n:"KX", s:graine}, ...], mes:0|1, maille:0|1, zone:0|1 }
   Parametres en clair (?mes=0&maille=1&zone=0) prioritaires sur ?p=.
   ===================================================================== */
const KEY = "PBayle-ZoomMatiere#2";
const DEFAULT = {x:[{t:'mono',n:'KX',s:1},{t:'poly',n:'BT',s:2},{t:'amorphe',n:'RW',s:3}], mes:1, maille:1, zone:1};
function decodeParams(code){
  try{
    let b64 = code.replace(/-/g,'+').replace(/_/g,'/'); while(b64.length % 4) b64 += '=';
    const raw = atob(b64), k = new TextEncoder().encode(KEY), bytes = new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) bytes[i] = raw.charCodeAt(i) ^ k[i % k.length];
    return JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){ return null; }
}
const Q = new URLSearchParams(location.search);
const CFG = Object.assign({}, DEFAULT, (Q.get('p') && decodeParams(Q.get('p'))) || {});
['mes','maille','zone'].forEach(k => { if(Q.has(k)) CFG[k] = +Q.get(k); });
if(!Array.isArray(CFG.x) || !CFG.x.length) CFG.x = DEFAULT.x;
const SAMPLES = CFG.x.map((c,i) => ({name: String(c.n || ('X'+(i+1))).slice(0,4), type: c.t, seed: (+c.s || i+1)}));

const A = 5.64e-10;                                       // côté de la maille (m) ; entités espacées de A/2
const SIZE = {mono:1.2e-3, poly:8e-3, amorphe:1.5e-3};    // taille de l'échantillon (m)
const LG = 8e-4;                                          // taille d'un grain du polycristal (m)
let cur = 0, measOn = false, meas = null, cellOn = false, cell = {x:0, y:0, th:0}, atomsDrawn = [];
const $ = id => document.getElementById(id);
if(!CFG.mes) $('measBtn').style.display = 'none';
if(!CFG.maille) ['cellBtn','rotL','rotR'].forEach(id => $(id).style.display = 'none');
if(!CFG.mes && !CFG.maille) $('measOut').style.display = 'none';
if(!CFG.zone) $('zone').style.display = 'none';

const gem = c => `<svg width="40" height="40" viewBox="0 0 44 44"><polygon points="22,3 40,15 34,40 10,40 4,15" fill="${c}" stroke="#14161c" stroke-width="3"/><polygon points="22,3 30,15 22,40 14,15" fill="rgba(255,255,255,.35)"/></svg>`;
SAMPLES.forEach((S,k) => { const d = document.createElement('div'); d.className = 'sample'+(k?'':' on');
  d.innerHTML = gem('#e0f7fa') + `<b>${S.name}</b>`;
  d.onclick = () => { cur = k; document.querySelectorAll('.sample').forEach((x,i)=>x.classList.toggle('on',i===k)); meas = null; cell = {x:0,y:0,th:0}; buildSeeds(); draw(); };
  $('samples').appendChild(d); });

const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function resize(){ W = cv.width = cv.clientWidth; H = cv.height = cv.clientHeight; draw(); }
function hash(i,j,s){ let h = (i*374761393 + j*668265263 + s*982451653) | 0; h = (h ^ (h >>> 13)) * 1274126177; h ^= h >>> 16; return (h >>> 0) / 4294967296; }
const SUP = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const pow10 = e => '10' + String(e).split('').map(c=>SUP[c]).join('');
function sci(v){ let e = Math.floor(Math.log10(v)), m = v/Math.pow(10,e); if(+m.toFixed(1)>=10){m/=10;e++;}
  return m.toFixed(1).replace('.',',')+'×'+pow10(e)+' m'; }

/* grains du polycristal : un joint de grain passe par le centre de la vue (graine propre à l'échantillon) */
let SEEDS = [];
function buildSeeds(){
  const g = SAMPLES[cur].seed * 101, th2 = .35 + hash(g,1,1)*.5;
  SEEDS = [{x:-LG*.5, y:0, th:hash(g,2,2)*.2, t:.4}, {x:LG*.5, y:0, th:th2, t:.75}];
  for(let i=-7;i<=7;i++) for(let j=-7;j<=7;j++){ if(j===0 && (i===0||i===-1)) continue;
    SEEDS.push({x:(i+.5+(hash(i+g,j,7)-.5)*.7)*LG, y:(j+(hash(i+g,j,9)-.5)*.7)*LG, th:hash(i+g,j,3)*Math.PI/2, t:hash(i+g,j,5)}); }
}
function grainAt(x,y){ let b = SEEDS[0], bd = 1e99; for(const s of SEEDS){ const d = (s.x-x)**2+(s.y-y)**2; if(d<bd){bd=d;b=s;} } return b; }

function draw(){
  if(!W) return;
  const z = +$('zoom').value, F = Math.pow(10,-z), s = W / F;
  const type = SAMPLES[cur].type, G = SIZE[type];
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  const toPx = (x,y) => [W/2 + x*s, H/2 - y*s];
  const gpx = G*s, inside = gpx > W*1.2;
  function mosaic(){
    const step = Math.max(2, Math.round(W/220));
    for(let px=0; px<W; px+=step) for(let py=0; py<H; py+=step){
      const g = grainAt((px-W/2)/s, (H/2-py)/s), l = 62 + g.t*26;
      ctx.fillStyle = `hsl(210,8%,${l}%)`; ctx.fillRect(px,py,step,step);
    }
  }

  /* 1) l'échantillon entier */
  if(gpx < W*2.2){
    ctx.save(); ctx.translate(W/2, H/2); const r = gpx/2;
    if(type === 'mono'){
      ctx.fillStyle = '#e8f6ff'; ctx.strokeStyle = '#90caf9'; ctx.lineWidth = Math.max(1, r*.02);
      ctx.beginPath(); ctx.moveTo(-r*.8,-r*.45); ctx.lineTo(0,-r*.85); ctx.lineTo(r*.8,-r*.45); ctx.lineTo(0,-r*.05); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#cfe8f7'; ctx.beginPath(); ctx.moveTo(-r*.8,-r*.45); ctx.lineTo(0,-r*.05); ctx.lineTo(0,r*.85); ctx.lineTo(-r*.8,r*.45); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#b3d6ee'; ctx.beginPath(); ctx.moveTo(r*.8,-r*.45); ctx.lineTo(0,-r*.05); ctx.lineTo(0,r*.85); ctx.lineTo(r*.8,r*.45); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if(type === 'amorphe'){
      const g = ctx.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r); g.addColorStop(0,'#ffffff'); g.addColorStop(1,'#b2dfdb');
      ctx.fillStyle = g; ctx.beginPath();
      for(let k=0;k<40;k++){ const t = k/40*Math.PI*2, rr = r*(.75+.2*Math.sin(3*t+1)+.05*Math.sin(7*t)); ctx.lineTo(rr*Math.cos(t), rr*Math.sin(t)); }
      ctx.closePath(); ctx.fill();
    } else {
      /* plaque de métal : on devine les grains à sa surface */
      ctx.beginPath(); ctx.rect(-r, -r*.55, 2*r, 1.1*r); ctx.save(); ctx.clip(); ctx.translate(-W/2,-H/2); mosaic(); ctx.restore();
      ctx.lineWidth = 2; ctx.strokeStyle = '#eceff1'; ctx.stroke();
    }
    ctx.restore();
  }

  /* 2) dans l'échantillon */
  if(inside){
    if(type === 'poly') mosaic();
    else { ctx.fillStyle = type === 'amorphe' ? '#d4efec' : '#dceefa'; ctx.fillRect(0,0,W,H); }
  }

  /* 3) échelle atomique */
  const apx = A*s, alpha = Math.max(0, Math.min(1, (apx-6)/18));
  atomsDrawn = [];
  if(alpha > 0){
    ctx.globalAlpha = alpha; ctx.fillStyle = '#0b1626'; ctx.fillRect(0,0,W,H);
    const half = A/2, k = type === 'poly' ? 1.5 : 1, nx = Math.ceil(k*F/half/2)+2, ny = Math.ceil(k*Math.max(F,F*H/W)/half/2)+2;
    const rad = Math.max(1.5, half*s*.42);
    const col = type === 'poly' ? ['#b0bec5','#b0bec5'] : ['#29b6f6','#66bb6a'];
    const ball = (x,y,c,r) => { const [X,Y] = toPx(x,y); if(X<-r||X>W+r||Y<-r||Y>H+r) return;
      atomsDrawn.push([x,y]);
      ctx.beginPath(); ctx.arc(X,Y,r,0,7); ctx.fillStyle = c; ctx.fill(); ctx.lineWidth = Math.max(1,r*.12); ctx.strokeStyle = '#000'; ctx.stroke();
      ctx.beginPath(); ctx.arc(X-r*.35,Y-r*.35,r*.28,0,7); ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fill(); };
    for(let i=-nx;i<=nx;i++) for(let j=-ny;j<=ny;j++){
      let x = i*half, y = j*half, odd = (i+j)&1, c = col[odd], r = type === 'poly' ? rad*.9 : (odd ? rad : rad*.7);
      if(type === 'amorphe'){ const g = SAMPLES[cur].seed*977; x += (hash(i+g,j,1)-.5)*half*.75; y += (hash(i+g,j,2)-.5)*half*.75; odd = hash(i+g,j,4) < .5 ? 0 : 1; c = col[odd]; r = odd ? rad : rad*.7; }
      if(type === 'poly'){
        /* chaque grain a son propre réseau, tourné d'un angle différent */
        const g0 = grainAt(x,y), ct = Math.cos(g0.th), st = Math.sin(g0.th);
        const X = i*half*ct - j*half*st, Y = i*half*st + j*half*ct;
        if(grainAt(X,Y) !== g0) continue; x = X; y = Y;
      }
      ball(x,y,c,r);
    }
    ctx.globalAlpha = 1;

    /* outil MAILLE : un motif de 3 × 3 positions, à superposer aux entités */
    if(cellOn && alpha > .5){
      const ct = Math.cos(cell.th), st = Math.sin(cell.th);
      const P = (u,v) => toPx(cell.x + (u*ct - v*st)*half, cell.y + (u*st + v*ct)*half);
      ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 3;
      ctx.beginPath(); [[0,0],[2,0],[2,2],[0,2]].forEach(([u,v],q)=>{ const [X,Y] = P(u,v); q ? ctx.lineTo(X,Y) : ctx.moveTo(X,Y); }); ctx.closePath(); ctx.stroke();
      ctx.lineWidth = 2;
      for(let u=0;u<=2;u++) for(let v=0;v<=2;v++){ const [X,Y] = P(u,v); ctx.beginPath(); ctx.arc(X,Y,Math.max(4,rad*.55),0,7); ctx.stroke(); }
    }
  }

  let e = Math.floor(Math.log10(F*0.3)), L = Math.pow(10,e);
  $('bar').style.width = (L*s)+'px'; $('barTxt').textContent = '1 × ' + pow10(e) + ' m';
  $('fov').textContent = 'champ ≈ ' + pow10(Math.round(Math.log10(F))) + ' m';
  $('zone').textContent = alpha > .5 ? 'ÉCHELLE ATOMIQUE' : inside ? 'DANS L\'ÉCHANTILLON' : 'À L\'ŒIL NU';

  if(meas){ ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 3; ctx.setLineDash([8,5]);
    ctx.beginPath(); ctx.moveTo(meas.x1,meas.y1); ctx.lineTo(meas.x2,meas.y2); ctx.stroke(); ctx.setLineDash([]);
    [[meas.x1,meas.y1],[meas.x2,meas.y2]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fillStyle='#ffd54f';ctx.fill();}); }
}

/* ===== contrôles ===== */
$('zoom').addEventListener('input', draw);
function nudge(d){ const z = $('zoom'); z.value = Math.min(9.5, Math.max(1.5, +z.value + d)); draw(); }
function hold(btn, fn){ let t = null; btn.addEventListener('pointerdown', e => { e.preventDefault(); fn(1); t = setInterval(()=>fn(1/3), 60); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => btn.addEventListener(ev, () => clearInterval(t))); }
hold($('zIn'), k => nudge(.1*k)); hold($('zOut'), k => nudge(-.1*k));
cv.addEventListener('wheel', e => { e.preventDefault(); nudge(-e.deltaY*.002); }, {passive:false});

$('measBtn').onclick = () => { measOn = !measOn; if(measOn){ cellOn = false; $('cellBtn').classList.remove('on'); }
  $('measBtn').classList.toggle('on', measOn); $('measOut').textContent = measOn ? 'glisser sur l\'image' : '—'; if(!measOn) meas = null; draw(); };
$('cellBtn').onclick = () => { cellOn = !cellOn; if(cellOn){ measOn = false; meas = null; $('measBtn').classList.remove('on');
    const F = Math.pow(10,-$('zoom').value); cell.x = -F*.1; cell.y = -F*.1; }
  $('cellBtn').classList.toggle('on', cellOn); $('measOut').textContent = cellOn ? 'glisser la maille sur les entités' : '—'; draw(); };
hold($('rotL'), () => { cell.th += Math.PI/90; draw(); }); hold($('rotR'), () => { cell.th -= Math.PI/90; draw(); });

let dragM = false, dragC = null;
const world = e => { const r = cv.getBoundingClientRect(), F = Math.pow(10,-$('zoom').value), s = W/F;
  return [(e.clientX-r.left-W/2)/s, (H/2-(e.clientY-r.top))/s, e.clientX-r.left, e.clientY-r.top]; };
cv.addEventListener('pointerdown', e => {
  const [x,y,px,py] = world(e);
  if(measOn){ meas = {x1:px, y1:py, x2:px, y2:py}; dragM = true; cv.setPointerCapture(e.pointerId); }
  else if(cellOn){ dragC = {dx:cell.x-x, dy:cell.y-y}; cv.setPointerCapture(e.pointerId); }
});
cv.addEventListener('pointermove', e => {
  const [x,y,px,py] = world(e);
  if(dragM){ meas.x2 = px; meas.y2 = py; const F = Math.pow(10,-$('zoom').value);
    $('measOut').textContent = 'L = ' + sci(Math.max(Math.hypot(meas.x2-meas.x1, meas.y2-meas.y1)*F/W, 1e-15)); draw(); }
  else if(dragC){ cell.x = x + dragC.dx; cell.y = y + dragC.dy; draw(); }
});
cv.addEventListener('pointerup', () => {
  dragM = false;
  if(dragC){ dragC = null;
    /* aimantation : le coin de la maille se pose sur l'entité la plus proche */
    let b = null, bd = 1e99; for(const [x,y] of atomsDrawn){ const d = (x-cell.x)**2+(y-cell.y)**2; if(d<bd){bd=d;b=[x,y];} }
    if(b){ cell.x = b[0]; cell.y = b[1]; } draw(); }
});
window.addEventListener('resize', resize);
buildSeeds();
resize();
</script>
</body>
</html>
