<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créateur d'affiche</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family: Arial, Helvetica, sans-serif; background:#e9edf1; overflow:hidden; }
  #app { display:flex; height:100%; }

  /* -------- Barre d'outils gauche -------- */
  #toolbar { width:150px; background:#2c3e50; color:#fff; padding:10px; overflow-y:auto; flex-shrink:0; }
  #toolbar h3 { font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:#9fb3c8; margin:14px 0 6px; }
  #toolbar button, #toolbar label.filebtn {
    display:block; width:100%; margin:4px 0; padding:8px 6px; border:none; border-radius:5px;
    background:#3d566e; color:#fff; font-size:12px; cursor:pointer; text-align:center;
  }
  #toolbar button:hover, #toolbar label.filebtn:hover { background:#4d6a85; }
  #toolbar button:disabled { opacity:.6; cursor:wait; }
  #toolbar input[type=file] { display:none; }
  #toolbar input[type=color] { width:100%; height:28px; border:none; border-radius:5px; margin:4px 0; cursor:pointer; }
  .fmt-btn.active { background:#e67e22 !important; }
  #shapesPopup { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; background:#1e2b38; padding:8px; border-radius:6px; margin:4px 0; }
  #shapesPopup.hidden { display:none; }
  .shape-opt { background:#3d566e; border-radius:5px; padding:6px; cursor:pointer; }
  .shape-opt:hover { background:#4d6a85; }
  .shape-opt svg { width:100%; height:22px; fill:#fff; display:block; }

  /* -------- Zone centrale -------- */
  #stage-wrap { flex:1; overflow:auto; display:flex; align-items:center; justify-content:center; padding:20px; }
  #stage { position:relative; background:#ffffff; box-shadow:0 4px 18px rgba(0,0,0,.25); overflow:hidden; }

  /* -------- Panneau propriétés droite -------- */
  #props { width:170px; background:#f4f6f8; padding:10px; flex-shrink:0; border-left:1px solid #d3d9df; overflow-y:auto; }
  #props h3 { font-size:13px; text-transform:uppercase; color:#7a8a99; margin:10px 0 6px; }
  #props .row { display:flex; align-items:center; gap:6px; margin:6px 0; }
  #props select, #props input[type=range] { width:100%; }
  #props button { width:100%; padding:7px; margin:4px 0; border:none; border-radius:5px; background:#c0392b; color:#fff; font-size:12px; cursor:pointer; }
  #props button.secondary { background:#7f8c8d; }
  #props .hidden { display:none; }
  #props input[type=color] { width:100%; height:26px; border:none; cursor:pointer; }
  .palette { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0; }
  .palette .swatch { width:18px; height:18px; border-radius:3px; cursor:pointer; border:1px solid rgba(0,0,0,.25); flex-shrink:0; }
  .palette .swatch:hover { outline:2px solid #2980b9; outline-offset:1px; }
  #toolbar .palette { background:#1e2b38; padding:6px; border-radius:5px; }

  /* -------- Éléments sur l'affiche -------- */
  .el { position:absolute; cursor:move; user-select:none; }
  .el.selected { outline:2px dashed #2980b9; }
  .el .handle {
    position:absolute; right:-7px; bottom:-7px; width:14px; height:14px;
    background:#2980b9; border-radius:50%; cursor:nwse-resize;
  }
  .el-text { padding:4px; min-width:30px; min-height:20px; outline:none; overflow:hidden; }
  .el-text:focus { cursor:text; }
  .el-shape { width:100%; height:100%; }
  .el-image-wrap img { width:100%; height:100%; object-fit:contain; pointer-events:none; display:block; }

  /* -------- Galerie clipart SVG -------- */
  #clipartPanel { position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; z-index:1000; }
  #clipartPanel.hidden { display:none; }
  #clipartBox { background:#fff; border-radius:8px; width:520px; max-width:90vw; max-height:80vh; overflow:hidden; display:flex; flex-direction:column; }
  .clipart-header { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:#2c3e50; color:#fff; }
  .clipart-header button { background:none; border:none; color:#fff; font-size:16px; cursor:pointer; }
  #clipartGrid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:14px; overflow-y:auto; }
  .clipart-item { border:1px solid #e0e0e0; border-radius:6px; padding:8px; text-align:center; cursor:pointer; }
  .clipart-item:hover { border-color:#2980b9; background:#f0f7fc; }
  .clipart-item img { width:100%; height:60px; object-fit:contain; }
  .clipart-item span { display:block; font-size:11px; color:#555; margin-top:4px; }
  .clipart-msg { grid-column:1/-1; text-align:center; color:#7a8a99; font-size:13px; padding:20px; }
</style>
</head>
<body>

<div id="app">

  <!-- ============ OUTILS ============ -->
  <div id="toolbar">
    <h3>Format</h3>
    <button class="fmt-btn active" data-fmt="portrait">Affiche A4 portrait</button>
    <button class="fmt-btn" data-fmt="paysage">Affiche A4 paysage</button>
    <button class="fmt-btn" data-fmt="carre">Carré (réseaux)</button>

    <h3>Ajouter</h3>
    <button id="btnText">+ Texte</button>
    <label class="filebtn">+ Image
      <input type="file" id="fileInput" accept="image/*">
    </label>
    <button id="btnShapes">+ Figure ▾</button>
    <div id="shapesPopup" class="hidden">
      <div class="shape-opt" data-shape="rect" title="Rectangle"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14"/></svg></div>
      <div class="shape-opt" data-shape="circle" title="Cercle"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg></div>
      <div class="shape-opt" data-shape="triangle" title="Triangle"><svg viewBox="0 0 24 24"><polygon points="12,4 21,20 3,20"/></svg></div>
      <div class="shape-opt" data-shape="arrow" title="Flèche"><svg viewBox="0 0 24 24"><path d="M2,10 L15,10 L15,6 L22,12 L15,18 L15,14 L2,14 Z"/></svg></div>
      <div class="shape-opt" data-shape="arrow2" title="Double flèche"><svg viewBox="0 0 24 24"><path d="M2,12 L7,7 L7,10.5 L17,10.5 L17,7 L22,12 L17,17 L17,13.5 L7,13.5 L7,17 Z"/></svg></div>
    </div>
    <button id="btnClipart">+ Clipart (SVG)</button>

    <h3>Fond de l'affiche</h3>
    <input type="color" id="bgColor" value="#ffffff">
    <div class="palette" id="paletteBg"></div>

    <h3>Fichier</h3>
    <button id="btnSave">💾 Sauver (brouillon)</button>
    <button id="btnLoad">📂 Reprendre brouillon</button>
    <button id="btnClear">🗑 Tout effacer</button>

    <h3>Export</h3>
    <button id="btnPng">Exporter en PNG</button>
    <button id="btnPdf">Exporter en PDF</button>
  </div>

  <!-- ============ ZONE DE TRAVAIL ============ -->
  <div id="stage-wrap">
    <div id="stage"></div>
  </div>

  <!-- ============ GALERIE CLIPART SVG ============ -->
  <div id="clipartPanel" class="hidden">
    <div id="clipartBox">
      <div class="clipart-header">
        <span>Clipart (SVG)</span>
        <div>
          <button id="refreshClipart" title="Actualiser">⟳</button>
          <button id="closeClipart" title="Fermer">✕</button>
        </div>
      </div>
      <div id="clipartGrid"></div>
    </div>
  </div>

  <!-- ============ PROPRIÉTÉS ============ -->
  <div id="props">
    <p style="font-size:12px;color:#7a8a99;">Cliquez un élément pour le modifier.</p>

    <div id="prop-text" class="hidden">
      <h3>Texte</h3>
      <div class="row"><select id="fontFamily">
        <option value="Arial">Arial</option>
        <option value="Georgia">Georgia</option>
        <option value="'Comic Sans MS'">Comic Sans</option>
        <option value="Impact">Impact</option>
        <option value="'Courier New'">Courier</option>
      </select></div>
      <div class="row"><input type="range" id="fontSize" min="10" max="120" value="24"></div>
      <div class="row">
        <button id="btnBold" class="secondary" style="width:auto;flex:1;">G</button>
        <button id="btnItalic" class="secondary" style="width:auto;flex:1;">I</button>
      </div>
      <div class="row"><input type="color" id="textColor" value="#000000"></div>
      <div class="palette" id="paletteText"></div>
    </div>

    <div id="prop-shape" class="hidden">
      <h3>Forme</h3>
      <div class="row"><input type="color" id="shapeColor" value="#3498db"></div>
      <div class="palette" id="paletteShape"></div>
    </div>

    <h3>Élément</h3>
    <button id="btnFront" class="secondary">Passer devant</button>
    <button id="btnDelete">Supprimer</button>
  </div>

</div>

<script>
const stage = document.getElementById('stage');
let selected = null;
let zTop = 1;
let clipboardEl = null;

/* ---------- Bibliothèque de clipart SVG (dossier sur GitHub) ---------- */
const REPO_USER   = 'fjakubcik08-web';
const REPO_NAME   = 'animations-moodle';
const REPO_BRANCH = 'main';
const CLIPART_FOLDER = 'svg';

/* ---------- Formats d'affiche ---------- */
const FORMATS = {
  portrait: {w:595, h:842},
  paysage:  {w:842, h:595},
  carre:    {w:700, h:700}
};
function setFormat(fmt){
  stage.style.width = FORMATS[fmt].w+'px';
  stage.style.height = FORMATS[fmt].h+'px';
  document.querySelectorAll('.fmt-btn').forEach(b=>b.classList.toggle('active', b.dataset.fmt===fmt));
}
setFormat('portrait');
document.querySelectorAll('.fmt-btn').forEach(b=>{
  b.addEventListener('click', ()=>setFormat(b.dataset.fmt));
});

document.getElementById('bgColor').addEventListener('input', e=>{
  stage.style.background = e.target.value;
});

/* ---------- Palettes ---------- */
const PALETTE_COLORS = ['#000000','#ffffff','#e74c3c','#e67e22','#f1c40f','#2ecc71','#1abc9c','#3498db','#9b59b6','#e84393','#7f8c8d','#795548'];
function buildPalette(containerId, onPick){
  const el = document.getElementById(containerId);
  if(!el) return;
  PALETTE_COLORS.forEach(c=>{
    const sw = document.createElement('div');
    sw.className = 'swatch';
    sw.style.background = c;
    sw.title = c;
    sw.addEventListener('click', ()=> onPick(c));
    el.appendChild(sw);
  });
}
buildPalette('paletteBg', c=>{
  document.getElementById('bgColor').value = c;
  stage.style.background = c;
});
buildPalette('paletteText', c=>{
  document.getElementById('textColor').value = c;
  if(selected){ const t = selected.querySelector('.el-text'); if(t) t.style.color = c; }
});
buildPalette('paletteShape', c=>{
  document.getElementById('shapeColor').value = c;
  if(selected){
    const shp = selected.querySelector('.el-shape');
    if(shp){
      if(shp.tagName.toLowerCase() === 'svg'){ shp.querySelector('path').setAttribute('fill', c); }
      else { shp.style.background = c; }
    }
  }
});

/* ---------- Sélection ---------- */
function selectEl(el){
  if(selected) selected.classList.remove('selected');
  selected = el;
  if(el) el.classList.add('selected');
  updatePropsPanel();
}
function updatePropsPanel(){
  document.getElementById('prop-text').classList.add('hidden');
  document.getElementById('prop-shape').classList.add('hidden');
  if(!selected) return;
  if(selected.classList.contains('el-text-wrap')){
    document.getElementById('prop-text').classList.remove('hidden');
    const txt = selected.querySelector('.el-text');
    document.getElementById('fontFamily').value = txt.style.fontFamily || 'Arial';
    document.getElementById('fontSize').value = parseInt(txt.style.fontSize)||24;
    document.getElementById('textColor').value = rgbToHex(txt.style.color) || '#000000';
  } else if(selected.classList.contains('el-shape-wrap')){
    document.getElementById('prop-shape').classList.remove('hidden');
    const shp = selected.querySelector('.el-shape');
    let col;
    if(shp.tagName.toLowerCase() === 'svg'){
      col = shp.querySelector('path').getAttribute('fill');
    } else {
      col = rgbToHex(shp.style.background);
    }
    document.getElementById('shapeColor').value = col || '#3498db';
  }
}
function rgbToHex(rgb){
  if(!rgb) return null;
  if(rgb.startsWith('#')) return rgb;
  const m = rgb.match(/\d+/g);
  if(!m) return null;
  return '#' + m.slice(0,3).map(x=>(+x).toString(16).padStart(2,'0')).join('');
}

/* ---------- Drag + resize ---------- */
function makeDraggable(wrap){
  let dragging=false, resizing=false, startX, startY, startL, startT, startW, startH;

  wrap.addEventListener('pointerdown', e=>{
    if(e.target.classList.contains('handle')){
      resizing = true;
      startX = e.clientX; startY = e.clientY;
      startW = wrap.offsetWidth; startH = wrap.offsetHeight;
    } else if(!e.target.isContentEditable) {
      dragging = true;
      startX = e.clientX; startY = e.clientY;
      startL = wrap.offsetLeft; startT = wrap.offsetTop;
    }
    selectEl(wrap);
    wrap.style.zIndex = ++zTop;
    e.stopPropagation();
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove', e=>{
    if(dragging){
      wrap.style.left = (startL + e.clientX - startX) + 'px';
      wrap.style.top  = (startT + e.clientY - startY) + 'px';
    } else if(resizing){
      wrap.style.width  = Math.max(24, startW + e.clientX - startX) + 'px';
      wrap.style.height = Math.max(20, startH + e.clientY - startY) + 'px';
    }
  });
  wrap.addEventListener('pointerup', ()=>{ dragging=false; resizing=false; });
}

function addHandle(wrap){
  const h = document.createElement('div');
  h.className='handle';
  wrap.appendChild(h);
}

/* ---------- Position d'apparition ---------- */
let spawnCount = 0;
function spawnPoint(){
  const wrapEl = document.getElementById('stage-wrap');
  const stageBox = stage.getBoundingClientRect();
  const wrapBox = wrapEl.getBoundingClientRect();
  const jitter = (spawnCount++ % 6) * 18;
  let x = (wrapBox.left - stageBox.left) + 40 + jitter;
  let y = (wrapBox.top - stageBox.top) + 40 + jitter;
  x = Math.max(10, Math.min(x, Math.max(10, stage.offsetWidth - 60)));
  y = Math.max(10, Math.min(y, Math.max(10, stage.offsetHeight - 60)));
  return { x, y };
}

/* ---------- Texte ---------- */
document.getElementById('btnText').addEventListener('click', ()=>{
  const wrap = document.createElement('div');
  wrap.className = 'el el-text-wrap';
  const p0 = spawnPoint();
  wrap.style.left=p0.x+'px'; wrap.style.top=p0.y+'px'; wrap.style.width='200px'; wrap.style.height='40px';
  const txt = document.createElement('div');
  txt.className='el-text';
  txt.contentEditable = true;
  txt.style.fontFamily='Arial'; txt.style.fontSize='24px'; txt.style.color='#000000';
  txt.innerText = 'Votre texte';
  wrap.appendChild(txt);
  addHandle(wrap);
  stage.appendChild(wrap);
  makeDraggable(wrap);
  selectEl(wrap);
});
document.getElementById('fontFamily').addEventListener('change', e=>{
  if(selected) selected.querySelector('.el-text').style.fontFamily = e.target.value;
});
document.getElementById('fontSize').addEventListener('input', e=>{
  if(selected) selected.querySelector('.el-text').style.fontSize = e.target.value+'px';
});
document.getElementById('textColor').addEventListener('input', e=>{
  if(selected) selected.querySelector('.el-text').style.color = e.target.value;
});
document.getElementById('btnBold').addEventListener('click', ()=>{
  if(selected){ const t=selected.querySelector('.el-text'); t.style.fontWeight = t.style.fontWeight==='bold'?'normal':'bold'; }
});
document.getElementById('btnItalic').addEventListener('click', ()=>{
  if(selected){ const t=selected.querySelector('.el-text'); t.style.fontStyle = t.style.fontStyle==='italic'?'normal':'italic'; }
});

/* ---------- Formes ---------- */
const SHAPE_PATHS = {
  triangle: 'M50,5 L95,95 L5,95 Z',
  arrow:    'M0,35 L60,35 L60,15 L100,50 L60,85 L60,65 L0,65 Z',
  arrow2:   'M0,50 L20,25 L20,40 L80,40 L80,25 L100,50 L80,75 L80,60 L20,60 L20,75 Z'
};
function addShape(kind){
  const wrap = document.createElement('div');
  wrap.className = 'el el-shape-wrap';
  const p0 = spawnPoint();
  wrap.style.left=p0.x+'px'; wrap.style.top=p0.y+'px';
  let shp;
  if(kind === 'rect' || kind === 'circle'){
    wrap.style.width='120px'; wrap.style.height='120px';
    shp = document.createElement('div');
    shp.className = 'el-shape';
    shp.style.background = '#3498db';
    if(kind === 'circle') shp.style.borderRadius = '50%';
  } else {
    wrap.style.width = '140px';
    wrap.style.height = kind === 'triangle' ? '120px' : '70px';
    shp = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    shp.setAttribute('viewBox', '0 0 100 100');
    shp.setAttribute('preserveAspectRatio', 'none');
    shp.classList.add('el-shape');
    shp.style.width = '100%'; shp.style.height = '100%'; shp.style.display = 'block';
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', SHAPE_PATHS[kind]);
    path.setAttribute('fill', '#3498db');
    shp.appendChild(path);
  }
  wrap.appendChild(shp);
  addHandle(wrap);
  stage.appendChild(wrap);
  makeDraggable(wrap);
  selectEl(wrap);
}
const shapesPopup = document.getElementById('shapesPopup');
document.getElementById('btnShapes').addEventListener('click', ()=>{
  shapesPopup.classList.toggle('hidden');
});
shapesPopup.querySelectorAll('.shape-opt').forEach(opt=>{
  opt.addEventListener('click', ()=>{
    addShape(opt.dataset.shape);
    shapesPopup.classList.add('hidden');
  });
});
document.getElementById('shapeColor').addEventListener('input', e=>{
  if(!selected) return;
  const shp = selected.querySelector('.el-shape');
  if(!shp) return;
  if(shp.tagName.toLowerCase() === 'svg'){
    shp.querySelector('path').setAttribute('fill', e.target.value);
  } else {
    shp.style.background = e.target.value;
  }
});

/* ==========================================================================
   SVG : normalisation
   Beaucoup de SVG (icônes) n'ont qu'un viewBox, sans width/height.
   Le navigateur les affiche dans un <img>, mais une fois dessinés sur un
   canvas (= ce que fait html2canvas à l'export) leur taille intrinsèque
   vaut 0 → ils disparaissent. On force width/height depuis le viewBox,
   et on embarque le SVG en data:URL (plus de CORS, brouillon autonome).
   ========================================================================== */
function normalizeSvgText(txt){
  const doc = new DOMParser().parseFromString(txt, 'image/svg+xml');
  const svg = doc.documentElement;
  if(!svg || svg.nodeName.toLowerCase() !== 'svg') throw new Error('SVG invalide');
  const wAttr = svg.getAttribute('width')  || '';
  const hAttr = svg.getAttribute('height') || '';
  const wOk = wAttr && !/%/.test(wAttr) && parseFloat(wAttr) > 0;
  const hOk = hAttr && !/%/.test(hAttr) && parseFloat(hAttr) > 0;
  let vb = svg.getAttribute('viewBox');
  if(!vb && wOk && hOk){
    vb = `0 0 ${parseFloat(wAttr)} ${parseFloat(hAttr)}`;
    svg.setAttribute('viewBox', vb);
  }
  if(!(wOk && hOk)){
    let W = 512, H = 512;
    if(vb){
      const p = vb.trim().split(/[\s,]+/).map(Number);
      if(p.length === 4 && p[2] > 0 && p[3] > 0){ W = p[2]; H = p[3]; }
    }
    svg.setAttribute('width', W);
    svg.setAttribute('height', H);
  }
  if(!svg.getAttribute('xmlns')) svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  return new XMLSerializer().serializeToString(svg);
}
function svgTextToDataUrl(txt){
  return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(normalizeSvgText(txt))));
}
async function svgUrlToDataUrl(url){
  const res = await fetch(url, { cache:'no-store' });
  if(!res.ok) throw new Error('SVG introuvable');
  return svgTextToDataUrl(await res.text());
}
function svgDataUrlToText(src){
  const i = src.indexOf(',');
  const head = src.slice(0, i), body = src.slice(i+1);
  if(/;base64/i.test(head)) return decodeURIComponent(escape(atob(body)));
  return decodeURIComponent(body);
}
function isSvgSrc(src){
  return /^data:image\/svg\+xml/i.test(src) || /\.svg(\?|#|$)/i.test(src);
}

/* ---------- Images (upload, clipart, coller) ---------- */
function addImageElement(src, w, h){
  const wrap = document.createElement('div');
  wrap.className = 'el el-image-wrap';
  const p0 = spawnPoint();
  wrap.style.left=p0.x+'px'; wrap.style.top=p0.y+'px';
  wrap.style.width=(w||220)+'px'; wrap.style.height=(h||160)+'px';
  const img = document.createElement('img');
  if(!src.startsWith('data:')) img.crossOrigin = 'anonymous';
  img.src = src;
  wrap.appendChild(img);
  addHandle(wrap);
  stage.appendChild(wrap);
  makeDraggable(wrap);
  selectEl(wrap);
  wrap.style.zIndex = ++zTop;
  return wrap;
}

function readImageFile(file){
  const reader = new FileReader();
  if(file.type === 'image/svg+xml'){
    reader.onload = ev => {
      let src;
      try { src = svgTextToDataUrl(ev.target.result); } catch(e){ return alert('SVG illisible.'); }
      addImageElement(src, 160, 160);
    };
    reader.readAsText(file);
  } else {
    reader.onload = ev => addImageElement(ev.target.result, 220, 160);
    reader.readAsDataURL(file);
  }
}

document.getElementById('fileInput').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(file) readImageFile(file);
  e.target.value = '';
});

/* ---------- Clipart SVG depuis GitHub ---------- */
const clipartPanel = document.getElementById('clipartPanel');
const clipartGrid = document.getElementById('clipartGrid');

document.getElementById('btnClipart').addEventListener('click', ()=>{
  clipartPanel.classList.remove('hidden');
  loadClipartLibrary();
});
document.getElementById('closeClipart').addEventListener('click', ()=>{
  clipartPanel.classList.add('hidden');
});
document.getElementById('refreshClipart').addEventListener('click', loadClipartLibrary);

async function loadClipartLibrary(){
  clipartGrid.innerHTML = '<p class="clipart-msg">Chargement de la bibliothèque…</p>';
  try {
    const apiUrl = `https://api.github.com/repos/${REPO_USER}/${REPO_NAME}/contents/${CLIPART_FOLDER}?ref=${REPO_BRANCH}`;
    const res = await fetch(apiUrl, { cache:'no-store', headers:{ 'Accept':'application/vnd.github+json' } });
    if(!res.ok) throw new Error('dossier introuvable ('+res.status+')');
    const data = await res.json();
    const files = (Array.isArray(data) ? data : []).filter(f =>
      f.type === 'file' && f.name.toLowerCase().endsWith('.svg')
    );
    clipartGrid.innerHTML = '';
    if(files.length === 0){
      clipartGrid.innerHTML = `<p class="clipart-msg">Aucun SVG dans /${CLIPART_FOLDER}/ pour l'instant.<br>Ajoute des fichiers .svg sur GitHub, puis clique "Actualiser".</p>`;
      return;
    }
    files.forEach(f=>{
      const rawUrl = f.download_url;
      const nom = f.name.replace(/\.svg$/i, '');
      const item = document.createElement('div');
      item.className = 'clipart-item';
      item.title = nom;
      item.innerHTML = `<img src="${rawUrl}" alt="${nom}"><span>${nom}</span>`;
      item.addEventListener('click', async ()=>{
        clipartPanel.classList.add('hidden');
        let src = rawUrl;
        try { src = await svgUrlToDataUrl(rawUrl); } catch(e){ /* repli : URL brute */ }
        addImageElement(src, 140, 140);
      });
      clipartGrid.appendChild(item);
    });
  } catch(err){
    clipartGrid.innerHTML = `<p class="clipart-msg">Impossible de charger la bibliothèque.<br>Vérifie le nom du dépôt / la branche (${REPO_BRANCH}) en haut du script, ou ta connexion.</p>`;
  }
}

/* ---------- Devant / supprimer ---------- */
document.getElementById('btnFront').addEventListener('click', ()=>{
  if(selected) selected.style.zIndex = ++zTop;
});
document.getElementById('btnDelete').addEventListener('click', ()=>{
  if(selected){ selected.remove(); selected=null; updatePropsPanel(); }
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Delete' && selected && !selected.querySelector('.el-text:focus')){
    selected.remove(); selected=null; updatePropsPanel();
  }
});

/* ---------- Copier / dupliquer ---------- */
document.addEventListener('keydown', e=>{
  const ctrl = e.ctrlKey || e.metaKey;
  if(!ctrl) return;
  const key = e.key.toLowerCase();
  const hasTextSelection = window.getSelection().toString().length > 0;
  if(key === 'c' && selected && !hasTextSelection){
    clipboardEl = selected.cloneNode(true);
    e.preventDefault();
  }
  if(key === 'v' && clipboardEl && !hasTextSelection && !document.activeElement.isContentEditable){
    duplicateClipboardEl();
    e.preventDefault();
  }
});
function duplicateClipboardEl(){
  const clone = clipboardEl.cloneNode(true);
  clone.classList.remove('selected');
  const left = parseInt(clone.style.left)||0;
  const top  = parseInt(clone.style.top)||0;
  clone.style.left = (left+20)+'px';
  clone.style.top  = (top+20)+'px';
  stage.appendChild(clone);
  makeDraggable(clone);
  selectEl(clone);
  clone.style.zIndex = ++zTop;
}
document.addEventListener('paste', e=>{
  const target = e.target;
  const editingText = target.closest && target.closest('.el-text');
  const cd = e.clipboardData || window.clipboardData;
  const items = cd ? cd.items : null;
  let imageItem = null;
  if(items){
    for(const it of items){ if(it.type.indexOf('image') !== -1){ imageItem = it; break; } }
  }
  if(imageItem){
    e.preventDefault();
    readImageFile(imageItem.getAsFile());
  } else if(!editingText && clipboardEl){
    e.preventDefault();
    duplicateClipboardEl();
  }
});
stage.addEventListener('pointerdown', e=>{
  if(e.target === stage) selectEl(null);
});

/* ---------- Brouillon local ---------- */
document.getElementById('btnSave').addEventListener('click', ()=>{
  try {
    localStorage.setItem('affiche_brouillon', stage.innerHTML);
    localStorage.setItem('affiche_bg', stage.style.background);
    localStorage.setItem('affiche_fmt', document.querySelector('.fmt-btn.active').dataset.fmt);
    alert('Brouillon sauvegardé sur cet appareil.');
  } catch(e){ alert('Sauvegarde impossible (stockage plein ou bloqué).'); }
});
document.getElementById('btnLoad').addEventListener('click', ()=>{
  let html = null;
  try { html = localStorage.getItem('affiche_brouillon'); } catch(e){}
  if(!html){ alert('Aucun brouillon trouvé sur cet appareil.'); return; }
  stage.innerHTML = html;
  try {
    stage.style.background = localStorage.getItem('affiche_bg') || '#ffffff';
    setFormat(localStorage.getItem('affiche_fmt') || 'portrait');
  } catch(e){}
  stage.querySelectorAll('.el').forEach(wrap=>{ makeDraggable(wrap); });
  selectEl(null);
});
document.getElementById('btnClear').addEventListener('click', ()=>{
  if(confirm('Tout effacer ?')){ stage.innerHTML=''; selected=null; updatePropsPanel(); }
});

/* ==========================================================================
   EXPORT
   html2canvas 1.4.1 : (1) rate les SVG sans width/height, (2) ignore
   object-fit:contain (déforme). On pré-rastérise donc chaque image nous-mêmes
   en PNG à la taille exacte de son cadre, et on l'injecte dans le clone.
   ========================================================================== */
const EXPORT_SCALE = 2;

function loadImg(src){
  return new Promise((resolve, reject)=>{
    const im = new Image();
    if(!src.startsWith('data:')) im.crossOrigin = 'anonymous';
    im.onload = ()=> resolve(im);
    im.onerror = reject;
    im.src = src;
  });
}

async function rasterizeImages(){
  const map = {};
  const imgs = [...stage.querySelectorAll('.el-image-wrap img')];
  for(let k = 0; k < imgs.length; k++){
    const img = imgs[k];
    img.dataset.exp = k;
    try {
      let src = img.getAttribute('src');
      if(isSvgSrc(src)){
        src = src.startsWith('data:') ? svgTextToDataUrl(svgDataUrlToText(src))
                                       : await svgUrlToDataUrl(src);
      }
      const im = await loadImg(src);
      const W = img.parentElement.clientWidth, H = img.parentElement.clientHeight;
      const c = document.createElement('canvas');
      c.width  = Math.max(1, Math.round(W * EXPORT_SCALE));
      c.height = Math.max(1, Math.round(H * EXPORT_SCALE));
      const iw = im.naturalWidth  || im.width  || W;
      const ih = im.naturalHeight || im.height || H;
      const r = Math.min(c.width / iw, c.height / ih);   // = object-fit:contain
      const dw = iw * r, dh = ih * r;
      c.getContext('2d').drawImage(im, (c.width-dw)/2, (c.height-dh)/2, dw, dh);
      map[k] = c.toDataURL('image/png');
    } catch(e){ /* on laisse html2canvas se débrouiller avec l'original */ }
  }
  return map;
}

let exporting = false;
async function prepareExport(cb){
  if(exporting) return;
  exporting = true;
  const btns = [document.getElementById('btnPng'), document.getElementById('btnPdf')];
  btns.forEach(b=> b.disabled = true);
  if(selected) selectEl(null);
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  try {
    const map = await rasterizeImages();
    const canvas = await html2canvas(stage, {
      scale: EXPORT_SCALE,
      useCORS: true,
      backgroundColor: null,
      onclone: doc => {
        doc.querySelectorAll('.handle').forEach(h=> h.style.display = 'none');
        doc.querySelectorAll('.el.selected').forEach(el=> el.classList.remove('selected'));
        doc.querySelectorAll('.el-image-wrap img').forEach(i=>{
          const d = map[i.dataset.exp];
          if(d){ i.removeAttribute('crossorigin'); i.src = d; i.style.objectFit = 'fill'; }
        });
      }
    });
    cb(canvas);
  } catch(e){
    alert('Export impossible : ' + e.message);
  } finally {
    stage.querySelectorAll('img[data-exp]').forEach(i=> i.removeAttribute('data-exp'));
    btns.forEach(b=> b.disabled = false);
    exporting = false;
  }
}
document.getElementById('btnPng').addEventListener('click', ()=>{
  prepareExport(canvas=>{
    const link = document.createElement('a');
    link.download = 'affiche.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
});
document.getElementById('btnPdf').addEventListener('click', ()=>{
  prepareExport(canvas=>{
    const { jsPDF } = window.jspdf;
    const w = stage.offsetWidth, h = stage.offsetHeight;
    const pdf = new jsPDF({ orientation: w>h?'landscape':'portrait', unit:'px', format:[w,h] });
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, w, h);
    pdf.save('affiche.pdf');
  });
});
</script>
