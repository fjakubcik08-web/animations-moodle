<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Du très grand au très petit</title>
<style>
html,body{margin:0;padding:0;background:#fdfbf4;overflow-x:hidden;overflow-y:auto}
body{font-family:'Comic Sans MS','Comic Neue','Chalkboard SE',cursive;color:#222}
#app{max-width:940px;margin:0 auto;padding:8px}
h1{font-size:28px;margin:6px 0 6px;text-align:center;color:#ff5a4e;-webkit-text-stroke:1.2px #111;text-shadow:3px 3px 0 #111;letter-spacing:1px;animation:wob 3s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg) scale(1.03)}}
@keyframes popin{0%{transform:scale(0) rotate(-12deg);opacity:0}70%{transform:scale(1.12) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes viewin{0%{transform:scale(0.6);opacity:0}80%{transform:scale(1.03);opacity:1}100%{transform:scale(1)}}
@keyframes jig{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg) scale(1.07)}75%{transform:rotate(3deg) scale(1.07)}}
.sub{text-align:center;font-size:16px;margin:0 auto 14px;max-width:640px;background:#fff;border:2.5px solid #111;border-radius:16px 10px 18px 8px;padding:6px 12px;box-shadow:3px 3px 0 #111}
#cards{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.card{width:156px;background-color:#fff;background-image:radial-gradient(rgba(0,0,0,0.07) 1.2px,transparent 1.4px);background-size:8px 8px;border:3px solid #111;border-radius:14px 9px 16px 8px/9px 15px 8px 14px;padding:6px 4px;cursor:pointer;text-align:center;user-select:none;box-shadow:5px 5px 0 #111;animation:popin .55s cubic-bezier(.3,1.6,.5,1) both}
.card.done{animation:none}
.card.done:hover{animation:jig .45s ease-in-out;box-shadow:8px 8px 0 #ff5a4e;background-color:#fff8d6}
.card:active{transform:translate(4px,4px);box-shadow:1px 1px 0 #111}
.card .nm{font-weight:bold}
.card canvas{width:146px;height:110px;display:block;margin:0 auto}
.card .nm{font-size:15px;margin-top:4px;min-height:38px;display:flex;align-items:center;justify-content:center}
#view{display:none;animation:viewin .45s cubic-bezier(.3,1.5,.5,1)}
#top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:6px}
#oname{font-size:18px;font-weight:bold;background:#ffd93b;border:3px solid #111;padding:4px 12px;border-radius:4px 9px 5px 8px;box-shadow:4px 4px 0 #111;transform:rotate(0.8deg)}
#cv{width:100%;display:block;border:3px solid #111;box-shadow:6px 6px 0 #111;border-radius:12px 8px 14px 9px/8px 13px 9px 12px;background:#fffef8;touch-action:none}
#bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:8px}
button{font-family:inherit;font-size:16px;font-weight:bold;color:#111;cursor:pointer;
  padding:6px 14px;border:3px solid #111;border-radius:6px 10px 5px 9px/9px 5px 10px 6px;
  background-color:#ffd93b;background-image:radial-gradient(rgba(0,0,0,0.16) 1.2px,transparent 1.4px);background-size:7px 7px;
  box-shadow:4px 4px 0 #111;transform:rotate(-1deg);transition:transform .1s,box-shadow .1s;text-shadow:1px 1px 0 #fff}
button:nth-of-type(even){transform:rotate(1deg)}
button:hover{transform:rotate(0) scale(1.08);box-shadow:6px 6px 0 #111}
button:active{transform:translate(3px,3px) scale(1.02);box-shadow:1px 1px 0 #111}
#zmm,#zpp{background-color:#ff5a4e;color:#fff;text-shadow:1px 1px 0 #111}
#zm,#zp{background-color:#4fb3ff;min-width:48px;font-size:20px;padding:3px 12px}
#bRul{background-color:#7ee081}
#bHome{background-color:#ffd93b}
#bExp{background-color:#c79bff}
.lbl{font-size:16px}
.hint{text-align:center;font-size:14px;color:#555;margin-top:6px}
</style>
</head>
<body>
<div id="app">
  <div id="home">
    <h1>🔭 Du très grand au très petit 🔬</h1>
    <div class="sub" id="sub">Clique sur un objet pour l'observer et le mesurer avec la règle.</div>
    <div id="cards"></div>
  </div>
  <div id="view">
    <div id="top">
      <button id="bHome">🏠 Retour aux objets</button>
      <div id="oname"></div>
    </div>
    <canvas id="cv"></canvas>
    <div id="bar">
      <span class="lbl">Zoom :</span>
      <button id="zmm" title="Dézoomer beaucoup">−− (÷10)</button>
      <button id="zm" title="Dézoomer un peu">−</button>
      <button id="zp" title="Zoomer un peu">+</button>
      <button id="zpp" title="Zoomer beaucoup">++ (×10)</button>
      <button id="bRul">📏 Replacer la règle</button>
      <button id="bExp" style="display:none">🔎 Taille (mode expert)</button>
      <span id="expVal" class="lbl" style="color:#d33"></span>
    </div>
    <div class="hint">La règle se déplace en la faisant glisser. La molette de la souris permet aussi de zoomer.</div>
  </div>
</div>
<script>
"use strict";
/* ================== OBJETS (meme ordre que LILLI_OBJ en Python) ================== */
const OBJ=[
 ["Univers observable",8.8e26,"diamètre","universe",{}],
 ["Galaxie d'Andromède",2.2e21,"diamètre","galaxy",{tilt:0.38,col:"#b9a6ff"}],
 ["Voie lactée",1.0e21,"diamètre","galaxy",{tilt:1,col:"#f0d58a"}],
 ["Nébuleuse d'Orion",2.3e17,"largeur","nebula",{}],
 ["Système solaire",9.0e12,"diamètre de l'orbite de Neptune","solar",{}],
 ["Bételgeuse",1.1e12,"diamètre","star",{col:"#ff7a3d",glow:"rgba(255,110,50,0.35)"}],
 ["Soleil",1.39e9,"diamètre","star",{col:"#ffd23d",glow:"rgba(255,200,40,0.35)"}],
 ["Saturne et ses anneaux",2.74e8,"diamètre des anneaux","saturn",{}],
 ["Jupiter",1.43e8,"diamètre","planet",{col:"#e0b98a",bands:["#c98f5a","#f3dcc0","#b97a48"],spot:1}],
 ["Terre",1.27e7,"diamètre","planet",{col:"#4f8fe0",land:1}],
 ["Lune",3.47e6,"diamètre","planet",{col:"#c8c8c8",craters:1}],
 ["Pluton",2.38e6,"diamètre","planet",{col:"#d9b99a",heart:1}],
 ["France",1.0e6,"largeur","france",{}],
 ["Paris (dans le périphérique)",1.0e4,"largeur","paris",{}],
 ["Comète Tchouri",4.1e3,"longueur","comet",{}],
 ["Cratère Meteor (Arizona)",1.2e3,"diamètre","crater",{}],
 ["Fourmi",5e-3,"longueur","ant",{}],
 ["Puce",2e-3,"longueur","flea",{}],
 ["Grain de sable",5e-4,"largeur","sand",{}],
 ["Acarien",3e-4,"longueur","mite",{}],
 ["Cheveu",7e-5,"épaisseur","hair",{}],
 ["Grain de pollen",3e-5,"diamètre","pollen",{}],
 ["Globule rouge",7e-6,"diamètre","rbc",{}],
 ["Bactérie E. coli",2e-6,"longueur","bacteria",{}],
 ["Coronavirus",1.2e-7,"diamètre","virus",{corona:1}],
 ["Virus de la grippe",1.0e-7,"diamètre","virus",{}],
 ["Hémoglobine",6.5e-9,"largeur","protein",{}],
 ["ADN",2e-9,"largeur","dna",{}],
 ["Molécule d'eau",2.8e-10,"largeur","water",{}],
 ["Atome d'or",2.9e-10,"diamètre","atom",{dense:1}],
 ["Atome d'hydrogène",1.06e-10,"diamètre","atom",{}],
 ["Proton",1.7e-15,"diamètre","proton",{}]
];
const NB_GRAND=16;
/* fourchettes realistes (m) pour les objets dont la taille varie dans la nature ;
   les autres (astres, France, Paris, molecules, atomes, proton...) ont une taille unique */
const RANGE={16:[2e-3,1.2e-2],17:[1.5e-3,3.3e-3],18:[1e-4,2e-3],19:[2e-4,4e-4],20:[5e-5,1.2e-4],21:[1e-5,1e-4],
  22:[6e-6,8e-6],23:[1e-6,3e-6],24:[8e-8,1.4e-7],25:[8e-8,1.2e-7]};

/* ================== PARAMETRES URL (JSON -> XOR -> base64url) ================== */
const KEY="PBayle-Lilliput#zoom26";
function decodeP(p){
  p=p.replace(/-/g,"+").replace(/_/g,"/");while(p.length%4)p+="=";
  const b=atob(p),k=new TextEncoder().encode(KEY),u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i)^k[i%k.length];
  return JSON.parse(new TextDecoder().decode(u));
}
function tirage(){
  const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const G=sh([...Array(NB_GRAND).keys()]),P=sh([...Array(OBJ.length-NB_GRAND).keys()].map(i=>i+NB_GRAND));
  const pick=[G[0],G[1],P[0],P[1]];const rest=sh([...G.slice(2),...P.slice(2)]);pick.push(rest[0]);return sh(pick);
}
/* p = {o:[indices], t:[tailles en m, meme ordre que o], md:0/1}
   sans aucun parametre -> MODE EXPERT : les 32 objets, tailles variees au hasard */
const PRM={o:null,t:null,md:1};
let EXPERT=false;
const SZ={};
function sig2(x){const e=Math.floor(Math.log10(x));return Math.round(x/Math.pow(10,e-1))*Math.pow(10,e-1);}
(function(){
  const q=new URLSearchParams(location.search);
  if(q.get("p")){try{Object.assign(PRM,decodeP(q.get("p")));}catch(e){}}
  if(q.get("o"))PRM.o=q.get("o").split(",").map(Number);
  if(q.get("t"))PRM.t=q.get("t").split(",").map(Number);
  if(q.get("md")!==null)PRM.md=+q.get("md");
  if(!q.get("p")&&!q.get("o")){EXPERT=true;PRM.o=[...Array(OBJ.length).keys()];PRM.t=PRM.o.map(i=>{const r=RANGE[i];return r?sig2(Math.exp(Math.log(r[0])+Math.random()*Math.log(r[1]/r[0]))):OBJ[i][1];});}
  if(!Array.isArray(PRM.o))PRM.o=tirage();
  const t=Array.isArray(PRM.t)?PRM.t:[];
  const o2=[];PRM.o.forEach((i,n)=>{if(Number.isInteger(i)&&i>=0&&i<OBJ.length){o2.push(i);SZ[i]=(t[n]>0)?t[n]:OBJ[i][1];}});
  PRM.o=o2;if(!PRM.o.length){PRM.o=tirage();PRM.o.forEach(i=>SZ[i]=OBJ[i][1]);}
})();

/* ================== OUTILS DESSIN XKCD ================== */
const INK="#222";
let VW=900,VH=560,T=0;
function hh(a,b){const x=Math.sin(a*127.1+b*311.7)*43758.5453;return (x-Math.floor(x))*2-1;}
function lwOf(w){return Math.max(0.8,Math.min(2.4,w/25));}
function wcirc(c,cx,cy,rx,ry,seed,fill,stroke,lw){
  const M=Math.max(rx,ry);const n=Math.max(24,Math.min(180,Math.round(M/2)));const j=Math.min(1.5,M*0.035);
  c.beginPath();
  for(let i=0;i<=n;i++){const k=i%n,a=k/n*2*Math.PI,jr=hh(seed,k)*j;const x=cx+(rx+jr)*Math.cos(a),y=cy+(ry+jr)*Math.sin(a);i?c.lineTo(x,y):c.moveTo(x,y);}
  c.closePath();
  if(fill){c.fillStyle=fill;c.fill();}
  if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||2.2;c.stroke();}
}
function wpoly(c,P,seed,fill,stroke,lw,open){
  const n=P.length,m=open?n-1:n;c.beginPath();c.moveTo(P[0][0],P[0][1]);
  for(let i=0;i<m;i++){
    const a=P[i],b=P[(i+1)%n],L=Math.hypot(b[0]-a[0],b[1]-a[1])||1;
    const k=Math.max(1,Math.min(12,Math.round(L/30))),nx=-(b[1]-a[1])/L,ny=(b[0]-a[0])/L;
    for(let j=1;j<=k;j++){const t=j/k,jj=j<k?hh(seed+i,j)*Math.min(1.4,L*0.03):0;c.lineTo(a[0]+(b[0]-a[0])*t+nx*jj,a[1]+(b[1]-a[1])*t+ny*jj);}
  }
  if(!open)c.closePath();
  if(fill){c.fillStyle=fill;c.fill();}
  if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||2;c.stroke();}
}
function wline(c,x1,y1,x2,y2,seed,lw,col){wpoly(c,[[x1,y1],[x2,y2]],seed,null,col||INK,lw||2,true);}
function dot(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,2*Math.PI);c.fill();}
function normPoly(p){const xs=p.map(q=>q[0]),a=Math.min(...xs),b=Math.max(...xs);return p.map(q=>[(q[0]-a)/(b-a)-0.5,q[1]/(b-a)]);}
function spring(c,x1,y1,x2,y2,a){const L=Math.hypot(x2-x1,y2-y1)||1,nx=-(y2-y1)/L,ny=(x2-x1)/L;c.beginPath();for(let i=0;i<=40;i++){const t=i/40,d=Math.sin(t*Math.PI*10)*a;const px=x1+(x2-x1)*t+nx*d,py=y1+(y2-y1)*t+ny*d;i?c.lineTo(px,py):c.moveTo(px,py);}c.stroke();}
function heart(c,x,y,z){c.beginPath();c.moveTo(x,y+z*0.35);c.bezierCurveTo(x-z*0.6,y-z*0.1,x-z*0.3,y-z*0.55,x,y-z*0.2);c.bezierCurveTo(x+z*0.3,y-z*0.55,x+z*0.6,y-z*0.1,x,y+z*0.35);c.fill();}
function vis(x,y,m){return x>-m&&x<VW+m&&y>-m&&y<VH+m;}

const FR=normPoly([[-0.05,-0.5],[0.12,-0.42],[0.3,-0.33],[0.45,-0.25],[0.42,-0.05],[0.36,0.1],[0.44,0.28],[0.3,0.38],[0.1,0.36],[-0.05,0.44],[-0.22,0.4],[-0.3,0.3],[-0.28,0.05],[-0.38,-0.1],[-0.5,-0.15],[-0.38,-0.25],[-0.2,-0.28],[-0.12,-0.4]]);
const SAND=normPoly([[-0.5,0.02],[-0.36,-0.28],[-0.05,-0.36],[0.28,-0.3],[0.5,-0.04],[0.4,0.24],[0.1,0.34],[-0.26,0.28]]);

/* ================== DESSIN DES OBJETS (w = taille mesuree en px) ================== */
const DRAW={
universe(c,x,y,w,o,s){const r=w/2;wcirc(c,x,y,r,r,s,"#1d1a3a",INK,lwOf(w));
  for(let i=0;i<260;i++){const a=(hh(s,i)+1)*Math.PI,d=Math.sqrt((hh(s+7,i)+1)/2)*r*0.95;const px=x+Math.cos(a)*d,py=y+Math.sin(a)*d;if(!vis(px,py,5))continue;c.globalAlpha=0.45+0.55*Math.abs(Math.sin(T*1.7+i*1.3));dot(c,px,py,Math.max(0.7,w*0.004),i%3?"#cfd8ff":"#ffd9a8");c.globalAlpha=1;}},
galaxy(c,x,y,w,o,s){const rx=w/2,t=o.tilt;
  c.save();c.translate(x,y);c.scale(1,t);const g=c.createRadialGradient(0,0,0,0,0,rx);g.addColorStop(0,"rgba(255,240,200,0.95)");g.addColorStop(0.3,"rgba(190,170,255,0.35)");g.addColorStop(1,"rgba(120,100,200,0)");c.fillStyle=g;c.beginPath();c.arc(0,0,rx,0,2*Math.PI);c.fill();c.restore();
  for(let arm=0;arm<2;arm++)for(let k=0;k<170;k++){const u=k/170,a=u*4.4+arm*Math.PI+T*0.25,d=(0.06+u*0.94)*rx+hh(s+arm,k)*0.05*rx;const px=x+Math.cos(a)*d,py=y+Math.sin(a)*d*t;if(!vis(px,py,10))continue;dot(c,px,py,Math.max(0.8,w*0.012*(1.1-u)),o.col);}
  c.save();c.translate(x,y);c.scale(1,t);dot(c,0,0,Math.max(1.5,rx*0.08),"#fff3c4");c.restore();},
nebula(c,x,y,w,o,s){const B=[[-0.3,0.05,0.2,"#ff8fc8"],[-0.1,-0.1,0.25,"#c08bff"],[0.15,0.05,0.27,"#8fd0ff"],[0.32,-0.05,0.18,"#ffb27a"],[0.0,0.15,0.2,"#ff9fb0"]];
  c.save();B.forEach((b,i)=>{c.globalAlpha=0.45+0.15*Math.sin(T*1.2+i*1.7);wcirc(c,x+b[0]*w,y+b[1]*w,b[2]*w,b[2]*w*0.8,s+i,b[3],null);});c.restore();
  for(let i=0;i<14;i++){const px=x+hh(s,i)*0.4*w,py=y+hh(s+3,i)*0.25*w;if(vis(px,py,5)){c.globalAlpha=0.4+0.6*Math.abs(Math.sin(T*2+i));dot(c,px,py,Math.max(1,w*0.008),"#fff8c0");c.globalAlpha=1;}}},
solar(c,x,y,w,o,s){const R=[0.013,0.024,0.033,0.051,0.173,0.318,0.64,1],C=["#aaa","#e8c27a","#4f8fe0","#d0603a","#e0b98a","#e8d29a","#9fe0e8","#4a6fe0"];
  R.forEach((f,i)=>{const r=f*w/2;wcirc(c,x,y,r,r,s+i,null,"#999",1.1);const a=(hh(s,i)+1)*Math.PI+T*0.9/Math.pow(f/0.033,1.5);dot(c,x+Math.cos(a)*r,y+Math.sin(a)*r,Math.max(1.5,w*0.008),C[i]);});
  dot(c,x,y,Math.max(2.5,w*0.006),"#ffd23d");},
star(c,x,y,w,o,s){const r=w/2,ra=r*(1.14+0.05*Math.sin(T*2));const g=c.createRadialGradient(x,y,r*0.95,x,y,ra);g.addColorStop(0,o.glow);g.addColorStop(1,"rgba(255,200,50,0)");c.fillStyle=g;c.beginPath();c.arc(x,y,ra,0,2*Math.PI);c.fill();
  c.strokeStyle=o.col;c.lineWidth=Math.max(1,w*0.012);for(let k=0;k<5;k++){const a=k*1.26+T*0.2,h=0.06+0.04*Math.sin(T*3+k*2);c.beginPath();c.arc(x+Math.cos(a)*r,y+Math.sin(a)*r,h*r,a-Math.PI/2+0.4,a+Math.PI/2-0.4,true);c.stroke();}
  wcirc(c,x,y,r,r,s,o.col,INK,lwOf(w));[[0.2,-0.15,0.08],[-0.25,0.2,0.06],[0.05,0.3,0.05]].forEach(b=>dot(c,x+b[0]*w,y+b[1]*w,b[2]*w,"rgba(150,60,0,0.25)"));},
planet(c,x,y,w,o,s){const r=w/2;wcirc(c,x,y,r,r,s,o.col,null);c.save();c.beginPath();c.arc(x,y,r,0,2*Math.PI);c.clip();
  if(o.bands)o.bands.forEach((b,i)=>{c.fillStyle=b;c.fillRect(x-r,y+(-0.6+i*0.45)*r,2*r,r*0.18);c.fillRect(x-r,y+(0.25+i*0.15)*r,2*r,r*0.08);});
  if(o.spot){const sx=((0.3+T*0.08)%2.4+2.4)%2.4-1.2;c.fillStyle="#c0503a";c.beginPath();c.ellipse(x+sx*r,y+0.3*r,0.18*r,0.1*r,0,0,2*Math.PI);c.fill();}
  if(o.land){const ox=T*0.06;[[-0.35,-0.25,0.3,0.22],[0.25,0.1,0.25,0.35],[-0.1,0.45,0.2,0.12],[0.95,-0.2,0.3,0.25],[1.35,0.25,0.22,0.3]].forEach((b,i)=>wcirc(c,x+((b[0]+ox+1.6)%3.2-1.6)*r,y+b[1]*r,b[2]*r,b[3]*r,s+i+3,"#6cbf5a",null));c.fillStyle="rgba(255,255,255,0.9)";c.fillRect(x-r,y-r,2*r,0.12*r);c.fillRect(x-r,y+0.9*r,2*r,0.1*r);}
  if(o.craters)[[-0.3,-0.2,0.15],[0.25,0.3,0.12],[0.35,-0.35,0.08],[-0.1,0.4,0.09],[0.0,0.0,0.06]].forEach((b,i)=>wcirc(c,x+b[0]*r,y+b[1]*r,b[2]*r,b[2]*r,s+10+i,"#a9a9a9","#777",Math.max(0.6,lwOf(w)*0.6)));
  if(o.heart){c.fillStyle="#f4e6d2";heart(c,x+0.15*r,y+0.15*r,0.5*r);}
  c.restore();wcirc(c,x,y,r,r,s,null,INK,lwOf(w));},
saturn(c,x,y,w,o,s){const R=w/2,ry=w*0.12,bw=w*0.085;

  const ob=OBJ[idx],art=ob[2].startsWith("dia")?"le ":ob[2].startsWith("épa")?"l'":"la ";
  document.getElementById("oname").textContent=ob[0]+(PRM.md?" — on mesure : "+art+ob[2]:"");
  resize();if(st.s===null)st.s=RULE_SPAN0/RL();lastUnit=null;SPEED={t0:T,dir:1};FX.length=0;addFX("ZOOM !");
  const v=document.getElementById("view");v.style.animation="none";void v.offsetWidth;v.style.animation="";
  document.getElementById("bExp").style.display=EXPERT?"inline-block":"none";document.getElementById("expVal").textContent="";
}
document.getElementById("bExp").onclick=()=>{if(cur===null)return;const v=SZ[cur],e=Math.floor(Math.log10(v)),m=v/Math.pow(10,e);document.getElementById("expVal").textContent=String(Math.round(m*100)/100).replace(".",",")+" × 10"+String(e).split("").map(ch=>ch==="-"?"⁻":SUP[ch]).join("")+" m";};
document.getElementById("bHome").onclick=()=>{cur=null;document.getElementById("view").style.display="none";document.getElementById("home").style.display="block";};
const S_MIN=6e-15/600,S_MAX=1e28/600;
function zoom(f,quiet){if(!st)return;st.s=Math.min(S_MAX,Math.max(S_MIN,st.s/f));if(quiet)return;SPEED={t0:T,dir:f>1?1:-1};if(Math.abs(Math.log10(f))>0.5)addFX((f>1?ONO_IN:ONO_OUT)[Math.floor(Math.random()*4)],f>1?"#ff5a4e":"#2f7fd8");}
document.getElementById("zmm").onclick=()=>zoom(0.1);
document.getElementById("zm").onclick=()=>zoom(1/1.25);
document.getElementById("zp").onclick=()=>zoom(1.25);
document.getElementById("zpp").onclick=()=>zoom(10);
document.getElementById("bRul").onclick=()=>{if(st){st.rx=0.12;st.ry=0.78;addFX("CLAC !","#2f9e44");}};
cv.addEventListener("wheel",e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*0.0015),true);},{passive:false});
window.addEventListener("resize",()=>{if(cur!==null)resize();});

/* --- regle --- */
const SUP={"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
const UNITS=[[1e-15,"fm"],[1e-12,"pm"],[1e-9,"nm"],[1e-6,"µm"],[1e-3,"mm"],[1e-2,"cm"],[1,"m"],[1e3,"km"],[1e6,"Mm"],[1e9,"Gm"],[1e12,"Tm"],[1e15,"Pm"],[1e18,"Em"],[1e21,"Zm"],[1e24,"Ym"]];
function nice(x){const e=Math.floor(Math.log10(x)),f=x/Math.pow(10,e);const m=f<1.5?1:f<3.5?2:f<7.5?5:10;return [m*Math.pow(10,e),m===10?1:m];}
function unitFor(d){let u=UNITS[0];for(const q of UNITS)if(q[0]<=d*(1+1e-9))u=q;return u;}
function fmt(v){return String(Math.round(v*1e6)/1e6).replace(".",",");}
function rulerBox(){const x0=st.rx*W,y0=st.ry*H,len=RL();return {x0,y0,len,L:x0-16,R:x0+len+86,T:y0,B:y0+52};}
function drawRuler(c){
  const b=rulerBox(),x0=b.x0,y0=b.y0,len=b.len;
  const lift=drag?7:4;c.fillStyle="rgba(17,17,17,0.85)";c.fillRect(b.L+lift,b.T+lift,b.R-b.L,b.B-b.T);
  wpoly(c,[[b.L,b.T],[b.R,b.T],[b.R,b.B],[b.L,b.B]],77,"rgb(255,240,170)",INK,2.5);
  const [d,m]=nice(len*st.s/6),wo=SZ[cur]/st.s,u=(wo>=0.3*len&&wo<=len)?unitFor(SZ[cur]):unitFor(d),ratio=Math.round(d/u[0]*1e6)/1e6,sub=m===1?10:m===2?4:5,dpx=d/st.s;
  c.strokeStyle=INK;c.fillStyle=INK;c.textAlign="center";c.font="15px 'Comic Sans MS','Comic Neue','Chalkboard SE',cursive";
  for(let i=0;;i++){const xx=x0+i*dpx/sub;if(xx>x0+len+0.5)break;const maj=i%sub===0,half=sub===10&&i%5===0&&!maj;
    c.lineWidth=maj?2:1.1;c.beginPath();c.moveTo(xx,y0);c.lineTo(xx,y0+(maj?18:half?12:7));c.stroke();
    if(maj)c.fillText(fmt(i/sub*ratio),xx,y0+36);}
  if(lastUnit!==null&&lastUnit!==u[1])unitT=T;lastUnit=u[1];const ua=Math.min(1,(T-unitT)/0.6),usc=1+0.7*(1-ua)*Math.abs(Math.cos((1-ua)*6));
  if(ua<1)burst(c,x0+len+44,y0+27,22*(1-ua*0.4),0,"rgba(255,90,78,"+(1-ua)+")");
  c.save();c.translate(x0+len+44,y0+27);c.scale(usc,usc);c.font="bold 19px 'Comic Sans MS','Comic Neue','Chalkboard SE',cursive";c.textBaseline="middle";c.lineWidth=3;c.strokeStyle="#fff";c.strokeText(u[1],0,0);c.fillStyle=ua<1?"#c0281c":INK;c.fillText(u[1],0,0);c.restore();c.textBaseline="alphabetic";
}
/* --- glisser la regle --- */
let drag=null;
function pos(e){const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
cv.addEventListener("pointerdown",e=>{if(!st)return;const [x,y]=pos(e),b=rulerBox();if(x>=b.L&&x<=b.R&&y>=b.T&&y<=b.B){drag=[x-b.x0,y-b.y0];cv.setPointerCapture(e.pointerId);cv.style.cursor="grabbing";}});
cv.addEventListener("pointermove",e=>{const [x,y]=pos(e);if(drag){st.rx=Math.min(0.95,Math.max(-0.5,(x-drag[0])/W));st.ry=Math.min(0.9,Math.max(0.02,(y-drag[1])/H));}else if(st){const b=rulerBox();cv.style.cursor=(x>=b.L&&x<=b.R&&y>=b.T&&y<=b.B)?"grab":"default";}});
const endDrag=()=>{drag=null;cv.style.cursor="default";};
cv.addEventListener("pointerup",endDrag);cv.addEventListener("pointercancel",endDrag);

/* --- rendu --- */
function frame(now){
  requestAnimationFrame(frame);T=(now-t0)/1000;if(cur===null){drawCards();return;}
  const c=ctx;VW=W;VH=H;c.setTransform(dpr,0,0,dpr,0,0);c.fillStyle="#fffef8";c.fillRect(0,0,W,H);c.fillStyle=dotPat(c);c.fillRect(0,0,W,H);
  const ob=OBJ[cur],wpx=SZ[cur]/st.s,cx=W/2,cy=H*0.42;
  c.save();c.beginPath();c.rect(0,0,W,H);c.clip();
  if(wpx>60*W){c.fillStyle=fillOf(ob);c.fillRect(0,0,W,H);}
  else if(wpx<4){dot(c,cx,cy,Math.max(1.2,wpx/2),INK);const ph=(now-t0)/400;c.strokeStyle="rgba(214,51,51,"+(0.45+0.3*Math.sin(ph))+")";c.lineWidth=2;c.beginPath();c.arc(cx,cy,11+3*Math.sin(ph),0,2*Math.PI);c.stroke();}
  else DRAW[ob[3]](c,cx,cy,wpx,ob[4],cur*31+7);
  /* limites de l'objet */
  const l1=cx-wpx/2,l2=cx+wpx/2;c.strokeStyle="#d33";c.lineWidth=2.2;c.setLineDash([9,6]);c.lineDashOffset=-T*18;
  for(const lx of [l1,l2])if(lx>-2&&lx<W+2){c.beginPath();c.moveTo(lx,0);c.lineTo(lx,H);c.stroke();}
  c.setLineDash([]);c.lineDashOffset=0;
  if(PRM.md&&wpx>70&&l1>-2&&l2<W+2){const ya=18;c.strokeStyle="#d33";c.lineWidth=1.8;c.beginPath();c.moveTo(l1+2,ya);c.lineTo(l2-2,ya);c.moveTo(l1+10,ya-6);c.lineTo(l1+2,ya);c.lineTo(l1+10,ya+6);c.moveTo(l2-10,ya-6);c.lineTo(l2-2,ya);c.lineTo(l2-10,ya+6);c.stroke();
    c.font="15px 'Comic Sans MS','Comic Neue','Chalkboard SE',cursive";const tx=ob[2],tw=c.measureText(tx).width;if(tw+16<wpx){c.fillStyle="#fffef8";c.fillRect(cx-tw/2-6,ya-10,tw+12,20);c.fillStyle="#d33";c.textAlign="center";c.textBaseline="middle";c.fillText(tx,cx,ya+1);c.textBaseline="alphabetic";}}
  drawRuler(c);drawFX(c);
  c.restore();
}
let PAT=null;function dotPat(c){if(PAT)return PAT;const p=document.createElement("canvas");p.width=p.height=12;const q=p.getContext("2d");q.fillStyle="rgba(40,60,120,0.07)";q.beginPath();q.arc(6,6,1.4,0,2*Math.PI);q.fill();PAT=c.createPattern(p,"repeat");return PAT;}
requestAnimationFrame(frame);
</script>
