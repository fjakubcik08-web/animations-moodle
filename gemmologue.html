<script>
(function(){
"use strict";

/* ---------- Paramètres (URL) ---------- */
const KEY = "Gemmo#PBayle-Comptoir7";
const MAT = {
  D:{n:2.42, rho:3.52, t:0.5},   /* diamant naturel   */
  S:{n:2.42, rho:3.52, t:0.5},   /* diamant synthèse  */
  Z:{n:2.17, rho:5.80, t:5.0},   /* zircone cubique   */
  M:{n:2.65, rho:3.22, t:1.0},   /* moissanite        */
  V:{n:1.65, rho:3.10, t:7.0},   /* verre au plomb    */
  Q:{n:1.54, rho:2.65, t:4.0}    /* quartz            */
};
function decodeP(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/");
  while (s.length % 4) s += "=";
  const bin = atob(s);
  const k = new TextEncoder().encode(KEY);
  const b = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) b[i] = bin.charCodeAt(i) ^ k[i % k.length];
  return JSON.parse(new TextDecoder().decode(b));
}
let P = {o:"DZM", m:[1.204,1.587,0.912], i:"BLT"};
const Q = new URLSearchParams(location.search);
if (Q.get("p")) { try { Object.assign(P, decodeP(Q.get("p"))); } catch(e) {} }
if (Q.get("o")) P.o = Q.get("o").toUpperCase();
if (Q.get("m")) P.m = Q.get("m").split(",").map(Number);
if (Q.get("i")) P.i = Q.get("i").toUpperCase();
for (const key of ["r","n","t"]) if (Q.get(key)) P[key] = Q.get(key).split(",").map(Number);
const LETTERS = "ABCDEF";
const GEMS = [];
for (let k=0;k<Math.min(P.o.length,6);k++){
  const typ = MAT[P.o[k]] ? P.o[k] : "V";
  const mat = Object.assign({}, MAT[typ]);
  if (Array.isArray(P.r) && P.r[k]>0) mat.rho = P.r[k];
  if (Array.isArray(P.n) && P.n[k]>0) mat.n = P.n[k];
  if (Array.isArray(P.t) && P.t[k]>0) mat.t = P.t[k];
  GEMS.push({id:k, name:LETTERS[k], mat:mat, mass:(P.m[k]||2.5), where:"tray"});
}

off.width = W*dpr; off.height = H*dpr;

  L:{x:325, y:165, w:310, h:445, title:"🔦 banc laser", gem:null},

let balMode = "air";

/* ---------- Géométrie ---------- */
const TRAY = {x:10, y:48, w:940, h:105};
function slotPos(k){ const n=GEMS.length; return {x: 480 + (k-(n-1)/2)*110, y: 106}; }
const BAL = {cx:130, panY:305, beakX:55, beakY:420, beakW:150, beakH:170, waterY:448, basketY:535};
const LAS = {cx:480, cy:395, R:140, Rs:110, Rh:170};
const BUE = {cx:800, cy:315, s:2.6};

function gemPos(gm){
  const now=performance.now(), dy=dropOff(gm,now);
  if (gm.where==="tray") { const p=slotPos(gm.id); return {x:p.x, y:p.y+dy, s:1}; }
  if (gm.where==="B"){
    const po=panOff(now), A={x:BAL.cx,y:BAL.panY-14+po}, Bq={x:BAL.cx,y:BAL.basketY-12+po};
    const e=Math.min(1,(now-balMoveT)/520), k=e<0.5?2*e*e:1-Math.pow(-2*e+2,2)/2;
    const from = balMode==="air" ? Bq : A, to = balMode==="air" ? A : Bq;
    return {x:to.x+(from.x-to.x)*(1-k)+Math.sin(k*Math.PI)*28, y:to.y+(from.y-to.y)*(1-k)+dy, s:1};
  }
  if (gm.where==="L") return {x:LAS.cx, y:LAS.cy+55, s:1, hidden:true};
  if (gm.where==="T") return {x:BUE.cx, y:BUE.cy+dy*1.4, s:BUE.s};
  return {x:0,y:0,s:1};
}

/* ---------- Dessin style xkcd ---------- */
const FONT = '"xkcd Script","Humor Sans","Comic Neue","Comic Sans MS","Chalkboard SE","Segoe Print",cursive';
const INK = "#1b1b1b";
function nz(t,s){ return Math.sin(t*1.7+s)*0.6 + Math.sin(t*3.3+s*1.31)*0.4; }
function seedOf(a,b,c2,d){ return ((a*7.13+b*13.7+c2*3.31+d*5.77)%97); }
function wl(c,x1,y1,x2,y2,move,amp){
  const A = amp===undefined ? 1.1 : amp;
  const L = Math.hypot(x2-x1,y2-y1), n = Math.max(2,Math.round(L/10));
  const nx = -(y2-y1)/(L||1), ny = (x2-x1)/(L||1), sd = seedOf(x1,y1,x2,y2);
  if (move!==false) c.moveTo(x1,y1);
  for (let i=1;i<=n;i++){
    const t=i/n, o=A*nz(i,sd)*Math.sin(Math.PI*t);
    c.lineTo(x1+(x2-x1)*t+nx*o, y1+(y2-y1)*t+ny*o);
  }
}
function wpoly(c,pts){ c.beginPath(); c.moveTo(pts[0][0],pts[0][1]); for(let i=0;i<pts.length;i++){ const p=pts[i], q=pts[(i+1)%pts.length]; wl(c,p[0],p[1],q[0],q[1],false); } c.closePath(); }
function wrect(c,x,y,w,h){ wpoly(c,[[x,y],[x+w,y],[x+w,y+h],[x,y+h]]); }
function wellipse(c,cx,cy,rx,ry,amp){
  const A = amp===undefined ? 1.0 : amp, n=Math.max(18,Math.round((rx+ry)/3)), sd=seedOf(cx,cy,rx,ry);
  c.beginPath();
  for (let k=0;k<=n;k++){ const a=k/n*2*Math.PI, r=1+A*nz(k,sd)/Math.max(rx,ry); const x=cx+Math.cos(a)*rx*r, y=cy+Math.sin(a)*ry*r; if(k===0)c.moveTo(x,y); else c.lineTo(x,y); }
  c.closePath();
}
function ink(c,w){ c.strokeStyle=INK; c.lineWidth=w||1.8; c.lineJoin="round"; c.lineCap="round"; }
function text(c,s,x,y,size,color,align,weight){ c.font=(weight||"400")+" "+size+"px "+FONT; c.fillStyle=color||INK; c.textAlign=align||"left"; c.textBaseline="middle"; c.fillText(s,x,y); }

function drawGem(c,x,y,s,label){
  const w=44*s, tw=w*0.55, hc=w*0.24, hp=w*0.48;
  const P=[[x-tw/2,y-hc],[x+tw/2,y-hc],[x+w/2,y],[x,y+hp],[x-w/2,y]];
  wpoly(c,P); c.fillStyle="#ffffff"; c.fill(); ink(c,1.8*Math.max(1,s*0.6)); c.stroke();
  c.beginPath();
  wl(c,x-w/2,y,x+w/2,y,true,0.6);
  wl(c,x-tw/2,y-hc,x-tw/4,y,true,0.5); wl(c,x-tw/4,y,x,y-hc,false,0.5); wl(c,x,y-hc,x+tw/4,y,false,0.5); wl(c,x+tw/4,y,x+tw/2,y-hc,false,0.5);
  wl(c,x-tw/4,y,x,y+hp,true,0.5); wl(c,x+tw/4,y,x,y+hp,true,0.5);
  ink(c,0.9*Math.max(1,s*0.5)); c.stroke();
  c.beginPath(); wl(c,x-tw/2+4*s,y-hc+4*s,x-tw/2+9*s,y-hc+4*s,true,0.3); wl(c,x-tw/2+4*s,y-hc+8*s,x-tw/2+6*s,y-hc+8*s,true,0.3); ink(c,1.2); c.stroke();
  if (label) {
    const r=11*Math.min(s,1.5), lx=x+w/2+5*s, ly=y-hc-5*s;
    wellipse(c,lx,ly,r,r,0.8); c.fillStyle="#ffffff"; c.fill(); ink(c,1.6); c.stroke();
    text(c,label,lx,ly+1,14*Math.min(s,1.5),INK,"center","700");
  }
}

function drawStationFrame(c,k){
  const s=ST[k], hot = drag && hitStation(drag.x,drag.y)===k;
  wrect(c,s.x,s.y,s.w,s.h); c.fillStyle= hot ? "#fff7d6" : "#ffffff"; c.fill(); ink(c, hot?2.6:1.8); c.stroke();
  text(c,s.title,s.x+14,s.y+24,19,INK,"left","700");
  c.beginPath(); wl(c,s.x+14,s.y+38,s.x+14+c.measureText(s.title).width,s.y+38,true,1.2); ink(c,1.2); c.stroke();
  if (s.gem===null) text(c,"(dépose une pierre ici)",s.x+s.w/2,s.y+58,14,"#666","center");
  else text(c,"pierre "+GEMS[s.gem].name,s.x+s.w/2,s.y+58,16,INK,"center","700");
}

  text(c,shown.toFixed(3).replace(".",",")+" g",b.cx+68,255,28,INK,"right","700");
  wrect(c,b.cx-70,b.panY+10,140,20); c.fillStyle="#eeeeee"; c.fill(); ink(c,1.6); c.stroke();
  const po=panOff(performance.now());
  wellipse(c,b.cx,b.panY+po,62,8); c.fillStyle="#ffffff"; c.fill(); ink(c,2); c.stroke();
  c.beginPath(); wl(c,b.cx,b.panY+30,b.cx,b.basketY-18+po,true,0.8); ink(c,1.3); c.stroke();
  c.beginPath(); c.moveTo(b.beakX+3,b.waterY);
  for (let x=b.beakX+3;x<=b.beakX+b.beakW-3;x+=6) c.lineTo(x,b.waterY+Math.sin(x*0.35)*1.6);
  c.lineTo(b.beakX+b.beakW-3,b.beakY+b.beakH-3); c.lineTo(b.beakX+3,b.beakY+b.beakH-3); c.closePath();
  c.fillStyle="#d9ecfa"; c.fill();
  c.beginPath(); wl(c,b.beakX,b.beakY,b.beakX,b.beakY+b.beakH,true); wl(c,b.beakX,b.beakY+b.beakH,b.beakX+b.beakW,b.beakY+b.beakH,false); wl(c,b.beakX+b.beakW,b.beakY+b.beakH,b.beakX+b.beakW,b.beakY,false);
  ink(c,2); c.stroke();
  text(c,"eau",b.beakX+b.beakW-24,b.beakY+b.beakH-16,14,"#2a5d8a","center");
  c.beginPath(); wl(c,b.cx-26,b.basketY-18,b.cx-20,b.basketY+4,true); wl(c,b.cx-20,b.basketY+4,b.cx+20,b.basketY+4,false); wl(c,b.cx+20,b.basketY+4,b.cx+26,b.basketY-18,false);
  wl(c,b.cx-26,b.basketY-18,b.cx,b.basketY-34,true); wl(c,b.cx,b.basketY-34,b.cx+26,b.basketY-18,false); ink(c,1.5); c.stroke();
}

/* ---------- Laser ---------- */
const D2R = Math.PI/180;
let LWS = 1;
function drawLaser(c){
  const L=LAS, st=ST.L, cx=L.cx, cy=L.cy;
  const GW=120, gtw=GW*0.55, ghc=GW*0.24, ghp=GW*0.48;
  const GP=[[cx-gtw/2,cy],[cx+gtw/2,cy],[cx+GW/2,cy+ghc],[cx,cy+ghc+ghp],[cx-GW/2,cy+ghc]];
  if (st.gem!==null){
    wpoly(c,[GP[0],GP[1],GP[2],GP[4]]); c.fillStyle="rgba(222,238,252,0.95)"; c.fill();
    c.beginPath(); wl(c,GP[4][0],GP[4][1],GP[0][0],GP[0][1],true); wl(c,GP[0][0],GP[0][1],GP[1][0],GP[1][1],false); wl(c,GP[1][0],GP[1][1],GP[2][0],GP[2][1],false); ink(c,2.2*LWS); c.stroke();
    c.beginPath(); wl(c,cx-gtw/2,cy,cx-gtw/4,cy+ghc,true,0.6); wl(c,cx+gtw/2,cy,cx+gtw/4,cy+ghc,true,0.6);
    ink(c,0.9*LWS); c.strokeStyle="rgba(27,27,27,0.4)"; c.stroke();
    c.save();
    if ("filter" in c) c.filter="blur("+(5*(LWS===1?1:3))+"px)";
    c.beginPath(); c.moveTo(GP[4][0],GP[4][1]-6); c.lineTo(GP[2][0],GP[2][1]-6); c.lineTo(GP[3][0],GP[3][1]); c.closePath();
    const gr=c.createLinearGradient(0,cy+ghc,0,cy+ghc+ghp);
    gr.addColorStop(0,"rgba(205,225,245,0.85)"); gr.addColorStop(1,"rgba(235,242,250,0.35)");
    c.fillStyle=gr; c.fill();
    c.restore();
  }
  wellipse(c,cx,cy,L.R,L.R,0.6); ink(c,1.6*LWS); c.stroke();
  c.strokeStyle=INK;
  for (let a=0;a<360;a++){
    const t=a*D2R, len = a%10===0?12:(a%5===0?8:4);
    c.lineWidth = (a%10===0?1.3:0.7)*LWS;
    c.beginPath(); c.moveTo(cx+Math.sin(t)*L.R,cy-Math.cos(t)*L.R); c.lineTo(cx+Math.sin(t)*(L.R-len),cy-Math.cos(t)*(L.R-len)); c.stroke();
    if (a%10===0){ let v=a%180; if(v>90) v=180-v; text(c,String(v),cx+Math.sin(t)*(L.R-23),cy-Math.cos(t)*(L.R-23),11,INK,"center"); }
  }
  c.setLineDash([6*LWS,5*LWS]); ink(c,1*LWS); c.strokeStyle="#777";
  c.beginPath(); c.moveTo(cx,cy-L.R); c.lineTo(cx,cy+L.R); c.moveTo(cx-L.R,cy); c.lineTo(cx+L.R,cy); c.stroke();
  c.setLineDash([]);
  const t1=i1*D2R, sx=cx-Math.sin(t1)*L.Rh, sy=cy-Math.cos(t1)*L.Rh;
  const n = st.gem!==null ? GEMS[st.gem].mat.n : 1.0;
  const t2 = Math.asin(Math.sin(t1)/n);
  let dEx = L.R;

  c.strokeStyle="#e01e1e"; c.lineWidth=2.4*LWS; c.lineCap="round";
  c.beginPath(); c.moveTo(sx,sy); c.lineTo(cx,cy); c.lineTo(cx+Math.sin(t2)*dEx,cy+Math.cos(t2)*dEx); c.stroke();
  if (dEx<L.R){ c.setLineDash([3*LWS,5*LWS]); c.lineWidth=1.3*LWS; c.strokeStyle="rgba(224,30,30,0.75)"; c.beginPath(); c.moveTo(cx+Math.sin(t2)*dEx,cy+Math.cos(t2)*dEx); c.lineTo(cx+Math.sin(t2)*L.R,cy+Math.cos(t2)*L.R); c.stroke(); c.setLineDash([]); }
  if (st.gem!==null){ c.strokeStyle="rgba(224,30,30,0.3)"; c.lineWidth=1.6*LWS; c.beginPath(); c.moveTo(cx,cy); c.lineTo(cx+Math.sin(t1)*L.R,cy-Math.cos(t1)*L.R); c.stroke(); }
  /* marques d'angle i1 (incidence) et i2 (refraction), sans valeur */
  if (i1 > 2){
    const r1 = 46;
    c.strokeStyle = "#1f6fb2"; c.lineWidth = 2*LWS;
    c.beginPath(); c.arc(cx, cy, r1, -Math.PI/2 - t1, -Math.PI/2, false); c.stroke();
    const am = -Math.PI/2 - t1/2;
    text(c, "i\u2081", cx + Math.cos(am)*(r1+14), cy + Math.sin(am)*(r1+14), 16, "#1f6fb2", "center", "700");
  }
  if (t2*180/Math.PI > 1.5){
    const r2 = 58;
    c.strokeStyle = "#0f8a5f"; c.lineWidth = 2*LWS;
    c.beginPath(); c.arc(cx, cy, r2, Math.PI/2 - t2, Math.PI/2, false); c.stroke();
    const bm = Math.PI/2 - t2/2;
    text(c, "i\u2082", cx + Math.cos(bm)*(r2+15), cy + Math.sin(bm)*(r2+15), 16, "#0f8a5f", "center", "700");
  }
  c.save(); c.translate(sx,sy); c.rotate(Math.atan2(cy-sy,cx-sx));
  wrect(c,-34,-9,36,18); c.fillStyle="#ffffff"; c.fill(); ink(c,1.8*LWS); c.stroke();
  text(c,"laser",-16,0,10,INK,"center");
  c.restore();
  wellipse(c,sx,sy,10,10,0.8); c.fillStyle= dragHandle ? "rgba(224,30,30,0.35)" : "rgba(224,30,30,0.15)"; c.fill(); c.strokeStyle="#e01e1e"; c.lineWidth=1.8*LWS; c.stroke();
  if (LWS===1){
    text(c,"← attrape le rond rouge",cx+68,585,14,"#555","center");
    const nowL=performance.now();
    if ((dragHandle || nowL-beamT<900) && Math.random()<0.6){ const L1=Math.hypot(cx-sx,cy-sy), L2=L.R; part({type:"photon",sx:sx,sy:sy,cx:cx,cy:cy,ux:Math.sin(t2),uy:Math.cos(t2),L1:L1,L2:dEx,life:420}); }
    if (dragHandle && st.gem!==null && Math.random()<0.25) sparks(cx,cy,1);
    c.save(); c.globalAlpha=0.18+0.1*Math.sin(nowL/120); c.strokeStyle="#ff4d4d"; c.lineWidth=9; c.lineCap="round"; c.beginPath(); c.moveTo(sx,sy); c.lineTo(cx,cy); c.lineTo(cx+Math.sin(t2)*dEx,cy+Math.cos(t2)*dEx); c.stroke(); c.restore();
  }
}

/* ---------- Buée ---------- */
function drawBuee(c,now){
  const b=BUE, st=ST.T;
  wellipse(c,b.cx,b.cy+52,110,24,1.5); c.fillStyle="#efefef"; c.fill(); ink(c,1.6); c.stroke();
  if (st.gem!==null && !(drag && drag.gem===st.gem)){
    drawGem(c,b.cx,b.cy,b.s,GEMS[st.gem].name);
    if (fogStart>0 && now>=fogStart){
      if (!chrono.run && chrono.acc===0){ chrono.run=true; chrono.t0=fogStart; chronoKick=now; boom(705,500,"TIC !","#ffe600",0.5,-0.2); }
      const a = 0.85*(1-(now-fogStart)/fogDur);
      if (a>0.15 && Math.random()<0.12) part({type:"wisp",x:b.cx+(Math.random()-0.5)*60,y:b.cy-30,vx:0,vy:-40,life:900,r:Math.random()*9});
      if (a>0){
        for (let k=0;k<9;k++){
          c.beginPath(); c.ellipse(b.cx+((k*29)%23)-11, b.cy+6+((k*37)%15)-7, 64-k*3, 40-k*2, 0, 0, 2*Math.PI);
          c.fillStyle="rgba(235,240,245,"+(a*0.5).toFixed(3)+")"; c.fill();
        }
        text(c,"pfffff…",b.cx-125,b.cy-40,17,"rgba(60,60,60,"+Math.min(1,a*1.4).toFixed(2)+")","left");
      } else { fogStart=-1; if (chrono.run){ chrono.acc=fogDur; chrono.run=false; chronoKick=now; boom(895,500,"CLAC !","#ff9a3c",0.55,0.2); shake(); } }
    }
  }
  text(c,"chronomètre (démarre avec la buée)",800,477,14,"#555","center");
  const ck=now-chronoKick, cs = ck<300 ? 4*(1-ck/300)*Math.sin(ck/18) : 0;
  c.save(); c.translate(cs,0);
  wrect(c,700,492,200,50); c.fillStyle="#ffffff"; c.fill(); ink(c,2); c.stroke();
  const t = chrono.acc + (chrono.run ? now-chrono.t0 : 0);
  text(c,(t/1000).toFixed(1).replace(".",",")+" s",800,518,30,INK,"center","700");
  c.restore();
}

/* ---------- Effets BD (style comics) ---------- */
const FX = [], PARTS = [];
let shakeT = -1e9, panKick = -1e9, dispRoll = -1e9, balMoveT = -1e9, chronoKick = -1e9, beamT = -1e9;
const NOW = () => performance.now();
const benday = (function(){ const p=document.createElement("canvas"); p.width=p.height=8; const q=p.getContext("2d"); q.fillStyle="rgba(0,0,0,0.22)"; q.beginPath(); q.arc(4,4,1.7,0,2*Math.PI); q.fill(); return p; })();
let bendayPat = null;
function boom(x,y,word,col,big,ang){ FX.push({x,y,word,col:col||"#ffe600",t0:NOW(),dur:900,big:big||1,rot:(ang!==undefined?ang:(Math.random()-0.5)*0.4),seed:Math.random()*100}); }
function shake(){ shakeT = NOW(); }
function part(o){ o.t0=NOW()+(o.delay||0); PARTS.push(o); }
function easeBounce(e){ const n=7.5625,d=2.75; if(e<1/d) return n*e*e; if(e<2/d) return n*(e-=1.5/d)*e+0.75; if(e<2.5/d) return n*(e-=2.25/d)*e+0.9375; return n*(e-=2.625/d)*e+0.984375; }
function dropOff(gm,now){ if(!gm.dropT) return 0; const e=(now-gm.dropT)/550; if(e>=1) return 0; return -90*(1-easeBounce(e)); }
function panOff(now){ const t=now-panKick; return t<1200 ? 7*Math.exp(-t/260)*Math.sin(t/38) : 0; }
function puffs(x,y,n,delay){ for(let k=0;k<n;k++){ const a=Math.PI*(k/(n-1)); part({type:"puff",x:x,y:y,vx:Math.cos(a)*(90+40*Math.random())*(k%2?1:-1),vy:-20-30*Math.random(),life:500,r:6+5*Math.random(),delay:delay||0}); } }
function impact(x,y,delay){ part({type:"lines",x:x,y:y,life:260,delay:delay||0}); }
function splash(x,y,delay){
  for(let k=0;k<16;k++) part({type:"drop",x:x+(Math.random()-0.5)*30,y:y,vx:(Math.random()-0.5)*260,vy:-180-220*Math.random(),life:700,delay:delay});
  for(let k=0;k<3;k++) part({type:"ring",x:x,y:y,life:700,delay:delay+k*120});
  for(let k=0;k<10;k++) part({type:"bubble",x:x+(Math.random()-0.5)*40,y:BAL.basketY-10,vx:(Math.random()-0.5)*10,vy:-45-30*Math.random(),life:1200,r:2+3*Math.random(),delay:delay+250+k*130});
}
function drips(x,y){ for(let k=0;k<6;k++) part({type:"drop",x:x+(Math.random()-0.5)*24,y:y,vx:(Math.random()-0.5)*30,vy:20+40*Math.random(),life:600,delay:150+k*70}); }
function breath(){
  for(let k=0;k<7;k++) part({type:"cloud",x:ST.T.x+10,y:BUE.cy-10+(Math.random()-0.5)*40,vx:430+80*Math.random(),vy:(Math.random()-0.5)*30,life:450,r:14+10*Math.random(),delay:k*45});
  for(let k=0;k<5;k++) part({type:"lines_h",x:ST.T.x+20,y:BUE.cy-40+k*18,life:300,delay:k*30});
}
function sparks(x,y,n){ for(let k=0;k<n;k++){ const a=Math.random()*2*Math.PI, v=60+140*Math.random(); part({type:"spark",x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:420+200*Math.random(),r:5+5*Math.random()}); } }

function star4(c,x,y,r){ c.beginPath(); for(let i=0;i<8;i++){ const a=i*Math.PI/4, rr2=i%2?r*0.3:r; c.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2); } c.closePath(); }
let lastNow = 0;
function drawParts(c,now){
  const dt = Math.min(0.05,(now-lastNow)/1000); lastNow=now;
  for (let k=PARTS.length-1;k>=0;k--){
    const q=PARTS[k]; if (now<q.t0) continue;
    const e=(now-q.t0)/q.life; if (e>=1){ PARTS.splice(k,1); continue; }
    if (q.vx!==undefined){ q.x+=q.vx*dt; q.y+=q.vy*dt; }
    c.save();
    if (q.type==="drop"){ q.vy+=900*dt; c.fillStyle="#3fa9f5"; c.strokeStyle=INK; c.lineWidth=1.2; c.beginPath(); c.ellipse(q.x,q.y,3.2,4.6,Math.atan2(q.vy,q.vx)+Math.PI/2,0,2*Math.PI); c.fill(); c.stroke(); }
    else if (q.type==="ring"){ c.strokeStyle="rgba(30,90,150,"+(1-e).toFixed(2)+")"; c.lineWidth=2; c.beginPath(); c.ellipse(q.x,q.y,12+60*e,3+8*e,0,0,2*Math.PI); c.stroke(); }
    else if (q.type==="bubble"){ if(q.y<BAL.waterY+4){ c.restore(); PARTS.splice(k,1); continue; } c.strokeStyle="#1d5f94"; c.fillStyle="rgba(255,255,255,0.7)"; c.lineWidth=1.2; c.beginPath(); c.arc(q.x+Math.sin(now/90+q.r)*2,q.y,q.r,0,2*Math.PI); c.fill(); c.stroke(); }
    else if (q.type==="puff"){ q.vx*=0.9; c.globalAlpha=1-e; wellipse(c,q.x,q.y,q.r*(1+e),q.r*(1+e)*0.8,0.8); c.fillStyle="#ffffff"; c.fill(); ink(c,1.4); c.stroke(); }
    else if (q.type==="cloud"){ c.globalAlpha=0.9*(1-e*0.6); wellipse(c,q.x,q.y,q.r*(1+e*1.5),q.r*(1+e)*0.75,1.2); c.fillStyle="#eef6ff"; c.fill(); ink(c,1.5); c.stroke(); }
    else if (q.type==="spark"){ q.vx*=0.92; q.vy*=0.92; c.globalAlpha=1-e; star4(c,q.x,q.y,q.r*(1-e*0.5)); c.fillStyle="#ffe600"; c.fill(); ink(c,1.2); c.stroke(); }
    else if (q.type==="photon"){ const L1=q.L1, L2=q.L2, d=e*(L1+L2); let x,y; if(d<L1){ x=q.sx+(q.cx-q.sx)*d/L1; y=q.sy+(q.cy-q.sy)*d/L1; } else { x=q.cx+q.ux*(d-L1); y=q.cy+q.uy*(d-L1); } c.fillStyle="rgba(255,230,0,0.95)"; c.strokeStyle="#c0392b"; c.lineWidth=1; c.beginPath(); c.arc(x,y,3.2,0,2*Math.PI); c.fill(); c.stroke(); }
    else if (q.type==="lines"){ ink(c,2.4); for(let i=0;i<10;i++){ const a=i/10*2*Math.PI, r1=24+30*e, r2=r1+14; c.globalAlpha=1-e; c.beginPath(); c.moveTo(q.x+Math.cos(a)*r1,q.y+Math.sin(a)*r1*0.6); c.lineTo(q.x+Math.cos(a)*r2,q.y+Math.sin(a)*r2*0.6); c.stroke(); } }
    else if (q.type==="lines_h"){ ink(c,2.2); c.globalAlpha=1-e; c.beginPath(); c.moveTo(q.x+e*60,q.y); c.lineTo(q.x+e*60+40,q.y); c.stroke(); }
    else if (q.type==="wisp"){ q.vx=Math.sin(now/120+q.r)*20; c.globalAlpha=0.7*(1-e); ink(c,1.4); c.beginPath(); c.moveTo(q.x,q.y); c.quadraticCurveTo(q.x+8,q.y-8,q.x,q.y-16); c.quadraticCurveTo(q.x-8,q.y-24,q.x,q.y-32); c.stroke(); }
    c.restore();
  }
}

function drawFX(c,now){
  if (!bendayPat) bendayPat = c.createPattern(benday,"repeat");
  for (let k=FX.length-1;k>=0;k--){
    const f=FX[k], e=(now-f.t0)/f.dur;
    if (e>=1){ FX.splice(k,1); continue; }
    const sc = (e<0.15 ? 0.2+(e/0.15)*1.1 : (e<0.28 ? 1.3-(e-0.15)/0.13*0.3 : 1+0.06*(e-0.28)))*f.big;
    const al = e<0.75 ? 1 : 1-(e-0.75)/0.25;
    c.save(); c.globalAlpha=al; c.translate(f.x,f.y-14*e); c.rotate(f.rot); c.scale(sc,sc);
    for (let i=0;i<22;i++){ const a=i/22*2*Math.PI+f.seed, r1=62+((i*17)%5)*3, r2=r1+26+((i*29)%4)*12, w=3+((i*7)%3);
      c.beginPath(); c.moveTo(Math.cos(a-0.03)*r1*1.3,Math.sin(a-0.03)*r1*0.85); c.lineTo(Math.cos(a)*r2*1.3,Math.sin(a)*r2*0.85); c.lineTo(Math.cos(a+0.03)*r1*1.3,Math.sin(a+0.03)*r1*0.85); c.closePath(); c.fillStyle=INK; c.fill(); }
    const N=13; c.beginPath();
    for (let i=0;i<=N*2;i++){ const a=i/(N*2)*2*Math.PI+f.seed, r=(i%2? 34 : 58)+((i*53+f.seed)%9); c.lineTo(Math.cos(a)*r*1.3,Math.sin(a)*r*0.88); }
    c.closePath(); c.fillStyle="#e3141b"; c.fill(); c.lineWidth=4; c.strokeStyle=INK; c.stroke();
    c.beginPath();
    for (let i=0;i<=N*2;i++){ const a=i/(N*2)*2*Math.PI+f.seed+0.12, r=(i%2? 26 : 44)+((i*31+f.seed)%7); c.lineTo(Math.cos(a)*r*1.3,Math.sin(a)*r*0.88); }
    c.closePath(); c.fillStyle=f.col; c.fill(); c.save(); c.clip(); c.fillStyle=bendayPat; c.fillRect(-90,-70,180,140); c.restore(); c.lineWidth=2.5; c.stroke();
    c.transform(1,0,-0.22,1,0,0);
    c.font="700 34px "+FONT; c.textAlign="center"; c.textBaseline="middle"; c.lineJoin="round";
    for (let d=6; d>0; d--){ c.fillStyle="#7a0c10"; c.fillText(f.word,d*0.9,2+d); }
    c.lineWidth=7; c.strokeStyle=INK; c.strokeText(f.word,0,2);
    c.fillStyle="#ffffff"; c.fillText(f.word,0,2);
    c.restore();
  }
}

/* ---------- Rendu ---------- */
function render(now){
  g.fillStyle="#ffffff"; g.fillRect(0,0,W,H);
  drawTray(g);
  for (const k of ACTIVE) drawStationFrame(g,k);
  if (ACTIVE.indexOf("B")>=0) drawBalance(g);
  if (ACTIVE.indexOf("L")>=0) drawLaser(g);
  if (ACTIVE.indexOf("T")>=0) drawBuee(g,now);
  drawButtons(g);
  for (const gm of GEMS){
    if (drag && drag.gem===gm.id) continue;
    if (gm.where==="T") continue;
    const p=gemPos(gm); if (p.hidden) continue;
    drawGem(g,p.x,p.y,p.s,gm.name);
  }
  if (drag) drawGem(g,drag.x,drag.y,1.2,GEMS[drag.gem].name);
  drawParts(g,now);
  drawFX(g,now);

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,cv.width,cv.height);
  const se=(now-shakeT)/220;
  if (se<1){ const A=8*(1-se)*dpr; ctx.drawImage(off,Math.sin(now*0.09)*A,Math.cos(now*0.11)*A); }
  else ctx.drawImage(off,0,0);
  if (loupe && ptr.inside && hitStation(ptr.x,ptr.y)==="L" && !drag){
    const Z=3, r=70, cx=ptr.x, cy=ptr.y;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx*dpr,cy*dpr,r*dpr,0,2*Math.PI); ctx.clip();
    ctx.setTransform(dpr*Z,0,0,dpr*Z,dpr*(cx-Z*cx),dpr*(cy-Z*cy));
    ctx.fillStyle="#ffffff"; ctx.fillRect(cx-r/Z,cy-r/Z,2*r/Z,2*r/Z);
    LWS=0.45; drawLaser(ctx); LWS=1;
    ctx.restore();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.beginPath(); ctx.arc(cx*dpr,cy*dpr,r*dpr,0,2*Math.PI);
    ctx.strokeStyle=INK; ctx.lineWidth=2.5*dpr; ctx.stroke();
  }
  requestAnimationFrame(render);
}

/* ---------- Interaction ---------- */
function toLocal(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height}; }
function hitStation(x,y){
  for (const k of ACTIVE){ const s=ST[k]; if (x>=s.x && x<=s.x+s.w && y>=s.y && y<=s.y+s.h) return k; }
  return null;
}
function hitGem(x,y){
  for (let k=GEMS.length-1;k>=0;k--){
    const gm=GEMS[k], p=gemPos(gm);
    if (gm.where==="L"){
      const dx=Math.abs(x-LAS.cx), dy=y-LAS.cy;
      if (dy>0 && dy<90 && dx < 64-dy*0.55) return gm.id;
      continue;
    }
    const r=26*p.s;
    if (Math.abs(x-p.x)<r && Math.abs(y-p.y)<r) return gm.id;
  }
  return null;
}
function placeGem(id,k){
  const gm=GEMS[id];
  if (gm.where!=="tray" && ST[gm.where]) ST[gm.where].gem=null;
  if (k && ST[k]){
    if (ST[k].gem!==null) GEMS[ST[k].gem].where="tray";
    ST[k].gem=id; gm.where=k;
    if (k==="T") fogStart=-1;
  } else gm.where="tray";
}

cv.addEventListener("pointerdown",e=>{
  const p=toLocal(e); ptr={x:p.x,y:p.y,inside:true};
  for (const b of BTN){
    if (ACTIVE.indexOf(b.st)<0) continue;
    if (p.x>=b.x && p.x<=b.x+b.w && p.y>=b.y && p.y<=b.y+b.h){ b.fn(); e.preventDefault(); return; }
  }
  if (ACTIVE.indexOf("L")>=0){
    const t1=i1*D2R, sx=LAS.cx-Math.sin(t1)*LAS.Rh, sy=LAS.cy-Math.cos(t1)*LAS.Rh;
    if ((p.x-sx)**2+(p.y-sy)**2 < 22*22){ dragHandle=true; cv.setPointerCapture(e.pointerId); e.preventDefault(); return; }
  }
  const id=hitGem(p.x,p.y);
  if (id!==null){ drag={gem:id,x:p.x,y:p.y}; cv.setPointerCapture(e.pointerId); e.preventDefault(); }
});
cv.addEventListener("pointermove",e=>{
  const p=toLocal(e); ptr={x:p.x,y:p.y,inside:true};
  if (dragHandle){
    const dx=LAS.cx-p.x, dy=LAS.cy-p.y;
    let a=Math.atan2(dx,dy)/D2R;
    i1=Math.max(0,Math.min(85,a));
  } else if (drag){ drag.x=p.x; drag.y=p.y; }
});
cv.addEventListener("pointerup",e=>{
  if (dragHandle){ dragHandle=false; if (ST.L.gem!==null){ beamT=NOW(); sparks(LAS.cx,LAS.cy,14); boom(LAS.cx+100,LAS.cy-178,"ZAP !","#ffe600",0.6,0.15); } return; }
  if (drag){ const p=toLocal(e), k=hitStation(p.x,p.y); placeGem(drag.gem, k); const gmD=GEMS[drag.gem]; gmD.dropT=NOW(); if(k){ const q=gemPos(gmD); const W2=["POW !","BAM !","PAF !","BOUM !"][drag.gem%4];
      if(k==="L"){ beamT=NOW(); sparks(LAS.cx,LAS.cy,18); boom(LAS.cx+95,LAS.cy-175,W2,"#ffe600",0.6,0.12); }
      else { const by = k==="T" ? BUE.cy+45 : (balMode==="air" ? BAL.panY-4 : BAL.basketY); puffs(q.x,by,8,200); impact(q.x,by,190);
             if(k==="B"){ panKick=NOW()+200; dispRoll=NOW()+150; if(balMode==="eau") splash(BAL.cx,BAL.waterY,220); }
             setTimeout(()=>{ boom(k==="T"?BUE.cx-70:BAL.cx+40, k==="T"?BUE.cy-90:BAL.panY+75, W2, "#ffe600", 0.6, (Math.random()-0.5)*0.4); shake(); },190); } } drag=null; }
});
cv.addEventListener("pointerleave",()=>{ ptr.inside=false; });

requestAnimationFrame(render);
})();
</script>
