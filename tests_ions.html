<script>
"use strict";
/* ===================== DÉCODAGE PARAMÈTRES ===================== */
//<DECODE>
const CLE_IONS = "PBayle-Ions#Precip-2026";
function decodeP(p){
  let s = p.replace(/-/g,"+").replace(/_/g,"/");
  while (s.length % 4) s += "=";
  const bin = atob(s);
  const k = new TextEncoder().encode(CLE_IONS);
  const b = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i) ^ k[i % k.length];
  return JSON.parse(new TextDecoder().decode(b));
}
//</DECODE>

/* ===================== DONNÉES CHIMIE ===================== */

const UNIT_ML = 1.5;   // quantité de chaque ion par mL de solution
let SOL = {};
function setSolution(list){ SOL = {}; list.forEach(i => SOL[i] = UNIT_ML); }
setSolution(CFG.ions);
function solDans(vol){ const o = {}; for (const k in SOL) o[k] = SOL[k]*vol; return o; }

/* ===================== ÉQUILIBRE (sans mémoire) ===================== */
function equil(sol, reag, reel){
  const S = Object.assign({}, sol), R = Object.assign({}, reag);
  const g  = i => (S[i]||0) + (R[i]||0);
  const gR = i => R[i]||0;
  const take = (i,n) => { const r = R[i]||0, a = Math.min(r,n); R[i] = r-a; n -= a; if (n > 1e-9) S[i] = Math.max(0,(S[i]||0)-n); };
  const add = (i,n) => { R[i] = (R[i]||0) + n; };
  let gas = 0, n;
  // 1) acide
  n = Math.min(g("H"), g("OH"));   take("H",n); take("OH",n);
  n = Math.min(g("H"), g("NH3"));  take("H",n); take("NH3",n); add("NH4",n);
  n = Math.min(g("H")/2, g("CO3"));take("H",2*n); take("CO3",n); gas += n;
  n = Math.min(g("H")/2, g("PO4"));take("H",2*n); take("PO4",n);
  n = Math.min(g("H"), g("C2O4")); take("H",n); take("C2O4",n);
  // 2) précipitations
  const ppt = {};
  for (const r of RULES) {
    const [id,c,x,a,b,,, ,,mode] = r;
    if (mode === "s" && !reel) continue;
    let avX, avXR;
    if (x === "OH") { avX = g("OH") + g("NH3"); avXR = avX; }
    else if (mode === "r" && !reel) { avX = gR(x); avXR = avX; }
    else { avX = g(x); avXR = gR(x); }
    const nn = Math.min(g(c)/a, avX/b, gR(c)/a + avXR/b);
    if (!(nn > 1e-6)) continue;
    take(c, nn*a);
    if (x === "OH") {
      let need = nn*b; const o = Math.min(g("OH"), need); take("OH",o); need -= o;
      if (need > 1e-9) { take("NH3",need); add("NH4",need); }
    } else take(x, nn*b);
    ppt[id] = (ppt[id]||0) + nn;
  }
  // 3) ammonium + hydroxyde -> ammoniac
  n = Math.min(g("NH4"), g("OH")); take("NH4",n); take("OH",n); add("NH3",n);
  // 4) hydroxydes amphotères
  for (const [id,k] of [["ZnOH",2],["PbOH",2],["AlOH",1]]) {
    if (ppt[id]) { const d = Math.min(ppt[id], g("OH")/k); ppt[id] -= d; take("OH", d*k); }
  }
  // 5) complexes ammine
  const col = {};
  for (const [id,k,sp] of [["AgOH",2,null],["AgCl",2,null],["CuOH",4,"CuNH3"],["NiOH",6,"NiNH3"],["ZnOH",4,null]]) {
    if (ppt[id]) { const d = Math.min(ppt[id], g("NH3")/k); ppt[id] -= d; take("NH3", d*k); if (sp) col[sp] = (col[sp]||0) + d; }
  }
  // 6) espèces colorées dissoutes
  for (const sp of ["Cu","Fe2","Fe3","Ni","Mn","CrO4","FeCN6","FeCN3"]) col[sp] = (col[sp]||0) + g(sp);
  n = Math.min(col.Fe3, g("SCN")); col.FeSCN = n; col.Fe3 -= n;
  n = Math.min(col.Fe3, col.FeCN3); col.Fe3FeCN3 = n; col.Fe3 -= n; col.FeCN3 -= n;
  return {ppt, col, gas, nh3: g("NH3")};
}

/* ===================== OUTILS COULEUR ===================== */
function hex2rgb(h){ const v = parseInt(h.slice(1),16); return [v>>16&255, v>>8&255, v&255]; }
function lerpRGB(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function rgba(c,a){ return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`; }
function couleurSolution(col, vol){
  let w = 0, acc = [0,0,0];
  for (const k in col) {
    if (!SOLCOL[k] || col[k] <= 1e-6) continue;
    const wi = col[k] * SOLCOL[k][1] / vol; const c = hex2rgb(SOLCOL[k][0]);
    acc = [acc[0]+c[0]*wi, acc[1]+c[1]*wi, acc[2]+c[2]*wi]; w += wi;
  }
  if (w < 1e-6) return {c:[190,218,242], a:.3};
  return {c:[acc[0]/w, acc[1]/w, acc[2]/w], a: Math.min(.92, .2 + w*.12)};
}
function couleurPpt(id, age){
  const r = RULE[id]; const c0 = hex2rgb(r[5]);
  if (!r[6]) return c0;
  return lerpRGB(c0, hex2rgb(r[6]), 1 - Math.exp(-age / r[7]));
}

const HMAX = 235, PX_ML = 52, PX_GOUTTE = 2.4, ML_GOUTTE = 0.05;

/* ----- outils tube ----- */
function hauteurLiquide(t){ return Math.min(HMAX, t.solVol*PX_ML + t.drops*PX_GOUTTE); }
function niveau(t){ return TBOT - hauteurLiquide(t); }
function demiLargeur(y){ if (y <= TSTRAIGHT) return TR - 3; const dy = y - TSTRAIGHT; return Math.max(0, Math.sqrt(Math.max(0, TR*TR - dy*dy)) - 3); }
function volTube(t){ return t.solVol + t.drops*ML_GOUTTE; }
function pathTube(){
  ctx.beginPath();
  ctx.moveTo(-TR, TTOP); ctx.lineTo(-TR, TSTRAIGHT);
  ctx.arc(0, TSTRAIGHT, TR, Math.PI, 0, true);
  ctx.lineTo(TR, TTOP);
}
function pileHauteur(t){ let s = 0; for (const id in t.parts) s += t.parts[id].length; return Math.min(75, 4 + Math.sqrt(s)*2.2); }

function recalcule(t){
  const res = equil(solDans(t.solVol), t.reag, CFG.reel);
  t.res = res;
  const dg = res.gas - t.gasPrev;
  if (dg > 1e-6) for (let k = 0; k < Math.min(140, 30 + dg*60); k++) t.bubbles.push(bulle(t));
  t.gasPrev = res.gas;
  t.nh3 = res.nh3;
  const lvl = niveau(t);
  const ids = new Set([...Object.keys(res.ppt), ...Object.keys(t.parts)]);
  for (const id of ids) {
    const amt = res.ppt[id] || 0, vis = RULE[id][8];
    const cible = Math.min(PART_MAX, Math.round(amt * vis * PART_PAR_UNITE));
    const arr = t.parts[id] || (t.parts[id] = []);
    if (amt > 0.02 && t.age[id] === undefined) t.age[id] = tNow;
    if (amt <= 0.02) delete t.age[id];
    while (arr.length > cible) arr.splice((Math.random()*arr.length)|0, 1);
    const ph = pileHauteur(t);
    while (arr.length < cible) {
      const restY = TBOT - 3 - Math.pow(Math.random(),1.4) * ph;
      const hw = demiLargeur(restY);
      arr.push({x: (Math.random()*2-1)*hw, y: lvl + 4 + Math.random()*Math.min(60, TBOT-lvl-8),
                vy: 0, vmax: .18 + Math.random()*.38, restY, s: 1.6 + Math.random()*1.6});
    }
    if (!arr.length) delete t.parts[id];
  }
}
function bulle(t){
  const lvl = niveau(t);
  return {x: (Math.random()*2-1)*(TR-5), y: TBOT - 6 - Math.random()*(TBOT-lvl-10)*.5,
          r: 1 + Math.random()*2.6, vy: .6 + Math.random()*1.4, d: Math.random()*120};
}
const testsFaits = new Set();   // réactifs testés sur la solution (même si le tube a été vidé ensuite)
function ajouterGoutte(t, code){
  if (t.solVol > 0) testsFaits.add(code);
  const r = REAC[code];
  for (const k in r.ions) t.reag[k] = (t.reag[k]||0) + r.ions[k];
  t.drops++;
  const last = t.log[t.log.length-1];
  if (last && last.c === code) last.n++; else t.log.push({c: code, n: 1});
  recalcule(t);
}
function agiterTube(t, force){
  const lvl = niveau(t);
  for (const id in t.parts) for (const p of t.parts[id]) {
    if (Math.random() < force) { p.y = lvl + 4 + Math.random()*(TBOT-lvl-10); p.vy = 0; p.x = (Math.random()*2-1)*demiLargeur(p.y); }
  }
}

/* ----- cibles ----- */
function tubeSous(x, y, dxMax, yHaut, yBas){
  for (const t of tubes) {
    if (t.state !== "rack") continue;
    if (Math.abs(x - t.x) < dxMax && y > t.dy + TTOP - yHaut && y < t.dy + TTOP + yBas) return t;
  }
  return null;
}
let refus = null;   // {t, msg}
let FILTRAT = null; // {vol, d} : volume de filtrat disponible (null = illimité)
function becherCible(){
  const t = tubeSous(becher.sx, becher.sy, TR + 10, 120, 15);
  if (!t) return null;
  if (t.drops > 0) { refus = {t, msg: "Réactif déjà ajouté"}; return null; }
  if (t.solVol >= VOL_MAX) { refus = {t, msg: "Volume suffisant"}; return null; }
  if (FILTRAT && FILTRAT.vol <= 0.01) { refus = {t, msg: "Plus de filtrat"}; return null; }
  return t;
}
function flaconCible(f){
  const t = tubeSous(f.x, f.y, TR - 3, 70, 25);
  if (!t) return null;
  if (t.solVol <= 0.05) { refus = {t, msg: "Verser d'abord la solution"}; return null; }
  if (t.log.length && t.log[0].c !== f.c) { refus = {t, msg: "Un seul réactif par tube"}; return null; }
  return t;
}

/* ----- pointeur ----- */
function posSouris(e){
  const rc = cv.getBoundingClientRect();
  return {x: (e.clientX - rc.left) * W / rc.width, y: (e.clientY - rc.top) * H / rc.height};
}
function surFlacon(x, y){
  for (const f of flacons) if (f.state === "home" && Math.abs(x - f.hx) < 20 && y > f.hy - 72 && y < f.hy + 4) return f;
  return null;
}
function surBecher(x, y){ return becher.state === "home" && x > becher.sx - BW - 6 && x < becher.sx + 8 && y > becher.sy - 8 && y < becher.sy + BH + 4; }
function surTube(x, y){
  for (const t of tubes) if (t.state === "rack" && Math.abs(x - t.x) < TR + 6 && y > t.dy + TTOP - 6 && y < t.dy + TBOT + 6) return t;
  return null;
}
let termine = false;
cv.addEventListener("pointerdown", e => {
  if (etape === 0) { E1.down(e); return; }

  let f, t;
  if ((f = surFlacon(m.x, m.y))) {

  } else if (surBecher(m.x, m.y)) {
    becher.state = "drag"; drag = {type: "becher", offX: becher.sx - m.x, offY: becher.sy - m.y};

    t.state = "drag"; drag = {type: "tube", ref: t, offX: t.x - m.x, offY: t.dy - m.y, lx: m.x, ly: m.y, v: 0};

cv.addEventListener("pointermove", e => {

    hover = surFlacon(m.x, m.y);

  }

  else if (drag.type === "becher") { becher.sx = m.x + drag.offX; becher.sy = m.y + drag.offY; }
  else if (drag.type === "tube") { const t = drag.ref; t.x = m.x + drag.offX; t.dy = m.y + drag.offY; }
});
function relacher(){
  if (etape === 0) { E1.up(); return; }
  if (!drag) return;
  if (drag.type === "flacon") drag.ref.state = "retour";
  else if (drag.type === "becher") becher.state = "retour";
  else if (drag.type === "tube") {
    const t = drag.ref;
    if ((t.solVol > 0 || t.drops > 0) && t.x > DECHETS.x - 15 && t.x < DECHETS.x + DECHETS.w + 15 && t.dy + TBOT < DECHETS.y + DECHETS.h) {
      t.state = "vidage"; t.vid = {t: 0, x0: t.x, y0: t.dy};

}
cv.addEventListener("pointerup", relacher);
cv.addEventListener("pointercancel", relacher);

/* ----- mise à jour ----- */
function maj(dt){
  refus = null;
  // bécher
  let cibleB = null;
  if (becher.state === "drag") cibleB = becherCible();
  const angB = cibleB ? 0.95 : 0;
  becher.ang += (angB - becher.ang) * Math.min(1, dt*7);
  if (becher.state === "retour") {
    becher.sx += (becher.hx - becher.sx) * Math.min(1, dt*10); becher.sy += (becher.hy - becher.sy) * Math.min(1, dt*10);
    if (Math.hypot(becher.hx - becher.sx, becher.hy - becher.sy) < 1 && becher.ang < .02) { becher.sx = becher.hx; becher.sy = becher.hy; becher.state = "home"; }
  }
  becher.verse = null;
  if (cibleB && becher.ang > 0.8) {
    let dv = Math.min(VOL_MAX - cibleB.solVol, 0.8 * dt);
    if (FILTRAT) { dv = Math.min(dv, FILTRAT.vol); FILTRAT.vol -= dv; }
    cibleB.solVol += dv; becher.verse = cibleB; recalcule(cibleB);
  }
  // flacons
  for (const f of flacons) {
    if (f.state === "drag") {
      const t = flaconCible(f);
      if (t) { f.dripT += dt; if (f.dripT >= 0) { f.dripT = -0.3; drops.push({x: f.x, y: f.y + 2, vy: 0, t, code: f.c}); } }
      else f.dripT = Math.min(f.dripT, -0.15);
    } else if (f.state === "retour") {
      f.x += (f.hx - f.x) * Math.min(1, dt*12); f.y += (f.hy - f.y) * Math.min(1, dt*12);
      if (Math.hypot(f.hx - f.x, f.hy - f.y) < 1) { f.x = f.hx; f.y = f.hy; f.state = "home"; }
    }
  }
  // gouttes
  for (let k = drops.length-1; k >= 0; k--) {
    const d = drops[k]; d.vy += 900*dt; d.y += d.vy*dt;
    const fond = d.t.dy + (d.t.solVol || d.t.drops ? niveau(d.t) : TBOT - 4);
    if (d.t.state !== "rack") { drops.splice(k,1); continue; }
    if (d.y >= fond) { drops.splice(k,1); ajouterGoutte(d.t, d.code); }
  }
  // tubes
  for (const t of tubes) {
    if (t.state === "drag") {
      const v = Math.hypot(mouse.x - drag.lx, mouse.y - drag.ly) / Math.max(dt, 1e-3);
      drag.v = drag.v*0.7 + v*0.3; drag.lx = mouse.x; drag.ly = mouse.y;
      if (drag.v > 350) agiterTube(t, Math.min(.5, (drag.v - 350)/3000));
    } else if (t.state === "retour") {
      const sx = SLOTS[t.i];
      t.x += (sx - t.x) * Math.min(1, dt*12); t.dy += (0 - t.dy) * Math.min(1, dt*12); t.ang *= Math.max(0, 1 - dt*12);
      if (Math.hypot(sx - t.x, t.dy) < 0.8) { t.x = sx; t.dy = 0; t.ang = 0; t.state = "rack"; }
    } else if (t.state === "vidage") {
      const v = t.vid; v.t += dt;
      const px = DECHETS.x + DECHETS.w/2 - 30, py = DECHETS.y - 70 - TTOP;   // embouchure au-dessus du bidon
      const a = Math.min(1, v.t/0.3);
      t.x = v.x0 + (px - v.x0)*a; t.dy = v.y0 + (py - v.y0)*a;
      if (v.t < 0.3) t.ang = 0;
      else if (v.t < 0.65) t.ang = 2.2 * (v.t - 0.3)/0.35;
      else if (v.t < 1.35) t.ang = 2.2;
      else t.ang = 2.2 * Math.max(0, 1 - (v.t - 1.35)/0.3);
      v.frac = Math.max(0, Math.min(1, (v.t - 0.55)/0.7));
      if (v.t >= 1.25 && !v.reset) { Object.assign(t, contenuVide()); v.reset = true; }
      if (v.t >= 1.65) { t.state = "retour"; t.vid = null; }
    }
    // particules
    for (const id in t.parts) for (const p of t.parts[id]) {
      if (p.y < p.restY) {
        p.vy = Math.min(p.vmax, p.vy + 0.01);
        p.y = Math.min(p.restY, p.y + p.vy * dt * 33);
        p.x += (Math.random()-.5)*0.35;
        const hw = demiLargeur(p.y); p.x = Math.max(-hw, Math.min(hw, p.x));
      }
    }
    const lvl = niveau(t);
    for (const b of t.bubbles) { if (b.d > 0) { b.d -= dt*60; continue; } b.y -= b.vy*dt*60; b.x += Math.sin(b.y*.2)*.3; }
    t.bubbles = t.bubbles.filter(b => b.y > lvl + 1);
  }
}

/* ----- dessin ----- */
function couleurTube(t){ return couleurSolution(t.res ? t.res.col : {}, volTube(t) + 0.3); }

function dessinerTube(t){
  const lvl0 = niveau(t);

      }

        for (const p of t.parts[id]) if (p.y > lvl) ctx.fillRect(p.x - p.s/2 - .6, p.y - p.s/2 - .6, p.s + 1.2, p.s + 1.2);

  ctx.fillStyle = "rgba(120,140,160,.12)"; ctx.fillRect(-TR+4, TTOP+6, 4, TSTRAIGHT-TTOP-10);
  ctx.strokeStyle = "#6b7785"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-TR-4, TTOP); ctx.lineTo(TR+4, TTOP); ctx.stroke();
  if (t.nh3 > 0.4 && t.ang === 0) {
    ctx.strokeStyle = `rgba(90,110,135,${.45 + .25*Math.sin(tNow*3)})`; ctx.lineWidth = 1.5;
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath();
      for (let y = 0; y < 40; y += 2) { const x = k*11 + Math.sin(y*.25 + tNow*4 + k)*3; y ? ctx.lineTo(x, TTOP-6-y) : ctx.moveTo(x, TTOP-6-y); }
      ctx.stroke();
    }
    ctx.fillStyle = "rgba(70,90,115,.85)"; ctx.font = "11px system-ui"; ctx.textAlign = "center";

    const mx = t.x + Math.sin(t.ang)*0, my = t.dy + TTOP;
    ctx.strokeStyle = rgba(cs.c, Math.max(.5, cs.a)); ctx.lineWidth = 3;

}
function etiquettesTubes(){

/* ----- boucle ----- */
let tPrev = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - tPrev)/1000); tPrev = now; tNow += dt;
  if (etape === 0) { ctx.clearRect(0,0,W,H); E1.maj(dt); E1.dessiner(); requestAnimationFrame(frame); return; }
  maj(dt);
  ctx.clearRect(0,0,W,H);

  if (becher.state !== "home") dessinerBecher();

/* ===================== ÉTAPE 1 : DISSOLUTION + FILTRATION ===================== */
const E1 = (() => {
/* ---------- couleur de la solution (selon ?ions=..., démo) ---------- */
function mix(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
const EAU = [190,218,242], SABLE = [201,165,107];
let SOL = {c: EAU, a: .3};
function initCouleur(){ const cs = couleurSolution(equil(solDans(3), {}, CFG.reel).col, 3); SOL = {c: cs.c, a: Math.max(.3, cs.a)}; }
function couleurLiquide(d, susp){        // d = avancement de la dissolution, susp = sable en suspension
  const c = mix(EAU, SOL.c, d), a = .3 + (SOL.a - .3)*d;
  return {c: mix(c, SABLE, Math.min(1, susp)), a: Math.min(.92, a + susp*.55)};
}

/* ---------- scène ---------- */
const BENCH = 470;
let tNow = 0, drag = null, mouse = {x:0,y:0}, refus = null, flashMsg = null, flashT = 0;

// Bécher de sable : bec verseur en (sx, sy), corps à gauche du bec
const BW = 120, BH = 130, VMAX = 50, PXML = 1.5, SABLE_H = 28;
const tourb = {k: 0, p: Array.from({length: 90}, () => ({a: Math.random()*6.283, r: .15 + Math.random()*.85, h: Math.random(), s: 1.5 + Math.random()*2}))};
const eclats = [];
let melangeFait = false;
const bech = {hx: 330, hy: BENCH - BH, sx: 330, sy: BENCH - BH, ang: 0, state: "home",
              vol: 0, sable: 1, d: 0, susp: 0, verse: null};
// Pissette : position de la pointe de l'embout
const PT = {x: 52, y: -150};                       // pointe dans le repère local (base = 0,0)
const pis = {hx: 130 + PT.x, hy: BENCH + PT.y, x: 130 + PT.x, y: BENCH + PT.y, ang: 0, state: "home", jet: false};
// Filtration
const FX = 660, FT = 190, FHW = 62, FA = 290, STEM = 362, FVMAX = 45;
const filtre = {vol: 0, d: 0, susp: 0, depot: 0, dropT: 0};
const fiole = {vol: 0, d: 0};
const drops = [];
// Spatule : position de la pointe (bout de la lame)
const SPL = 135, MELANGE_OK = .95;
const spat = {hx: 405, hy: BENCH - 4, x: 405, y: BENCH - 4, state: "home", dans: false, v: 0, lx: 0, ly: 0};

/* ---------- entrées ---------- */
function pos(e){ const r = cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height}; }
function surBecher(m){ return bech.state === "home" && m.x > bech.sx - BW - 6 && m.x < bech.sx + 8 && m.y > bech.sy - 8 && m.y < bech.sy + BH + 4; }
function surSpatule(m){ return spat.state === "home" && m.x > spat.hx - 10 && m.x < spat.hx + SPL + 10 && m.y > spat.hy - 12 && m.y < spat.hy + 8; }
function surPissette(m){ const bx = pis.x - PT.x, by = pis.y - PT.y; return pis.state === "home" && m.x > bx - 32 && m.x < bx + 56 && m.y > by - 170 && m.y < by + 2; }
function down(e){
  const m = pos(e); mouse = m;
  if (surSpatule(m)) { spat.state = "drag"; spat.x = m.x; spat.y = m.y + SPL - 15; spat.lx = spat.x; spat.ly = spat.y; drag = {o: spat}; }
  else if (surPissette(m)) { pis.state = "drag"; drag = {o: pis, ox: pis.x - m.x, oy: pis.y - m.y}; }
  else if (surBecher(m)) { bech.state = "drag"; drag = {o: bech, ox: bech.sx - m.x, oy: bech.sy - m.y, lx: m.x, ly: m.y, v: 0}; }
  else return;
  cv.setPointerCapture(e.pointerId); cv.style.cursor = "grabbing";
}
function move(e){
  const m = pos(e); mouse = m;
  if (!drag) { cv.style.cursor = (surSpatule(m) || surPissette(m) || surBecher(m)) ? "grab" : "default"; return; }
  if (drag.o === spat) {
    spat.x = m.x; spat.y = m.y + SPL - 15;
    // la lame ne traverse pas le fond ni les parois du bécher
    if (spat.x > bech.sx - BW && spat.x < bech.sx && spat.y > bech.sy) {
      spat.x = Math.max(bech.sx - BW + 6, Math.min(bech.sx - 6, spat.x)); spat.y = Math.min(bech.sy + BH - 4, spat.y);
    }
  }
  else if (drag.o === pis) { pis.x = m.x + drag.ox; pis.y = m.y + drag.oy; }
  else { bech.sx = m.x + drag.ox; bech.sy = m.y + drag.oy; }
}
function lacher(){ if (!drag) return; drag.o.state = "retour"; drag = null; cv.style.cursor = "default"; }

/* ---------- cibles ---------- */
function auDessusBecher(x, y){ return bech.state === "home" && x > bech.sx - BW + 8 && x < bech.sx - 6 && y > bech.sy - 90 && y < bech.sy + 25; }
function auDessusEntonnoir(x, y){ return Math.abs(x - FX) < FHW && y > FT - 90 && y < FT + 15; }
function auDessusFiole(x, y){ return Math.abs(x - FX) < 75 && y > STEM - 30 && y < BENCH; }

/* ---------- mise à jour ---------- */
function retour(o, kx, ky, hx, hy, dt){
  o[kx] += (hx - o[kx]) * Math.min(1, dt*10); o[ky] += (hy - o[ky]) * Math.min(1, dt*10);
  if (Math.hypot(hx - o[kx], hy - o[ky]) < 1 && o.ang < .02) { o[kx] = hx; o[ky] = hy; o.state = "home"; }
}
function maj(dt){
  tNow += dt; flashT = Math.max(0, flashT - dt);
  refus = null;
  // pissette
  let angP = 0; pis.jet = false;
  if (pis.state === "drag") {
    if (auDessusBecher(pis.x, pis.y)) {
      if (bech.vol >= VMAX) refus = {x: bech.sx - BW/2, y: bech.sy - 30, msg: "Volume suffisant"};
      else { angP = .55; if (pis.ang > .4) { pis.jet = true; bech.vol = Math.min(VMAX, bech.vol + 10*dt); bech.susp = Math.min(1, bech.susp + .5*dt); } }
    } else if (auDessusEntonnoir(pis.x, pis.y) || auDessusFiole(pis.x, pis.y))
      refus = {x: pis.x, y: pis.y - 40, msg: "L'eau se verse dans le bécher de sable"};
  } else if (pis.state === "retour") retour(pis, "x", "y", pis.hx, pis.hy, dt);
  pis.ang += (angP - pis.ang) * Math.min(1, dt*8);
  // bécher
  let angB = 0; bech.verse = null;
  if (bech.state === "drag") {
    const v = Math.hypot(mouse.x - drag.lx, mouse.y - drag.ly) / Math.max(dt, 1e-3);
    drag.v = drag.v*.7 + v*.3; drag.lx = mouse.x; drag.ly = mouse.y;
    if (auDessusEntonnoir(bech.sx, bech.sy)) {
      if (bech.vol <= .5) refus = {x: FX, y: FT - 50, msg: "Ajouter d'abord de l'eau"};
      else if (bech.d < MELANGE_OK && filtre.vol + fiole.vol < .5) refus = {x: FX, y: FT - 50, msg: "Mélanger d'abord avec la spatule"};
      else if (filtre.vol >= FVMAX - .5) { refus = {x: FX, y: FT - 50, msg: "Filtre plein : attendre"}; }
      else {
        angB = .95;
        if (bech.ang > .8) {
          const dv = Math.min(bech.vol, 24*dt, FVMAX - filtre.vol);
          const ds = Math.min(bech.sable, dv/VMAX * (.4 + bech.susp));
          filtre.d = (filtre.d*filtre.vol + bech.d*dv) / (filtre.vol + dv);
          filtre.susp = Math.min(1, (filtre.susp*filtre.vol + bech.susp*dv) / (filtre.vol + dv) + ds*2);
          filtre.vol += dv; bech.vol -= dv; bech.sable -= ds; filtre.depot += ds;
          bech.verse = true;
        }
      }
    } else if (auDessusFiole(bech.sx, bech.sy)) refus = {x: FX, y: STEM - 40, msg: "Il faut filtrer le mélange"};
  } else if (bech.state === "retour") retour(bech, "sx", "sy", bech.hx, bech.hy, dt);
  bech.ang += (angB - bech.ang) * Math.min(1, dt*7);
  // spatule : mélange
  spat.dans = false;
  if (spat.state === "drag") {
    const v = Math.hypot(spat.x - spat.lx, spat.y - spat.ly) / Math.max(dt, 1e-3);
    spat.v = spat.v*.8 + v*.2; spat.lx = spat.x; spat.ly = spat.y;
    if (bech.state === "home" && spat.x > bech.sx - BW && spat.x < bech.sx && spat.y > bech.sy - 10) {
      const surf = bech.sy + BH - (bech.vol > 0 ? bech.vol*PXML + 12 : SABLE_H);
      if (spat.y > surf) {
        spat.dans = true;
        if (bech.vol <= .5) refus = {x: bech.sx - BW/2, y: bech.sy - 30, msg: "Ajouter d'abord de l'eau"};
        else if (spat.v > 60) { const f = Math.min(1, spat.v/600); bech.d = Math.min(1, bech.d + dt*.22*f); bech.susp = Math.min(1, bech.susp + dt*1.2*f); tourb.k = Math.min(1, tourb.k + dt*3*f); }
      }
    } else if (auDessusEntonnoir(spat.x, spat.y) || auDessusFiole(spat.x, spat.y))
      refus = {x: spat.x, y: spat.y - SPL - 10, msg: "La spatule sert à mélanger dans le bécher"};
  } else if (spat.state === "retour") {
    spat.x += (spat.hx - spat.x)*Math.min(1, dt*10); spat.y += (spat.hy - spat.y)*Math.min(1, dt*10);
    if (Math.hypot(spat.hx - spat.x, spat.hy - spat.y) < 1) { spat.x = spat.hx; spat.y = spat.hy; spat.state = "home"; }
  }
  // tourbillon : inertie puis ralentissement
  tourb.k = Math.max(0, tourb.k - dt*.45);
  for (const q of tourb.p) q.a += dt * (2 + 9*tourb.k) * (1.2 - q.r*.6);
  if (!melangeFait && bech.d >= MELANGE_OK) { melangeFait = true; feuDArtifice(); }
  for (const e of eclats) { e.vy += 500*dt; e.x += e.vx*dt; e.y += e.vy*dt; e.t -= dt; e.rot += e.vr*dt; }
  for (let k = eclats.length-1; k >= 0; k--) if (eclats[k].t <= 0) eclats.splice(k,1);
  // dissolution lente sans agitation, décantation
  if (bech.vol > 0) bech.d = Math.min(1, bech.d + dt*.004);
  bech.susp = Math.max(0, bech.susp - dt*.18);
  // filtration
  if (filtre.vol > 0) {
    const q = Math.min(filtre.vol, 5*dt);
    filtre.vol -= q;
    fiole.d = (fiole.d*fiole.vol + filtre.d*q) / (fiole.vol + q || 1);
    fiole.vol = Math.min(120, fiole.vol + q);
    filtre.dropT += dt;
    if (filtre.dropT > .09) { filtre.dropT = 0; drops.push({y: STEM + 2, vy: 0}); }
  }
  filtre.susp = Math.max(0, filtre.susp - dt*.4);
  for (const d of drops) { d.vy += 900*dt; d.y += d.vy*dt; }
  const niv = BENCH - 4 - fiole.vol*1.6;
  for (let k = drops.length-1; k >= 0; k--) if (drops[k].y > niv) drops.splice(k,1);
}

/* ---------- dessin ---------- */
function grains(x0, x1, y0, y1, n, seed){
  let s = seed; const r = () => (s = (s*16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) {
    const x = x0 + r()*(x1-x0), y = y0 + r()*(y1-y0), c = 150 + r()*70;
    ctx.fillStyle = `rgb(${c+40|0},${c+8|0},${c-50|0})`; ctx.fillRect(x, y, 2.2, 2.2);
  }
}
function dessinerBecher(){
  const b = bech, hLiq = b.vol > 0 ? b.vol*PXML + 12 : 0;
  const lc = couleurLiquide(b.d, b.susp);
  ctx.save(); ctx.translate(b.sx, b.sy); ctx.rotate(b.ang);
  const path = () => { ctx.beginPath(); ctx.moveTo(8,-6); ctx.lineTo(0,4); ctx.lineTo(0,BH); ctx.lineTo(-BW,BH); ctx.lineTo(-BW,0); };
  ctx.save(); path(); ctx.closePath(); ctx.clip();
  // liquide (surface horizontale)
  if (hLiq > 0) {
    ctx.rotate(-b.ang);
    const surfUp = BH - hLiq, surf = surfUp + (3 - surfUp) * Math.min(1, b.ang/.95);
    if (tourb.k > .02 && b.ang < .05) {
      // surface creusée par le vortex
      const cx = -BW/2, prof = Math.min(hLiq*.6, 26*tourb.k), lw = 26;
      ctx.beginPath(); ctx.moveTo(-BW-5, surf);
      for (let x = -BW; x <= 0; x += 3) ctx.lineTo(x, surf + prof*Math.exp(-(((x-cx)/lw)**2)) + Math.sin(x*.25 + tNow*12)*1.2*tourb.k);
      ctx.lineTo(5, surf); ctx.lineTo(5, BH+5); ctx.lineTo(-BW-5, BH+5); ctx.closePath();
      ctx.fillStyle = rgba(lc.c, lc.a); ctx.fill();
      // filets de courant
      ctx.strokeStyle = `rgba(255,255,255,${.5*tourb.k})`; ctx.lineWidth = 1.6;
      for (let k = 0; k < 4; k++) {
        const yy = surf + 14 + k*(hLiq-20)/4, a0 = tNow*(6 + 8*tourb.k) + k*1.7, rx = BW*.42 - k*6;
        ctx.beginPath(); ctx.ellipse(cx, yy, rx, 6 + k, 0, a0, a0 + 1.8); ctx.stroke();
      }
      // grains entraînés
      for (const q of tourb.p) {
        const y = surf + 8 + q.h*(hLiq - 14), x = cx + Math.cos(q.a)*q.r*BW*.44, z = Math.sin(q.a);
        const c = 150 + z*45;
        ctx.fillStyle = `rgba(${c+45|0},${c+10|0},${c-45|0},${.35 + .6*tourb.k})`;
        const sz = q.s*(1 + .35*z); ctx.fillRect(x - sz/2, y + z*4, sz, sz);
      }
      // bulles
      ctx.strokeStyle = `rgba(255,255,255,${.7*tourb.k})`; ctx.lineWidth = 1;
      for (let k = 0; k < 6; k++) { const ph = (tNow*.9 + k*.37) % 1, x = cx + Math.sin(k*2.1 + tNow*3)*BW*.3;
        ctx.beginPath(); ctx.arc(x, BH - 6 - ph*(hLiq - 10), 1.5 + k%3, 0, 6.283); ctx.stroke(); }
    } else { ctx.fillStyle = rgba(lc.c, lc.a); ctx.fillRect(-400, surf, 800, 400); }
    if (b.susp > .05) grains(-BW*1.2, 20, surf + 4, surf + 80, 60*b.susp, (tNow*20|0));
    ctx.rotate(b.ang);
  }
  // sable (tourne avec le bécher), dessiné par-dessus le liquide
  const hs = SABLE_H * (.25 + .75*b.sable);
  ctx.fillStyle = b.vol > 0 ? "#c7a76d" : "#d9bd85"; ctx.fillRect(-BW, BH - hs, BW, hs);
  grains(-BW+2, -2, BH - hs + 2, BH - 2, 160 * b.sable + 20, 7);
  ctx.restore();
  path(); ctx.strokeStyle = "#6b7785"; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.strokeStyle = "rgba(107,119,133,.55)"; ctx.lineWidth = 1;
  for (let k = 1; k <= 3; k++) { ctx.beginPath(); ctx.moveTo(-BW+6, BH-k*30); ctx.lineTo(-BW+22, BH-k*30); ctx.stroke(); }
  // étiquette
  ctx.fillStyle = "#fff"; ctx.strokeStyle = "#9aa6b3"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(-BW+30, 24, 60, 24, 3); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#1d2733"; ctx.font = "600 13px system-ui"; ctx.textAlign = "center"; ctx.fillText("Sable", -BW+60, 41);
  ctx.restore();
  if (b.verse) {
    ctx.strokeStyle = rgba(lc.c, Math.max(.6, lc.a)); ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(b.sx + 5, b.sy); ctx.quadraticCurveTo(b.sx + 10, b.sy + 25, FX + 6, FA - 25 - filtre.vol*.6); ctx.stroke();
  }
}
function dessinerPissette(){
  const p = pis;
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.ang); ctx.translate(-PT.x, -PT.y);
  // embout
  ctx.strokeStyle = "#8a96a3"; ctx.lineWidth = 4; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0,-118); ctx.lineTo(0,-148); ctx.quadraticCurveTo(2,-168, 28,-166); ctx.lineTo(44,-160); ctx.lineTo(PT.x, PT.y); ctx.stroke();
  // bouchon
  ctx.fillStyle = "#2f7fd0"; ctx.beginPath(); ctx.roundRect(-14,-124,28,14,3); ctx.fill();
  // corps souple
  ctx.fillStyle = "rgba(225,235,245,.85)"; ctx.strokeStyle = "#6b7785"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-14,-110); ctx.quadraticCurveTo(-30,-100,-30,-80); ctx.lineTo(-30,-6); ctx.quadraticCurveTo(-30,0,-24,0);
  ctx.lineTo(24,0); ctx.quadraticCurveTo(30,0,30,-6); ctx.lineTo(30,-80); ctx.quadraticCurveTo(30,-100,14,-110); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "rgba(160,200,240,.55)"; ctx.fillRect(-28,-62,56,60);
  ctx.fillStyle = "#fff"; ctx.strokeStyle = "#9aa6b3"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(-24,-52,48,30,3); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#1d2733"; ctx.font = "600 10px system-ui"; ctx.textAlign = "center";
  ctx.fillText("Eau", 0, -40); ctx.fillText("distillée", 0, -28);
  ctx.restore();
  if (p.jet) {
    const yb = bech.sy + BH - (bech.vol*PXML + 12);
    ctx.strokeStyle = "rgba(110,170,230,.85)"; ctx.lineWidth = 2.5;
    const dx = Math.sin(p.ang)*8, dy = Math.cos(p.ang)*8;
    ctx.beginPath(); ctx.moveTo(p.x + dx, p.y + dy); ctx.quadraticCurveTo(p.x + 14, p.y + 30, p.x + 6, Math.max(p.y + 20, yb)); ctx.stroke();
  }
}
function dessinerFiltration(){
  // support
  ctx.fillStyle = "#9aa6b3"; ctx.fillRect(600, BENCH - 8, 200, 8);
  ctx.fillStyle = "#b3bfcc"; ctx.fillRect(772, 120, 8, BENCH - 128);
  ctx.fillRect(FX + FHW - 2, FT + 12, 772 - (FX + FHW - 2), 7);
  ctx.strokeStyle = "#8a97a6"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(FX, FT + 16, FHW - 6, 7, 0, 0, 2*Math.PI); ctx.stroke();
  // bécher de récupération du filtrat
  const FBW = 116, FBH = 100, fx0 = FX - FBW/2, fy0 = BENCH - FBH;
  const fpath = () => { ctx.beginPath(); ctx.moveTo(fx0 - 7, fy0 - 5); ctx.lineTo(fx0, fy0 + 4); ctx.lineTo(fx0, BENCH); ctx.lineTo(fx0 + FBW, BENCH); ctx.lineTo(fx0 + FBW, fy0); };
  ctx.save(); fpath(); ctx.closePath(); ctx.clip();
  if (fiole.vol > 0) { const c = couleurLiquide(fiole.d, 0); ctx.fillStyle = rgba(c.c, c.a); ctx.fillRect(fx0 - 10, BENCH - fiole.vol*1.6, FBW + 20, 200); }
  ctx.restore();
  fpath(); ctx.strokeStyle = "#6b7785"; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.strokeStyle = "rgba(107,119,133,.55)"; ctx.lineWidth = 1;
  for (let k = 1; k <= 3; k++) { const y = BENCH - k*24; ctx.beginPath(); ctx.moveTo(fx0 + FBW - 20, y); ctx.lineTo(fx0 + FBW - 5, y); ctx.stroke(); }
  ctx.fillStyle = "#fff"; ctx.strokeStyle = "#9aa6b3"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(FX - 32, fy0 + 22, 64, 22, 3); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#1d2733"; ctx.font = "600 12px system-ui"; ctx.textAlign = "center"; ctx.fillText("Filtrat", FX, fy0 + 37);
  // gouttes
  const fc = couleurLiquide(filtre.d, 0);
  ctx.fillStyle = rgba(fc.c, Math.max(.7, fc.a));
  for (const d of drops) { ctx.beginPath(); ctx.ellipse(FX, d.y, 2.4, 3.2, 0, 0, 2*Math.PI); ctx.fill(); }
  // entonnoir + papier filtre
  const cone = (hw, top, apex) => { ctx.beginPath(); ctx.moveTo(FX-hw, top); ctx.lineTo(FX, apex); ctx.lineTo(FX+hw, top); };
  ctx.save(); cone(FHW-5, FT-4, FA-6); ctx.closePath(); ctx.clip();
  ctx.fillStyle = "#fbfbf7"; ctx.fillRect(FX-FHW, FT-6, 2*FHW, FA-FT);
  if (filtre.vol > 0) {
    const h = 88*Math.sqrt(filtre.vol/FVMAX), c = couleurLiquide(filtre.d, filtre.susp);
    ctx.fillStyle = rgba(c.c, c.a); ctx.fillRect(FX-FHW, FA - 6 - h, 2*FHW, h + 2);
  }
  if (filtre.depot > 0) {
    const hd = Math.min(40, 8 + filtre.depot*70);
    ctx.fillStyle = "#cfae74"; ctx.beginPath(); ctx.moveTo(FX - hd*.62, FA - 6 - hd); ctx.lineTo(FX, FA - 6); ctx.lineTo(FX + hd*.62, FA - 6 - hd); ctx.closePath(); ctx.fill();
    grains(FX - hd*.55, FX + hd*.55, FA - 6 - hd + 2, FA - 8, hd*5, 11);
  }
  ctx.restore();
  ctx.strokeStyle = "rgba(150,150,140,.6)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(FX - 20, FT - 2); ctx.lineTo(FX, FA - 6); ctx.stroke();
  cone(FHW, FT, FA); ctx.strokeStyle = "#6b7785"; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = "rgba(225,233,242,.5)"; ctx.fillRect(FX-4, FA-2, 8, STEM-FA+2);
  ctx.strokeRect(FX-4, FA-2, 8, STEM-FA+2);
}
function dessinerSpatule(){
  ctx.save();
  if (spat.state === "home") {
    ctx.translate(spat.x, spat.y);
    ctx.fillStyle = "#3b4654"; ctx.beginPath(); ctx.roundRect(SPL - 50, -6, 50, 9, 4); ctx.fill();
    ctx.strokeStyle = "#9aa6b3"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(14, -2); ctx.lineTo(SPL - 50, -2); ctx.stroke();
    ctx.fillStyle = "#b7c1cc"; ctx.beginPath(); ctx.ellipse(8, -2, 10, 4.5, 0, 0, 2*Math.PI); ctx.fill();
    ctx.strokeStyle = "#7d8a99"; ctx.lineWidth = 1; ctx.stroke();
  } else {
    if (spat.dans && spat.v > 60 && bech.vol > .5) {
      const cx = bech.sx - BW/2, cy = bech.sy + BH - bech.vol*PXML*.5 - 10;
      ctx.save(); ctx.strokeStyle = "rgba(60,110,170,.55)"; ctx.lineWidth = 2;
      for (let k = 0; k < 2; k++) { const a0 = tNow*5 + k*Math.PI; ctx.beginPath(); ctx.ellipse(cx, cy, 38, 10, 0, a0, a0 + 2.2); ctx.stroke(); }
      ctx.restore();
    }
    const a = spat.dans ? Math.sin(tNow*9)*.08 : 0;
    ctx.translate(spat.x, spat.y); ctx.rotate(a);
    ctx.fillStyle = "#b7c1cc"; ctx.beginPath(); ctx.ellipse(0, -8, 4.5, 11, 0, 0, 2*Math.PI); ctx.fill();
    ctx.strokeStyle = "#7d8a99"; ctx.lineWidth = 1; ctx.stroke();
    ctx.strokeStyle = "#9aa6b3"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(0, -(SPL - 50)); ctx.stroke();
    ctx.fillStyle = "#3b4654"; ctx.beginPath(); ctx.roundRect(-4.5, -SPL, 9, 50, 4); ctx.fill();
  }
  ctx.restore();
}
function etiquettes(){

    const ok = formuleJuste(r.i1, r.n1, r.i2, r.n2, cats, ans);
    if (!ok) { faux++; continue; }
    const key = r.i1 + "|" + r.i2;
    if (!vus.has(key)) { vus.add(key); bon++; }
  }
  const total = totalComposes(cats, ans);
  return {score: Math.max(0, Math.min(total, bon - faux)), total};
}
//<NOMS>
function normNom(t){
  t = t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  t = t.replace(/[’'`´]/g, "' ").replace(/\bd' /g, "de ").replace(/[()\[\].,;:_\-]/g, " ");
  t = t.replace(/\biii\b/g, " 3 ").replace(/\bii\b/g, " 2 ");
  const dig = (t.match(/\d/g) || []).join("");
  const let_ = t.replace(/\d/g, " ").replace(/\s+/g, " ").trim();
  return {let: let_, dig};
}
function lev(a, b){
  const m = a.length, n = b.length; let prev = Array.from({length: n+1}, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function composeDe(txt, cats, ans){
  const u = normNom(txt);
  if (!u.let) return null;
  for (const c of cats) for (const a of ans) {
    const [nc, d, opt] = NOM_CAT[c];
    const canon = NOM_AN[a] + " de " + nc;
    const tol = canon.length <= 12 ? 1 : 2;
    if (lev(u.let, canon) > tol) continue;
    const okDig = d ? (u.dig === String(d) || (opt && u.dig === "")) : u.dig === "";
    if (okDig) return c + "|" + a;
  }
  return "X";
}
function totalComposes(cats, ans){ return cats.length * ans.length; }   // toutes les associations cation/anion (max 2×2 = 4)
//</NOMS>
function scoreComposes(){
  const cats = CFG.ions.filter(i => CATIONS.includes(i)), ans = CFG.ions.filter(i => ANIONS.includes(i));
  const vus = new Set(); let bon = 0, faux = 0;
  document.querySelectorAll("#f3 .ligne").forEach(inp => {
    const r = composeDe(inp.value, cats, ans);
    if (r === null) return;
    if (r === "X") { faux++; return; }
    if (!vus.has(r)) { vus.add(r); bon++; }
  });
  const total = totalComposes(cats, ans);
  return {score: Math.max(0, Math.min(total, bon - faux)), total};
}
function dansZone(e, z){
  const a = e.getBoundingClientRect(), b = z.getBoundingClientRect();
  const cx = a.left + a.width/2, cy = a.top + a.height/2;
  return cx > b.left && cx < b.right && cy > b.top && cy < b.bottom;
}
function scoreFeuille(){
  const zC = document.getElementById("zoneC"), zA = document.getElementById("zoneA");
  const presents = new Set(CFG.ions);
  let bon = 0, faux = 0;
  for (const e of etiquettes) {
    const ion = e.dataset.ion, inC = dansZone(e, zC), inA = dansZone(e, zA);
    if (!inC && !inA) continue;
    const ok = presents.has(ion) && ((inC && CATIONS.includes(ion)) || (inA && ANIONS.includes(ion)));
    ok ? bon++ : faux++;
  }
  const total = presents.size;
  return {score: Math.max(0, Math.min(total, bon - faux)), total};
}

}
