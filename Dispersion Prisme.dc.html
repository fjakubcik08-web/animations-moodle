<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="styles.css"></link>
<style id="__om-edit-overrides"></style>
<style>
  @keyframes bulbPulse { 0%, 100% { opacity: 0.82; filter: brightness(1); } 50% { opacity: 1; filter: brightness(1.22); } }
</style>
</helmet>
<div style="min-height:100vh; background:var(--color-bg); font-family:var(--font-body); padding:36px 20px; display:flex; flex-direction:column; align-items:center; gap:18px; box-sizing:border-box; color:var(--color-text);">

  <div style="width:960px; max-width:100%;">
    <h1 style="font-size:28px; margin:0 0 6px;">Dispersion de la lumière par un prisme</h1>
    <p style="font-size:15px; color:var(--color-neutral-700); margin:0;">Glisse une ampoule vers la source, puis appuie sur l'interrupteur pour observer le spectre obtenu. Déplace le curseur pour lire une longueur d'onde.</p>
  </div>

  <div style="width:960px; max-width:100%; background:var(--color-neutral-900); border:2px solid var(--color-divider); padding:18px 28px 26px; box-sizing:border-box;">
    <div style="width:900px; max-width:100%; margin:0 auto;">
      <div style="display:flex; justify-content:space-between; align-items:baseline; font-size:12px; letter-spacing:0.04em; text-transform:uppercase; color:var(--color-neutral-400); font-weight:600; margin-bottom:8px;">
        <span>Spectre observé</span>
        <span>Longueur d'onde →</span>
      </div>
      <svg viewBox="0 0 900 18" width="900" height="18" style="display:block; overflow:visible;">
        <line x1="0" y1="9" x2="890" y2="9" stroke="#7d7979" stroke-width="1.5"></line>
        <polygon points="890,3 900,9 890,15" fill="#7d7979"></polygon>
      </svg>
      <div style="position:relative; height:70px; margin-top:6px;">
        <div style="position:absolute; inset:0; overflow:hidden; background:#161515; border:1px solid #444141;">
          <sc-for list="{{ topMarkers }}" as="m" hint-placeholder-count="4">
            <div style="position:absolute; top:6px; left:{{ m.x }}px; transform:translateX(-50%); width:{{ m.width }}px; height:58px; background:{{ m.color }}; box-shadow:0 0 10px {{ m.color }}; opacity:{{ m.markerOpacity }}; filter:{{ m.filter }}; transition:opacity 0.5s ease, width 0.2s ease;"></div>
            <div style="position:absolute; top:8px; left:{{ m.x }}px; transform:translateX(-50%); font-size:9px; font-weight:800; line-height:1; color:#161515; background:{{ m.color }}; padding:0 3px; opacity:{{ m.markerOpacity }}; transition:opacity 0.5s ease;">{{ m.rank }}</div>
          </sc-for>
        </div>
        <div style="position:absolute; top:-26px; left:{{ cursorX }}px; transform:translateX(-50%); font-size:11px; font-weight:700; color:#ec3013; white-space:nowrap; background:#161515; padding:1px 5px; border:1px solid #ec3013;">{{ cursorLabel }}</div>
        <div onPointerDown="{{ onCursorPointerDown }}" onPointerMove="{{ onCursorPointerMove }}" onPointerUp="{{ onCursorPointerUp }}" style="position:absolute; top:0; left:{{ cursorX }}px; transform:translateX(-50%); width:16px; height:70px; cursor:{{ cursorCursor }}; touch-action:none;">
          <div style="position:absolute; left:7px; top:0; width:2px; height:70px; background:#ec3013;"></div>
          <div style="position:absolute; left:2px; top:-2px; width:12px; height:8px; background:#ec3013;"></div>
        </div>
      </div>
      <div style="position:relative; height:26px; margin-top:2px;">
        <sc-for list="{{ minorTicks }}" as="mt" hint-placeholder-count="10">
          <div style="position:absolute; top:0; left:{{ mt.x }}px; width:1px; height:6px; background:#605d5d;"></div>
        </sc-for>
        <sc-for list="{{ majorTicks }}" as="t" hint-placeholder-count="6">
          <div style="position:absolute; top:0; left:{{ t.x }}px; width:1px; height:10px; background:#9b9797;"></div>
          <span style="position:absolute; top:11px; left:{{ t.x }}px; transform:translateX(-50%); font-size:11px; color:var(--color-neutral-500); white-space:nowrap;">{{ t.label }}</span>
        </sc-for>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-top:14px;">
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
          <sc-for list="{{ cursorButtons }}" as="cb" hint-placeholder-count="4">
            <button class="btn btn-secondary" onClick="{{ cb.onClick }}" style="font-size:12px; padding:4px 10px; color:#eae7e7; border-color:#605d5d; background:#2d2b2b;">{{ cb.label }}</button>
          </sc-for>
          <button class="btn btn-secondary" onClick="{{ onZoomOut }}" style="font-size:12px; padding:4px 10px; color:#eae7e7; border-color:#605d5d; background:#2d2b2b;">Zoom −</button>
          <button class="btn btn-secondary" onClick="{{ onZoomIn }}" style="font-size:12px; padding:4px 10px; color:#eae7e7; border-color:#605d5d; background:#2d2b2b;">Zoom +</button>
          <button class="btn btn-secondary" onClick="{{ onZoomReset }}" style="font-size:12px; padding:4px 10px; color:#eae7e7; border-color:#605d5d; background:#2d2b2b;">Réinitialiser le zoom</button>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <label style="font-size:12px; color:var(--color-neutral-400); white-space:nowrap;">Amplification ×{{ gainLabel }}</label>
          <input type="range" min="1" max="4" step="0.1" value="{{ gain }}" onChange="{{ onGainChange }}" style="width:160px; accent-color:#ec3013;"></input>
        </div>
      </div>
    </div>
  </div>

  <div onDragOver="{{ onBenchDragOver }}" onDrop="{{ onBenchDrop }}" style="width:960px; max-width:100%; background:var(--color-neutral-900); border:2px solid var(--color-divider); padding:16px 28px; box-sizing:border-box;">
    <svg viewBox="0 0 900 360" width="900" height="360" style="display:block; width:100%; height:auto; max-width:900px; margin:0 auto;">
      <rect x="20" y="300" width="860" height="26" fill="#7d7979"></rect>

      <rect x="26" y="236" width="66" height="64" fill="#444141"></rect>
      <circle cx="59" cy="268" r="10" fill="{{ powerFill }}" style="transition:fill 0.4s ease;"></circle>
      <circle cx="59" cy="268" r="17" fill="{{ powerFill }}" opacity="{{ powerGlowOpacity }}" style="transition:opacity 0.4s ease;" onClick="{{ onTogglePower }}"></circle>
      <circle cx="59" cy="268" r="10" fill="transparent" onClick="{{ onTogglePower }}" style="cursor:pointer;"></circle>
      <text x="59" y="320" text-anchor="middle" font-size="11" font-family="Archivo, sans-serif" fill="{{ powerFill }}" style="transition:fill 0.4s ease;">{{ powerStateLabel }}</text>

      <rect x="137" y="190" width="6" height="110" fill="#7d7979"></rect>
      <circle cx="140" cy="170" r="20" fill="{{ bulbColor }}" opacity="0.92" style="animation:bulbPulse 2.4s ease-in-out infinite; transform-origin:140px 170px;"></circle>
      <circle cx="140" cy="170" r="30" fill="{{ bulbColor }}" opacity="{{ bulbGlowOpacity }}" style="transition:opacity 0.4s ease;"></circle>
      <text x="140" y="110" text-anchor="middle" font-size="12" font-family="Archivo, sans-serif" fill="#d7d3d3">Source ({{ sourceName }})</text>

      <line x1="145" y1="170" x2="460" y2="170" stroke="{{ bulbColor }}" stroke-width="4" stroke-linecap="round" stroke-dasharray="315 315" opacity="{{ beamOpacity }}" style="stroke-dashoffset:{{ beamOffset }}; transition:stroke-dashoffset 0.65s ease, opacity 0.65s ease;"></line>

      <sc-for list="{{ disperseRays }}" as="ray" hint-placeholder-count="4">
        <line x1="{{ ray.x1 }}" y1="{{ ray.y1 }}" x2="{{ ray.x2 }}" y2="{{ ray.y2 }}" stroke="{{ ray.color }}" stroke-width="3" stroke-linecap="round" stroke-dasharray="{{ ray.len }} {{ ray.len }}" opacity="{{ ray.opacity }}" style="stroke-dashoffset:{{ ray.dashoffset }}; transition:stroke-dashoffset 0.7s ease, opacity 0.7s ease;"></line>
      </sc-for>

      <sc-for list="{{ screenDots }}" as="dot" hint-placeholder-count="4">
        <circle cx="{{ dot.x }}" cy="{{ dot.y }}" r="12" fill="{{ dot.color }}" opacity="{{ dot.glowOpacity }}" style="transition:opacity 0.5s ease;"></circle>
        <circle cx="{{ dot.x }}" cy="{{ dot.y }}" r="5" fill="{{ dot.color }}" opacity="{{ dot.dotOpacity }}" style="transition:opacity 0.5s ease;"></circle>
      </sc-for>

      <rect x="457" y="194" width="6" height="106" fill="#7d7979"></rect>
      <polygon points="460,138 428,194 492,194" fill="rgba(215,211,211,0.22)" stroke="#d7d3d3" stroke-width="2"></polygon>
      <text x="460" y="122" text-anchor="middle" font-size="12" font-family="Archivo, sans-serif" fill="#d7d3d3">Prisme</text>

      <rect x="796" y="285" width="6" height="15" fill="#7d7979"></rect>
      <rect x="816" y="55" width="8" height="230" fill="#f8f4f4"></rect>
      <text x="820" y="43" text-anchor="middle" font-size="12" font-family="Archivo, sans-serif" fill="#d7d3d3">Écran</text>
    </svg>
  </div>

  <div style="width:960px; max-width:100%; background:var(--color-surface); border:2px solid var(--color-divider); padding:18px 28px; box-sizing:border-box; display:flex; flex-direction:column; gap:14px;">
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <sc-for list="{{ bulbs }}" as="b" hint-placeholder-count="30">
        <div draggable="true" onDragStart="{{ b.onDragStart }}" onClick="{{ b.onClick }}" style="display:flex; flex-direction:column; align-items:center; gap:4px; cursor:grab; padding:6px 8px; background:{{ b.trayBg }}; border:2px solid {{ b.trayBorder }};">
          <svg viewBox="0 0 28 32" width="28" height="32">
            <circle cx="14" cy="12" r="10" fill="{{ b.color }}" opacity="0.9" style="animation:bulbPulse 2.2s ease-in-out infinite; animation-delay:{{ b.delay }}s; transform-origin:14px 12px;"></circle>
            <rect x="10" y="20" width="8" height="4" fill="#7d7979"></rect>
            <rect x="11" y="25" width="6" height="3" fill="#605d5d"></rect>
          </svg>
          <span style="font-size:11px; font-weight:600;">{{ b.label }}</span>
        </div>
      </sc-for>
    </div>
    <div style="padding-top:12px; border-top:2px solid var(--color-divider);">
      <p style="margin:0; font-size:13.5px; color:var(--color-neutral-700); max-width:640px;">{{ caption }}</p>
    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:960,&quot;height&quot;:900},&quot;defaultSource&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;na&quot;,&quot;options&quot;:[&quot;h&quot;,&quot;he&quot;,&quot;ne&quot;,&quot;ar&quot;,&quot;kr&quot;,&quot;xe&quot;,&quot;hg&quot;,&quot;na&quot;,&quot;li&quot;,&quot;k&quot;,&quot;rb&quot;,&quot;cs&quot;,&quot;ca&quot;,&quot;sr&quot;,&quot;ba&quot;,&quot;cu&quot;,&quot;cd&quot;,&quot;zn&quot;,&quot;tl&quot;,&quot;in&quot;,&quot;pb&quot;,&quot;bi&quot;,&quot;sb&quot;,&quot;al&quot;,&quot;b&quot;,&quot;mn&quot;,&quot;fe&quot;,&quot;ni&quot;,&quot;co&quot;,&quot;cr&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Simulation&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.5,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;x&quot;,&quot;section&quot;:&quot;Simulation&quot;}}">
class Component extends DCLogic {
  state = { sourceKey: null, playing: false, phase: 'idle', cursorX: 450, draggingCursor: false, gain: 1, viewMin: 400, viewMax: 800 };
  timeouts = [];
  draggedKey = null;

  WL_MIN = 400;
  WL_MAX = 800;
  BAR_PAD = 10;
  BAR_SPAN = 880;

  xFromWl(wl) {
    const { viewMin, viewMax } = this.state;
    return this.BAR_PAD + (wl - viewMin) / (viewMax - viewMin) * this.BAR_SPAN;
  }
  wlFromX(x) {
    const { viewMin, viewMax } = this.state;
    return viewMin + (x - this.BAR_PAD) / this.BAR_SPAN * (viewMax - viewMin);
  }
  pickStep(span) {
    const steps = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200];
    for (const s of steps) { if (span / s <= 9) return s; }
    return 200;
  }
  zoomBy(factor) {
    const { viewMin, viewMax } = this.state;
    const centerWl = Math.max(viewMin, Math.min(viewMax, this.wlFromX(this.state.cursorX)));
    let half = (viewMax - viewMin) / 2 * factor;
    half = Math.max(5, half);
    let newMin = centerWl - half, newMax = centerWl + half;
    if (newMax - newMin >= this.WL_MAX - this.WL_MIN) { newMin = this.WL_MIN; newMax = this.WL_MAX; }
    else {
      if (newMin < this.WL_MIN) { newMax += this.WL_MIN - newMin; newMin = this.WL_MIN; }
      if (newMax > this.WL_MAX) { newMin -= newMax - this.WL_MAX; newMax = this.WL_MAX; }
    }
    this.setState({ viewMin: newMin, viewMax: newMax, cursorX: this.xFromWlIn(centerWl, newMin, newMax) });
  }
  xFromWlIn(wl, viewMin, viewMax) {
    return this.BAR_PAD + (wl - viewMin) / (viewMax - viewMin) * this.BAR_SPAN;
  }
  onZoomIn = () => this.zoomBy(0.6);
  onZoomOut = () => this.zoomBy(1 / 0.6);
  onZoomReset = () => this.setState({ viewMin: this.WL_MIN, viewMax: this.WL_MAX });

  SOURCES = {
    h: { name: 'Hydrogène', short: 'H', lines: [410.2, 434.0, 486.1, 656.3], swatchWl: 486, caption: "Série de Balmer : violet, bleu, cyan et rouge caractéristiques de l'hydrogène." },

    kr: { name: 'Krypton', short: 'Kr', lines: [427.4, 431.9, 435.0, 445.4, 450.2, 460.9, 470.6, 556.2, 587.1, 645.6, 760.2, 768.5, 810.4], swatchWl: 557, caption: "Le krypton présente des raies vertes et jaune-orangées, utilisées comme référence de longueur d'onde." },
    xe: { name: 'Xénon', short: 'Xe', lines: [462.4, 467.1, 484.4, 492.3, 500.0, 529.2, 541.9, 553.7, 605.9, 619.9], swatchWl: 480, caption: "Le xénon émet plusieurs raies bleu-vert, donnant aux lampes au xénon leur teinte blanc-bleuté." },
    hg: { name: 'Mercure', short: 'Hg', lines: [404.7, 407.8, 435.8, 491.6, 546.1, 577.0, 579.1], swatchWl: 546, caption: "Le mercure émet des raies dans le violet, le bleu, le vert et le jaune." },
    na: { name: 'Sodium', short: 'Na', lines: [568.8, 589.0, 589.6, 615.4, 616.1], swatchWl: 589, caption: "Le sodium émet un doublet jaune presque monochromatique, à 589,0 et 589,6 nm, entouré de raies plus faibles." },
    li: { name: 'Lithium', short: 'Li', lines: [413.3, 460.3, 610.4, 670.8], swatchWl: 670, caption: "Le lithium colore la flamme en rouge carmin, avec des raies rouge et orangée dominantes." },

    zn: { name: 'Zinc', short: 'Zn', lines: [468.0, 472.2, 481.0, 636.2], swatchWl: 472, caption: "Le zinc émet un ensemble de raies bleues rapprochées et une raie rouge plus faible." },
    tl: { name: 'Thallium', short: 'Tl', lines: [466.0, 535.0, 652.0, 706.0], swatchWl: 535, caption: "Le thallium émet une raie verte intense et isolée, très caractéristique." },
    in: { name: 'Indium', short: 'In', lines: [410.2, 451.1, 468.0, 610.4, 616.0], swatchWl: 451, caption: "L'indium émet des raies bleu-violet, utilisées pour calibrer les spectromètres." },
    pb: { name: 'Plomb', short: 'Pb', lines: [405.8, 500.6, 571.8, 639.0], swatchWl: 405, caption: "Le plomb émet un ensemble de raies faibles, du violet au rouge, peu visibles à l'œil nu." },

    sb: { name: 'Antimoine', short: 'Sb', lines: [452.7, 473.0, 528.0, 606.0], swatchWl: 452, caption: "L'antimoine émet des raies bleu-vert caractéristiques de son spectre d'arc." },
    al: { name: 'Aluminium', short: 'Al', lines: [394.4, 396.2, 466.0, 512.0, 624.0, 669.0], swatchWl: 512, caption: "L'aluminium émet des raies bleu-vert et rouge dans son spectre d'arc." },
    b: { name: 'Bore', short: 'B', lines: [492.0, 518.0, 549.0, 563.0], swatchWl: 518, caption: "Le bore émet des raies vertes, donnant une flamme verte pâle." },
    mn: { name: 'Manganèse', short: 'Mn', lines: [403.1, 476.0, 542.0, 601.0], swatchWl: 542, caption: "Le manganèse émet des raies du violet au jaune-orangé." },
    fe: { name: 'Fer', short: 'Fe', lines: [438.4, 495.7, 516.7, 527.0], swatchWl: 480, caption: "Le fer émet de très nombreuses raies, notamment bleue et verte, d'où les étincelles dorées à la flamme." },
    ni: { name: 'Nickel', short: 'Ni', lines: [430.0, 470.0, 486.0, 508.0, 533.0, 547.7, 610.0], swatchWl: 520, caption: "Le nickel émet de nombreuses raies vertes et bleues rapprochées, typiques des métaux de transition." },
    co: { name: 'Cobalt', short: 'Co', lines: [423.0, 450.0, 481.3, 520.9, 546.0, 587.0, 612.0], swatchWl: 500, caption: "Le cobalt émet de nombreuses raies bleue, verte et jaune, typiques des métaux de transition." },
    cr: { name: 'Chrome', short: 'Cr', lines: [425.4, 427.5, 520.6, 552.5, 600.0], swatchWl: 480, caption: "Le chrome émet des raies violette et verte caractéristiques." },
  };

  SOURCE_X = 145;
  PRISM_X = 460;
  SCREEN_X = 816;
  AXIS_Y = 170;

  componentWillUnmount() { this.clearTimeouts(); }
  clearTimeouts() { this.timeouts.forEach(clearTimeout); this.timeouts = []; }

  wavelengthToRGB(wl) {
    let r = 0, g = 0, b = 0;
    if (wl >= 380 && wl < 440) { r = -(wl - 440) / (440 - 380); g = 0; b = 1; }
    else if (wl >= 440 && wl < 490) { r = 0; g = (wl - 440) / (490 - 440); b = 1; }
    else if (wl >= 490 && wl < 510) { r = 0; g = 1; b = -(wl - 510) / (510 - 490); }
    else if (wl >= 510 && wl < 580) { r = (wl - 510) / (580 - 510); g = 1; b = 0; }
    else if (wl >= 580 && wl < 645) { r = 1; g = -(wl - 645) / (645 - 580); b = 0; }
    else if (wl >= 645 && wl <= 780) { r = 1; g = 0; b = 0; }
    let factor;
    if (wl >= 380 && wl < 420) factor = 0.55 + 0.45 * (wl - 380) / (420 - 380);
    else if (wl >= 420 && wl < 701) factor = 1;
    else if (wl >= 701 && wl <= 780) factor = 0.55 + 0.45 * (780 - wl) / (780 - 701);
    else factor = 0.55;
    const gamma = 0.8;
    const adj = (c) => c === 0 ? 0 : Math.round(255 * Math.pow(c * factor, gamma));
    return `rgb(${adj(r)},${adj(g)},${adj(b)})`;
  }

  selectSource(key) {
    this.clearTimeouts();
    if (this.state.playing) {
      const speed = this.props.speed ?? 1;
      this.setState({ sourceKey: key, phase: 'toPrism' });
      this.timeouts.push(setTimeout(() => this.setState({ phase: 'dispersing' }), 700 / speed));
      this.timeouts.push(setTimeout(() => this.setState({ phase: 'done' }), 1500 / speed));
    } else {
      this.setState({ sourceKey: key });
    }
  }

  onBenchDragOver = (e) => { e.preventDefault(); };
  onBenchDrop = (e) => {
    e.preventDefault();
    const key = this.draggedKey || e.dataTransfer.getData('text/plain');
    if (key && this.SOURCES[key]) this.selectSource(key);
  };
  makeDragStart(key) {
    return (e) => { this.draggedKey = key; e.dataTransfer.setData('text/plain', key); e.dataTransfer.effectAllowed = 'copy'; };
  }
  makeClickSelect(key) {
    return () => this.selectSource(key);
  }

  onTogglePower = () => {
    this.clearTimeouts();
    if (this.state.playing) {
      this.setState({ playing: false, phase: 'idle' });
      return;
    }
    const speed = this.props.speed ?? 1;
    this.setState({ playing: true, phase: 'toPrism' });
    this.timeouts.push(setTimeout(() => this.setState({ phase: 'dispersing' }), 700 / speed));
    this.timeouts.push(setTimeout(() => this.setState({ phase: 'done' }), 1500 / speed));
  };

  onCursorPointerDown = (e) => {
    e.target.setPointerCapture(e.pointerId);
    this.setState({ draggingCursor: true });
  };
  onCursorPointerMove = (e) => {
    if (!this.state.draggingCursor) return;
    const rect = e.currentTarget.parentElement.getBoundingClientRect();
    let x = e.clientX - rect.left;
    const lo = this.BAR_PAD, hi = this.BAR_PAD + this.BAR_SPAN;
    x = Math.max(lo, Math.min(hi, x));
    this.setState({ cursorX: x });
  };
  onCursorPointerUp = () => { this.setState({ draggingCursor: false }); };
  onGainChange = (e) => { this.setState({ gain: parseFloat(e.target.value) }); };

  adjustCursor(deltaNm) {
    const lo = this.BAR_PAD, hi = this.BAR_PAD + this.BAR_SPAN;
    this.setState((s) => {
      const pxPerNm = this.BAR_SPAN / (s.viewMax - s.viewMin);
      return { cursorX: Math.max(lo, Math.min(hi, s.cursorX + deltaNm * pxPerNm)) };
    });
  }

  renderVals() {
    const sourceKey = this.state.sourceKey ?? this.props.defaultSource ?? 'na';
    const source = this.SOURCES[sourceKey] ?? this.SOURCES.na;
    const { SOURCE_X: sourceX, PRISM_X: prismX, SCREEN_X: screenX, AXIS_Y: axisY, WL_MIN, WL_MAX } = this;
    const d = screenX - prismX;
    const phase = this.state.phase;
    const playing = this.state.playing;

    const beamRevealed = phase !== 'idle';
    const beamOffset = beamRevealed ? 0 : (prismX - sourceX);
    const beamOpacity = beamRevealed ? 1 : 0;

    const disperseRevealed = phase === 'dispersing' || phase === 'done';
    const doneRevealed = phase === 'done';

    const sortedIdx = source.lines.map((wl, i) => i).sort((a, b) => source.lines[a] - source.lines[b]);
    let sortedOffsets = sortedIdx.map((i) => (550 - source.lines[i]) * 0.00095 * d);
    const minGap = 14;
    for (let k = 1; k < sortedOffsets.length; k++) {
      if (sortedOffsets[k - 1] - sortedOffsets[k] < minGap) sortedOffsets[k] = sortedOffsets[k - 1] - minGap;
    }
    sortedOffsets = sortedOffsets.map((v) => Math.max(-105, Math.min(105, v)));
    const offsetByIndex = {};
    sortedIdx.forEach((i, k) => { offsetByIndex[i] = sortedOffsets[k]; });

    const disperseRays = source.lines.map((wl, i) => {
      const y2 = axisY + offsetByIndex[i];
      const len = Math.hypot(screenX - prismX, y2 - axisY);
      const color = this.wavelengthToRGB(wl);
      return {
        key: 'r' + i, x1: prismX, y1: axisY, x2: screenX, y2, color, len,
        dashoffset: disperseRevealed ? 0 : len,
        opacity: disperseRevealed ? 1 : 0,
      };
    });

    const screenDots = disperseRays.map((ray, i) => ({
      key: 'd' + i, x: ray.x2, y: ray.y2, color: ray.color,
      glowOpacity: doneRevealed ? 0.3 : 0, dotOpacity: doneRevealed ? 1 : 0,
    }));

    const gain = this.state.gain;
    const sortedWls = [...source.lines].sort((a, b) => a - b);
    const topMarkers = source.lines.map((wl, i) => {
      const x = this.xFromWl(wl);
      return {
        key: 'm' + i, x, color: this.wavelengthToRGB(wl), markerOpacity: doneRevealed ? 1 : 0,
        width: Math.min(24, 3 * gain), filter: `brightness(${gain})`,
        rank: sortedWls.indexOf(wl) + 1,
      };
    });

    const bulbs = Object.keys(this.SOURCES).map((k, i) => {
      const s = this.SOURCES[k];
      const active = k === sourceKey;
      return {
        key: k, label: s.short, color: this.wavelengthToRGB(s.swatchWl), delay: (i % 6) * 0.18,
        onDragStart: this.makeDragStart(k), onClick: this.makeClickSelect(k),
        trayBg: active ? 'var(--color-accent-100)' : 'var(--color-bg)',
        trayBorder: active ? 'var(--color-accent)' : 'var(--color-divider)',
      };
    });

    const { viewMin, viewMax } = this.state;
    const cursorWl = this.wlFromX(this.state.cursorX);

    const majorStep = this.pickStep(viewMax - viewMin);
    const minorStep = majorStep / 5;
    const majorTicks = [];
    for (let v = Math.ceil(viewMin / majorStep) * majorStep; v <= viewMax + 1e-6; v += majorStep) {
      majorTicks.push({ key: 'M' + v.toFixed(2), x: this.xFromWl(v), label: (majorStep < 1 ? v.toFixed(1) : Math.round(v)) + ' nm' });
    }
    const minorTicks = [];
    for (let v = Math.ceil(viewMin / minorStep) * minorStep; v <= viewMax + 1e-6; v += minorStep) {
      if (Math.abs(v / majorStep - Math.round(v / majorStep)) > 1e-6) minorTicks.push({ key: 'm' + v.toFixed(2), x: this.xFromWl(v) });
    }

    const cursorButtons = [
      { key: 'm1', label: '−1 nm', onClick: () => this.adjustCursor(-1) },
      { key: 'm01', label: '−0,1 nm', onClick: () => this.adjustCursor(-0.1) },
      { key: 'p01', label: '+0,1 nm', onClick: () => this.adjustCursor(0.1) },
      { key: 'p1', label: '+1 nm', onClick: () => this.adjustCursor(1) },
    ];

    return {
      beamOffset, beamOpacity, disperseRays, screenDots, topMarkers, bulbs, cursorButtons,
      caption: source.caption,
      sourceName: source.name,
      bulbColor: this.wavelengthToRGB(source.swatchWl),
      bulbGlowOpacity: playing ? 0.35 : 0,
      powerFill: playing ? '#ec3013' : '#7d7979',
      powerGlowOpacity: playing ? 0.4 : 0,
      powerStateLabel: playing ? 'MARCHE' : 'ARRÊT',
      onTogglePower: this.onTogglePower,
      onBenchDragOver: this.onBenchDragOver,
      onBenchDrop: this.onBenchDrop,
      cursorX: this.state.cursorX,
      cursorLabel: cursorWl.toFixed(1) + ' nm',
      cursorCursor: this.state.draggingCursor ? 'grabbing' : 'grab',
      onCursorPointerDown: this.onCursorPointerDown,
      onCursorPointerMove: this.onCursorPointerMove,
      onCursorPointerUp: this.onCursorPointerUp,
      gain, gainLabel: gain.toFixed(1), onGainChange: this.onGainChange,
      majorTicks, minorTicks,
      onZoomIn: this.onZoomIn, onZoomOut: this.onZoomOut, onZoomReset: this.onZoomReset,
    };
  }
}

</script>
</body>
</html>
